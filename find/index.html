<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>사랑흐름 여권 찾기</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<!-- 사랑흐름 여권 찾기 find.html · v6 · 260710
  [v4 실제배포본] 라이브 v3 기준. ①결과 카드(rcard)를 gate 발급여권 톤(딥네이비·골드 이중테두리·골드 번호)으로 통일. ②푸터 진한네이비 제거→gate톤(링크줄+© 한 줄, 사업자상세는 about/trust로). ③날짜칸 전체클릭 시 달력(showPicker+calendar-picker-indicator 전체영역). ④"부품 시안·실제 파일 아님" 안내박스·title·주석 제거. 조회 실동작(M1A findPassport)·doFind·render 구조 무변경. -->
  <!-- (구) 260702-v3: 조회폼(관계·연락처4·날짜·구입처·이메일·결제번호)+결과 rcard. -->
<style>
  :root{--cream:#FAFAF8;--cream2:#F5F3ED;--card:#fff;--line:#E6E2D7;--navy:#1E4A76;--navyd:#102543;--gold:#C9A96E;--goldd:#B8923E;--ink:#2A2A28;--sub:#7A7368;--serif:'Nanum Myeongjo',serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:linear-gradient(180deg,var(--cream),var(--cream2));color:var(--ink);padding:0 0 40px;line-height:1.7}
  .wrap{max-width:480px;margin:0 auto;padding:16px 14px}
  .note{background:#FFF7E8;border:1px solid #EAD9A8;border-radius:10px;padding:9px 12px;font-size:12px;color:#8A6A1E;margin-bottom:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 18px;margin-bottom:14px;box-shadow:0 4px 18px rgba(180,140,90,.06)}
  .head{text-align:center;margin-bottom:18px}
  .head .ttl{font-family:var(--serif);font-size:21px;font-weight:800;color:var(--navyd)}
  .head .sub{font-size:13px;color:var(--sub);margin-top:5px}

  .field{margin-bottom:15px}
  .flabel{font-size:13px;font-weight:800;color:var(--navyd);margin-bottom:7px;display:flex;align-items:center;gap:5px}
  .flabel .req{color:#C0392B;font-size:11px}
  .flabel .opt{color:var(--sub);font-size:11px;font-weight:600}
  .inp,.sel{width:100%;height:50px;border:2px solid var(--line);border-radius:12px;padding:0 14px;font-size:15px;font-family:inherit;color:var(--navyd);background:#FFFCFA;outline:none}
  .inp:focus,.sel:focus{border-color:var(--gold)}
  .inp::placeholder{color:#C7BCAD}

  /* 관계 선택 = 전면 강조 (다중관계 암시) */
  .rel-field{background:linear-gradient(135deg,#FFF6E9,#FBEFD5);border:1px solid #EBD9A8;border-radius:14px;padding:16px;margin-bottom:16px}
  .rel-field .flabel{color:var(--goldd)}
  .rel-hint{font-size:12px;color:#8A6A1E;margin-top:8px;line-height:1.6}

  .row2{display:flex;gap:10px}
  .row2 .field{flex:1}

  .btn{width:100%;height:52px;background:linear-gradient(135deg,var(--navy),#3A6499);color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;margin-top:4px}

  /* 결과 */
  .result{margin-top:16px}
  .modal-bg{position:fixed;inset:0;background:rgba(16,37,69,.62);display:none;align-items:center;justify-content:center;z-index:200;padding:22px}
  .modal-bg.on{display:flex}
  .modal-inner{position:relative;width:100%;max-width:350px;max-height:86vh;overflow-y:auto}
  .modal-x{position:absolute;top:-10px;right:-10px;width:34px;height:34px;border-radius:50%;background:#fff;border:none;font-size:15px;font-weight:800;color:var(--navyd);cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:3}
  .rcard{position:relative;border:1.5px solid var(--gold);background:linear-gradient(150deg,#1E4A76,#102543);border-radius:14px;padding:18px 18px 16px;margin-bottom:12px;overflow:hidden;text-align:center;box-shadow:0 10px 26px rgba(19,40,69,.28)}
  .rcard::before{content:'';position:absolute;inset:5px;border:1px solid rgba(212,175,55,.32);border-radius:10px;pointer-events:none}
  .rcard .rc-rel{position:relative;font-size:12px;color:rgba(212,175,55,.9);font-weight:700;margin-bottom:7px;letter-spacing:.03em}
  .rcard .rc-pp{position:relative;font-family:var(--serif);font-size:34px;font-weight:800;color:var(--gold);letter-spacing:.1em;margin-bottom:2px}
  .rcard .rc-go{background:var(--navyd);color:#fff;border:none;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:800;font-family:inherit;cursor:pointer}
  .rcard .rc-copy{position:relative;background:var(--gold);color:#102543;border:none;border-radius:10px;padding:11px 14px;font-size:13px;font-weight:800;font-family:inherit;cursor:pointer}
  .rmore{font-size:12px;color:var(--sub);text-align:center;margin-top:6px}

  .topbar{position:sticky;top:0;background:rgba(255,249,244,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:20}
  .tb-in{max-width:480px;margin:0 auto;padding:10px 16px;display:flex;justify-content:space-between;align-items:center}
  .tb-in a,.tb-in button{background:none;border:none;font-family:inherit;cursor:pointer}
  .tb-back{font-size:14px;font-weight:700;color:var(--navy)}
  .tb-title{font-size:13px;font-weight:800;color:var(--goldd)}
  .tb-r{display:flex;gap:13px;align-items:center}.tb-home{font-size:16px}.tb-menu{font-size:20px;color:var(--navyd)}
  .foot{padding:18px 16px 6px;margin-top:16px;text-align:center;border-top:1px solid var(--line)}
  .foot .flinks{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 14px;margin-bottom:11px}
  .foot .flinks a{font-size:12px;font-weight:700;color:var(--navy);text-decoration:none;cursor:pointer}
  .foot .warn{font-size:10px;color:#A8A095;font-weight:500;line-height:1.7}
  #date{position:relative}
  #date::-webkit-calendar-picker-indicator{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;margin:0;padding:0;opacity:0;cursor:pointer}
  .bottom-link{text-align:center;padding:16px 0 4px}.bottom-link a{font-size:13px;color:var(--goldd);font-weight:700;text-decoration:none}
  /* 찾은 뒤 경로 버튼들 */
  .go-paths{margin-top:12px}
  .gp-lbl{font-size:12px;color:var(--sub);text-align:center;margin-bottom:8px}
  .gp-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .gp-btn{padding:13px;border-radius:12px;font-weight:800;font-size:13.5px;border:none;cursor:pointer;font-family:inherit;text-decoration:none;text-align:center;display:flex;align-items:center;justify-content:center;gap:5px}
  .gp-letter{background:linear-gradient(135deg,#F2916B,#E0A93E);color:#fff}
  .gp-journey{background:var(--navyd);color:#fff}
  .gp-home{background:#fff;color:var(--navyd);border:1px solid var(--line)}
  .gp-copy{background:#FBEFD5;color:var(--goldd);border:1px solid #EBD9A8}
  .gnav{display:flex;align-items:center;gap:6px;padding:12px 14px;border-bottom:1px solid var(--line);background:#fff}
  .gnav .home img{height:26px;cursor:pointer;display:block}
  .gnav .back{background:none;border:none;font-size:24px;color:var(--navy);cursor:pointer;line-height:1}
  .gnav .loc{font-size:13px;font-weight:800;color:var(--navy);margin-left:4px}
  .gnav .ham{background:none;border:none;font-size:20px;color:var(--navy);cursor:pointer;margin-left:auto}
  .drawer{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:50}
  .drawer.on{display:block}
  .dpanel{position:absolute;top:0;right:0;width:75%;max-width:300px;height:100%;background:#fff;padding:18px}
  .dhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .dhead b{color:var(--navy);font-size:16px}
  .dhead .x{background:none;border:none;font-size:20px;cursor:pointer;color:var(--sub)}
  .dbody a{display:block;padding:12px 6px;color:var(--navy);font-weight:700;font-size:14px;border-bottom:1px solid #f0f3f6;cursor:pointer;text-decoration:none}
</style>
</head>
<body>
<div class="gnav">
  <div class="home"><img src="https://raw.githubusercontent.com/hkcpcgg/loveflow/main/logo.png" alt="사랑흐름 홈" onclick="goHome()"></div>
  <button class="back" onclick="history.back()" aria-label="뒤로">‹</button>
  <div class="loc">사랑흐름 여권 찾기</div>
  <button class="ham" onclick="openMenu()" aria-label="메뉴">☰</button>
</div>
<div class="drawer" id="drawer" onclick="if(event.target===this)closeMenu()">
  <div class="dpanel">
    <div class="dhead"><b>사랑흐름</b><button class="x" onclick="closeMenu()">✕</button></div>
    <div class="dbody">
        <a onclick="lfGo('home')">홈</a>
        <a onclick="lfGo('hanmadi')">마음 한마디</a>
        <a onclick="lfGo('journey')">여행지도 보기</a>
        <a onclick="lfGo('letter')">편지</a>
        <a onclick="lfGo('reenter')">여권으로 입장</a>
        <a onclick="lfGo('find')">사랑흐름 여권 찾기</a>
        <a onclick="lfGo('showroom')">여행의 기록</a>
        <a onclick="lfGo('showcase')">마음 여행 예매하기</a>
        <a onclick="location.reload()">다시 시작</a>
      </div>
  </div>
</div>
<div class="wrap">
  <div class="note" style="display:none"></div>

  <div class="card">
    <div class="head">
      <div class="ttl">🗝️ 사랑흐름 여권 찾기</div>
      <div class="sub">지난 여행의 사랑흐름 여권번호를 잊으셨나요?<br>몇 가지만 알려주시면 다시 찾아드릴게요</div>
    </div>

    <!-- ★ 관계 선택 = 전면 강조 (한 명과 여행했어도 여러 관계 보여줌 → 다중관계 암시) -->
    <div class="rel-field">
      <div class="flabel">💛 누구와의 여행을 찾으시나요? <span class="req">*</span></div>
      <select class="sel" id="rel">
        <option value="">— 관계를 선택하세요 —</option>
        <option>🌷 어머니</option>
        <option>🌰 아버지</option>
        <option>💛 배우자·연인</option>
        <option>🌿 친구</option>
        <option>🐣 자녀</option>
        <option>🤝 형제·자매</option>
        <option>🌈 기타</option>
        <option>💗 나 자신</option>
      </select>
    </div>

    <!-- 연락처 + 결제번호 (한 줄) -->
    <div class="row2">
      <div class="field">
        <div class="flabel">📱 연락처 뒤 4자리 <span class="req">*</span></div>
        <input class="inp" id="phone4" maxlength="4" inputmode="numeric" placeholder="0000">
      </div>
      <div class="field">
        <div class="flabel">🧾 결제번호 <span class="opt">(아시면)</span></div>
        <input class="inp" id="orderNo" placeholder="주문 확인 번호">
      </div>
    </div>

    <!-- 날짜 + 구입처 -->
    <div class="row2">
      <div class="field">
        <div class="flabel">📅 여행하신 날짜</div>
        <input class="inp" id="date" type="date" onclick="try{this.showPicker&&this.showPicker()}catch(e){}" style="cursor:pointer">
      </div>
      <div class="field">
        <div class="flabel">🏪 구입하신 곳</div>
        <select class="sel" id="channel" style="height:50px">
          <option value="">선택</option>
          <option>스마트스토어</option>
          <option>계좌이체</option>
          <option>카카오</option>
          <option>기타</option>
        </select>
      </div>
    </div>

    <!-- 이메일 (아이디 + @ + 도메인 선택) -->
    <div class="field">
      <div class="flabel">📧 이메일 <span class="opt">(가입/구매 때 쓰신 이메일)</span></div>
      <div style="display:flex;gap:6px;align-items:center">
        <input class="inp" id="emailId" style="flex:1" placeholder="아이디">
        <span style="color:var(--sub);font-weight:700">@</span>
        <select class="sel" id="emailDom" style="flex:1" onchange="onDom()">
          <option value="">직접입력</option>
          <option>naver.com</option><option>gmail.com</option><option>daum.net</option>
          <option>hanmail.net</option><option>nate.com</option><option>kakao.com</option>
          <option>icloud.com</option><option>outlook.com</option>
        </select>
      </div>
      <input class="inp" id="emailDomCustom" style="margin-top:6px;display:none" placeholder="도메인 직접입력 (예: company.com)">
    </div>

    <button class="btn" id="findBtn" onclick="doFind()">🌊 내 사랑흐름 여권 찾기</button>


  <div class="foot">
    <div class="flinks"><a href="/about.html">소개</a><a href="/trust.html">이용약관</a><a href="/trust.html">개인정보</a><a href="/trust.html">환불정책</a></div>
    <div class="warn">© 2026 사랑흐름 · LFRI™. 무단복제·상업적 이용 금지.</div>
  </div>
  <div class="bottom-link"><a>← 홈으로</a></div>


</div>
<!-- 결과 팝업(모달) -->
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal-inner">
    <button class="modal-x" onclick="closeModal()">✕</button>
    <div id="modalBody"></div>
  </div>
</div>
<div class="toast" id="toast" style="position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:11px 22px;border-radius:22px;font-size:13.5px;opacity:0;transition:.3s;pointer-events:none;z-index:99;white-space:nowrap"></div>
<script>
var GAS='https://script.google.com/macros/s/AKfycbxLIG_LRAZD3AMJH26gPhefdkwLbXmA5ip_UurBfQ-53bxgq2T63dSre6YO9j4hxBZM1A/exec';
var LINK={home:'/',journey:'/journey/',letter:'/l/'   /* [v21·260713] ★옛 GAS 주소(script.google.com) → /l/. 눌러도 옛 빈칸 편지로 가던 것 */,find:'/find/',reenter:'/reenter.html',about:'/about.html',trust:'/trust.html'};
function goHome(){location.href=LINK.home;}
function go(k){var u=LINK[k];if(u){location.href=u;}else{toast('연결 예정입니다');}}
function openMenu(){document.getElementById('drawer').classList.add('on');}
function closeMenu(){document.getElementById('drawer').classList.remove('on');}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.opacity=1;t.style.transform='translateX(-50%) translateY(0)';setTimeout(function(){t.style.opacity=0;t.style.transform='translateX(-50%) translateY(20px)';},2500);}
function onDom(){var d=document.getElementById('emailDom').value;document.getElementById('emailDomCustom').style.display=d?'none':'block';}
function getEmail(){var id=(document.getElementById('emailId').value||'').trim();if(!id)return '';var dom=document.getElementById('emailDom').value||(document.getElementById('emailDomCustom').value||'').trim();if(!dom)return '';return id+'@'+dom;}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function doFind(){
  var phone4=(document.getElementById('phone4').value||'').replace(/\D/g,'');
  if(phone4.length!==4){toast('연락처 뒤 4자리를 넣어주세요');return;}
  var email=getEmail(),date=(document.getElementById('date').value||''),channel=(document.getElementById('channel').value||''),rel=(document.getElementById('rel').value||'');
  var orderNo=(document.getElementById('orderNo').value||'').trim();
  var aux=(email?1:0)+(date?1:0)+(channel?1:0)+(orderNo?1:0);
  if(aux<2){toast('날짜·구입처·이메일·결제번호 중 2가지 이상 입력해주세요');return;}
  var btn=document.getElementById('findBtn');btn.disabled=true;btn.textContent='🌊 찾는 중...';
  var cbName='fp_cb_'+Date.now();
  window[cbName]=function(res){btn.disabled=false;btn.textContent='🌊 내 사랑흐름 여권 찾기';if(res&&res.status==='need_more'){toast('2가지 이상 입력해주세요');try{delete window[cbName];}catch(e){}return;}render(res&&res.candidates?res.candidates:[]);try{delete window[cbName];}catch(e){}};
  var url=GAS+'?action=findPassport&phone4='+encodeURIComponent(phone4)+'&email='+encodeURIComponent(email)+'&date='+encodeURIComponent(date)+'&channel='+encodeURIComponent(channel)+'&orderNo='+encodeURIComponent(orderNo)+'&rel='+encodeURIComponent(rel)+'&callback='+cbName;
  var sc=document.createElement('script');sc.src=url;sc.onerror=function(){btn.disabled=false;btn.textContent='🌊 내 사랑흐름 여권 찾기';toast('잠시 후 다시 시도해주세요');};document.body.appendChild(sc);
}
function render(list){
  var body=document.getElementById('modalBody');
  if(!list.length){body.innerHTML='<div style="background:#fff;border-radius:16px;padding:28px 22px;text-align:center;color:var(--sub);font-size:14px;line-height:1.8">일치하는 여행 기록을 찾지 못했어요 🔒<br>입력 정보를 다시 확인해보세요.<br><br>도움이 필요하시면<br>070-4158-7786 으로 문의해주세요.</div>';openModal();return;}
  var h='<div class="rmore" style="margin-bottom:14px;color:#fff;font-weight:800;text-align:center;font-size:17px">✦ 찾았어요!</div>';
  list.forEach(function(c){
    var rel=(c.relType||'')+(c.relNick?' · '+c.relNick:'');
    if(!rel.trim())rel='사랑흐름 여행 '+(c.nth||'')+'회차';
    var pp=esc(c.passport);
    h+='<div class="rcard">'
      +'<div class="rc-rel">'+esc(rel)+'</div>'
      +'<div class="rc-pp">'+pp+'</div>'
      +'<button class="rc-cbtn rc-copy" style="width:100%;margin-top:10px" onclick="copyOne(\''+pp+'\')">📋 이 여권번호 복사하기</button>'
      +'</div>';
  });
  body.innerHTML=h;
  openModal();
}
function openModal(){document.getElementById('modalBg').classList.add('on');}
function closeModal(){document.getElementById('modalBg').classList.remove('on');}
function copyOne(pp){try{navigator.clipboard.writeText(pp);toast('📋 '+pp+' 복사됐어요! 편지 입력칸에 붙여넣으세요');}catch(e){var ta=document.createElement('textarea');ta.value=pp;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);toast('📋 복사됐어요! 편지에 붙여넣으세요');}}
</script>

<script>
/* ═══════════════════════════════════════════════════════════════════
   [260713 대표 확정] ☰ 표준 메뉴 9항목 — 전 화면 공용
   ───────────────────────────────────────────────────────────────────
   대표: "어디 들어갈 곳이 없어. 입구가 안 보여. 매우 답답해요."
   → 세 개의 문을 뚫었습니다.
       여권으로 입장       — 번호를 아는 사람이 바로 들어가는 문
       여행의 기록         — 구경하는 문
       마음 여행 예매하기  — ★예매하는 문 ("사기"가 아니라 "예매". 여행이니까요)

   ★함수 이름을 lfGo 로 따로 뒀습니다.
     화면마다 go() 가 이미 있고(index 는 화면 넘기는 함수), 이름이 부딪힙니다.

   ★여권번호를 달고 갑니다.
     여행지도·편지·여권으로 입장은 여권번호가 있어야 열립니다.
     지금 보고 있는 화면에서 번호를 들고 가면, 손님이 다시 안 넣어도 됩니다.
   ═══════════════════════════════════════════════════════════════════ */
var LF_LINK = {
  home:     '/',
  hanmadi:  '/',
  journey:  '/journey/',
  letter:   '/l/',
  reenter:  '/reenter.html',
  find:     '/find/',
  showroom: '/showroom.html',
  showcase: '/showcase.html',
  gate:     '/gate.html',
  apply:    '/apply.html',
  pay:      '/pay.html'
};

/* 여권번호가 따라가야 하는 곳 */
var LF_NEEDS_ID = { journey:1, letter:1 };

function lfPassport(){
  var p = '';
  try{
    var m = location.search.match(/[?&]id=(LF[ML]?-[A-Za-z0-9]+)/i);
    if (m) { p = m[1]; }
  }catch(e){}
  if (!p) { try{ p = sessionStorage.getItem('lf_passport') || ''; }catch(e){} }
  if (!p) { try{ p = localStorage.getItem('lf_passport') || ''; }catch(e){} }
  return p.trim().toUpperCase();
}

function lfGo(k){
  var u = LF_LINK[k];
  if (!u) { return; }
  if (LF_NEEDS_ID[k]) {
    var pp = lfPassport();
    if (pp) { u += (u.indexOf('?') > -1 ? '&' : '?') + 'id=' + encodeURIComponent(pp); }
  }
  location.href = u;
}
</script>
<script>
/* ═══════════════════════════════════════════════════════════════════
   [260713 대표 확정] 앞뒤 방향 — 전 화면 공용
   ───────────────────────────────────────────────────────────────────
   대표: "내가 머물러 있는 곳이 지금 내 자리가 아니라고 판단됐을 때
          ★빨리 어디론가 갈 수 있게는 해줘야 된다.
          그 자리에 ★그 값이 살아 있어야 된다.
          앞에서 뭘 보고 왔는데, 그 앞자리로 돌아가고 싶다는 욕구가 있다.
          그래서 앞으로 가기도 필요한 거예요."
   [이사회] 새 창은 카톡 인앱에서 제멋대로 열립니다. 팝업은 결제를 못 담습니다.
            → ★같은 창에서 '돌아가기'. 창을 이탈시키지 않습니다.

   [뒤로] 방금 온 곳. ★이름까지 보여줍니다. 어디로 가는지 알고 누르게.
   [앞으로] 화면마다 다릅니다. ★이게 매출 동선입니다.
   ═══════════════════════════════════════════════════════════════════ */
var LF_NAME = {
  '/':'홈', '/index.html':'홈',
  '/journey/':'여행지도', '/journey/index.html':'여행지도',
  '/journey/result.html':'여행일지',
  '/l/':'편지', '/letter/':'편지', '/letter/index.html':'편지',
  '/gate.html':'여권 발급', '/enter.html':'여권 발급',
  '/pay.html':'결제', '/apply.html':'계좌이체',
  '/showcase.html':'여행 예매', '/showroom.html':'여행의 기록',
  '/reenter.html':'여권으로 입장', '/find/':'여권 찾기', '/m/':'마음 한마디'
};

/* 화면마다 "앞으로 갈 곳" — 다음 상품으로 미는 문 */
var LF_NEXT = {
  '/':                    { k:'showroom', t:'여행의 기록 보러 가기' },
  '/index.html':          { k:'showroom', t:'여행의 기록 보러 가기' },
  '/showroom.html':       { k:'showcase', t:'마음 여행 예매하기' },
  '/showcase.html':       { k:'pay',      t:'결제하기' },
  '/enter.html':          { k:'journey',  t:'여행 시작하기' },
  '/journey/result.html': { k:'letter',   t:'이 여행을 편지로 이어가기' },
  /* 편지·여행지도는 길을 안 깝니다(위 lfPaintWay 참조).
     편지 완성 화면의 "다른 분과 여행하기"는 그 화면 안에 이미 있습니다. */
  '/reenter.html':        { k:'showroom', t:'여행의 기록 보러 가기' },
  '/find/':               { k:'showroom', t:'여행의 기록 보러 가기' },
  '/apply.html':          { k:'showroom', t:'여행의 기록 보러 가기' },
  '/pay.html':            { k:'gate',     t:'여권 발급받기' },
  '/l/':                  { k:'letter',   t:'편지 쓰러 가기' },
  '/gate.html':           { k:'journey',  t:'여행 시작하기' }
};

/* 지금 화면에 온 것을 기록해 둡니다 (다음 화면의 "뒤로"가 여기로 옵니다) */
(function(){
  try{
    var here = location.pathname;
    var prev = sessionStorage.getItem('lf_here') || '';
    if (prev && prev !== here) { sessionStorage.setItem('lf_prev', prev); }
    sessionStorage.setItem('lf_here', here);
  }catch(e){}
})();

function lfPrev(){
  try{ return sessionStorage.getItem('lf_prev') || ''; }catch(e){ return ''; }
}

function lfPrevName(){
  var p = lfPrev();
  if (!p) { return ''; }
  return LF_NAME[p] || '';
}

function lfBack(){
  var p = lfPrev();
  if (!p) { location.href = '/'; return; }
  var pp = (typeof lfPassport === 'function') ? lfPassport() : '';
  if (pp && (p.indexOf('/journey') === 0 || p.indexOf('/letter') === 0 || p.indexOf('/l/') === 0)) {
    p += (p.indexOf('?') > -1 ? '&' : '?') + 'id=' + encodeURIComponent(pp);
  }
  location.href = p;
}

function lfNext(){
  var n = LF_NEXT[location.pathname];
  if (!n) { return; }
  if (typeof lfGo === 'function') { lfGo(n.k); }
}

/* 화면 아래에 길을 깝니다 */
function lfPaintWay(){
  if (document.getElementById('lfway')) { return; }

  /* ★질문을 쓰는 화면에는 길을 깔지 않습니다.
     · 여행지도·편지는 화면 아래에 이미 [이전][다음] 버튼이 있습니다. 넷이 되면 헷갈립니다.
     · 그리고 여행 중에 "앞으로"를 누르면 ★적던 답이 날아갑니다.
     · 이 화면들은 다 끝난 뒤(결과지·편지 완성)에 길이 나옵니다. */
  var p = location.pathname;
  if (p.indexOf('/journey/') === 0 && p.indexOf('result') < 0) { return; }
  if (p.indexOf('/letter/') === 0) { return; }

  var prev = lfPrev();
  var next = LF_NEXT[location.pathname];
  if (!prev && !next) { return; }          /* 갈 곳이 없으면 안 깝니다 */

  var css = document.createElement('style');
  css.textContent =
    '.lfway{display:flex;gap:8px;max-width:420px;margin:22px auto 8px;padding:0 16px;box-sizing:border-box}'
  + '.lfway a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;'
  + 'padding:11px 6px;border:1px solid #E4DED2;border-radius:12px;background:#fff;'
  + 'text-decoration:none;cursor:pointer;transition:.15s}'
  + '.lfway a:active{transform:scale(.97)}'
  + '.lfway .ic{font-size:15px;color:#1E4A76;line-height:1}'
  + '.lfway .tt{font-size:11.5px;font-weight:700;color:#1E4A76}'
  + '.lfway .sb{font-size:10px;color:#9A9287}'
  + '.lfway .fwd{background:#1E4A76;border-color:#1E4A76}'
  + '.lfway .fwd .ic,.lfway .fwd .tt{color:#fff}'
  + '.lfway .fwd .sb{color:#C9D6E4}'
  + '@media print{.lfway{display:none}}';
  document.head.appendChild(css);

  var h = '<div class="lfway" id="lfway">';
  if (prev) {
    var nm = lfPrevName();
    h += '<a onclick="lfBack()"><span class="ic">←</span><span class="tt">돌아가기</span>'
       + (nm ? '<span class="sb">' + nm + '</span>' : '') + '</a>';
  }
  h += '<a onclick="lfGo(\'home\')"><span class="ic">⌂</span><span class="tt">홈으로</span><span class="sb">처음부터</span></a>';
  if (next) {
    h += '<a class="fwd" onclick="lfNext()"><span class="ic">→</span><span class="tt">앞으로</span>'
       + '<span class="sb">' + next.t + '</span></a>';
  }
  h += '</div>';

  /* 푸터 바로 앞에 답니다.
     화면마다 푸터 클래스가 제각각이라(.foot / footer / .glegal / 클래스 없음),
     ★저작권 문구(© 2026)를 품은 덩어리를 찾아 그 앞에 답니다. 그게 제일 확실합니다. */
  var foot = document.querySelector('.foot') || document.querySelector('footer')
          || document.querySelector('.glegal') || document.querySelector('.legal');

  if (!foot) {
    var all = document.body.querySelectorAll('div');
    for (var i = all.length - 1; i >= 0; i--) {
      if ((all[i].textContent || '').indexOf('© 2026') > -1) {
        var node = all[i];
        /* 저작권 문구를 품은 가장 바깥 덩어리까지 올라갑니다 */
        while (node.parentNode && node.parentNode !== document.body
               && (node.parentNode.textContent || '').indexOf('© 2026') > -1
               && (node.parentNode.textContent || '').length < 400) {
          node = node.parentNode;
        }
        foot = node;
        break;
      }
    }
  }

  if (foot && foot.parentNode && foot.parentNode !== document.documentElement) {
    foot.insertAdjacentHTML('beforebegin', h);
  } else {
    document.body.insertAdjacentHTML('beforeend', h);
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', lfPaintWay);
} else {
  lfPaintWay();
}
</script>
