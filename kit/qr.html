<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사랑흐름 · QR 자료실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1E4A76; --navy-d:#163A5C; --cream:#FFFBF5;
    --gold:#D4AF37; --ink:#243040; --mut:#8a94a0;
    --line:#e7e2d8; --card:#ffffff; --reserve:#9a9184; --reserve-bg:#f3efe7;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--cream);color:var(--ink);
    line-height:1.5;-webkit-text-size-adjust:100%;padding-bottom:60px}

  .top{background:var(--navy);color:#fff;padding:16px 20px;position:sticky;top:0;z-index:10;
    box-shadow:0 2px 10px rgba(30,74,118,.18)}
  .top h1{font-size:18px;font-weight:900;letter-spacing:-.3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .top .ver{font-size:12.5px;font-weight:900;color:#4a3a00;background:var(--gold);
    border-radius:20px;padding:2px 11px;letter-spacing:.3px}
  .top .day{font-size:12.5px;color:#fff;font-weight:700;margin-top:5px}
  .top .sub{font-size:11.5px;color:#a9c5de;margin-top:2px;font-weight:400}

  .bar{padding:12px 16px 6px;position:sticky;top:56px;z-index:9;background:var(--cream);
    display:flex;gap:8px;align-items:center}
  .search{flex:1;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;
    font-size:15px;font-family:inherit;background:#fff;color:var(--ink);outline:none}
  .search:focus{border-color:var(--navy)}
  .allbtn{flex:none;padding:11px 12px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);
    border-radius:12px;font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap}
  .allbtn:active{transform:scale(.95)}

  .wrap{max-width:760px;margin:0 auto;padding:6px 16px}

  /* 아코디언 */
  .acc{margin-bottom:9px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
  .acc.reserve{background:var(--reserve-bg)}
  .acc-h{width:100%;display:flex;align-items:center;gap:9px;padding:15px 15px;background:transparent;
    border:none;font-family:inherit;font-size:15.5px;font-weight:700;color:var(--navy);cursor:pointer;text-align:left}
  .acc.reserve .acc-h{color:var(--reserve)}
  .acc-h .dot{width:9px;height:9px;border-radius:50%;background:var(--gold);flex:none}
  .acc.reserve .acc-h .dot{background:var(--reserve)}
  .acc-h .cnt{font-size:12.5px;color:var(--mut);font-weight:400}
  .acc-h .chev{margin-left:auto;flex:none;color:var(--mut);font-size:13px;transition:transform .2s}
  .acc.open .acc-h .chev{transform:rotate(180deg)}
  .acc-body{display:none;padding:2px 11px 12px}
  .acc.open .acc-body{display:block}

  .row{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid #f2eee6}
  .acc-body .row:last-child{border-bottom:none}
  .info{flex:1;min-width:0}
  .name{font-size:14.5px;font-weight:500;color:var(--ink);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .acc.reserve .name{color:#6b6459}
  .lock{font-size:10.5px;font-weight:700;color:#a05a00;background:#fff2d6;
    border:1px solid #f0dca6;border-radius:20px;padding:1px 7px}
  .note{font-size:10.5px;font-weight:700;color:#7a5c00;background:#fdf3d6;border:1px solid #f0dca6;border-radius:20px;padding:1px 7px}
  .path{font-size:11.5px;color:var(--mut);margin-top:2px;word-break:break-all;font-weight:400}
  .btns{display:flex;gap:6px;flex:none}
  .b{border:none;border-radius:9px;padding:9px 12px;font-size:13px;font-weight:700;font-family:inherit;
    cursor:pointer;white-space:nowrap;transition:transform .05s}
  .b:active{transform:scale(.94)}
  .b-open{background:var(--navy);color:#fff;text-decoration:none;display:inline-block}
  .b-copy{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
  .acc.reserve .b-open{background:var(--reserve)}
  .acc.reserve .b-copy{color:var(--reserve);border-color:var(--reserve)}
  .b.copied{background:var(--gold)!important;color:#4a3a00!important;border-color:var(--gold)!important}

  /* 테스트 계정 */
  .tdesc{font-size:12px;color:var(--mut);margin:4px 4px 10px;line-height:1.6}
  .tdesc b{color:var(--navy)}
  .tcard{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
  .tcard-top{background:var(--navy);color:#fff;font-size:11.5px;font-weight:700;padding:6px 12px;letter-spacing:.3px}
  .trow{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid #f2eee6}
  .tcard .trow:last-child{border-bottom:none}
  .tlabel{font-size:11.5px;font-weight:700;color:var(--navy);flex:none;width:66px}
  .tval{flex:1;min-width:0;font-size:14px;color:var(--ink);word-break:break-all;
    font-family:'SFMono-Regular',Consolas,monospace}
  .tval.none{color:#c3bdb0;font-family:'Noto Sans KR',sans-serif;font-style:italic}
  .tcopy{flex:none;border:1.5px solid var(--navy);background:#fff;color:var(--navy);
    border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;transition:transform .05s}
  .tcopy:active{transform:scale(.93)}
  .tcopy.copied{background:var(--gold)!important;color:#4a3a00!important;border-color:var(--gold)!important}

  .empty{text-align:center;color:var(--mut);padding:30px;font-size:14px;display:none}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:var(--navy-d);color:#fff;padding:11px 20px;border-radius:24px;font-size:13.5px;
    font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .foot{text-align:center;font-size:11px;color:var(--mut);margin-top:22px;line-height:1.7}
</style><style>
  .note{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:14px 0;font-size:13px;color:var(--mut);line-height:1.7}
  .tagbar{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:14px 0}
  .tagbar label{display:block;font-size:13px;font-weight:700;color:var(--navy);margin-bottom:7px}
  .tagbar input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px;font-family:inherit}
  .tagbar .hint{font-size:12.5px;color:var(--mut);margin-top:7px;line-height:1.6}
  .qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:11px;margin-top:11px}
  .qc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
  .qc a{display:block;background:#fff;padding:9px;border-radius:8px;margin-bottom:9px}
  .qc canvas,.qc img{width:100%;max-width:110px;height:auto;display:block;margin:0 auto}
  .qc .nm{font-size:13px;font-weight:700;color:var(--navy);line-height:1.35;margin-bottom:3px;word-break:keep-all}
  .qc .pt{font-size:11px;color:var(--mut);margin-bottom:9px;word-break:break-all}
  .qc button{width:100%;padding:8px;border:0;border-radius:7px;background:var(--navy);color:#fff;
    font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer}
  .qc button:active{background:var(--navy-d)}
  .grp{margin-top:26px}
  .grp h2{font-size:15px;font-weight:900;color:var(--navy);padding:9px 0;border-bottom:2px solid var(--gold)}
  .allbar{display:flex;gap:9px;margin:14px 0;flex-wrap:wrap}
  .allbar button{flex:1;min-width:130px;padding:12px;border:0;border-radius:9px;background:var(--gold);
    color:#4a3a00;font-size:13.5px;font-weight:900;font-family:inherit;cursor:pointer}
  .allbar button.sec{background:#fff;border:1px solid var(--line);color:var(--navy)}
</style>
</head>
<body>

<div class="top">
  <h1>사랑흐름 · QR 자료실 <span class="ver">v1</span></h1>
  <div class="day">2026. 8. 13. &middot; 화면에서 바로 그려 내려받습니다</div>
  <div class="sub">주소가 바뀌면 QR도 따라 바뀝니다</div>
</div>

<div class="wrap">

  <div class="tagbar">
    <label for="tag">추적 꼬리표 (넣지 않아도 됩니다)</label>
    <input id="tag" type="text" placeholder="예: 농협 · 파주복지관 · 명함" autocomplete="off">
    <div class="hint">여기에 적으면 아래 QR 전체에 <b>?lf=</b>로 붙습니다. 나중에 어디서 들어온 사람인지 구분됩니다. 비우면 붙지 않습니다.</div>
  </div>

  <div class="allbar">
    <button id="dlall">전체 내려받기</button>
    <button class="sec" id="dl6">기관 영업만 내려받기</button>
  </div>

  <div class="note">
    QR을 누르면 그 화면이 열립니다. 내려받기를 누르면 인쇄용 1024px PNG로 저장됩니다.<br>
    파일 이름은 <b>lf_qr_(주소).png</b> 형태입니다.
  </div>

  <div id="list"></div>
</div>

function slug(p){
  var s = p.replace(/^\//,'').replace(/\.html$/,'').replace(/\/$/,'').replace(/[?=&]/g,'_');
  return s || 'home';
}
function fullUrl(p){
  var t = document.getElementById('tag').value.trim();
  var u = BASE + p;
  if(!t) return u;
  return u + (u.indexOf('?')>=0 ? '&' : '?') + 'lf=' + encodeURIComponent(t);
}
function makeQR(url, size){
  var box = document.createElement('div');
  new QRCode(box, {text:url, width:size, height:size, correctLevel:QRCode.CorrectLevel.H});
  return box;
}
function bigCanvas(url, cb){
  var box = document.createElement('div');
  box.style.position='fixed'; box.style.left='-9999px';
  document.body.appendChild(box);
  new QRCode(box, {text:url, width:1024, height:1024, correctLevel:QRCode.CorrectLevel.H});
  setTimeout(function(){
    var src = box.querySelector('canvas') || box.querySelector('img');
    var pad = 96, side = 1024 + pad*2;
    var out = document.createElement('canvas');
    out.width = side; out.height = side;
    var ctx = out.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,side,side);
    ctx.drawImage(src, pad, pad, 1024, 1024);
    cb(out.toDataURL('image/png'));
    document.body.removeChild(box);
  }, 80);
}
function saveOne(path, name){
  bigCanvas(fullUrl(path), function(data){
    var a = document.createElement('a');
    a.href = data; a.download = 'lf_qr_' + slug(path) + '.png';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  });
}
function render(){
  var wrap = document.getElementById('list');
  wrap.innerHTML = '';
  DATA.forEach(function(g){
    if(g.reserve) return;
    var sec = document.createElement('div'); sec.className='grp';
    var h = document.createElement('h2'); h.textContent = g.title; sec.appendChild(h);
    var grid = document.createElement('div'); grid.className='qgrid';
    g.items.forEach(function(it){
      var url = fullUrl(it.path);
      var card = document.createElement('div'); card.className='qc';
      var link = document.createElement('a'); link.href=url; link.target='_blank'; link.rel='noopener';
      link.appendChild(makeQR(url, 240));
      card.appendChild(link);
      var nm = document.createElement('div'); nm.className='nm'; nm.textContent = it.name; card.appendChild(nm);
      var pt = document.createElement('div'); pt.className='pt'; pt.textContent = it.path; card.appendChild(pt);
      var b = document.createElement('button'); b.textContent='내려받기';
      b.onclick = function(){ saveOne(it.path, it.name); };
      card.appendChild(b);
      grid.appendChild(card);
    });
    sec.appendChild(grid); wrap.appendChild(sec);
  });
}
function saveMany(list){
  var i = 0;
  (function next(){
    if(i >= list.length) return;
    saveOne(list[i].path, list[i].name);
    i++;
    setTimeout(next, 420);
  })();
}
document.getElementById('dlall').onclick = function(){
  var all = [];
  DATA.forEach(function(g){ if(!g.reserve) g.items.forEach(function(it){ all.push(it); }); });
  saveMany(all);
};
document.getElementById('dl6').onclick = function(){
  var g = DATA.filter(function(x){ return x.title.indexOf('안내자') >= 0; })[0];
  if(g) saveMany(g.items);
};
document.getElementById('tag').addEventListener('input', function(){ render(); });
render();
</script>
