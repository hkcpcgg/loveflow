<style>
:root{--navy:#1E4A76;--gold:#C9A96E;--cream:#FFFCF7;--ink:#2E3A46;--sub:#7d7465;--line:#EADFCF;
  --d1a:#3B2F72;--d1b:#1F1840;--d2a:#0F5A68;--d2b:#08303D}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;word-break:keep-all;-webkit-tap-highlight-color:transparent}
html.lfx body.nh{padding-bottom:0!important}
body.nh #lfxTab{display:none!important}
body.nh .lfx-sheet:not(.on){visibility:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.home{max-width:520px;margin:0 auto;padding:22px 16px 6px;display:flex;flex-direction:column;gap:16px}
.hero{text-align:center}
.hero h1{font-family:'Noto Serif KR',serif;font-size:25px;line-height:1.4;color:var(--navy);margin:0 0 6px;font-weight:700}
.hero p{margin:0;color:var(--sub);font-size:14px;line-height:1.55}
.lfflow{width:100%;max-width:440px;aspect-ratio:4/1;margin:10px auto 0}
/* 큰 문 둘 — 같은 크기 · 가운데 대칭 */
.doors{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.door{position:relative;border:0;border-radius:22px;padding:22px 12px 16px;min-height:208px;color:#fff;text-align:center;display:flex;flex-direction:column;align-items:center;gap:9px;overflow:hidden;transition:transform .12s}
.door:active{transform:scale(.97)}
.door.d1{background:linear-gradient(165deg,var(--d1a),var(--d1b))}
.door.d2{background:linear-gradient(165deg,var(--d2a),var(--d2b))}
.door::before{content:'';position:absolute;inset:0;border-radius:22px;padding:1.5px;background:linear-gradient(130deg,rgba(255,255,255,.55),rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,.35));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.door.d1::after,.door.d2::after{content:'';position:absolute;width:150px;height:150px;border-radius:50%;top:-60px;right:-50px;filter:blur(28px);opacity:.55;pointer-events:none}
.door.d1::after{background:#B07FE0}
.door.d2::after{background:#4FD1C5}
.door .di{position:relative;width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);display:grid;place-items:center;font-size:27px;line-height:1}
.door .di svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.door b{position:relative;font-size:19px;font-weight:800;letter-spacing:-.01em;margin-top:2px}
.door small{position:relative;font-size:12.5px;line-height:1.45;color:rgba(255,255,255,.82);min-height:36px}
.door .go{position:relative;margin-top:auto;font-size:13px;font-weight:700;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:6px 15px}
/* 이야기방 만들기 · 사랑흐름 여권으로 입장하기 — 같은 크기 */
.acts{display:flex;flex-direction:column;gap:10px}
.pass{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;border:1.5px solid var(--gold);background:linear-gradient(135deg,#FFFBF2,#FBF1DD);border-radius:16px;transition:transform .12s}
.pass:active{transform:scale(.98)}
.pass .ci{display:inline-grid;place-items:center;border-radius:50%;color:#fff;width:40px;height:40px;flex:0 0 40px}
.pass .ci svg{width:55%;height:55%;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pass b{display:block;color:var(--navy);font-size:15.5px}.pass small{display:block;color:#9a7a3a;font-size:12.5px}
.mkone{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border:0;border-radius:16px;background:linear-gradient(160deg,var(--d2a),var(--d2b));color:#fff;font-size:16.5px;font-weight:800;transition:transform .12s}
.mkone:active{transform:scale(.98)}
.mkone .pl{font-size:20px;line-height:1}
/* 우리 이야기 마당 사진 한 줄 — 옆으로 밀어 보기 */
.pz[hidden]{display:none}
.pzh{display:flex;align-items:center;justify-content:space-between;margin:0 2px 9px}
.pzh b{font-size:15px;font-weight:800;color:var(--navy)}
.pzg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;border-radius:16px;overflow:hidden}
.pt{aspect-ratio:1/1;border:0;padding:0;position:relative;overflow:hidden;background:#E9E3D8 center/cover no-repeat;display:block;width:100%}
.pt.wait{background:linear-gradient(100deg,#EEE8DE 30%,#F7F2EA 50%,#EEE8DE 70%);background-size:300% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-150% 0}}
.pt i{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;font-style:normal;font-size:11.5px;font-weight:700;color:#fff;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.55));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt .pl{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:10px;display:grid;place-items:center}
.pzw{font-size:12.5px;color:var(--sub);margin:6px 2px 0}
/* ← ⌂ → */
.way3{display:flex;justify-content:center;gap:26px;margin:18px 0 6px}
.way3 button{width:44px;height:44px;border-radius:50%;border:0;background:var(--navy);color:#fff;font-size:20px;line-height:1;display:grid;place-items:center}
.way3 button:active{opacity:.6}.way3 button.off{opacity:.3;cursor:default}
.pzh a{font-size:13px;font-weight:700;color:var(--d2a);text-decoration:none}
.minor{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mn{display:flex;align-items:center;justify-content:center;gap:7px;padding:12px 8px;border-radius:14px;background:#fff;border:1.5px solid var(--line);font-size:14px;font-weight:700;color:var(--navy);transition:transform .12s}
.mn:active{transform:scale(.97)}
.mn .e{font-size:17px;line-height:1}
.mn.tr{border-color:#CFC6E8;color:var(--d1a)}
.hero h1{font-size:26px}
@media (max-width:350px){.door{min-height:196px;padding:18px 8px 14px}.door b{font-size:17px}.door small{font-size:12px}}
@media (prefers-reduced-motion:reduce){.pt.wait{animation:none}}
</style>

<body class="nh" data-lf-title="사랑흐름" data-lf-menu="2">
<main class="home">
  <section class="hero">
    <h1>우리 이야기가 쌓이는 곳</h1>
    <p>나의 일상부터 우리 모두의 이야기까지</p>
  </section>

  <section class="pz" id="pz">
    <div class="pzh"><b>🍇 우리 이야기 마당</b><a href="/rec/?plaza=1" id="pzGo">둘러보기 →</a></div>
    <div class="pzg" id="pzs"><span class="pt wait"></span><span class="pt wait"></span><span class="pt wait"></span><span class="pt wait"></span><span class="pt wait"></span><span class="pt wait"></span><span class="pt wait"></span><span class="pt wait"></span><span class="pt wait"></span></div>
    <div class="pzw" id="pzw">마당 사진을 불러오는 중입니다</div>
  </section>

  <section class="acts">
    <button class="mkone" type="button" id="aMake"><span class="pl">＋</span>우리 이야기 만들기</button>

      <button class="mn" type="button" id="aFree"><span class="e">💌</span>마음 전하기 (무료)</button>
      <button class="mn tr" type="button" id="aTrip"><span class="e">🧭</span>사랑흐름 여행</button>
    </div>
  </section>

  <div class="way3"><button type="button" id="wB" aria-label="앞 화면">←</button><button type="button" id="wH" aria-label="사랑흐름 홈">⌂</button><button type="button" id="wF" aria-label="앞으로">→</button></div>
</main>
<div id="lfFoot"></div>
<script src="/lf/config.js?v=3"></script>
<script>
(function(){
  function $(i){ return document.getElementById(i); }
  function go(u){ location.href=u; }
  var PLAZA='/rec/?plaza=1';
  $('aMake').onclick=function(){ go('/rec/?open=form'); };
  $('aTrip').onclick=function(){ go('/travel/'); };
  $('aFree').onclick=function(){ if(window.LFFrame&&LFFrame.open){ LFFrame.open('taste'); } else { go('/hanmadi/'); } };   /* 마음 한마디 · 마음 도화지 · 관계 나침반 — 올라오는 판 */
  /* ← ⌂ → */
  var inSite=false; try{ inSite=!!document.referrer && document.referrer.indexOf(location.host)>=0 && history.length>1; }catch(e){}
  if(!inSite){ $('wB').classList.add('off'); }
  $('wB').onclick=function(){ if(inSite){ history.back(); } };
  $('wH').onclick=function(){ window.scrollTo({top:0,behavior:'smooth'}); };
  $('wF').onclick=function(){ history.forward(); };

  /* 우리 이야기 마당 사진 한 줄 — 우리 이야기 서버 recPlaza(마당과 같은 사진) · 못 받으면 줄을 감춤(꾸민 사진은 넣지 않음) */
  var C=window.LF_CONFIG||{}, GAS=(C.gas&&C.gas.rec)||'';
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function hide(){ $('pz').hidden=true; }
  function draw(d){
    /* ★438 실제 기록 먼저 — 사랑흐름 방(main)의 홍보 그림은 모자랄 때만 채움 · 다른 방 대표 사진(cover)도 실제 기록 */
    var rooms=d.rooms||[], items=d.items||[], h='', n=0, cells=[], seen={}, real=[], promo=[];
    function bgOf(x){ if(x.yt){ return 'https://i.ytimg.com/vi/'+encodeURIComponent(x.yt)+'/mqdefault.jpg'; } if(x.u&&/^[A-Za-z0-9_-]{10,80}$/.test(x.u)){ return 'https://drive.google.com/thumbnail?id='+encodeURIComponent(x.u)+'&sz=w400'; } return ''; }
    function put(x,r){ if(!x||!r||seen[x.id]){ return; } var bg=bgOf(x); if(!bg){ return; } seen[x.id]=1; (r.main?promo:real).push({x:x,r:r,bg:bg}); }
    for(var i=0;i<items.length;i++){ put(items[i],rooms[items[i].c]); }
    for(var k=0;k<rooms.length;k++){ put(rooms[k].cover,rooms[k]); }
    var pick=real.concat(promo);
    for(var m=0;m<pick.length&&n<9;m++){
      var x=pick[m].x, r=pick[m].r, bg=pick[m].bg;
      cells.push('<button type="button" class="pt wait" data-bg="'+esc(bg)+'" aria-label="'+esc((x.t||'사진')+' · '+(r.name||''))+'">'+(x.yt?'<span class="pl">▶</span>':'')+'<i>'+esc(r.name||'')+'</i></button>');
      n++;
    }
    n=n-(n%3); if(n<3){ hide(); return; } h=cells.slice(0,n).join('');
    $('pzs').innerHTML=h; $('pzw').hidden=true;
    var ts=$('pzs').querySelectorAll('.pt');
    for(var j=0;j<ts.length;j++){ (function(t){
      var u=t.getAttribute('data-bg'), im=new Image();
      im.onload=function(){ if(im.naturalWidth>1){ t.style.backgroundImage='url("'+u+'")'; t.classList.remove('wait'); } else { t.classList.remove('wait'); } };
      im.onerror=function(){ t.classList.remove('wait'); };   /* 못 불러온 칸도 자리는 지킴 — 바둑판이 깨지지 않게 */
      im.src=u; t.onclick=function(){ go(PLAZA); };
    })(ts[j]); }
  }
  if(!GAS){ hide(); return; }
  var done=false; function fin(d){ if(done){ return; } done=true; if(d&&d.status==='ok'){ draw(d); } else { hide(); } }
  function jsonp(){
    var nm='hz_'+Date.now(), sc=document.createElement('script');
    window[nm]=function(d){ try{ delete window[nm]; }catch(e){} fin(d); };
    sc.onerror=function(){ fin(null); };
    sc.src=GAS+'?action=recPlaza&n=48&callback='+nm+'&t='+Date.now(); document.body.appendChild(sc);
  }
  try{
    fetch(GAS,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'recPlaza',n:'48'})})
      .then(function(r){ return r.text(); }).then(function(t){ fin(JSON.parse(t)); })
      .catch(function(){ jsonp(); });
  }catch(e){ jsonp(); }
  setTimeout(function(){ fin(null); },20000);
})();
</script>
