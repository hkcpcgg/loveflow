<!-- ★ 현재 버전 ▶ g/index.html · v2 · 261111 · [공사 칸 ⑦ 말 · 577~579 · 점검표 말 사전 v1] 손님 화면 말 — 「마음 여행여권 · 관계 여권 · 마음관리청 · 앞말 없는 여권(여권번호)」 → 「사랑흐름 여권 · 사랑흐름 여권번호」 · 「바탕화면에 두기」 → 「홈 화면에 추가」 · 「장수」 → 「몇 명에게」 · 「담긴 여행」 → 「구성」 · 시트 칸 이름(여권번호)과 본부 표 머리 · 짧은 칩은 그대로 -->
<!-- (이전) g/index.html · v1 · 261111 · [공사 칸 ⑤ · 대표 OK 261111 17:07 「개인 간 소통에 간섭하지 말 것 · 복잡한 것 빼기」] 새 화면 — 선물 받는 분 화면(/g/?t=열쇠 일곱 글자).
     · 차례(대표 261111 15:37 · /my/ 와 같은 원칙): ① 누가 보낸 선물인지 ② 보내는 글 ③ 담긴 여행(구성) ④ 받기(성명 · 연락처 · [필수] 동의) → 받으면 사랑흐름 여권 화면(/my/?k=)으로 — 그 화면이 안내 글 + 「○○로 입장하기 ›」 + 이 휴대폰에 두기를 이미 그 차례로 보임.
     · 맨 위에 행동 단추 없음 · QR 안내 없음 · 값 · 판매 말 · 광고 없음(80차 1-3) · 받는 분 카카오 로그인 안 시킴(80차 C).
     · 「받지 않기」 · 「마음 한마디로 답하기」는 두지 않음(대표 17:00 — 두 분 사이 일 · 고맙다는 말은 두 분이 카톡으로).
     · 서버 = 개인 계정 「사랑흐름 유료여행지도」(…xBZM1A) ⑦ gift.gs v5 — giftOpen · giftTake · giftImg(읽기만 · 서버 고침 없음).
     · 보낸 분 이름은 그대로 — 「박서윤 님이 선물하신」 · 「박서윤 · 이민정 님이 함께 선물하신」(넷 이상만 「… 님 외 n분」). -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>선물이 도착했습니다 · 사랑흐름</title>
<meta property="og:title" content="사랑흐름 · 선물이 도착했습니다">
<meta property="og:description" content="마음을 담은 사랑흐름 여권이 도착했습니다.">
<meta name="theme-color" content="#1E4A76">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1E4A76;--night:#0E1736;--ink:#1E2A3A;--sub:#6B6680;--line:#E4DFEE;--violet:#8A6FC9}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);background:linear-gradient(180deg,#EEF0F7 0%,#F6F1EA 100%);min-height:100vh;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:480px;margin:0 auto;padding:16px 14px 40px}
.state{text-align:center;padding:48px 18px;color:var(--sub);font-size:15px;line-height:1.7}
.state i{display:block;font-style:normal;font-size:40px;margin-bottom:8px}
.state b{display:block;color:var(--night);font-size:17px;margin-bottom:4px}
.wave{display:inline-flex;gap:6px;margin-top:12px}
.wave span{width:8px;height:8px;border-radius:50%;background:var(--violet);animation:wv 1.1s infinite ease-in-out}
.wave span:nth-child(2){animation-delay:.15s}.wave span:nth-child(3){animation-delay:.3s}
@keyframes wv{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-7px);opacity:1}}
.giftTop{text-align:center;background:linear-gradient(140deg,#0E1736,#2A2370 65%,#3B2F72);color:#fff;border-radius:18px;padding:22px 14px 18px;position:relative;overflow:hidden;box-shadow:0 10px 24px rgba(14,23,54,.25)}
.giftTop:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,#7FE3D6,#8A6FC9,#E6A9C8,#F3E3B5)}
.giftTop i{display:block;font-style:normal;font-size:40px;animation:pop .9s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{0%{transform:scale(.3) rotate(-12deg);opacity:0}60%{transform:scale(1.12) rotate(4deg);opacity:1}100%{transform:none}}
.giftTop b{display:block;font-family:'Nanum Myeongjo',serif;font-size:20px;color:#F3E3B5;margin-top:6px;line-height:1.45;word-break:keep-all}
.giftTop span{display:block;font-size:14.5px;margin-top:6px;font-weight:700;line-height:1.5;word-break:keep-all}
.sample{display:inline-block;margin-top:10px;background:#B8323A;color:#fff;font-size:12px;font-weight:800;border-radius:999px;padding:3px 12px}
.zone{font-size:12px;font-weight:800;color:#5B4A9A;letter-spacing:.3px;margin:20px 2px 8px}
.letter{background:#FFFDF8;border:1px solid #EFE4CC;border-radius:16px;padding:18px 16px;font-family:'Nanum Myeongjo',serif;font-size:16px;line-height:1.95;color:#3A2E1E;white-space:pre-wrap;word-break:keep-all}
.letter .from{display:block;text-align:right;margin-top:10px;font-size:14.5px;color:#6A5A3E}
.pic{margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px;text-align:center}
.pic img{max-width:100%;border-radius:10px;display:block;margin:0 auto}
.words{margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px 14px}
.words div{padding:10px 0;border-bottom:1px solid #F0ECF5;font-size:14.5px;line-height:1.6}
.words div:last-child{border-bottom:0}
.words b{display:block;font-size:12.5px;color:#5B4A9A}
.inc{background:#fff;border:1.5px solid #D9D0F0;border-radius:16px;padding:16px 14px;text-align:center}
.inc .t{font-family:'Nanum Myeongjo',serif;font-size:19px;font-weight:800;color:var(--night)}
.inc .g{font-size:15px;color:#3B2F72;font-weight:700;margin-top:6px;line-height:1.6;word-break:keep-all}
.take{margin-top:20px;background:#fff;border:1.5px solid #D9D0F0;border-radius:18px;padding:16px 14px 14px;box-shadow:0 6px 18px rgba(74,63,120,.08)}
.take .h{font-size:15.5px;font-weight:800;color:var(--night);line-height:1.55;text-align:center;word-break:keep-all}
.take .s{font-size:13px;color:var(--sub);line-height:1.55;text-align:center;margin-top:6px;word-break:keep-all}
.bigBtn{display:block;width:100%;margin-top:14px;border:0;border-radius:16px;padding:16px 14px;font-size:17px;font-weight:800;color:#fff;background:linear-gradient(135deg,#2A2370,#1E4A76 55%,#2C6E8F);box-shadow:0 8px 20px rgba(30,74,118,.32);text-align:center;text-decoration:none}
.bigBtn[disabled]{opacity:.6}
.again{display:inline-block;margin-top:14px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);border-radius:14px;padding:11px 18px;font-size:15px;font-weight:700;text-decoration:none}
.err{margin-top:10px;color:#B0412E;font-size:14px;text-align:center;font-weight:700;min-height:1px}
.lock{display:inline-block;margin-top:12px;background:rgba(255,255,255,.12);border:1px solid rgba(243,227,181,.5);color:#F3E3B5;border-radius:999px;padding:6px 14px;font-size:15px;font-weight:800}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);background:rgba(14,23,54,.92);color:#fff;font-size:14px;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:2147483100;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body data-lf-title="선물">
<div class="wrap" id="g">
  <div class="state"><b>선물</b>선물을 여는 중입니다<div class="wave"><span></span><span></span><span></span></div></div>
</div>
<div id="lfFoot"></div>
<div class="toast" id="toast"></div>

<script src="/lf/ident.js?v=4"></script>
<script>
(function () {
  'use strict';
  var GAS = 'https://script.google.com/macros/s/AKfycbxLIG_LRAZD3AMJH26gPhefdkwLbXmA5ip_UurBfQ-53bxgq2T63dSre6YO9j4hxBZM1A/exec';
  var MEM_K = 'lf_my_k';
  var $ = function (id) { return document.getElementById(id); };
  var T = '', D = null;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function ls(k, v) { try { if (v === undefined) { return localStorage.getItem(k) || ''; } localStorage.setItem(k, v); } catch (e) { } return ''; }
  function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove('on'); }, 2400); }
  function ding() {
    try {
      var C = window.AudioContext || window.webkitAudioContext; if (!C) { return; }
      var a = new C(), t = a.currentTime;
      [880, 1318.5].forEach(function (f, i) { var o = a.createOscillator(), g = a.createGain(); o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t + i * 0.12); g.gain.exponentialRampToValueAtTime(0.08, t + i * 0.12 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.12 + 0.5); o.connect(g); g.connect(a.destination); o.start(t + i * 0.12); o.stop(t + i * 0.12 + 0.55); });
    } catch (e) { }
  }
  function jsonp(params, done, wait) {
    var cb = 'lfG' + Date.now() + Math.floor(Math.random() * 1000), fin = false, s = document.createElement('script');
    var timer = setTimeout(function () { if (fin) { return; } fin = true; cleanup(); done(null); }, wait || 20000);
    function cleanup() { try { delete window[cb]; } catch (e) { window[cb] = undefined; } if (s.parentNode) { s.parentNode.removeChild(s); } }
    window[cb] = function (r) { if (fin) { return; } fin = true; clearTimeout(timer); cleanup(); done(r); };
    var u = GAS + '?callback=' + cb;
    for (var k in params) { u += '&' + k + '=' + encodeURIComponent(params[k]); }
    s.src = u; s.onerror = function () { if (fin) { return; } fin = true; clearTimeout(timer); cleanup(); done(null); };
    document.body.appendChild(s);
  }
  /* 보낸 분 이름 — 그대로(넷 이상만 「외 n분」) */
  function names() {
    var ns = [D.giver].concat(D.tog || []).filter(function (x) { return String(x || '').trim(); });
    if (!ns.length) { return ''; }
    return ns.length <= 3 ? ns.join(' · ') + ' 님' : ns.slice(0, 3).join(' · ') + ' 님 외 ' + (ns.length - 3) + '분';
  }
  function giftWord() { var ns = [D.giver].concat(D.tog || []).filter(function (x) { return String(x || '').trim(); }); return ns.length > 1 ? '이 함께 선물하신' : '이 선물하신'; }
  function fromLine() { var n = names(); return n ? n + giftWord() + ' 사랑흐름 여권입니다' : '마음을 담은 사랑흐름 여권입니다'; }
  function md(d) { var p = String(d || '').split('-'); return p.length === 3 ? (+p[1]) + '월 ' + (+p[2]) + '일' : d; }

  function state(icon, title, text, extra) {
    $('g').innerHTML = '<div class="state"><i>' + icon + '</i><b>' + title + '</b>' + text + (extra || '') + '</div>';
  }
  function myBtn(label) {
    var k = ls(MEM_K);
    return /^[A-Za-z0-9]{10}$/.test(k) ? '<br><a class="again" href="/my/?k=' + k + '">' + (label || '사랑흐름 여권 화면 열기') + '</a>' : '<br><a class="again" href="/find/">사랑흐름 여권 찾기</a>';
  }

  function open() {
    var q = new URLSearchParams(location.search);
    T = String(q.get('t') || '').trim();
    if (!/^[A-Za-z0-9]{7}$/.test(T)) { state('🎁', '선물을 찾지 못했습니다', '받으신 링크를 끝까지 눌러 다시 열어 주세요.'); return; }
    jsonp({ action: 'giftOpen', t: T }, function (r) {
      if (!r || r.status !== 'ok') {
        state('📶', '연결이 잠시 늦어지고 있습니다', '조금 뒤에 다시 열어 주세요.', '<br><button type="button" class="again" id="re">다시 열기</button>');
        $('re').onclick = function () { location.reload(); };
        return;
      }
      D = r;
      var c = r['case'];
      if (c === 'none')    { state('🎁', '선물을 찾지 못했습니다', '받으신 링크를 끝까지 눌러 다시 열어 주세요.'); return; }
      if (c === 'old')     { state('🎁', '새 링크로 다시 보내 드린 선물입니다', '보내신 분께 받으신 새 링크로 열어 주세요.'); return; }
      if (c === 'taken')   { state('🎁', '이미 받으신 선물입니다', esc(fromLine()) + '.', myBtn()); return; }
      if (c === 'refused') { state('🎁', '열리지 않는 선물입니다', '보내신 분께 새 링크를 받아 열어 주세요.'); return; }
      paint(c);
    });
  }

  function paint(c) {
    var h = '<div class="giftTop"><i>🎁</i><b>' + esc(D.name ? D.name + ' 님께 ' : '') + '선물이 도착했습니다</b><span>' + esc(fromLine()) + '</span>'
      + (D.sample ? '<span class="sample">견본</span>' : '')
      + (c === 'rsv' ? '<span class="lock">🔒 ' + esc(md(D.date)) + '에 열립니다</span>' : '')
      + '</div>';
    if (c === 'rsv') {
      h += '<div class="state" style="padding:24px 10px">그날 이 링크를 다시 누르시면 선물이 열립니다.</div>';
      $('g').innerHTML = h; ding(); return;
    }
    /* ② 보내는 글 · 붙인 그림 · 함께하신 분들 한마디 */
    if (D.msg) {
      h += '<div class="zone">💌 보내는 글</div><div class="letter">' + esc(D.msg) + (names() ? '<span class="from">— ' + esc(names()) + '</span>' : '') + '</div>';
    }
    if (D.img) { h += '<div class="pic" id="pic" style="display:none"><img id="picImg" alt="함께 보낸 그림"></div>'; }
    if (D.maeum && D.maeum.length) {
      h += '<div class="words">';
      D.maeum.forEach(function (m) { h += '<div><b>' + esc(m.name) + ' 님</b>' + esc(m.text) + '</div>'; });
      h += '</div>';
    }
    /* ③ 담긴 여행 */
    h += '<div class="zone">🧳 구성</div><div class="inc"><div class="t">사랑흐름 여권</div><div class="g">' + esc(D.gus || '') + '</div></div>';
    /* ④ 받기 */
    h += '<div class="take" id="takeBox">'
      + '<div class="h">' + esc(names() ? names() + giftWord() + ' 사랑흐름 여권을 받으시려면 아래에 성명과 연락처를 넣고 「선물 받기」를 누르세요.' : '선물을 받으시려면 아래에 성명과 연락처를 넣고 「선물 받기」를 누르세요.') + '</div>'
      + '<div class="s">받으시면 사랑흐름 여권이 바로 열리고, 그 화면에서 여행을 시작하실 수 있습니다.</div>'
      + '<div id="lfIdent"></div>'
      + '<div class="err" id="err"></div>'
      + '<button type="button" class="bigBtn" id="takeBtn">🎁 선물 받기</button>'
      + '</div>';
    $('g').innerHTML = h;
    try { LFIdent.mount('lfIdent', { consent: true, checked: false, onEnter: take }); } catch (e) { }
    if (D.name && $('lfiName')) { $('lfiName').value = D.name; }
    $('takeBtn').onclick = function () { take(); };
    ding();
    if (D.img) {
      jsonp({ action: 'giftImg', t: T }, function (r) {
        if (r && r.status === 'ok' && r.data) { $('picImg').src = r.data; $('pic').style.display = 'block'; }
      });
    }
  }

  var busy = false;
  function take(add) {
    if (busy) { return; }
    var r = LFIdent.read();
    if (!r.ok) { $('err').textContent = r.msg; LFIdent.focus(r.field); return; }
    $('err').textContent = '';
    busy = true;
    var b = $('takeBtn'); b.disabled = true; b.textContent = '사랑흐름 여권을 만드는 중입니다…';
    jsonp({ action: 'giftTake', t: T, name: r.name, contact: r.contact, agree: r.agree, termsVer: r.termsVer, add: add ? '1' : '' }, function (res) {
      busy = false; b.disabled = false; b.textContent = '🎁 선물 받기';
      if (!res) { $('err').textContent = '연결이 늦어지고 있습니다. 다시 눌러 주세요. 두 번 받아지지 않습니다.'; return; }
      if (res.status === 'has') {
        $('takeBox').innerHTML = '<div class="h">이미 사랑흐름 여권을 가지고 계십니다.</div>'
          + '<div class="s">이 선물(' + esc(res.gus || D.gus || '') + ')을 가지고 계신 사랑흐름 여권에 더해 드릴까요?</div>'
          + '<div class="err" id="err"></div>'
          + '<button type="button" class="bigBtn" id="addBtn">가지고 계신 사랑흐름 여권에 더하기</button>';
        $('addBtn').onclick = function () {
          var ab = $('addBtn'); ab.disabled = true; ab.textContent = '더하는 중입니다…';
          jsonp({ action: 'giftTake', t: T, name: r.name, contact: r.contact, agree: r.agree, termsVer: r.termsVer, add: '1' }, function (r2) {
            ab.disabled = false; ab.textContent = '가지고 계신 사랑흐름 여권에 더하기';
            done(r2);
          }, 30000);
        };
        return;
      }
      done(res);
    }, 30000);
  }
  function done(res) {
    if (!res) { $('err').textContent = '연결이 늦어지고 있습니다. 다시 눌러 주세요. 두 번 받아지지 않습니다.'; return; }
    if (res.status !== 'ok') { $('err').textContent = res.msg || '잠시 후 다시 시도해 주세요.'; return; }
    ding();
    if (!res.attached && /^[A-Za-z0-9]{10}$/.test(String(res.key || ''))) {
      ls(MEM_K, res.key);
      try { sessionStorage.setItem('lf_passport', res.passport); localStorage.setItem('lf_passport', res.passport); } catch (e) { }
      location.href = '/my/?k=' + res.key;
      return;
    }
    state('🎁', '가지고 계신 사랑흐름 여권에 더했습니다', esc(res.gus || D.gus || '') + '<br>늘 쓰시던 사랑흐름 여권으로 들어가시면 바로 쓰실 수 있습니다.', myBtn());
  }

  window.LF_G = { open: open, data: function () { return D; } };   /* 견본 시험용 */
  open();
})();
</script>
<script src="/lf-foot.js" defer></script>
<script src="/lf/frame.js?v=22"></script>
</body>
</html>
