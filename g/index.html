<script>
(function () {
  'use strict';
  var GAS = 'https://script.google.com/macros/s/AKfycbxLIG_LRAZD3AMJH26gPhefdkwLbXmA5ip_UurBfQ-53bxgq2T63dSre6YO9j4hxBZM1A/exec';
  var MEM_K = 'lf_my_k';
  var $ = function (id) { return document.getElementById(id); };
  var T = '', D = null;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function ls(k, v) { try { if (v === undefined) { return localStorage.getItem(k) || ''; } localStorage.setItem(k, v); } catch (e) { } return ''; }
  function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove('on'); }, 2400); }
  function ding() { try { if (window.LFFx && LFFx.soft) { LFFx.soft([880, 1318.5]); } } catch (e) { } }
  function jsonp(params, done, wait) {
    var cb = 'lfG' + Date.now() + Math.floor(Math.random() * 1000), fin = false, s = document.createElement('script');
    var timer = setTimeout(function () { if (fin) { return; } fin = true; cleanup(); done(null); }, wait || 20000);
    function cleanup() { try { delete window[cb]; } catch (e) { window[cb] = undefined; } if (s.parentNode) { s.parentNode.removeChild(s); } }
    window[cb] = function (r) { if (fin) { return; } fin = true; clearTimeout(timer); cleanup(); done(r); };
    var u = GAS + '?callback=' + cb;
    for (var k in params) { u += '&' + k + '=' + encodeURIComponent(params[k]); }
    s.src = u; s.onerror = function () { if (fin) { return; } fin = true; clearTimeout(timer); cleanup(); done(null); };
    document.body.appendChild(s);
  }
  /* 보낸 분 이름 — 그대로(넷 이상만 「외 n분」) */
  function names() {
    var ns = [D.giver].concat(D.tog || []).filter(function (x) { return String(x || '').trim(); });
    if (!ns.length) { return ''; }
    return ns.length <= 3 ? ns.join(' · ') + ' 님' : ns.slice(0, 3).join(' · ') + ' 님 외 ' + (ns.length - 3) + '분';
  }
  /* ★v4 보내는 분이 적은 그대로 — 「사랑하는 딸 민지가」처럼 조사로 끝나면 그대로, 이름만이면 「○○ 님이」 */
  function soloG() { return !(D.tog && D.tog.filter(function (x) { return String(x || '').trim(); }).length) && String(D.giver || '').trim(); }
  function fromSubj() { var g = String(D.giver || '').trim(); return /(가|이|께서|로부터|으로부터)$/.test(g) ? g : g + ' 님이'; }
  function fromSign() { var g = soloG(); return g ? g : names(); }
  function giftWord() { var ns = [D.giver].concat(D.tog || []).filter(function (x) { return String(x || '').trim(); }); return ns.length > 1 ? '이 함께 선물하신' : '이 선물하신'; }
  function fromLine() { if (soloG()) { var f = fromSubj(); return f + (/로부터$/.test(f) ? ' 온' : ' 보낸') + ' 선물입니다'; } var n = names(); return n ? n + giftWord() + ' 사랑흐름 여권입니다' : '마음을 담은 사랑흐름 여권입니다'; }
  function md(d) { var p = String(d || '').split('-'); return p.length === 3 ? (+p[1]) + '월 ' + (+p[2]) + '일' : d; }

  function state(icon, title, text, extra) {
    $('g').innerHTML = '<div class="state"><i>' + icon + '</i><b>' + title + '</b>' + text + (extra || '') + '</div>';
  }
  function myBtn(label) {
    var k = ls(MEM_K);
    return /^[A-Za-z0-9]{10}$/.test(k) ? '<br><a class="again" href="/my/?k=' + k + '">' + (label || '사랑흐름 여권 화면 열기') + '</a>' : '<br><a class="again" href="/find/">사랑흐름 여권 찾기</a>';
  }

  /* ★v4 860 보내신 분이 고른 그 시절 이야기 — 메인과 같은 eraOne · 받는 분 기기에 곳 · 때를 남겨 첫 이야기 화면에서 바로(lf_era_pick) */
  var ERA_PL = { field: '🌾 들과 산', sea: '🌊 바다와 섬', alley: '🏘️ 골목과 장터' };
  function eraShow() {
    var a = String(D.era || '').split('|'), g = a[0], d = parseInt(a[1], 10), i = parseInt(a[2], 10) || 0, box = $('gEraBox');
    if (!ERA_PL[g] || !(d >= 1940 && d <= 2010)) { if (box) { box.parentNode.removeChild(box.previousSibling); box.parentNode.removeChild(box); } return; }
    try { localStorage.setItem('lf_era_pick', JSON.stringify({ g: g, p: ERA_PL[g], d: d })); } catch (e) { }
    var MG = 'https://script.google.com/macros/s/AKfycbxJSELNi3T6YXJP5qGuGcMAFPZBXsUOejNFNFLw0RDWX0qFJlOtVhV38QXWCTKTv6yA/exec';
    var cb = 'gera' + Date.now(), sc = document.createElement('script'), fin = false;
    window[cb] = function (r) { if (fin) { return; } fin = true; try { delete window[cb]; } catch (e) { }
      if (!(r && r.status === 'ok' && r.t)) { box.innerHTML = '<span style="color:#9a8f7c;font-size:14px">' + esc(ERA_PL[g]) + ' · ' + d + '년대 무렵</span>'; return; }
      box.innerHTML = '<span style="display:block;color:#9a8f7c;font-size:13px;font-family:inherit">' + esc(ERA_PL[g]) + ' · ' + d + '년대 무렵</span><b style="display:block;margin:2px 0 6px;color:#163a5e">' + esc(r.t) + '</b>' + esc(r.scene);
    };
    sc.src = MG + '?action=eraOne&g=' + g + '&dec=' + d + '&i=' + i + '&callback=' + cb; document.body.appendChild(sc);
  }
  function open() {
    var q = new URLSearchParams(location.search);
    T = String(q.get('t') || '').trim();
    if (!/^[A-Za-z0-9]{7}$/.test(T)) { state('🎁', '선물을 찾지 못했습니다', '받으신 링크를 끝까지 눌러 다시 열어 주세요.'); return; }
    jsonp({ action: 'giftOpen', t: T }, function (r) {
      if (!r || r.status !== 'ok') {
        state('📶', '연결이 잠시 늦어지고 있습니다', '조금 뒤에 다시 열어 주세요.', '<br><button type="button" class="again" id="re">다시 열기</button>');
        $('re').onclick = function () { location.reload(); };
        return;
      }
      D = r;
      var c = r['case'];
      if (c === 'none')    { state('🎁', '선물을 찾지 못했습니다', '받으신 링크를 끝까지 눌러 다시 열어 주세요.'); return; }
      if (c === 'wait')    { state('🎁', '선물을 준비하고 있어요', (r.giver ? esc(r.giver) + ' 님이 보내신 선물이 곧 열려요.<br>' : '선물이 곧 열려요.<br>') + '조금 뒤에 이 링크를 다시 열어 주세요.'); return; }   /* ★v6 */
      if (c === 'old')     { state('🎁', '새 링크로 다시 보내 드린 선물입니다', '보내신 분께 받으신 새 링크로 열어 주세요.'); return; }
      if (c === 'taken')   { state('🎁', '이미 받으신 선물입니다', esc(fromLine()) + '.', myBtn()); return; }
      if (c === 'refused') { state('🎁', '열리지 않는 선물입니다', '보내신 분께 새 링크를 받아 열어 주세요.'); return; }
      paint(c);
    });
  }

  function paint(c) {
    var h = '<div class="giftTop"><i>🎁</i><b>' + esc(D.name ? D.name + ' 님께 ' : '') + '선물이 도착했습니다</b><span>' + esc(fromLine()) + '</span>'
      + (D.sample ? '<span class="sample">견본</span>' : '')
      + (c === 'rsv' ? '<span class="lock">🔒 ' + esc(md(D.date)) + '에 열립니다</span>' : '')
      + '</div>';
    if (c === 'rsv') {
      h += '<div class="state" style="padding:24px 10px">그날 이 링크를 다시 누르시면 선물이 열립니다.</div>';
      $('g').innerHTML = h; ding(); return;
    }
    /* ② 보내는 글 · 붙인 그림 · 함께하신 분들 한마디 */
    if (D.msg) {
      h += '<div class="zone">💌 보내는 글</div><div class="letter">' + esc(D.msg) + (fromSign() ? '<span class="from">— ' + esc(fromSign()) + '</span>' : '') + '</div>';
    }
    if (D.era) { h += '<div class="zone">🕰 함께 보낸 그 시절 이야기</div><div class="letter era" id="gEraBox" style="white-space:normal"><span style="color:#9a8f7c;font-size:14px">그 시절 이야기를 꺼내 오고 있어요…</span></div>'; }   /* ★v4 860 */
    if (D.img) { h += '<div class="pic" id="pic" style="display:none"><img id="picImg" alt="함께 보낸 그림"></div>'; }
    if (D.maeum && D.maeum.length) {
      h += '<div class="words">';
      D.maeum.forEach(function (m) { h += '<div><b>' + esc(m.name) + ' 님</b>' + esc(m.text) + '</div>'; });
      h += '</div>';
    }
    /* ③ 담긴 여행 */
    h += '<div class="zone">🧳 구성</div><div class="inc"><div class="t">사랑흐름 여권</div><div class="g">' + esc(D.gus || '') + '</div></div>';
    /* ④ 받기 */
    h += '<div class="take" id="takeBox">'
      + '<div class="h">선물을 받으시려면 받는 분과 연락처를 넣고 「선물 받기」를 누르세요.</div>'
      + '<div class="s">받으시면 사랑흐름 여권이 바로 열리고, 그 화면에서 여행을 시작하실 수 있습니다.</div>'
      + '<div id="lfIdent"></div>'
      + '<div class="err" id="err"></div>'
      + '<button type="button" class="bigBtn" id="takeBtn">🎁 선물 받기</button>'
      + '</div>';
    $('g').innerHTML = h;
    if (D.era) { eraShow(); }
    try { LFIdent.mount('lfIdent', { consent: true, checked: false, onEnter: take }); } catch (e) { }
    if (D.name && $('lfiName')) { $('lfiName').value = D.name; }
    /* ★v4 칸 이름 — 「성명」 → 「받는 분」 · 연락처 아래 쓰임 한 줄 (공용 부품 ident.js 는 그대로) */
    try {
      Array.prototype.forEach.call($('lfIdent').querySelectorAll('div'), function (d) { if (d.children.length === 0 && d.textContent === '성명') { d.textContent = '받는 분'; } });
      if ($('lfiName')) { $('lfiName').placeholder = '이름을 적어 주세요'; }
      var nm = $('lfiNum'); if (nm && !$('numUse')) { var u = document.createElement('div'); u.id = 'numUse'; u.style.cssText = 'font-size:12.5px;color:#8a7e6e;margin:5px 2px 0'; u.textContent = '사랑흐름 여권번호를 잊으셨을 때 이 번호로 찾아 드려요'; nm.parentNode.insertBefore(u, nm.nextSibling); }
    } catch (e) { }
    $('takeBtn').onclick = function () { take(); };
    ding();
    if (D.img) {
      jsonp({ action: 'giftImg', t: T }, function (r) {
        if (r && r.status === 'ok' && r.data) { $('picImg').src = r.data; $('pic').style.display = 'block'; }
      });
    }
  }

  var busy = false;
  function take(add) {
    if (busy) { return; }
    var r = LFIdent.read();
    if (!r.ok) { $('err').textContent = String(r.msg || '').replace('성명을 적어 주세요', '받는 분을 적어 주세요'); LFIdent.focus(r.field); return; }
    $('err').textContent = '';
    busy = true;
    var b = $('takeBtn'); b.disabled = true; b.textContent = '사랑흐름 여권을 만드는 중입니다…';
    jsonp({ action: 'giftTake', t: T, name: r.name, contact: r.contact, agree: r.agree, termsVer: r.termsVer, add: add ? '1' : '' }, function (res) {
      busy = false; b.disabled = false; b.textContent = '🎁 선물 받기';
      if (!res) { $('err').textContent = '연결이 늦어지고 있습니다. 다시 눌러 주세요. 두 번 받아지지 않습니다.'; return; }
      if (res.status === 'has') {
        $('takeBox').innerHTML = '<div class="h">이미 사랑흐름 여권을 가지고 계십니다.</div>'
          + '<div class="s">이 선물(' + esc(res.gus || D.gus || '') + ')을 가지고 계신 사랑흐름 여권에 더해 드릴까요?</div>'
          + '<div class="err" id="err"></div>'
          + '<button type="button" class="bigBtn" id="addBtn">가지고 계신 사랑흐름 여권에 더하기</button>';
        $('addBtn').onclick = function () {
          var ab = $('addBtn'); ab.disabled = true; ab.textContent = '더하는 중입니다…';
          jsonp({ action: 'giftTake', t: T, name: r.name, contact: r.contact, agree: r.agree, termsVer: r.termsVer, add: '1' }, function (r2) {
            ab.disabled = false; ab.textContent = '가지고 계신 사랑흐름 여권에 더하기';
            done(r2, r);
          }, 30000);
        };
        return;
      }
      done(res, r);
    }, 30000);
  }
  function done(res, who) {
    if (!res) { $('err').textContent = '연결이 늦어지고 있습니다. 다시 눌러 주세요. 두 번 받아지지 않습니다.'; return; }
    if (res.status !== 'ok') { $('err').textContent = res.msg || '잠시 후 다시 시도해 주세요.'; return; }
    ding();
    if (!res.attached && /^[A-Za-z0-9]{10}$/.test(String(res.key || ''))) {
      ls(MEM_K, res.key);
      try { sessionStorage.setItem('lf_passport', res.passport); localStorage.setItem('lf_passport', res.passport); } catch (e) { }
      location.href = '/my/?k=' + res.key;
      return;
    }
    /* ★v3 829 운5 — 이 기기에 마지막으로 쓴 사랑흐름 여권(남의 것일 수 있음)을 열지 않음.
       방금 넣으신 성명 · 연락처로 「사랑흐름 여권 찾기」와 같은 길(findPassport → giftPassKey)을 밟아 더한 그 여권을 보이고 엶. */
    state('🎁', '가지고 계신 사랑흐름 여권에 더했습니다', esc(res.gus || D.gus || '') + '<div id="addPp" style="margin-top:10px;color:#6B6458;font-size:14px">더한 사랑흐름 여권을 찾고 있습니다…</div>', '<div id="addGo"></div>');
    var toFind = '<br><a class="again" href="/find/">사랑흐름 여권 찾기</a>';
    if (!who || !who.name || !who.contact) { $('addPp').innerHTML = ''; $('addGo').innerHTML = toFind; return; }
    var p4 = String(who.contact).replace(/\D/g, '').slice(-4);
    jsonp({ action: 'findPassport', name: who.name, contact: who.contact }, function (f) {
      var c = (f && f.candidates) || [];
      if (c.length !== 1 || !c[0].passport) { $('addPp').innerHTML = '늘 쓰시던 사랑흐름 여권으로 들어가시면 바로 쓰실 수 있습니다.'; $('addGo').innerHTML = toFind; return; }
      var pp = String(c[0].passport);
      $('addPp').innerHTML = '사랑흐름 여권번호 <b style="color:#163a5e">' + esc(pp) + '</b>';
      $('addGo').innerHTML = '<br><a class="again" href="#" id="addOpen">이 사랑흐름 여권 화면 열기</a>';
      $('addOpen').onclick = function (ev) {
        ev.preventDefault(); var a = this; a.textContent = '사랑흐름 여권 화면을 여는 중입니다';
        jsonp({ action: 'giftPassKey', no: pp, p4: p4 }, function (k) {
          if (k && k.status === 'ok' && k.k) { ls(MEM_K, k.k); try { sessionStorage.setItem('lf_passport', pp); localStorage.setItem('lf_passport', pp); } catch (e) { } location.href = '/my/?k=' + encodeURIComponent(k.k); return; }
          a.textContent = '이 사랑흐름 여권 화면 열기'; $('addGo').innerHTML += toFind;
        }, 15000);
      };
    }, 15000);
  }

  window.LF_G = { open: open, data: function () { return D; } };   /* 견본 시험용 */
  open();
})();
</script>
<script src="/lf-foot.js" defer></script>
<script src="/lf/frame.js?v=22"></script>
<script src="/lf/fx.js?v=3" defer></script>
</body>
