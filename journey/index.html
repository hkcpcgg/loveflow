<!-- ═══════════════════════════════════════════════════════════════════
     [v20] 잠금 — 여권 없이 들어오면 게이트로 되돌립니다.
     ★반드시 head 맨 위. 화면이 그려지기 전에 튕겨야 유료 내용이 안 새 나갑니다.

     [라이브에서 그대로 떼어 왔고, 버그 하나를 고쳤습니다]
       기존:  /[?&]id=LF-/i   ← "LF-" 라는 글자만 찾습니다.
              그런데 지금 나가는 여권은 LFL-GAKU5 · LFM-ABC12 입니다.
              "LFL-" 안에는 "LF-" 라는 글자가 없습니다(LF 다음이 L이라).
              → 돈 내고 발권받은 손님이 여행지도에 못 들어가고 게이트로 되튕깁니다.
       수정:  /[?&]id=LF[ML]?-/i   ← 옛 LF- · LFM- · LFL- 전부 알아봅니다.

     [동작]
       · 주소에 여권번호가 있으면 → 통과 + 자물쇠를 풀어 둡니다(새로고침·뒤로가기 대비)
       · 한 번 풀렸으면 → 주소에 번호가 없어도 통과 (여행 중 새로고침해도 안 튕김)
       · 둘 다 아니면 → 게이트로
       · 여권번호는 따로 기억해 둡니다(저장·결과지·편지가 씁니다)
     ═══════════════════════════════════════════════════════════════════ -->
<script>(function(){
  try{
    var m = location.search.match(/[?&]id=(LF[ML]?-[A-Za-z0-9]+)/i);
    if (m) {
      var pp = m[1].toUpperCase();
      try{ sessionStorage.setItem('lf_unlock','1'); }catch(e){}
      try{ sessionStorage.setItem('lf_passport', pp); }catch(e){}
      try{ localStorage.setItem('lf_passport', pp); }catch(e){}
    }
    var unlocked = false;
    try{ unlocked = (sessionStorage.getItem('lf_unlock') === '1'); }catch(e){}

    if (window.top === window.self && /^https?:/.test(location.protocol) && !m && !unlocked) {
      location.replace('/gate.html');
    }
  }catch(e){}
})();</script>

   [근거] 260707 이사회 확정 · 여행 가방 기록:
     "임시저장·자동저장을 모든 질문 여정에 적용. 답할 때마다 자동 저장(localStorage)
      + 재진입 시 '이어서 하기' 제공. ★여권번호 기준으로 진행 상태 저장."
     → 확정만 되고 구현이 안 돼 있었음. v20에서 넣습니다.
   [대표 지시 260712] 자동으로만 담지 말고 ★임시저장 버튼이 항상 눈에 보여야 함.
   [저장 열쇠] lf_journey_ + 여권번호  → 다른 여행과 안 섞입니다.
   ═══════════════════════════════════════════════════════════════════ */
function draftKey(){
  var p = myPassport();
  return 'lf_journey_' + (p || 'guest');
}

/* 답할 때마다 조용히 담아둡니다. 버튼을 누르면 "담았어요"를 보여줍니다. */
function saveDraft(loud){
  try{
    var box = {
      i: i,
      sel: sel,
      selText: selText,
      data: data,
      at: Date.now(),
      v: 'v19'
    };
    localStorage.setItem(draftKey(), JSON.stringify(box));
    if (loud) { flashSaved(); }
  }catch(e){
    if (loud) {
      var m = document.getElementById('savemsg');
      if (m) { m.textContent = '이 브라우저에선 담아둘 수 없어요'; }
    }
  }
}

function flashSaved(){
  var m = document.getElementById('savemsg');
  if (!m) { return; }
  m.textContent = '여기까지 담아뒀어요. 안심하고 다녀오세요';
  m.classList.add('on');
  clearTimeout(window._svT);
  window._svT = setTimeout(function(){
    m.textContent = '답하실 때마다 자동으로 담아둡니다';
    m.classList.remove('on');
  }, 2600);
}

function clearDraft(){
  try{ localStorage.removeItem(draftKey()); }catch(e){}
}

/* 저장해둔 여행이 있나 — 첫 화면에서 한 번만 물어봅니다 */
function loadDraft(){
  try{
    var raw = localStorage.getItem(draftKey());
    if (!raw) { return null; }
    var box = JSON.parse(raw);
    if (!box || typeof box.i !== 'number' || box.i < 1) { return null; }
    return box;
  }catch(e){ return null; }
}

function offerResume(){
  var box = loadDraft();
  if (!box) { return; }
  var host = document.getElementById('stage');
  if (!host) { return; }
  var n = box.i + 1;
  var h = '<div class="resume">'
        + '<p>지난번 <b>' + n + '번째 물음</b>까지 오셨어요.<br>거기서부터 이어서 여행할까요?</p>'
        + '<div class="rb">'
        + '<button class="go" onclick="resumeJourney()">이어서 여행하기</button>'
        + '<button class="fresh" onclick="freshJourney()">처음부터</button>'
        + '</div></div>';
  host.insertAdjacentHTML('afterbegin', h);
}

function resumeJourney(){
  var box = loadDraft();
  if (!box) { return; }
  sel     = box.sel || {};
  selText = box.selText || {};
  data    = box.data || {target:null, nick:"", mbtiMe:null, mbtiYou:null};
  i       = box.i;
  fade();
}

function freshJourney(){
  clearDraft();
  var r = document.querySelector('.resume');
  if (r) { r.remove(); }
}

/* 아직 담기지 않은 답이 있나 (여행 중인가) */
function inJourney(){
  if (SAVED_ONCE) { return false; }          /* 이미 여행을 마쳤으면 붙잡지 않습니다 */
  if (i <= 0) { return false; }              /* 아직 시작 안 했으면 붙잡지 않습니다 */
  var has = false, k;
  for (k in sel) { has = true; break; }
  if (!has && data.target === null) { return false; }
  return true;
}

/* 나가려 할 때 한 번 붙잡습니다. 나가도 담아둔 건 남습니다. */
function leaveGuard(ev){
  if (!inJourney()) { return true; }
  saveDraft(false);                          /* 나가기 전에 먼저 담아둡니다 */
  var ok = confirm('여행 중이시네요.\n\n여기까지는 담아뒀으니, 다시 오시면 이어서 하실 수 있어요.\n\n지금 나갈까요?');
  if (!ok && ev) { ev.preventDefault(); return false; }
  return ok;
}

function goHomeGuard(){
  if (leaveGuard(null)) { location.href = '/'; }
}

function restartJourney(){
  if (inJourney()) {
    if (!confirm('처음부터 다시 시작하면\n지금까지 적으신 마음이 사라져요.\n\n그래도 다시 시작할까요?')) { return; }
  }
  clearDraft();
  location.reload();
}

/* 임시저장 줄은 질문 화면에서만 보입니다 (의식·되묻기·마지막 화면엔 숨김) */
function paintSaveRow(){
  var row = document.getElementById('saverow');
  if (!row) { return; }
  var s = steps[i];
  var hide = (!s || s.t === 'rite' || s.t === 'repq' || s.t === 'saved');
  if (hide) { row.classList.add('hide'); }
  else      { row.classList.remove('hide'); }
}

/* 유료 GAS(M1A) — issuePassport·saveJourney·lookupPassport 가 사는 곳 */
function gasUrl(){
  return 'https://script.google.com/macros/s/'
       + 'AKfycbxLIG_LRAZD3AMJH26gPhefdkwLbXmA5ip_UurBfQ-53bxgq2T63dSre6YO9j4hxBZM1A'
       + '/exec';
}

/* 여권번호 — 주소 → 세션 → 저장소 순으로 읽습니다.
   여행 중 새로고침·뒤로가기로 주소에서 번호가 빠져도 저장이 안 깨지게. */
function myPassport(){
  var p = '';
  try{
    var m = location.search.match(/[?&]id=(LF[ML]?-[A-Za-z0-9]+)/i);
    if (m) { p = m[1]; }
  }catch(e){}
  if (!p) { try{ p = sessionStorage.getItem('lf_passport') || ''; }catch(e){} }
  if (!p) { try{ p = localStorage.getItem('lf_passport') || ''; }catch(e){} }
  return p.trim().toUpperCase();
}

/* [v20-1 · 260713 · 이사회 의결] 삭제: myProductType()
   여권 접두어(LFL-/LFM-)로 상품을 판단하던 함수입니다.
   ★이사회 만장일치로 "여권번호는 LF- 하나. 번호에 상품 의미를 넣지 않는다"로 확정됐습니다.
   상품구분은 발권할 때 이미 ★주문대장 J열에 찍힙니다(issuePassport v4).
   화면이 다시 보낼 이유가 없고, 보내면 오히려 빈칸으로 덮어씁니다. */

function saveJourneyToGAS(){
  if (SAVED_ONCE) { return; }
  SAVED_ONCE = true;

  /* 선택형은 sel[i](번호), 서술형은 sel[i](글자).
     하이브리드는 sel[i]=번호 + selText[i]=직접 쓴 말 → 어댑터가 글자를 먼저 씁니다. */
  var merged = {};
  var k;
  for (k in sel)     { merged[k] = sel[k]; }
  for (k in selText) {
    var txt = (selText[k] || '').trim();
    if (txt) { merged[k] = txt; }        /* 직접 쓴 말이 있으면 그게 이깁니다 */
  }

  var payload = {
    action: 'saveJourney',
    sel:  merged,
    data: { target: data.target, nick: data.nick, mbtiMe: data.mbtiMe, mbtiYou: data.mbtiYou },
    meta: {
      passport:       myPassport(),
      /* productType 안 보냅니다 — 주문대장 J열이 원본입니다 (이사회 의결 260713) */
      journeyVersion: 'v19',
      repository:     'main',
      inputMethod:    '온라인',
      issueChannel:   ''
    },
    email: ''
  };

  try {
    /* ★한 번만 보냅니다(no-cors).
       GAS 웹앱은 CORS 응답을 못 돌려줍니다. 그래서 "응답을 못 읽었다"와
       "저장이 안 됐다"를 구분할 수 없습니다.
       실패한 줄 알고 다시 보내면, 서버엔 이미 들어간 뒤라 ★두 줄이 저장됩니다.
       결과는 어차피 결과지가 여권번호로 다시 읽어 그리므로, 응답을 읽을 필요가 없습니다.
       (라이브 여행지도도 같은 방식입니다) */
    fetch(gasUrl(), { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
  } catch(e) {}
}


function answered(){
  var s=steps[i];
  if(s.t==="rite"||s.t==="repq"||s.t==="saved") return true;
  if(s.t==="target") return data.target!==null;
  if(s.t==="mbti") return (s.who==="me"?data.mbtiMe:data.mbtiYou)!==null;
  if(s.t==="write") return (sel[i]||"").trim().length>0;
  return sel[i]!==undefined && sel[i]!==null;
}

function paint(){
  var s=steps[i], h="";
  var body=document.getElementById("stage");
  var g = s.guide ? '<div class="guide">'+s.guide+'</div>' : '';
  if(s.t==="target"){
    h+=g+'<div class="q">'+s.q+'</div>'+(s.hint?'<div class="hint">'+s.hint+'</div>':'');
    h+='<div class="grid">';
    for(var a=0;a<TARGETS.length;a++){ h+='<button class="cell'+(data.target===a?" sel":"")+'" onclick="pickTarget('+a+')">'+TARGETS[a]+'</button>'; }
    h+='</div>';
    h+='<div class="nick"><label>그분을 뭐라고 부르시나요? (선택)</label><input value="'+esc(data.nick)+'" placeholder="예) 엄마, 그이, 벗…" oninput="data.nick=this.value"></div>';
  } else if(s.t==="mbti"){
    h+=g+'<div class="q">'+s.q+'</div>'+(s.hint?'<div class="hint">'+s.hint+'</div>':'');
    h+=mbtiOne(s.who);
  } else if(s.t==="write"){
    h+=g+'<div class="q">'+s.q+'</div>'+(s.hint?'<div class="hint">'+s.hint+'</div>':'');
    h+='<textarea placeholder="'+(s.ph||'')+'" oninput="sel[i]=this.value; refreshNext(); saveDraft(false);">'+esc(sel[i]||"")+'</textarea>';
  } else if(s.t==="opt"){
    h+=g+'<div class="q">'+s.q+'</div>'+(s.hint?'<div class="hint">'+s.hint+'</div>':'');
    h+='<div class="opts">'+optHtml(s.opts)+'</div>';
  } else if(s.t==="hybrid"){
    h+=g+'<div class="q">'+s.q+'</div>'+(s.hint?'<div class="hint">'+s.hint+'</div>':'');
    h+='<div class="opts">'+optHtml(s.opts)+'</div>';
    /* [v20] ★버그수정: 이 textarea 에 저장 코드가 없어, 손님이 직접 적은 말이 사라졌습니다.
       이 문항(가장 오래 남은 한마디)은 편지의 Q15 로 그대로 들어가는 칸입니다.
       selText[i] 에 담아 두면, 어댑터가 "고른 문구"보다 "직접 쓴 문장"을 먼저 씁니다. */
    h+='<details class="hybrid"><summary>'+s.more+' &#43;</summary><textarea placeholder="'+(s.ph||'')+'" oninput="selText[i]=this.value; saveDraft(false);">'+esc(selText[i]||"")+'</textarea></details>';
  } else if(s.t==="sense"){
    h+='<div class="sense"><div class="emo">'+s.emo+'</div>';
    h+=(s.guide?'<div class="guide">'+s.guide+'</div>':'');
    h+='<div class="q" style="font-size:18px">'+s.q+'</div><div style="height:14px"></div>';
    h+='<div class="opts">'+optHtml(s.opts)+'</div><div class="warm">'+s.warm+'</div></div>';
  } else if(s.t==="rite"){
    h+='<div class="rite"><div class="aura"></div>';
    h+=(s.spell?'<div class="spell">'+s.spell+'</div>':'');
    h+='<div class="halo">'+s.em+'</div><div class="q">'+s.q+'</div><div class="hint">'+s.hint+'</div>';
    h+='<div class="door"><button onclick="enterRite(\''+s.who+'\')">'+(s.door||'천천히, 시작할게요')+'</button></div></div>';
    breathe(); if(s.who==="self"){ riteSelf(); } else { riteOther(); }
  } else if(s.t==="repq"){
    h+='<div class="repq">'+petalsHtml()+'<div class="em">🌸</div><div class="big">'+s.big+'</div><div class="echo">'+s.echo+'</div></div>';
  } else if(s.t==="saved"){
    h+='<div class="saved"><div class="mark">🌸</div><h2>나의 마음, 잘 간직할게요</h2>';
    h+='<p>오늘의 마음은,<br>여행지도의 한 페이지가 되었어요.</p>';
    h+='<div class="season">여름이 가면 가을이 오듯,<br>나의 마음에도<br>다음 계절이 찾아올 거예요.<br>그때, 그분과 다시 만나요.</div>';
    h+='<div class="brand">모든 마음에는, 저마다의 흐름이 있으니까요.</div>';
    h+='<button class="toMap" onclick="departMap()">🗺 마음 여행지도 보기</button>';
    h+='<button class="restart" onclick="go(1)">처음으로 ↺</button></div>';
    chord();
    saveJourneyToGAS();   /* [v20] 마지막 화면에 닿는 순간 딱 한 번 저장 */
    clearDraft();         /* [v20] 여행을 마쳤으니 담아둔 임시본은 비웁니다 */
  }
  if(s.philo){ h+='<div class="philo">'+s.philo+'</div>'; }
  body.innerHTML=h;
  paintSaveRow();   /* [v20] 질문 화면에서만 임시저장 줄을 보여줍니다 */
  document.getElementById("bar").style.width=((i+1)/steps.length*100)+"%";
  document.getElementById("pcount").textContent=(i+1)+" / "+steps.length;
  document.getElementById("nextbtn").innerHTML=(i>=steps.length-1)?"처음으로 ↺":"다음 &#8250;";
  var _nav=document.querySelector(".nav");
  _nav.classList.toggle("hide", (s.t==="rite" && i===0) || s.t==="saved");
  _nav.classList.toggle("nonext", s.t==="rite" && i>0);
  refreshNext();
}
function refreshNext(){ document.getElementById("nextbtn").classList.toggle("off", !answered()); }

function esc(v){ return (v||"").replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function optHtml(opts){var o="";for(var k=0;k<opts.length;k++){o+='<button class="opt'+(sel[i]===k?" sel":"")+'" onclick="pick('+k+')">'+opts[k]+'</button>';}return o;}
function mbtiOne(who){
  var cur = who==="me"?data.mbtiMe:data.mbtiYou;
  var lab = who==="me" ? "🟡 내 성향(MBTI)" : "🔵 그분 성향(MBTI)";
  var h='<div class="mhead '+who+'">'+lab+'</div><div class="mgrid">';
  for(var k=0;k<MBTI_NAMES.length;k++){ h+='<button class="mcell '+who+(cur===k?" sel":"")+'" onclick="pickMbti(\''+who+'\','+k+')"><b>'+MBTI_NAMES[k][0]+'</b><span>'+MBTI_NAMES[k][1]+'</span></button>'; }
  h+='</div><button class="munknown'+(cur==="x"?" sel":"")+'" onclick="pickMbti(\''+who+'\',\'x\')">잘 모르겠어요</button>';
  return h;
}
/* [v20] 답할 때마다 자동으로 담아둡니다 (조용히 · 화면 안 건드림) */
function pick(k){ sel[i]=k; dingStep(); saveDraft(false); paint(); }
function pickTarget(a){ data.target=a; dingStep(); saveDraft(false); paint(); }
function pickMbti(who,k){ if(who==="me"){ data.mbtiMe=k; dingMe(); } else { data.mbtiYou=k; dingYou(); } saveDraft(false); paint(); }
function petalsHtml(){var p='<div class="petals">',L=[[8,0,7.5],[26,1.6,9],[48,3.4,8],[68,0.9,9.4],[86,2.6,8.4]];for(var k=0;k<L.length;k++){p+='<span class="pt" style="left:'+L[k][0]+'%;animation-delay:'+L[k][1]+'s;animation-duration:'+L[k][2]+'s">🌸</span>';}return p+'</div>';}
function enterRite(who){ if(who==="self"){ enterSelf(); } else { enterOther(); } go(1); }
function departMap(){ departSound(); /* 결과지로 이동(여권번호 전달) — v20: 주소에 없으면 보관해둔 번호를 씁니다 */ var id=myPassport(); var base='/journey/result.html'; setTimeout(function(){ location.href=base+'?id='+encodeURIComponent(id); },300); }
function go(d){
  if(d>0 && !answered()){ var b=document.getElementById("stage"); b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); return; }
  var n=i+d;if(n<0)return;if(n>=steps.length){i=0;sel={};selText={};SAVED_ONCE=false;data={target:null,nick:"",mbtiMe:null,mbtiYou:null};fade();return;}i=n;fade();
}
function fade(){var b=document.getElementById("stage");var slow=(steps[i]&&steps[i].t==="rite");b.classList.add("fade");setTimeout(function(){paint();setTimeout(function(){b.classList.remove("fade");},30);},slow?560:380);}
paint();
offerResume();   /* [v20] 담아둔 여행이 있으면 이어할지 물어봅니다 */

/* [v20] 브라우저 뒤로가기·창 닫기로 나갈 때도 담아둡니다 */
window.addEventListener('beforeunload', function(){
  if (inJourney()) { saveDraft(false); }
});
</script>
