<script>(function(){
  try{
    var m = location.search.match(/[?&]id=(LF[ML]?-[A-Za-z0-9]+)/i);
    if (m) {
      var pp = m[1].toUpperCase();
      try{ sessionStorage.setItem('lf_unlock','1'); }catch(e){}
      try{ sessionStorage.setItem('lf_passport', pp); }catch(e){}
      try{ localStorage.setItem('lf_passport', pp); }catch(e){}
    }
    var unlocked = false;
    try{ unlocked = (sessionStorage.getItem('lf_unlock') === '1'); }catch(e){}
    if (window.top === window.self && /^https?:/.test(location.protocol) && !m && !unlocked) {
      location.replace('/gate.html');
    }
  }catch(e){}
})();</script>

<style>

  /* [v3 · 260712 대표 지시] 이번에 여행한 관계 도장을 반짝이게.

    0%,100%{ filter:drop-shadow(0 0 0 rgba(212,175,55,0)); transform:scale(1); }

/* ═══════════════════════════════════════════════════════════════════
   [v3] LFRI 16유형 표 — ★라이브 편지(letter.html)의 표를 그대로 옮겨왔습니다.
   결과지와 편지가 같은 표를 써야, 손님이 두 화면에서 다른 유형 이름을 보지 않습니다.
   키는 L 체계(CWER·CWEL…) — computeResult v2·DB와 통일.
   ═══════════════════════════════════════════════════════════════════ */
var LFRI_TYPE = {
  CWER:{icon:'🌧',short:'봄비 여행자',desc:'주변과 밀착되어 온기가 넘치며 표현도 잘하고 회복 의지도 강한, 가장 축복받은 여행자입니다.'},
  CWEL:{icon:'🌿',short:'울타리 여행자',desc:'가족·지인과 끈끈하고 표현도 잘하지만, 갈등은 평화롭게 품어 안는 여행자입니다.'},
  CWHR:{icon:'🌲',short:'소나무 여행자',desc:'관계는 밀착되어 있고 온기도 가득하지만, 진심을 표현하지 못하고 가슴에 묻어둔 채 회복을 갈망하는 여행자입니다.'},

  CGER:{icon:'🌋',short:'화산 여행자',desc:'관계가 얽혀 마찰과 상처가 잦지만, 그만큼 사랑해서 완전한 회복을 원하는 여행자입니다.'},
  CGEL:{icon:'🪨',short:'바위섬 여행자',desc:'얽힌 관계 속 상처를 거침없이 표출한 뒤, 미련 없이 평화를 찾으려는 여행자입니다.'},
  CGHR:{icon:'🦔',short:'고슴도치 여행자',desc:'너무 가까운 관계라 상처는 깊은데 말은 못 하고 응어리로 묻어둔 채, 관계 정상화를 간절히 바라는 여행자입니다.'},

     이미 같은 것이었습니다(260707 확정). 중복이라 삭제하고, 원래 것에 반짝임만 넣었습니다. */
  h+='<button class="go" onclick="goUniverse()">+ 다른 분과 여행하기</button></div>';
  /* 13 더보기 */

             "증명서"(certificate.html 이 지금 여행지도 복사본이라 엉뚱한 화면이 뜸 — 별건으로 제대로 살립니다)
             "카톡 공유"는 위로 올려 "내 여행자 유형 보내기"로 이름을 바꿨습니다.
     [신설] 홈으로 — 다른 화면엔 다 있는데 결과지에만 없었습니다. 여행 끝나고 나갈 문. */
  h+='<div class="homeout"><a href="/">&lsaquo; 홈으로</a></div>';
  document.getElementById("stage").innerHTML=h;
}

/* ── 사운드 ── */
var AC=null, muted=false;
function ac(){ if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();} return AC; }
function tone(f,d,pk,ty,dl){ if(muted)return; var c=ac(),t=c.currentTime+(dl||0),o=c.createOscillator(),g=c.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(pk,t+0.03);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+0.05);}
function arriveChord(){ [130.81,164.81,196.00,261.63].forEach(function(f,k){ tone(f,1.1,0.06,'triangle',k*0.14); }); }
function departSound(){ [130.81,164.81,196.00].forEach(function(f,k){ tone(f,1.0,0.07,'triangle',k*0.05); }); [196.00,261.63,329.63,392.00].forEach(function(f,k){ tone(f,0.7,0.08,'triangle',0.55+k*0.13); }); }
function toggleSound(e){ e.stopPropagation(); muted=!muted; document.getElementById('sndbtn').textContent=muted?'🔇':'🔊'; }
function toggleMenu(e){ e.stopPropagation(); document.getElementById('drawer').classList.toggle('open'); }
document.addEventListener('click',function(){ document.getElementById('drawer').classList.remove('open'); });
/* [v3] 편지 버튼 — 기존엔 window.LINK.letter 를 봤는데 그게 어디에도 정의돼 있지 않아
   base 가 빈 값이 되어 ★버튼을 눌러도 아무 일이 없었습니다(죽은 버튼).
   목적지를 /l/ (편지 통로 · gate·enter 라이브 표준)로 못 박습니다.
   여권번호는 주소에 없으면 보관해둔 것을 씁니다. */
function toLetter(){

/* ═══════════════════════════════════════════════════════════════════
   [v3 · 260712] 결과물 내보내기
   ───────────────────────────────────────────────────────────────────
   [표준] 버튼 이름은 언제나 "무엇이 나오는지"를 말한다.

   ═══════════════════════════════════════════════════════════════════ */

/* 이 여행일지 저장하기 — 지금 이 화면 전체가 종이로 나옵니다.
   버튼·도장 같은 조작거리는 인쇄에서 빠집니다(@media print). */
function saveResult(){

  if (!ok) { return; }

/* 내 여행자 유형 보내기 — ★유형 카드 한 장만 나갑니다.
   손님이 적은 속마음(따뜻했던 장면·전하지 못한 말)은 절대 안 딸려 갑니다.
   그건 자랑거리가 아니라 본인 것입니다. 대신 "나도 해보기" 링크가 붙습니다. */
function shareKakao(){
  var typeName = (D && D.typeName) ? D.typeName : '사랑흐름 여행자';
  var icon     = (D && D.icon) ? D.icon : '🌊';
  var title    = icon + ' 나는 ' + typeName + '였어요';
  var desc     = '많은 관계는 사랑이 부족해서가 아니라,\n서로의 언어를 몰라서 멀어집니다.';
  var link     = 'https://www.loveflow.ai.kr';

  try{
    if (window.Kakao && Kakao.Share) {
      Kakao.Share.sendDefault({
        objectType: 'feed',
        content: {
          title: title,
          description: desc,
          imageUrl: 'https://raw.githubusercontent.com/hkcpcgg/loveflow/main/logo.png',
          link: { mobileWebUrl: link, webUrl: link }
        },
        buttons: [{ title: '나도 마음 여행 해보기', link: { mobileWebUrl: link, webUrl: link } }]
      });
      return;
    }
  }catch(e){}

  /* 카카오가 안 뜨면 — 휴대폰 기본 공유 → 그것도 없으면 링크 복사 */
  var text = title + '\n\n' + desc + '\n' + link;
  if (navigator.share) {
    navigator.share({ title: title, text: text }).catch(function(){});
    return;
  }
  try{
    navigator.clipboard.writeText(text);
    alert('복사했어요. 카톡에 붙여넣기 해보세요.');
  }catch(e){
    alert(text);
  }
}

   여권은 그대로 쓰고 여행지도를 새로 시작합니다. */

/* [v3] 삭제한 함수 — goCert(증명서) · restart(또 여행)
   · 증명서: certificate.html 이 지금 여행지도 복사본이라 엉뚱한 화면이 뜹니다.
     진짜 증명서는 여행지도 안에 인쇄용으로 갇혀 있습니다(사랑흐름 마음관리청™ · 관계흐름증명서).
     그걸 꺼내 certificate.html 을 제대로 만드는 건 ★별건으로 남깁니다.
   · 또 여행: 뜻을 모르겠는 말이고, "다른 분과 여행하기"와 겹칩니다. */

/* ═══════════════════════════════════════════════════════════════════
   [v3 · 260712] 실데이터 연결
   ───────────────────────────────────────────────────────────────────
   여행지도(v20)가 GAS에 저장하고 → 여기로 ?id=여권번호 를 들고 옵니다.
   그 번호로 유료 GAS(M1A)의 lookupPassport 를 불러 실제 결과를 읽어 그립니다.

   · GET + JSONP 로 부릅니다. GAS는 CORS 응답을 못 주지만, JSONP는 됩니다(gate와 같은 방식).
   · GAS가 늦거나 죽어도 화면은 뜹니다 — 위의 데모 D 로 일단 그려두고, 응답이 오면 덮어씁니다.
   · 못 찾으면(방금 저장 직후 등) 잠깐 뒤 한 번 더 부릅니다. 그래도 없으면 안내를 띄웁니다.
   ═══════════════════════════════════════════════════════════════════ */
var GAS_M1A = 'https://script.google.com/macros/s/'
            + 'AKfycbxLIG_LRAZD3AMJH26gPhefdkwLbXmA5ip_UurBfQ-53bxgq2T63dSre6YO9j4hxBZM1A'
            + '/exec';

function myPassport(){
  var p = '';
  try{
    var m = location.search.match(/[?&]id=(LF[ML]?-[A-Za-z0-9]+)/i);
    if (m) { p = m[1]; }
  }catch(e){}
  if (!p) { try{ p = sessionStorage.getItem('lf_passport') || ''; }catch(e){} }
  if (!p) { try{ p = localStorage.getItem('lf_passport') || ''; }catch(e){} }
  return p.trim().toUpperCase();
}

/* GAS 응답 → 화면이 쓰는 D 모양으로 옮깁니다 */
function toD(r){
  var code = (r.lfriCode || '').toUpperCase();
  var t = (typeof LFRI_TYPE !== 'undefined' && LFRI_TYPE[code]) ? LFRI_TYPE[code] : null;
  return {
    passport: r.passport || '',
    code:     code,
    typeName: r.typeName || (t ? t.short : ''),
    icon:     t ? t.icon : '🌊',
    tag:      t ? t.desc : '',
    target:   r.relType || '',
    nick:     r.relNick || r.relType || '',
    sc: {
      C: Number(r.scC)||0, D: Number(r.scD)||0,
      W: Number(r.scW)||0, G: Number(r.scG)||0,
      E: Number(r.scE)||0, H: Number(r.scH)||0,
      R: Number(r.scR)||0, L: Number(r.scP)||0      /* 옛 이름 scP = L축 */
    },
    A: Number(r.scA)||0,
    narr: {
      scene:  r.Q8  || '',                          /* 따뜻했던 한 장면 */
      unsaid: r.Q16 || ''                           /* 전하지 못한 한마디 */
    }
  };
}

var _tries = 0;
function loadResult(){
  var pp = myPassport();
  if (!pp) { return; }                              /* 잠금이 이미 튕겨냈을 것 */

  var cb = 'lfcb_' + Date.now() + '_' + (++_tries);
  window[cb] = function(res){
    try{ delete window[cb]; }catch(e){}
    if (res && res.status === 'ok') {
      render(toD(res));
      return;
    }
    /* 방금 저장한 직후면 아직 안 보일 수 있습니다. 한 번만 더 기다렸다 부릅니다. */
    if (_tries < 2) { setTimeout(loadResult, 1800); return; }
    showNotFound();
  };

  var s = document.createElement('script');
  s.src = GAS_M1A + '?id=' + encodeURIComponent(pp) + '&callback=' + cb;
  s.onerror = function(){
    try{ delete window[cb]; }catch(e){}
    if (_tries < 2) { setTimeout(loadResult, 1800); return; }
    showNotFound();
  };
  document.body.appendChild(s);
}

function showNotFound(){
  var host = document.querySelector('.wrap') || document.body;
  var box = document.createElement('div');
  box.style.cssText = 'margin:16px 20px;padding:16px;background:#FFF7FA;border:1px solid #F3B8CC;border-radius:14px;font-size:13.5px;line-height:1.75;color:#2A3542';
  box.innerHTML = '아직 여행 기록을 불러오지 못했어요.<br>'
    + '<span style="color:#8A8580">잠시 뒤 새로고침하시거나, 여행을 다시 마치고 오시면 펼쳐집니다.</span>';
  host.insertBefore(box, host.firstChild);
}

render(D);        /* 일단 뼈대를 그려둡니다 (GAS가 늦어도 빈 화면을 안 보게) */
loadResult();     /* 그다음 실제 여행 기록으로 덮어씁니다 */
setTimeout(function(){ try{arriveChord();}catch(e){} }, 350);
