  $('nGo').onclick=function(){ var nm=$('nNm').value.trim(); if(nm.length<2){ toast('받는 곳 이름을 적어 주십시오'); return; } hqAct({act:'prNew',name:nm,room:$('nRm').value.trim(),who:$('nWh').value.trim(),tpl:$('nTp').value},'만들었습니다 — 담당자 링크를 복사해 보내십시오'); };
  each(PP,'[data-cp]',function(b){ b.onclick=function(){ copy(b.getAttribute('data-cp'),'링크를 복사했습니다'); }; });
  each(PP,'[data-nx]',function(b){ b.onclick=function(){ hqAct({act:'prNext',com:b.getAttribute('data-nx')},'다음 회차를 만들었습니다'); }; });
  each(PP,'[data-f]',function(b){ b.onclick=function(){ var f=$(b.getAttribute('data-f')); f.hidden=!f.hidden; }; });
  each(PP,'[data-do]',function(b){ b.onclick=function(){ var f=b.parentNode, p={act:b.getAttribute('data-do'),com:b.getAttribute('data-o'),n:b.getAttribute('data-n')};
    each(f,'[data-k]',function(el){ p[el.getAttribute('data-k')]=el.value.trim(); });
    if(p.act==='prProxy'){ p.ans=JSON.stringify({q1:p.q1}); delete p.q1; if(!p.shop){ toast('상호를 적어 주십시오'); return; } }
    if(p.act==='prFix'&&(p.what||'').length<2){ toast('무엇을 고쳤는지 적어 주십시오'); return; }
    hqAct(p,{prFix:'고친 것을 사무국 화면에 올렸습니다',prResult:'교육 결과를 적었습니다',prProxy:'대신 입력했습니다',prMgrAdd:'담당자 링크를 만들었습니다'}[p.act]); }; });
}

/* ══ 본부에서 바로 보기 — 사무국 관리 화면 그대로(단추는 눌리지 않음) · 로그인 전 화면 · 공간 화면 ══ */
function hqOrg(cb){ call({action:'recHq',ht:htGet(),act:'prList'},function(d){ var o=null; (d.orgs||[]).forEach(function(x){ if(x.com===Q.get('view')){ o=x; } }); if(d.status!=='ok'||!o){ fail(d.msg||'본부로 들어온 뒤에 열 수 있습니다.'); return; } cb(o); },'불러오는 중입니다'); }
function hqBanner(read){ return '<div class="pv noprint"><span>본부 보기 — 사무국 '+(read?'담당자가 처음 링크를 열었을 때':'담당자 관리 화면')+' 그대로입니다. 단추는 눌리지 않습니다.</span></div><div class="row2 noprint" style="margin:6px 0 4px"><button type="button" class="btn sm line" id="hvL">'+(read?'관리 화면 보기':'로그인 전 화면 보기')+'</button><a class="btn sm line" href="/p/?hq=1">본부 목록</a></div>'; }
function hqLock(){ each(PP,'input,textarea,select',function(el){ el.readOnly=true; el.disabled=true; }); ['oOk','aGo','aNo','kLg'].forEach(function(id){ if($(id)){ $(id).disabled=true; $(id).onclick=null; } }); each(PP,'[data-sv]',function(b){ b.disabled=true; b.onclick=null; }); }
function hqDecor(){ drawOffice(); PP.insertAdjacentHTML('afterbegin',hqBanner(false)); hqLock(); var r=rnd();
  if($('oPv')){ $('oPv').onclick=function(){ location.href='/p/?hq=1&view='+encodeURIComponent(D.com)+'&pv='+r.n; }; }
  $('oRep').onclick=function(){ location.href='/p/?hq=1&rep='+encodeURIComponent(D.com); };
  $('hvL').onclick=function(){ drawRead(); PP.insertAdjacentHTML('afterbegin',hqBanner(true)); hqLock(); $('hvL').onclick=hqDecor; }; }
function hqView(){ hqOrg(function(o){ D=o; D.name=o.to; D.me='(본부 보기)'; D._hq=1; D.bound=o.mgrs.some(function(m){ return m.kakao; })?1:0; tpl(o.tpl,function(){ if(!CUR){ var r=o.rounds, pick=r[r.length-1]; for(var i=0;i<r.length;i++){ if(r[i].st!==ST.done){ pick=r[i]; break; } } CUR=pick?pick.n:1; } hqDecor(); }); }); }
function hqPv(){ hqOrg(function(o){ var n=parseInt(Q.get('pv'),10)||1, r=null; o.rounds.forEach(function(x){ if(x.n===n){ r=x; } }); if(!r){ fail('그 회차를 찾지 못했습니다.'); return; } tpl(o.tpl,function(t){ drawGuest({name:o.to,tpl:o.tpl,n:r.n,date:r.date,time:r.time,place:r.place,due:r.due,open:1,pv:1},t); }); }); }
/* ← ⌂ → */
$('wB').onclick=function(){ history.back(); }; $('wF').onclick=function(){ history.forward(); };
$('wH').onclick=function(){ location.href=MODE==='hq'?'/rec/?hq=1':'/'; };
if(MODE==='guest'||MODE==='pv'){ guest(); } else if(MODE==='office'){ office(); } else if(MODE==='rep'){ report(); } else if(MODE==='hq'){ hq(); } else if(MODE==='hqrep'){ hqReport(); } else if(MODE==='hqview'){ hqView(); } else if(MODE==='hqpv'){ hqPv(); } else { fail('받으신 링크를 다시 눌러 주십시오.'); }
})();
</script>
