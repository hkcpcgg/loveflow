<style>
:root{--navy:#1E4A76;--gold:#C9A96E;--gold2:#C0872E;--cream:#FFFCF7;--sand:#F4EEE4;--ink:#2E3A46;--sub:#7d7465;--line:#EADFCF}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;word-break:keep-all;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.home{max-width:520px;margin:0 auto;min-height:calc(100vh - 124px);min-height:calc(100svh - 124px);display:flex;flex-direction:column;gap:clamp(10px,2.2vh,22px);padding:clamp(12px,2.6vh,26px) 18px clamp(12px,2.2vh,20px)}
.hero{text-align:center}
.hero h1{font-family:'Noto Serif KR',serif;font-size:24px;line-height:1.4;color:var(--navy);margin:0 0 6px;font-weight:700}
.hero p{margin:0;color:var(--sub);font-size:14px;line-height:1.55}
.steps{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:12px;font-size:13px;font-weight:700;color:var(--navy)}
.steps span{display:flex;align-items:center;gap:5px}.steps i{width:18px;height:1.5px;background:#D8CBB6}
.ci{display:inline-grid;place-items:center;border-radius:50%;color:#fff;width:42px;height:42px;flex:0 0 42px}
.ci svg{width:55%;height:55%;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.steps .ci{width:26px;height:26px;flex-basis:26px}
.lfflow{width:100%;max-width:460px;aspect-ratio:4/1;margin:12px auto 0}
.g{display:flex;flex-direction:column}
.g.grow{flex:1 0 auto}.g.grow2{flex:1.6 0 auto}
.lab{font-weight:800;color:var(--navy);font-size:15px;margin:0 2px 9px}
.t3,.t4{display:grid;gap:10px;flex:1 0 auto;grid-auto-rows:minmax(min-content,1fr)}
.t3{grid-template-columns:repeat(3,1fr);max-height:150px}
.t4{grid-template-columns:1fr 1fr;max-height:230px}
.tile{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;text-align:center;min-height:86px;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile b{font-size:14px;color:var(--navy);line-height:1.3;font-weight:700}
.tile.h{flex-direction:row;text-align:left;padding:12px 11px;gap:10px;min-height:64px}
.tile.h .ci{width:38px;height:38px;flex-basis:38px}
.tile.h b{display:block;font-size:14.5px}.tile.h small{display:block;font-size:12px;color:var(--sub);line-height:1.4;margin-top:1px}
.pass{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;border:1.5px solid var(--gold);background:linear-gradient(135deg,#FFFBF2,#FBF1DD);border-radius:16px}
.pass .ci{width:40px;height:40px;flex-basis:40px;background:var(--gold)}
.pass b{display:block;color:var(--navy);font-size:15.5px}.pass small{display:block;color:#9a7a3a;font-size:12.5px}
.go{display:block;width:100%;margin-top:10px;background:var(--navy);color:#fff;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800;white-space:nowrap}
.soon{display:none;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 13px;border:1.5px dashed #C9A96E;background:#FFFCF5;border-radius:16px;margin-top:10px;cursor:pointer}
.soon .tg{flex:none;font-size:12px;font-weight:800;color:#9A5B12;background:#FFF1DC;border-radius:8px;padding:3px 7px}
.soon b{display:block;font-size:15px;color:var(--navy)}.soon small{display:block;font-size:12.5px;color:var(--sub);line-height:1.4}
.soon .ar{margin-left:auto;color:var(--gold);font-size:20px;font-weight:800}
.soonx{display:none;text-align:center;font-size:13px;font-weight:700;color:var(--navy);margin:6px 0 2px;text-decoration:underline;text-underline-offset:3px}
@media (max-height:760px){
  .hero h1{font-size:20px}.hero p{font-size:12.5px}.steps{margin-top:7px}.lfflow{max-width:300px;margin-top:6px}
  .tile .ci{width:34px;height:34px;flex-basis:34px}.tile{padding:10px 6px;min-height:72px}.tile.h{padding:9px;min-height:52px}.tile.h small{display:none}
  .pass{padding:9px 12px}.go{padding:12px;margin-top:7px}.lab{margin-bottom:6px}
  .home{gap:10px;padding-top:12px}.t3,.t4{gap:8px}.tile b{font-size:13.5px}.pass .ci{width:34px;height:34px;flex-basis:34px}.pass b{font-size:14.5px}
}
@media (max-height:640px){ .steps{display:none} .lfflow{display:none} .hero h1{font-size:19px} .pass small{display:none} }
/* 올라오는 판 */
.hdim{position:fixed;inset:0;z-index:1600;background:rgba(30,40,55,.38);opacity:0;visibility:hidden;transition:.2s}
.hdim.on{opacity:1;visibility:visible}
.hsheet{position:fixed;left:0;right:0;bottom:0;z-index:1700;max-width:560px;margin:0 auto;background:#fff;border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease;box-shadow:0 -8px 22px rgba(0,0,0,.16)}
.hsheet.on{transform:none}
.hsheet .grab{width:38px;height:4px;border-radius:2px;background:#ddd;margin:0 auto 12px}
.hsh{display:flex;gap:12px;align-items:center}.hsh .ci{width:48px;height:48px;flex-basis:48px}
.hsh b{display:block;font-size:18px;color:var(--navy)}.hsh small{color:var(--sub);font-size:13px}
.hsp{font-size:14.5px;line-height:1.7;margin:12px 0 4px}
.hbo,.hbn{display:block;width:100%;border-radius:14px;padding:13px;font-size:15.5px;font-weight:800;text-align:center;white-space:nowrap;margin-top:10px}
.hbo{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.hbn{background:var(--navy);color:#fff;border:1.5px solid var(--navy)}
/* 안쪽 화면 — 머리 글이 없어 화면 채우기(늘이기) 대신 간격을 고정 */
.home{min-height:0;gap:24px;padding-top:22px}.g.grow,.g.grow2{flex:none}.t3,.t4{flex:none;max-height:none}
.t3 .tile{position:relative;padding:16px 6px 12px}
.t3 .tile small.tl{font-size:11.5px;line-height:1.35;color:var(--sub);margin-top:-3px}
.t3 .tile .fr{position:absolute;top:7px;right:7px;font-style:normal;font-size:10.5px;font-weight:800;color:#2F7F76;background:#E3F3F0;border-radius:6px;padding:2px 6px}
.way3{display:flex;justify-content:center;gap:26px;margin:14px 0 6px}
.way3 button{width:44px;height:44px;border-radius:50%;border:0;background:var(--navy);color:#fff;font-size:20px;line-height:1;display:grid;place-items:center}
.way3 button:active{opacity:.6}.way3 button.off{opacity:.3;cursor:default}
</style>

  draw:{t:'삐뚤빼뚤 마음 도화지',s:'무료로 해 보기',ic:'draw',c:'#8A6FC9',p:'손가락으로 삐뚤빼뚤 그린 마음을 그 사람에게 보냅니다. 잘 그리지 않아도 마음은 닿습니다.',go:['마음 도화지 해 보기','/draw/']},
  compass:{t:'관계 나침반',s:'무료로 해 보기',ic:'compass',c:'#1D9E75',p:'몇 가지 물음으로 그 사람과 나 사이가 지금 어느 쪽을 향하고 있는지 봅니다.',go:['관계 나침반 해 보기','/compass.html']},
  map:{t:'마음 여행지도',s:'나를 먼저 돌아보기',ic:'map',c:'#1D9E75',p:'물음을 따라 걸으며 나와 그 사람 사이를 돌아보는 여행입니다. 여행이 끝나면 나의 마음 여행지도가 남습니다.',more:['여행 자세히 보기','/showcase.html'],go:['마음 여행지도 예매하기','/pay.html?item=map']},
  set:{t:'마음여행',s:'여행지도와 편지',ic:'letter',c:'#E58A5F',p:'마음 여행지도를 그리고, 그 사람에게 전하지 못한 마음을 편지로 남기는 여행입니다.',more:['여행 자세히 보기','/showcase.html'],go:['마음여행 예매하기','/pay.html?item=set']},
  memoir:{t:'한 편의 기록',s:'나의 이야기를 한 편씩',ic:'mem',c:'#C0872E',p:'물음에 답하며 내 삶의 이야기 하나를 남깁니다. 열 편이 모이면 한 사람의 삶이 담긴 자서전이 됩니다.',more:['자서전 자세히 보기','/memoir/'],go:['한 편의 기록 예매하기','/pay.html?item=memoir']},
  life:{t:'두 분의 여정',s:'지도 · 편지 · 기록까지',ic:'two',c:'#C25B7C',p:'마음 여행지도와 편지에 한 편의 기록까지, 두 분의 이야기를 함께 남기는 여정입니다.',more:['여행 자세히 보기','/showcase.html'],go:['두 분의 여정 예매하기','/pay.html?item=life']}
};
var HIC={pass:'<rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M9 16h6"/>',word:'<path d="M4 5h16v11H9l-5 4z"/>',draw:'<path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/>',compass:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5L11 11l-2.5 4.5L13 13z"/>',map:'<path d="M9 4L3 6.5v13L9 17l6 2.5 6-2.5v-13L15 6.5 9 4z"/><path d="M9 4v13M15 6.5v13"/>',letter:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',mem:'<path d="M5 4h10a2 2 0 012 2v14H7a2 2 0 01-2-2z"/><path d="M8 8h6M8 11h6"/>',two:'<circle cx="8.5" cy="8" r="2.6"/><circle cx="16" cy="8" r="2.6"/><path d="M3.5 19c0-2.5 2.2-4.2 5-4.2s5 1.7 5 4.2"/><path d="M14.6 15.1c2.4.2 4.4 1.8 4.4 3.9"/>',ask:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 015 0c0 2-2.5 2-2.5 4M12 17h.01"/>',ear:'<path d="M7 10a5 5 0 1110 0c0 3-3 4-3 7a3 3 0 01-6 0"/><path d="M10 10a2 2 0 114 0"/>'};
function hEsc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function hOpen(k){
  var d=HS[k]; if(!d) return;
  var h='<div class="grab"></div><div class="hsh"><span class="ci" style="background:'+d.c+'"><svg viewBox="0 0 24 24">'+HIC[d.ic]+'</svg></span><div><b>'+hEsc(d.t)+'</b><small>'+hEsc(d.s)+'</small></div></div>'
   +'<p class="hsp">'+hEsc(d.p)+'</p>'
   +(d.more?'<button class="hbo" data-u="'+d.more[1]+'">'+hEsc(d.more[0])+'</button>':'')
   +'<button class="hbn" data-u="'+d.go[1]+'">'+hEsc(d.go[0])+'</button>';
  var sh=document.getElementById('hSheet'); sh.innerHTML=h;
  var bs=sh.querySelectorAll('button[data-u]'); for(var i=0;i<bs.length;i++){ bs[i].onclick=function(){ location.href=this.getAttribute('data-u'); }; }
  document.getElementById('hDim').classList.add('on'); sh.classList.add('on');
  try{ gtag('event','home_tile',{k:k}); }catch(e){}
}
function hClose(){ document.getElementById('hDim').classList.remove('on'); document.getElementById('hSheet').classList.remove('on'); }
document.getElementById('hDim').onclick=hClose;
(function(){ var ts=document.querySelectorAll('.tile'); for(var i=0;i<ts.length;i++){ ts[i].onclick=function(){ hOpen(this.getAttribute('data-k')); }; } })();
(function(){ var y0=null, sh=document.getElementById('hSheet');
  sh.addEventListener('touchstart',function(e){ y0=e.touches[0].clientY; },{passive:true});
  sh.addEventListener('touchend',function(e){ if(y0!==null && e.changedTouches[0].clientY-y0>60){ hClose(); } y0=null; });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ hClose(); } });
})();
</script>
<script>
(function(){
  function $(i){ return document.getElementById(i); }
  var home='/'; try{ home=sessionStorage.getItem('lf_home')||'/'; }catch(e){}
  var inSite=false; try{ inSite=!!document.referrer && document.referrer.indexOf(location.host)>=0 && history.length>1; }catch(e){}
  $('wB').onclick=function(){ if(inSite){ history.back(); } else { location.href=home; } };
  $('wH').onclick=function(){ location.href=home; };
  $('wF').onclick=function(){ history.forward(); };
})();
</script>
