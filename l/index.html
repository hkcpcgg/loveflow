<script>
/* [v8] 편지 화면이 GitHub 으로 나왔습니다. GAS 는 이제 데이터만 줍니다. */
var LETTER_TARGET = '/letter/';
var PETAL_COLORS=['#F7B9CD','#F3A9C2','#FBC7D6','#EFA7BE','#F6BBCB'];
function spawnPetal(){
  var box=document.getElementById('petals'); if(!box) return;
  var p=document.createElement('div');
  var size=9+Math.random()*13, left=Math.random()*100, dur=7+Math.random()*6;
  var drift=(Math.random()*140-70)+'px', peak=(0.55+Math.random()*0.20).toFixed(2);
  var c=PETAL_COLORS[(Math.random()*PETAL_COLORS.length)|0];
  p.style.cssText='position:absolute;top:-8%;border-radius:50%;left:'+left+'%;width:'+size+'px;height:'+size+'px;background:'+c+';';
  p.style.setProperty('--drift',drift); p.style.setProperty('--peak',peak);
  p.style.animation='fall '+dur+'s linear forwards';
  box.appendChild(p);
  setTimeout(function(){ if(p&&p.parentNode) p.parentNode.removeChild(p); }, dur*1000+400);
}
for(var i=0;i<6;i++){ setTimeout(spawnPetal, i*300); }
setInterval(spawnPetal, 950);

function getId(){ return (new URLSearchParams(location.search)).get('id') || ''; }
(function(){ var id=getId(); if(id){ document.getElementById('passLine').innerHTML = '여권 <b>'+id.replace(/[<>&]/g,'')+'</b> · 확인됐어요'; } })();
function go(u){ location.href=u; }

var AC=null, muted=false;
function ac(){ if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); } return AC; }
function tone(f,d,pk,ty,dl){ if(muted) return; var c=ac(),t=c.currentTime+(dl||0),o=c.createOscillator(),g=c.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(pk,t+0.03);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+0.05); }
function welcomeChord(){ [130.81,164.81,196.00,261.63].forEach(function(f,k){ tone(f,1.1,0.07,'triangle',k*0.13); }); }
function breathe(){ if(muted) return; var c=ac(),t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=65.41;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.05,t+0.9);g.gain.exponentialRampToValueAtTime(0.0001,t+3.0);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+3.1); }
function departSound(){ [196.00,261.63,329.63,392.00].forEach(function(f,k){ tone(f,0.7,0.08,'triangle',k*0.12); }); }
var greeted=false;
function greet(){ if(greeted||muted) return; greeted=true; try{ welcomeChord(); breathe(); }catch(e){} }
document.addEventListener('pointerdown', function(){ greet(); });
function toggleSound(e){ e.stopPropagation(); muted=!muted; document.getElementById('sndbtn').textContent=muted?'🔇':'🔊'; if(!muted){ greeted=false; greet(); } }
function toggleMenu(e){ e.stopPropagation(); document.getElementById('drawer').classList.toggle('open'); }
document.addEventListener('click', function(){ document.getElementById('drawer').classList.remove('open'); });
function enter(){ try{ departSound(); }catch(e){} var id=getId(); var u=LETTER_TARGET; if(id){ u += '?id=' + encodeURIComponent(id); } setTimeout(function(){ location.href=u; }, 1100); }
</script>
<script>
/* ═══════════════════════════════════════════════════════════════════
   [260713 대표 확정] ☰ 표준 메뉴 9항목 — 전 화면 공용

   → 세 개의 문을 뚫었습니다.
       여권으로 입장       — 번호를 아는 사람이 바로 들어가는 문
       여행의 기록         — 구경하는 문
       마음 여행 예매하기  — ★예매하는 문 ("사기"가 아니라 "예매". 여행이니까요)

   ★함수 이름을 lfGo 로 따로 뒀습니다.
     화면마다 go() 가 이미 있고(index 는 화면 넘기는 함수), 이름이 부딪힙니다.

   ★여권번호를 달고 갑니다.
     여행지도·편지·여권으로 입장은 여권번호가 있어야 열립니다.
     지금 보고 있는 화면에서 번호를 들고 가면, 손님이 다시 안 넣어도 됩니다.
   ═══════════════════════════════════════════════════════════════════ */
var LF_LINK = {
  home:     '/',
  hanmadi:  '/',
  journey:  '/journey/',
  letter:   '/l/',
  reenter:  '/reenter.html',
  find:     '/find/',
  showroom: '/showroom.html',
  showcase: '/showcase.html',
  gate:     '/gate.html',
  apply:    '/apply.html',
  pay:      '/pay.html'
};

/* 여권번호가 따라가야 하는 곳 */
var LF_NEEDS_ID = { journey:1, letter:1 };

function lfPassport(){
  var p = '';
  try{
    var m = location.search.match(/[?&]id=(LF[ML]?-[A-Za-z0-9]+)/i);
    if (m) { p = m[1]; }
  }catch(e){}
  if (!p) { try{ p = sessionStorage.getItem('lf_passport') || ''; }catch(e){} }
  if (!p) { try{ p = localStorage.getItem('lf_passport') || ''; }catch(e){} }
  return p.trim().toUpperCase();
}

function lfGo(k){
  var u = LF_LINK[k];
  if (!u) { return; }
  if (LF_NEEDS_ID[k]) {
    var pp = lfPassport();
    if (pp) { u += (u.indexOf('?') > -1 ? '&' : '?') + 'id=' + encodeURIComponent(pp); }
  }
  location.href = u;
}

  '/reenter.html':'여권으로 입장', '/find/':'여권 찾기', '/m/':'마음 한마디'
};

/* 화면마다 "앞으로 갈 곳" — 다음 상품으로 미는 문 */
var LF_NEXT = {
  '/':                    { k:'showroom', t:'여행의 기록 보러 가기' },
  '/index.html':          { k:'showroom', t:'여행의 기록 보러 가기' },
  '/showroom.html':       { k:'showcase', t:'마음 여행 예매하기' },
  '/showcase.html':       { k:'pay',      t:'결제하기' },
  '/enter.html':          { k:'journey',  t:'여행 시작하기' },
  '/journey/result.html': { k:'letter',   t:'이 여행을 편지로 이어가기' },
  /* 편지·여행지도는 길을 안 깝니다(위 lfPaintWay 참조).
     편지 완성 화면의 "다른 분과 여행하기"는 그 화면 안에 이미 있습니다. */
  '/reenter.html':        { k:'showroom', t:'여행의 기록 보러 가기' },
  '/find/':               { k:'showroom', t:'여행의 기록 보러 가기' },
  '/apply.html':          { k:'showroom', t:'여행의 기록 보러 가기' },
  '/pay.html':            { k:'gate',     t:'여권 발급받기' },
  '/l/':                  { k:'letter',   t:'편지 쓰러 가기' },
  '/gate.html':           { k:'journey',  t:'여행 시작하기' }
};

/* 지금 화면에 온 것을 기록해 둡니다 (다음 화면의 "뒤로"가 여기로 옵니다) */
(function(){
  try{
    var here = location.pathname;
    var prev = sessionStorage.getItem('lf_here') || '';
    if (prev && prev !== here) { sessionStorage.setItem('lf_prev', prev); }
    sessionStorage.setItem('lf_here', here);
  }catch(e){}
})();

function lfPrev(){
  try{ return sessionStorage.getItem('lf_prev') || ''; }catch(e){ return ''; }
}

function lfPrevName(){
  var p = lfPrev();
  if (!p) { return ''; }
  return LF_NAME[p] || '';
}

function lfBack(){
  var p = lfPrev();
  if (!p) { location.href = '/'; return; }
  var pp = (typeof lfPassport === 'function') ? lfPassport() : '';
  if (pp && (p.indexOf('/journey') === 0 || p.indexOf('/letter') === 0 || p.indexOf('/l/') === 0)) {
    p += (p.indexOf('?') > -1 ? '&' : '?') + 'id=' + encodeURIComponent(pp);
  }
  location.href = p;
}

function lfNext(){
  var n = LF_NEXT[location.pathname];
  if (!n) { return; }
  if (typeof lfGo === 'function') { lfGo(n.k); }
}

/* 화면 아래에 길을 깝니다 */
function lfPaintWay(){
  if (document.getElementById('lfway')) { return; }

  /* ★질문을 쓰는 화면에는 길을 깔지 않습니다.
     · 여행지도·편지는 화면 아래에 이미 [이전][다음] 버튼이 있습니다. 넷이 되면 헷갈립니다.
     · 그리고 여행 중에 "앞으로"를 누르면 ★적던 답이 날아갑니다.
     · 이 화면들은 다 끝난 뒤(결과지·편지 완성)에 길이 나옵니다. */
  var p = location.pathname;
  if (p.indexOf('/journey/') === 0 && p.indexOf('result') < 0) { return; }
  if (p.indexOf('/letter/') === 0) { return; }

  var prev = lfPrev();
  var next = LF_NEXT[location.pathname];
  if (!prev && !next) { return; }          /* 갈 곳이 없으면 안 깝니다 */

  var css = document.createElement('style');
  css.textContent =
    '.lfway{display:flex;gap:8px;max-width:420px;margin:22px auto 8px;padding:0 16px;box-sizing:border-box}'
  + '.lfway a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;'
  + 'padding:11px 6px;border:1px solid #E4DED2;border-radius:12px;background:#fff;'
  + 'text-decoration:none;cursor:pointer;transition:.15s}'
  + '.lfway a:active{transform:scale(.97)}'
  + '.lfway .ic{font-size:15px;color:#1E4A76;line-height:1}'
  + '.lfway .tt{font-size:11.5px;font-weight:700;color:#1E4A76}'
  + '.lfway .sb{font-size:10px;color:#9A9287}'
  + '.lfway .fwd{background:#1E4A76;border-color:#1E4A76}'
  + '.lfway .fwd .ic,.lfway .fwd .tt{color:#fff}'
  + '.lfway .fwd .sb{color:#C9D6E4}'
  + '@media print{.lfway{display:none}}';
  document.head.appendChild(css);

  var h = '<div class="lfway" id="lfway">';
  if (prev) {
    var nm = lfPrevName();
    h += '<a onclick="lfBack()"><span class="ic">←</span><span class="tt">돌아가기</span>'
       + (nm ? '<span class="sb">' + nm + '</span>' : '') + '</a>';
  }
  h += '<a onclick="lfGo(\'home\')"><span class="ic">⌂</span><span class="tt">홈으로</span><span class="sb">처음부터</span></a>';
  if (next) {
    h += '<a class="fwd" onclick="lfNext()"><span class="ic">→</span><span class="tt">앞으로</span>'
       + '<span class="sb">' + next.t + '</span></a>';
  }
  h += '</div>';

  /* 푸터 바로 앞에 답니다.
     화면마다 푸터 클래스가 제각각이라(.foot / footer / .glegal / 클래스 없음),
     ★저작권 문구(© 2026)를 품은 덩어리를 찾아 그 앞에 답니다. 그게 제일 확실합니다. */
  var foot = document.querySelector('.foot') || document.querySelector('footer')
          || document.querySelector('.glegal') || document.querySelector('.legal');

  if (!foot) {
    var all = document.body.querySelectorAll('div');
    for (var i = all.length - 1; i >= 0; i--) {
      if ((all[i].textContent || '').indexOf('© 2026') > -1) {
        var node = all[i];
        /* 저작권 문구를 품은 가장 바깥 덩어리까지 올라갑니다 */
        while (node.parentNode && node.parentNode !== document.body
               && (node.parentNode.textContent || '').indexOf('© 2026') > -1
               && (node.parentNode.textContent || '').length < 400) {
          node = node.parentNode;
        }
        foot = node;
        break;
      }
    }
  }

  if (foot && foot.parentNode && foot.parentNode !== document.documentElement) {
    foot.insertAdjacentHTML('beforebegin', h);
  } else {
    document.body.insertAdjacentHTML('beforeend', h);
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', lfPaintWay);
} else {
  lfPaintWay();
}
</script>

</body>
</html>
