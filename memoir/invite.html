function myUrl(){ return location.origin+'/memoir/invite.html?k='+KEY; }
function myLinkBox(){
  return '<div class="card" style="background:#FFFAF4;border-color:#F0D9C4"><b style="color:#9a5b3c"><span class="ii"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/></svg></span>이분만의 링크</b>'
   +'<p class="small" style="margin-top:4px">이 링크를 간직하시면 다시 와서 더하거나 고칠 수 있어요. 다른 분은 이 링크로 쓰신 글을 볼 수 없어요.</p>'
   +'<button class="btn line" onclick="copyMy()">내 링크 복사</button><div class="small" id="myOk" style="text-align:center;min-height:1em;margin-top:4px;color:#2f8a4c"></div></div>';
}
function copyMy(){
  var t=myUrl(), ok=function(){ var e=$('myOk'); if(e){ e.textContent='복사했어요 · 카톡 「나와의 채팅」에 붙여 두시면 편해요'; } };
  try{ if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(t).then(ok); return; } }catch(e){}
  var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(e){} document.body.removeChild(ta); ok();
}
function groupBoot(){
  var mine=''; try{ mine=localStorage.getItem('lf_mem_g_'+GKEY)||''; }catch(e){}
  if(/^[a-f0-9]{32}$/.test(mine)){ location.replace('/memoir/invite.html?k='+mine); return; }   /* 같은 기기 — 그분 칸으로 */
  jsonp({ action:'memGroupGet', g:GKEY }, function(d){
    if(!d){ draw('<div class="msg">지금은 초대장을 펼칠 수 없어요. 잠시 뒤 다시 열어 주세요.<br><br><button class="btn line" style="max-width:240px;margin:0 auto" onclick="location.reload()">다시 열기</button></div>'); return; }
    if(d.status!=='ok'){ draw('<div class="card" style="text-align:center"><h2>초대장을 찾지 못했어요</h2><p class="small">받으신 링크를 처음부터 다시 눌러 주세요.</p></div>'+linksHtml()); return; }
    GD=d; D={ from:d.from, to:'', deadline:d.deadline, closed:d.closed, qs:d.qs }; groupFirst();
  });
}
function groupFirst(){
  var f=esc(GD.from||'보내신 분');
  var h=bar(1)+'<div class="card inv"><img class="logo" src="/logo.png" alt="사랑흐름">'
   +'<h1>'+f+' 님이 보내신 초대장</h1>'+(GD.to?'<div class="to">'+esc(GD.to)+' 여러분께</div>':'')
   +'<div class="rule"></div>'
   +'<p>'+f+' 님이 삶의 여정을 글로 남기고 있습니다. 그 길에서 함께한 분들의 기억도 곁에 남겨 두고 싶어 합니다.</p>'
   +'<p>함께 나눈 웃음과 고마운 순간들을 들려주세요. 들려주신 기억은 '+f+' 님의 이야기 속에서 오래도록 함께 빛납니다.</p>'
   +'<ul class="hint"><li><span class="ii"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9.5" r="2.3"/><path d="M3.5 19.5c0-3.3 2.4-5.5 5.5-5.5s5.5 2.2 5.5 5.5M15.5 14.3c2.8.2 5 2.2 5 5.2"/></svg></span>이 링크를 누르신 분마다 자기 칸이 따로 생겨요</li><li><span class="ii"><svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg></span>물음 일곱 가운데 마음 가는 것부터</li><li><span class="ii"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></span>'+(GD.closed?'이 초대장은 새 분을 받지 않습니다':(esc(fmtDay(GD.deadline))+'까지 받습니다'))+'</li></ul></div>';
  if(GD.closed){ draw(h+'<div class="card" style="text-align:center"><h2>이 초대장은 새 분을 받지 않습니다</h2><p class="small">이미 쓰신 분은 받으신 자기 링크로 들어오시면 됩니다.</p></div>'+linksHtml()); return; }
  h+='<div class="card">'+whoBox().replace('이 링크로 할 수 있습니다','이분만의 링크로 할 수 있습니다')
   +'<div class="small" style="margin-top:8px">같은 단톡방의 다른 분이 쓴 글은 보이지 않고, 내 글도 다른 분께 보이지 않아요.</div>'
   +'<label class="age"><input type="checkbox" id="ag" onchange="gGate()"><span>만 14세 이상입니다</span></label>'
   +'<div class="small">만 14세가 되지 않으셨다면, 보호자와 함께 종이 물음지로 들려주실 수 있어요. '+f+' 님께 말씀해 주세요.</div>'
   +'<label class="f" for="gNm">성함</label><input class="t" id="gNm" maxlength="20" oninput="gGate()" placeholder="예: 김철수">'
   +'<div class="err" id="gEr"></div><button class="btn" id="gGo" disabled onclick="gJoin()">내 칸 열기</button></div>';
  draw(h);
}
function gGate(){ var b=$('gGo'); if(b){ b.disabled=!($('ag').checked && ($('gNm').value||'').trim()); } }
function gJoin(){
  var b=$('gGo'); b.disabled=true; b.textContent='내 칸을 만들고 있어요…';
  jsonp({ action:'memJoin', g:GKEY, name:($('gNm').value||'').trim() }, function(d){
    if(d && d.status==='ok' && d.key){ try{ localStorage.setItem('lf_mem_g_'+GKEY, d.key); }catch(e){} location.replace('/memoir/invite.html?k='+d.key+'&j=1'); return; }
    b.disabled=false; b.textContent='내 칸 열기'; $('gEr').textContent=(d&&d.msg)||'지금은 칸을 만들 수 없어요. 잠시 뒤 다시 눌러 주세요.';
  });
}
boot();
</script>
