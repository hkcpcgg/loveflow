    var rows = sec.items.filter(function(it){
      if(!filter) return true;
      return (it.name+" "+it.path).toLowerCase().indexOf(filter) > -1;
    });
    if(rows.length === 0) return;
    shown += rows.length;
    var open = filter ? " open" : "";
    html += '<div class="acc'+(sec.reserve?' reserve':'')+open+'">';
    html += '<button class="acc-h"><span class="dot"></span>'+esc(sec.title)
          + '<span class="cnt">('+rows.length+')</span><span class="chev">▼</span></button>';
    html += '<div class="acc-body">';
    rows.forEach(function(it){ html += rowHtml(it); });
    html += '</div></div>';
  });

  // 테스트 계정 아코디언
  var tRows = TEST.filter(function(t){ return !filter || testMatch(t, filter); });
  if(tRows.length > 0){
    shown += tRows.length;
    var topen = filter ? " open" : "";
    html += '<div class="acc'+topen+'">';
    html += '<button class="acc-h"><span class="dot" style="background:var(--navy)"></span>테스트 여권 · 계정'
          + '<span class="cnt">('+TEST.length+')</span><span class="chev">▼</span></button>';
    html += '<div class="acc-body">'+testBodyHtml()+'</div></div>';
  }

  html += '<div class="foot">사랑흐름 페이지 관리표 <b>v7</b> · 260730 갱신<br>'
        + 'v1 260718 최초 · v2 마음 도화지 /draw/ 추가 · v3 관리 도구 신설 · admin 예비역→현행<br>'
        + '주소 <b>www.loveflow.ai.kr/hq-3756.html</b><br>© 2026 사랑흐름 · 내부 관리용</div>';

  listEl.innerHTML = html;
  document.getElementById("empty").style.display = shown===0 ? "block" : "none";
}

function copy(val, btn){
  function done(){
    var isT = btn.classList.contains("tcopy");
    btn.classList.add("copied");
    var old = btn.textContent; btn.textContent = "복사됨";
    var t = document.getElementById("toast"); t.classList.add("show");
    setTimeout(function(){ t.classList.remove("show"); }, 1300);
    setTimeout(function(){ btn.classList.remove("copied"); btn.textContent = old; }, 1100);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(val).then(done).catch(function(){ fb(val); done(); });
  } else { fb(val); done(); }
}
function fb(val){
  var ta=document.createElement("textarea"); ta.value=val;
  ta.style.position="fixed"; ta.style.left="-9999px";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
}

var listEl = document.getElementById("list");
listEl.addEventListener("click", function(e){
  var cp = e.target.closest(".b-copy");
  if(cp){ copy(cp.getAttribute("data-copy"), cp); return; }
  var h = e.target.closest(".acc-h");
  if(h){ h.parentNode.classList.toggle("open"); updateAllBtn(); }
});

document.getElementById("q").addEventListener("input", function(e){
  render(e.target.value); updateAllBtn();
});

var allBtn = document.getElementById("allbtn");
allBtn.addEventListener("click", function(){
  var accs = document.querySelectorAll(".acc");
  var anyClosed = false;
  accs.forEach(function(a){ if(!a.classList.contains("open")) anyClosed = true; });
  accs.forEach(function(a){ a.classList.toggle("open", anyClosed); });
  updateAllBtn();
});
function updateAllBtn(){
  var accs = document.querySelectorAll(".acc");
  var allOpen = accs.length>0 && Array.prototype.every.call(accs, function(a){ return a.classList.contains("open"); });
  allBtn.textContent = allOpen ? "모두 접기" : "모두 펼치기";
}

render("");
updateAllBtn();
</script>
