  if(it.pcode && window.LF_PRICE){
    var pi = window.LF_PRICE.get(it.pcode);
    if(pi) badges += '<span class="note">'+esc(window.LF_PRICE.comma(pi.total))+'</span>';
  }
  return '<div class="row">'
    + '<div class="info"><div class="name">'+esc(it.name)+badges+'</div>'
    + '<div class="path">'+esc(url)+'</div></div>'
    + '<div class="btns">'
    + '<a class="b b-open" href="'+esc(url)+'" target="_blank" rel="noopener">열기</a>'
    + '<button class="b b-copy" data-copy="'+esc(url)+'">복사</button>'
    + '</div></div>';
}


function render(filter){
  filter = (filter||"").trim().toLowerCase();
  var listEl = document.getElementById("list");
  var html = "";
  var shown = 0;

  DATA.forEach(function(sec){
    var rows = sec.items.filter(function(it){
      if(!filter) return true;
      return (it.name+" "+it.path).toLowerCase().indexOf(filter) > -1;
    });
    if(rows.length === 0) return;
    shown += rows.length;
    var open = filter ? " open" : "";
    html += '<div class="acc'+(sec.reserve?' reserve':'')+open+'">';
    html += '<button class="acc-h"><span class="dot"></span>'+esc(sec.title)
          + '<span class="cnt">('+rows.length+')</span><span class="chev">▼</span></button>';
    html += '<div class="acc-body">';
    rows.forEach(function(it){ html += rowHtml(it); });
    html += '</div></div>';
  });


  html += '<div class="foot">사랑흐름 페이지 관리표 <b>'+VER+'</b> · 261023 갱신<br>'
        + 'v1 260718 최초 · v7 가격 원장 · v9 프로그램 제안 · v10 본부 로그인 · 시험용 여권 뺌<br>'
        + '주소 <b>www.loveflow.ai.kr/hq-3756.html</b><br>© 2026 사랑흐름 · 내부 관리용</div>';

  listEl.innerHTML = html;
  document.getElementById("empty").style.display = shown===0 ? "block" : "none";
}

function copy(val, btn){
  function done(){
    var isT = btn.classList.contains("tcopy");
    btn.classList.add("copied");
    var old = btn.textContent; btn.textContent = "복사됨";
    var t = document.getElementById("toast"); t.classList.add("show");
    setTimeout(function(){ t.classList.remove("show"); }, 1300);
    setTimeout(function(){ btn.classList.remove("copied"); btn.textContent = old; }, 1100);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(val).then(done).catch(function(){ fb(val); done(); });
  } else { fb(val); done(); }
}
function fb(val){
  var ta=document.createElement("textarea"); ta.value=val;
  ta.style.position="fixed"; ta.style.left="-9999px";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
}

var listEl = document.getElementById("list");
listEl.addEventListener("click", function(e){
  var cp = e.target.closest(".b-copy");
  if(cp){ copy(cp.getAttribute("data-copy"), cp); return; }
  var h = e.target.closest(".acc-h");
  if(h){ h.parentNode.classList.toggle("open"); updateAllBtn(); }
});

document.getElementById("q").addEventListener("input", function(e){
  render(e.target.value); updateAllBtn();
});

var allBtn = document.getElementById("allbtn");
allBtn.addEventListener("click", function(){
  var accs = document.querySelectorAll(".acc");
  var anyClosed = false;
  accs.forEach(function(a){ if(!a.classList.contains("open")) anyClosed = true; });
  accs.forEach(function(a){ a.classList.toggle("open", anyClosed); });
  updateAllBtn();
});
function updateAllBtn(){
  var accs = document.querySelectorAll(".acc");
  var allOpen = accs.length>0 && Array.prototype.every.call(accs, function(a){ return a.classList.contains("open"); });
  allBtn.textContent = allOpen ? "모두 접기" : "모두 펼치기";
}

/* ★v10 본부 로그인 문 — 우리 이야기 본부 표(lf_rec_ht)를 서버에 물어 본부 사람일 때만 표를 그림 */
document.getElementById("ver").textContent = VER;
document.getElementById("day").textContent = DAY;
function gateShow(h, p, btn, again){
  document.getElementById("gh").textContent = h;
  document.getElementById("gp").textContent = p;
  var b = document.getElementById("gb");
  b.classList.toggle("hide", !btn);
  if(again){ b.textContent = "다시 시도"; b.href = "#"; b.onclick = function(e){ e.preventDefault(); gateCheck(); }; }
  else { b.textContent = "본부 로그인"; b.href = "/rec/?hq=1"; b.onclick = null; }
}
function htGet(){
  var raw = "";
  try{ raw = sessionStorage.getItem("lf_rec_ht") || localStorage.getItem("lf_rec_ht") || ""; }catch(e){}
  try{ var o = JSON.parse(raw || "null"); if(o && o.v && o.e > Date.now()){ return o.v; } }catch(e){}
  return "";
}
function gateOpen(){
  document.getElementById("gate").classList.add("hide");
  document.getElementById("bar").classList.remove("hide");
  render(""); updateAllBtn();
}
function gateCheck(){
  var ht = htGet();
  var gas = window.LF_CONFIG && LF_CONFIG.gas && LF_CONFIG.gas.rec;
  if(!ht){ gateShow("본부 로그인이 필요합니다", "본부에 로그인한 뒤 이 화면을 다시 여십시오.", true); return; }
  if(!gas){ gateShow("연결되지 않습니다", "잠시 후 다시 시도해 주십시오.", true, true); return; }
  gateShow("본부 확인 중입니다", "잠시만 기다려 주십시오.", false);
  var done = false;
  function fin(d){
    if(done){ return; } done = true;
    if(d && d.status === "ok"){ gateOpen(); return; }
    if(d && (d.reason === "NO_HQ" || d.reason === "PERM")){
      try{ localStorage.removeItem("lf_rec_ht"); sessionStorage.removeItem("lf_rec_ht"); }catch(e){}
      gateShow("본부 로그인이 필요합니다", "본부 확인이 끝났습니다. 다시 로그인해 주십시오.", true); return;
    }
    gateShow("연결되지 않습니다", "잠시 후 다시 시도해 주십시오.", true, true);
  }
  try{
    fetch(gas, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({action:"recHq", act:"me", ht:ht})})
      .then(function(r){ return r.json(); }).then(fin).catch(function(){ fin(null); });
  }catch(e){ fin(null); }
  setTimeout(function(){ fin(null); }, 30000);
}
gateCheck();
</script>
