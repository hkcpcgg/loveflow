<script>(function(){
  try{
    var m = location.search.match(/[?&]id=(LF[ML]?-[A-Za-z0-9]+)/i);
    if (m) {
      var pp = m[1].toUpperCase();
      try{ sessionStorage.setItem('lf_unlock','1'); }catch(e){}
      try{ sessionStorage.setItem('lf_passport', pp); }catch(e){}
      try{ localStorage.setItem('lf_passport', pp); }catch(e){}
    }
    var unlocked = false;
    try{ unlocked = (sessionStorage.getItem('lf_unlock') === '1'); }catch(e){}
    if (window.top === window.self && /^https?:/.test(location.protocol) && !m && !unlocked) {
      location.replace('/gate.html');
    }
  }catch(e){}
})();</script>

function buildLetterAI(ans, who){ return null; /* L5+: 여기서 실제 AI 호출(Retry). 지금은 미연결→null→Fallback */ }
function buildLetterTemplate(ans, who){
  /* ═══════════════════════════════════════════════════════════════
     [v2 · 260713] ★여행지도에서 남긴 말을 함께 엮습니다
       편지 5각도 (오늘 쓴 것) — 표현·이유·변화·전달·미래
       여행지도 (그때 남긴 것) — Q8 따뜻한 장면 · Q24 계절 · Q16 못 전한 말
     기억에서 시작해 오늘의 마음으로 흐르게 배열합니다.
     ═══════════════════════════════════════════════════════════════ */
  var a  = function(k){ return (ans[k]  || '').trim(); };
  var tp = function(k){ return (TRIP[k] || '').trim(); };

  /* [v2] ★조사 붙이기 — "엄마을(를)" 같은 걸 손님에게 보이면 안 됩니다.
     한글 받침이 있으면 을/이/은, 없으면 를/가/는. */
  var josa = function(word, withBatchim, without){
    var w = String(word || '');
    if (!w) { return without; }
    var last = w.charCodeAt(w.length - 1);
    if (last < 0xAC00 || last > 0xD7A3) { return without; }   /* 한글이 아니면 */
    return ((last - 0xAC00) % 28 > 0) ? withBatchim : without;
  };
  var eul = function(w){ return w + josa(w, '을', '를'); };
  var ga  = function(w){ return w + josa(w, '이', '가'); };

  /* [v2] 문장 끝 마무리 — 손님이 마침표를 안 찍었어도 자연스럽게 */
  var end = function(s){
    s = String(s || '').trim();
    if (!s) { return ''; }
    return /[.!?…"'”’)]$/.test(s) ? s : (s + '.');
  };

  var paras = [];

  paras.push('사랑하는 ' + who + '께.');

  /* ★여행지도에서 떠올린 그 장면부터 */
  if (tp('Q8')) {
    var scene = eul(who) + ' 떠올리면, 가장 먼저 이 장면이 와요. ' + end(tp('Q8'));
    if (tp('Q24')) { scene += ' 그 시간은 저에게 ' + tp('Q24') + ' 같은 계절로 남아 있어요.'; }
    paras.push(scene);
  }

  if (a('express')) {
    paras.push('그때, ' + who + '에게 가장 먼저 건네고 싶었던 말이 있었어요. ' + a('express') + ' — 그 한마디였습니다.');
  }

  if (a('reason')) {
    var why = '그런데 그 말을, 그때는 끝내 하지 못했어요. ' + end(a('reason'));
    /* ★여행지도에서도 남겼던 못 전한 말 */
    if (tp('Q16')) { why += ' 여행지도에서도 저는 그 마음을 이렇게 적었더라고요. ' + end(tp('Q16')); }
    paras.push(why);
  }

  if (a('change')) {
    paras.push('시간이 흐르며, ' + eul(who) + ' 향한 제 마음도 조금씩 달라졌어요. ' + end(a('change')));
  }

  if (a('deliver')) {
    paras.push('그래서 이번에는, 이 마음만큼은 꼭 전하고 싶어요. ' + end(a('deliver')));
  }

  if (a('future')) {
    paras.push('이 편지를 읽는 ' + ga(who) + ', ' + end(a('future')) + ' 그런 모습이면 좋겠습니다.');
  }

  paras.push('제 마음이, 오늘 이 편지를 통해 ' + who + '에게 가만히 닿기를 바라요.');
  return paras;
}

function lfPassport(){
  var p = '';

    var m = location.search.match(/[?&]id=(LF[ML]?-[A-Za-z0-9]+)/i);
    if (m) { p = m[1]; }
  }catch(e){}
  if (!p) { try{ p = sessionStorage.getItem('lf_passport') || ''; }catch(e){} }

          그래서 앞으로 가기도 필요한 거예요."
   [이사회] 새 창은 카톡 인앱에서 제멋대로 열립니다. 팝업은 결제를 못 담습니다.
            → ★같은 창에서 '돌아가기'. 창을 이탈시키지 않습니다.

   [뒤로] 방금 온 곳. ★이름까지 보여줍니다. 어디로 가는지 알고 누르게.
   [앞으로] 화면마다 다릅니다. ★이게 매출 동선입니다.
   ═══════════════════════════════════════════════════════════════════ */
var LF_NAME = {
  '/':'홈', '/index.html':'홈',
  '/journey/':'여행지도', '/journey/index.html':'여행지도',
  '/journey/result.html':'여행일지',
  '/l/':'편지', '/letter/':'편지', '/letter/index.html':'편지',
  '/gate.html':'여권 발급', '/enter.html':'여권 발급',
  '/pay.html':'결제', '/apply.html':'계좌이체',
  '/showcase.html':'여행 예매', '/showroom.html':'여행의 기록',
  '/reenter.html':'여권으로 입장', '/find/':'여권 찾기', '/m/':'마음 한마디'
};

/* 화면마다 "앞으로 갈 곳" — 다음 상품으로 미는 문 */
var LF_NEXT = {
  '/':                    { k:'showroom', t:'여행의 기록 보러 가기' },
  '/index.html':          { k:'showroom', t:'여행의 기록 보러 가기' },
  '/showroom.html':       { k:'showcase', t:'마음 여행 예매하기' },
  '/showcase.html':       { k:'pay',      t:'결제하기' },
  '/enter.html':          { k:'journey',  t:'여행 시작하기' },
  '/journey/result.html': { k:'letter',   t:'이 여행을 편지로 이어가기' },
  /* 편지·여행지도는 길을 안 깝니다(위 lfPaintWay 참조).
     편지 완성 화면의 "다른 분과 여행하기"는 그 화면 안에 이미 있습니다. */
  '/reenter.html':        { k:'showroom', t:'여행의 기록 보러 가기' },
  '/find/':               { k:'showroom', t:'여행의 기록 보러 가기' },
  '/apply.html':          { k:'showroom', t:'여행의 기록 보러 가기' },
  '/pay.html':            { k:'gate',     t:'여권 발급받기' },
  '/l/':                  { k:'letter',   t:'편지 쓰러 가기' },
  '/gate.html':           { k:'journey',  t:'여행 시작하기' }
};

/* 지금 화면에 온 것을 기록해 둡니다 (다음 화면의 "뒤로"가 여기로 옵니다) */
(function(){
  try{
    var here = location.pathname;
    var prev = sessionStorage.getItem('lf_here') || '';
    if (prev && prev !== here) { sessionStorage.setItem('lf_prev', prev); }
    sessionStorage.setItem('lf_here', here);
  }catch(e){}
})();

function lfPrev(){
  try{ return sessionStorage.getItem('lf_prev') || ''; }catch(e){ return ''; }
}

function lfPrevName(){
  var p = lfPrev();
  if (!p) { return ''; }
  return LF_NAME[p] || '';
}

function lfBack(){
  var p = lfPrev();
  if (!p) { location.href = '/'; return; }
  var pp = (typeof lfPassport === 'function') ? lfPassport() : '';
  if (pp && (p.indexOf('/journey') === 0 || p.indexOf('/letter') === 0 || p.indexOf('/l/') === 0)) {
    p += (p.indexOf('?') > -1 ? '&' : '?') + 'id=' + encodeURIComponent(pp);
  }
  location.href = p;
}

function lfNext(){
  var n = LF_NEXT[location.pathname];
  if (!n) { return; }
  if (typeof lfGo === 'function') { lfGo(n.k); }
}

/* 화면 아래에 길을 깝니다 */
function lfPaintWay(){
  if (document.getElementById('lfway')) { return; }

  /* ★질문을 쓰는 화면에는 길을 깔지 않습니다.
     · 여행지도·편지는 화면 아래에 이미 [이전][다음] 버튼이 있습니다. 넷이 되면 헷갈립니다.
     · 그리고 여행 중에 "앞으로"를 누르면 ★적던 답이 날아갑니다.
     · 이 화면들은 다 끝난 뒤(결과지·편지 완성)에 길이 나옵니다. */
  var p = location.pathname;
  if (p.indexOf('/journey/') === 0 && p.indexOf('result') < 0) { return; }
  if (p.indexOf('/letter/') === 0) { return; }

  var prev = lfPrev();
  var next = LF_NEXT[location.pathname];
  if (!prev && !next) { return; }          /* 갈 곳이 없으면 안 깝니다 */

  var css = document.createElement('style');
  css.textContent =
    '.lfway{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;'
  + 'max-width:420px;margin:20px auto 10px;padding:0 16px;box-sizing:border-box}'
  + '.lfway a{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 11px;'
  + 'border:1px solid #E6E1D8;border-radius:13px;background:#fff;'
  + 'text-decoration:none;cursor:pointer;transition:.15s}'
  + '.lfway a:active{opacity:.55}'
  + '.lfway .ic{font-size:11px;color:#94A0AE;line-height:1}'
  + '.lfway .tt{font-size:10.5px;font-weight:500;color:#7A8794;letter-spacing:-.2px}'
  + '@media print{.lfway{display:none}}';
  document.head.appendChild(css);

  var h = '<div class="lfway" id="lfway">';
  if (prev) {
    h += '<a onclick="lfBack()"><span class="ic">←</span><span class="tt">뒤로</span></a>';
  }
  h += '<a onclick="lfGo(\'home\')"><span class="ic">⌂</span><span class="tt">홈</span></a>';
  if (next) {
    h += '<a onclick="lfNext()"><span class="ic">→</span><span class="tt">앞으로</span></a>';
  }
  h += '</div>';

  /* 푸터 바로 앞에 답니다.
     화면마다 푸터 클래스가 제각각이라(.foot / footer / .glegal / 클래스 없음),
     ★저작권 문구(© 2026)를 품은 덩어리를 찾아 그 앞에 답니다. 그게 제일 확실합니다. */
  var foot = document.querySelector('.foot') || document.querySelector('footer')
          || document.querySelector('.glegal') || document.querySelector('.legal');

  if (!foot) {
    var all = document.body.querySelectorAll('div');
    for (var i = all.length - 1; i >= 0; i--) {
      if ((all[i].textContent || '').indexOf('© 2026') > -1) {
        var node = all[i];
        /* 저작권 문구를 품은 가장 바깥 덩어리까지 올라갑니다 */
        while (node.parentNode && node.parentNode !== document.body
               && (node.parentNode.textContent || '').indexOf('© 2026') > -1
               && (node.parentNode.textContent || '').length < 400) {
          node = node.parentNode;
        }
        foot = node;
        break;
      }
    }
  }

  if (foot && foot.parentNode && foot.parentNode !== document.documentElement) {
    foot.insertAdjacentHTML('beforebegin', h);
  } else {
    document.body.insertAdjacentHTML('beforeend', h);
  }
}


/* ═══════════════════════════════════════════════════════════════════
   [260714 대표 확정] 지난 여행 이어가기 — 전 화면 공용 부품
   ───────────────────────────────────────────────────────────────────
   대표: "입구마다 있어야 됩니다. 주인 버튼. '지난 여행 이어가기'를 누르면
          여권번호 입력창이 뜨고, 넣으면 바로 그 여행으로 이어진다.
          결제하는 데, 쇼룸, 여권 찾는 데 — 중간중간 게이트마다 다 보여줘야 된다.
          ★광고 효과도 있는 거예요."

   [왜 시트인가 · reenter로 안 보내는가]
     pay(돈 내는 중)에서 다른 페이지로 보내면 ★결제를 이탈시킵니다. 매출 구멍입니다.
     그 자리에서 열리는 시트는 닫으면 원래 화면 그대로 남습니다.

   [★편지 목적지 함정] LF_LINK.letter = '/l/' 은 꽃비 맞이 의식입니다(1.1초 뒤 /letter/로 넘김).
     이어가는 손님에게 의식을 다시 보여줄 순 없고, ?resume= 도 넘어가다 사라집니다.
     → 이어가기는 LF_RESUME_LINK 로 ★/letter/ 에 직행합니다.

   [한계 · 정직하게] 저장은 이 브라우저 안에만 있습니다(localStorage).
     폰에서 쓰다 PC로 오면 번호를 넣어도 못 찾습니다.
     어디서든 이어지려면 서버(시트)에 담아야 하고, 그건 GAS 위험구간이라 별건입니다.
   ═══════════════════════════════════════════════════════════════════ */
var LF_RESUME_LINK = { journey:'/journey/', letter:'/letter/' };

function lfReadDraft(kind, pp){
  try{
    var raw = localStorage.getItem('lf_' + kind + '_' + pp);
    if (!raw) { return null; }
    var b = JSON.parse(raw);
    if (!b || typeof b.i !== 'number' || b.i < 1) { return null; }
    return b;
  }catch(e){ return null; }
}

/* 이 브라우저에 담아둔 게 하나라도 있나 — 버튼을 살릴지 정합니다 */
function lfHasAnyDraft(){
  try{
    for (var n = 0; n < localStorage.length; n++) {
      var k = localStorage.key(n);
      if (k && (k.indexOf('lf_journey_') === 0 || k.indexOf('lf_letter_') === 0)) { return true; }
    }
  }catch(e){}
  return false;
}

function lfPaintResume(){
  if (document.getElementById('lfres')) { return; }

  /* ★안 까는 곳
     · 여행지도 질문 중 · 편지 쓰는 중 — 지금 하는 여행이 날아갑니다
     · reenter — 그 화면이 이미 여권번호 입력창입니다 */
  var p = location.pathname;
  if (p.indexOf('/journey/') === 0 && p.indexOf('result') < 0) { return; }
  if (p.indexOf('/letter/') === 0) { return; }
  if (p.indexOf('/reenter') === 0) { return; }

  var has = lfHasAnyDraft();

  var css = document.createElement('style');
  css.textContent =
    '.lfres{max-width:420px;margin:16px auto 0;padding:0 16px;box-sizing:border-box}'
  + '.lfres .rb{width:100%;display:flex;align-items:center;justify-content:center;gap:7px;'
  + 'background:#fff;border:1px solid #D9CFC0;border-radius:12px;padding:11px 10px;'
  + 'font-family:inherit;font-size:12px;font-weight:500;color:#1E4A76;cursor:pointer;transition:.15s}'
  + '.lfres .rb:active{transform:scale(.985)}'
  + '.lfres .rb.has{border-color:#F0DCE4;background:#FFF7FA}'
  + '.lfres .rb .tag{font-size:11px;color:#C98BA5;font-weight:700}'
  + '.lfsheet{position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(30,40,50,.45);'
  + 'display:none;align-items:flex-end;justify-content:center;z-index:9999}'
  + '.lfsheet.on{display:flex}'
  + '.lfsheet .pan{width:100%;max-width:412px;background:#FFFBF5;border-radius:20px 20px 0 0;padding:18px 16px 24px;box-sizing:border-box}'
  + '.lfsheet .ttl{text-align:center;font-size:13.5px;font-weight:700;color:#1E4A76}'
  + '.lfsheet .sub{text-align:center;font-size:11.5px;color:#9A9287;margin:5px 0 13px}'
  + '.lfsheet input{width:100%;box-sizing:border-box;border:1.5px solid #D9CFC0;border-radius:12px;'
  + 'padding:12px;text-align:center;font-family:inherit;font-size:15px;color:#1E4A76;'
  + 'letter-spacing:1px;background:#fff;text-transform:uppercase}'
  + '.lfsheet input:focus{outline:none;border-color:#1E4A76}'
  + '.lfsheet .found{margin-top:12px;padding:13px;background:#FFF7FA;border:1px solid #F0DCE4;border-radius:14px;display:none}'
  + '.lfsheet .found.on{display:block}'
  + '.lfsheet .found .ft{font-size:11px;font-weight:800;color:#C98BA5;margin-bottom:6px}'
  + '.lfsheet .found p{font-size:12.5px;color:#2E3A46;line-height:1.65;margin:0}'
  + '.lfsheet .found p b{color:#1E4A76}'
  + '.lfsheet .fb{display:flex;gap:7px;margin-top:10px}'
  + '.lfsheet .fb button{flex:1;border-radius:10px;padding:10px;font-family:inherit;font-size:11.5px;'
  + 'font-weight:700;cursor:pointer;border:1px solid #F0DCE4}'
  + '.lfsheet .fb .go{background:#1E4A76;color:#fff;border-color:#1E4A76}'
  + '.lfsheet .fb .fresh{background:#fff;color:#8C8880}'
  + '.lfsheet .foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px}'
  + '.lfsheet .foot a{font-size:11.5px;color:#9A9287;text-decoration:none;cursor:pointer}'
  + '@media print{.lfres,.lfsheet{display:none !important}}';
  document.head.appendChild(css);

  var btn = '<div class="lfres" id="lfres">'
    + '<button class="rb' + (has ? ' has' : '') + '" onclick="lfResOpen()">'
    + '<span>&#127915;</span><span>지난 여행 이어가기</span>'
    + (has ? '<span class="tag">담아둔 여행이 있어요</span>' : '')
    + '</button></div>';

  var sheet = '<div class="lfsheet" id="lfsheet" onclick="if(event.target===this)lfResClose()">'
    + '<div class="pan">'
    + '<div class="ttl">지난 여행 이어가기</div>'
    + '<div class="sub">여권번호를 넣어주세요</div>'
    + '<input id="lfResIn" placeholder="LF-XXXXX" autocomplete="off" oninput="lfResCheck()">'
    + '<div class="found" id="lfResFound"><div class="ft" id="lfResTag"></div>'
    + '<p id="lfResMsg"></p>'
    + '<div class="fb"><button class="go" id="lfResGo">이어서 여행하기</button>'
    + '<button class="fresh" onclick="lfResGoNow(true)">처음부터 다시</button></div></div>'
    + '<div class="foot"><a onclick="lfGo(\'find\')">번호를 잊으셨나요?</a>'
    + '<a onclick="lfResClose()">닫기</a></div>'
    + '</div></div>';

  /* 방향버튼 바로 위에 답니다. 방향버튼이 없는 화면이면 푸터 앞에. */
  var way = document.getElementById('lfway');
  if (way) {
    way.insertAdjacentHTML('beforebegin', btn);
  } else {
    var foot = document.querySelector('.foot') || document.querySelector('footer')
            || document.querySelector('.glegal') || document.querySelector('.legal');
    if (foot && foot.parentNode) { foot.insertAdjacentHTML('beforebegin', btn); }
    else { document.body.insertAdjacentHTML('beforeend', btn); }
  }
  document.body.insertAdjacentHTML('beforeend', sheet);
}

var LF_RES = null;

document.addEventListener('click', function(e){
  if (e.target && e.target.id === 'lfResGo') { lfResGoNow(false); }
});

function lfResOpen(){
  var s = document.getElementById('lfsheet');
  if (!s) { return; }
  s.classList.add('on');
  var pp = lfPassport();
  var inp = document.getElementById('lfResIn');
  if (pp && inp && !inp.value) { inp.value = pp; }
  lfResCheck();
  if (inp) { inp.focus(); }
}

function lfResClose(){
  var s = document.getElementById('lfsheet');
  if (s) { s.classList.remove('on'); }
}

function lfResCheck(){
  var f = document.getElementById('lfResFound');
  var v = (document.getElementById('lfResIn').value || '').trim().toUpperCase();
  LF_RES = null;
  if (!/^LF[ML]?-[A-Z0-9]+$/.test(v)) { f.classList.remove('on'); return; }

  var j = lfReadDraft('journey', v);
  var l = lfReadDraft('letter',  v);
  var kind = j ? 'journey' : (l ? 'letter' : '');

  /* ★담아둔 게 없어도 빈손으로 안 돌려보냅니다 — 그 여권으로 여행지도를 펼쳐드립니다 */
  if (!kind) {
    LF_RES = { kind:'journey', pp:v, empty:1 };
    document.getElementById('lfResTag').textContent = '담아둔 여행이 없어요';
    /* ★[260714 대표 지적] "없다"로 끝내면 손님은 여행이 날아간 줄 압니다.
       ★"거기 가면 있다"고 알려줘야 합니다. 담아둔 것은 그 기기 안에 있습니다. */
    document.getElementById('lfResMsg').innerHTML =
      '이 기기엔 담아둔 게 없어요.<br>'
    + '<span style="color:#8C8880;font-size:11.5px">폰에서 쓰신 여행은 폰에서, 컴퓨터에서 쓰신 여행은 컴퓨터에서 이어집니다.</span><br>'
    + '이 여권으로 여행지도를 새로 펼쳐볼까요?';
    document.getElementById('lfResGo').textContent = '여행지도 펼치기';
    f.classList.add('on');
    return;
  }

  var b = j || l;
  var who = '';
  try{ who = (b.data && (b.data.nick || b.data.target)) || ''; }catch(e){}
  var what = (kind === 'journey') ? '여행지도' : '편지';

  LF_RES = { kind:kind, pp:v, empty:0 };
  document.getElementById('lfResTag').textContent = '담아둔 여행이 있어요';
  document.getElementById('lfResMsg').innerHTML =
      (who ? '<b>' + lfEsc(who) + '</b>님과의 ' : '')
    + what + '가 <b>' + b.i + '번째 물음</b>에서 멈춰 있어요.<br>거기서부터 이어갈까요?';
  document.getElementById('lfResGo').textContent =
      (kind === 'journey') ? '이어서 여행하기' : '이어서 쓰기';
  f.classList.add('on');
}

function lfEsc(v){ return (v||'').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

function lfResGoNow(fresh){
  if (!LF_RES) { return; }
  if (fresh && !LF_RES.empty) {
    try{ localStorage.removeItem('lf_' + LF_RES.kind + '_' + LF_RES.pp); }catch(e){}
  }
  var u = LF_RESUME_LINK[LF_RES.kind];
  if (!u) { return; }
  u += '?id=' + encodeURIComponent(LF_RES.pp);
  if (!LF_RES.empty) { u += fresh ? '&fresh=1' : '&resume=1'; }
  location.href = u;
}

function lfPaintAll(){
  lfPaintWay();
  lfPaintResume();   /* [260714] 방향버튼 위에 '지난 여행 이어가기' */
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', lfPaintAll);
} else {
  lfPaintAll();
}
</script>
