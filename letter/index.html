<script>
/* 데모 데이터 (실제로는 GAS가 여권번호로 주입) */
/* ═══════════════════════════════════════════════════════════════════
   [v2] 여행지도 기록 불러오기  ★29,800원의 핵심
   손님이 "내가 여행지도에서 쓴 말을 편지가 기억하고 있네" 를 느껴야 합니다.
   (260713 이사회: "질문을 만든 게 아니라 질문의 답이 살아야 한다")
   GAS가 늦거나 죽어도 편지는 씁니다. 손님을 막지 않습니다.
   ═══════════════════════════════════════════════════════════════════ */
var D = { target:"", nick:"" };
var TRIP = { Q8:'', Q15:'', Q16:'', Q23:'', Q24:'', Q26:'' };

var LETTER_GAS = 'https://script.google.com/macros/s/'
               + 'AKfycbxmIVu6EWwIHK8pmaQnrzZMg_r2XiytvrkohHMJDR2lBscC3OPUAZr6qmEOn6DTLjdA'
               + '/exec';

function myPassport(){
  var p = '';
  try{
    var m = location.search.match(/[?&]id=(LF[ML]?-[A-Za-z0-9]+)/i);
    if (m) { p = m[1]; }
  }catch(e){}
  if (!p) { try{ p = sessionStorage.getItem('lf_passport') || ''; }catch(e){} }
  if (!p) { try{ p = localStorage.getItem('lf_passport') || ''; }catch(e){} }
  return p.trim().toUpperCase();
}

function loadTrip(){
  var pp = myPassport();
  if (!pp) { return; }
  fetch(LETTER_GAS + '?action=getLetter&passport=' + encodeURIComponent(pp))
    .then(function(r){ return r.json(); })
    .then(function(res){
      if (!res || !res.success || !res.data) { return; }
      var d = res.data;
      if (d.locked) { showLocked(); return; }   /* 편지 없는 상품 */
      D.target = d['관계유형'] || '';
      D.nick   = d['관계닉네임'] || d['관계유형'] || '';
      TRIP.Q8  = d['Q8']  || '';
      TRIP.Q15 = d['Q15'] || '';
      TRIP.Q16 = d['Q16'] || '';
      TRIP.Q23 = d['Q23'] || '';
      TRIP.Q24 = d['Q24'] || '';
      TRIP.Q26 = d['Q26'] || '';
      paint();
    })
    .catch(function(){});
}

function showLocked(){
  var st = document.getElementById('stage');
  if (!st) { return; }
  st.innerHTML = '<div class="rite"><div class="halo">✉️</div>'
    + '<div class="q">이 여권은<br>편지가 없는 여행이에요.</div>'
    + '<div class="hint">마음 여행편지가 포함된 여행에서 만나요.</div>'
    + '<div class="door"><button onclick="location.href=\'/showcase.html\'">여행 고르러 가기</button></div>'
    + '</div>';
}

/* ── 사운드 (v18·편지 C펜타 계승) ── */
var AC=null, muted=false;
function ac(){ if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();} return AC; }
function tone(f,d,pk,ty,dl){ if(muted)return; var c=ac(),t=c.currentTime+(dl||0),o=c.createOscillator(),g=c.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(pk,t+0.03);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+0.05);}
var PENTA=[130.81,146.83,164.81,196.00,220.00,261.63], lastF=-1;
function dingWrite(){ var f=PENTA[Math.floor(Math.random()*PENTA.length)],gd=0; while(f===lastF&&gd++<4){f=PENTA[Math.floor(Math.random()*PENTA.length)];} lastF=f; tone(f,0.7,0.09,'triangle'); }
function enterLetter(){ [130.81,164.81,196.00,261.63].forEach(function(f,k){ tone(f,0.9,0.08,'triangle',k*0.12); }); }
function weaveSound(){ [261.63,293.66,329.63,392.00,440.00].forEach(function(f,k){ tone(f,0.9,0.07,'sine',k*0.18); }); }
function breathe(){ if(muted)return; var c=ac(),t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=65.41;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.05,t+0.9);g.gain.exponentialRampToValueAtTime(0.0001,t+3.0);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+3.1); }
function toggleSound(e){ e.stopPropagation(); muted=!muted; document.getElementById('sndbtn').textContent=muted?'🔇':'🔊'; }
function toggleMenu(e){ e.stopPropagation(); document.getElementById('drawer').classList.toggle('open'); }
document.addEventListener('click',function(){ document.getElementById('drawer').classList.remove('open'); });

/* ── 편지 여정 스텝 ── */
var steps=[
 {t:"rite", to:true},
 {t:"ask", angle:"표현",
  guide:"기억에 말을 붙이는 여행, 그 첫 걸음이에요",

 {t:"ask", angle:"변화",

var i=0, sel={};

function answered(){
  var s=steps[i];
  if(s.t==="rite"||s.t==="weave") return true;
  if(s.t==="ask") return (sel[i]||"").trim().length>0;
  return true;
}
function paint(){
  var s=steps[i], h="", body=document.getElementById("stage");
  var nav=document.querySelector(".nav");
  if(s.t==="rite"){
    var who = D.nick || D.target || "그분";
    h+='<div class="rite"><div class="aura"></div>';
    h+='<div class="spell">기억을 꺼내는 여행이 끝났어요.<br>이제, 그 기억에 말을 붙일 시간이에요.</div>';
    h+='<div class="halo">✉️</div>';
    h+='<div class="q">당신은 오늘의 작가예요.<br>저는, 당신의 마음을 아름다운<br>순서로 엮는 편집자가 될게요.</div>';
    h+='<div class="to">이 편지는 <b>'+esc(who)+'</b>께 닿을 거예요.</div>';
    h+='<div class="door"><button onclick="enterRite()">천천히, 첫 문장을 열게요</button></div></div>';
    breathe();
  } else if(s.t==="ask"){
    h+='<div class="guide">'+s.guide+'</div>';
    h+='<div class="q">'+s.q+'</div>';
    h+='<div class="hint">'+s.hint+'</div>';
    h+='<textarea placeholder="'+(s.ph||'')+'" oninput="sel[i]=this.value; onType();">'+esc(sel[i]||"")+'</textarea>';
    h+='<div class="echo" id="echoLine">'+s.echo+'</div>';
    if(s.philo){ h+='<div class="philo">'+s.philo+'</div>'; }
  } else if(s.t==="weave"){
    h+='<div class="waiting"><div class="halo">✍️</div><p>이제, 당신이 들려준 마음을<br>한 통의 편지로 엮어볼게요.<br>잠시만요…</p></div>';
    weaveSound();
    setTimeout(function(){ toApprove(); }, 2600);
  }
  body.innerHTML=h;
  // 진행바 (맞이·대기 제외, 5각도만 카운트)
  var total=5, cur=(s.t==="ask")?(i-0):0; // steps[1..5]=ask
  if(s.t==="ask"){ document.getElementById("bar").style.width=(i/5*100)+"%"; document.getElementById("pcount").textContent=i+" / 5"; }
  else if(s.t==="rite"){ document.getElementById("bar").style.width="0%"; document.getElementById("pcount").textContent=""; }
  else { document.getElementById("bar").style.width="100%"; document.getElementById("pcount").textContent=""; }
  // 내비
  nav.classList.toggle("hide", s.t==="rite" || s.t==="weave");
  document.getElementById("nextbtn").innerHTML = (i>=steps.length-2)?"편지 엮기 &#8250;":"다음 &#8250;";
  refreshNext();
}
function refreshNext(){ document.getElementById("nextbtn").classList.toggle("off", !answered()); }
function onType(){ refreshNext(); var e=document.getElementById("echoLine"); if(e && (sel[i]||"").trim().length>4){ e.classList.add("on"); } }
function esc(v){ return (v||"").replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function enterRite(){ enterLetter(); go(1); }
/* ── 편지 초안 생성: AI 자리(함수만) → 실패/미연결 시 템플릿 Fallback ── */
function buildLetterAI(ans, who){ return null; /* L5+: 여기서 실제 AI 호출(Retry). 지금은 미연결→null→Fallback */ }
function buildLetterTemplate(ans, who){
  /* ═══════════════════════════════════════════════════════════════
     [v2 · 260713] ★여행지도에서 남긴 말을 함께 엮습니다
       편지 5각도 (오늘 쓴 것) — 표현·이유·변화·전달·미래
       여행지도 (그때 남긴 것) — Q8 따뜻한 장면 · Q24 계절 · Q16 못 전한 말
     기억에서 시작해 오늘의 마음으로 흐르게 배열합니다.
     ═══════════════════════════════════════════════════════════════ */
  var a  = function(k){ return (ans[k]  || '').trim(); };
  var tp = function(k){ return (TRIP[k] || '').trim(); };

  /* [v2] ★조사 붙이기 — "엄마을(를)" 같은 걸 손님에게 보이면 안 됩니다.
     한글 받침이 있으면 을/이/은, 없으면 를/가/는. */
  var josa = function(word, withBatchim, without){
    var w = String(word || '');
    if (!w) { return without; }
    var last = w.charCodeAt(w.length - 1);
    if (last < 0xAC00 || last > 0xD7A3) { return without; }   /* 한글이 아니면 */
    return ((last - 0xAC00) % 28 > 0) ? withBatchim : without;
  };
  var eul = function(w){ return w + josa(w, '을', '를'); };
  var ga  = function(w){ return w + josa(w, '이', '가'); };

  /* [v2] 문장 끝 마무리 — 손님이 마침표를 안 찍었어도 자연스럽게 */
  var end = function(s){
    s = String(s || '').trim();
    if (!s) { return ''; }
    return /[.!?…"'”’)]$/.test(s) ? s : (s + '.');
  };

  var paras = [];

  paras.push('사랑하는 ' + who + '께.');

  /* ★여행지도에서 떠올린 그 장면부터 */
  if (tp('Q8')) {
    var scene = eul(who) + ' 떠올리면, 가장 먼저 이 장면이 와요. ' + end(tp('Q8'));
    if (tp('Q24')) { scene += ' 그 시간은 저에게 ' + tp('Q24') + ' 같은 계절로 남아 있어요.'; }
    paras.push(scene);
  }

  if (a('express')) {
    paras.push('그때, ' + who + '에게 가장 먼저 건네고 싶었던 말이 있었어요. ' + a('express') + ' — 그 한마디였습니다.');
  }

  if (a('reason')) {
    var why = '그런데 그 말을, 그때는 끝내 하지 못했어요. ' + end(a('reason'));
    /* ★여행지도에서도 남겼던 못 전한 말 */
    if (tp('Q16')) { why += ' 여행지도에서도 저는 그 마음을 이렇게 적었더라고요. ' + end(tp('Q16')); }
    paras.push(why);
  }

  if (a('change')) {
    paras.push('시간이 흐르며, ' + eul(who) + ' 향한 제 마음도 조금씩 달라졌어요. ' + end(a('change')));
  }

  if (a('deliver')) {
    paras.push('그래서 이번에는, 이 마음만큼은 꼭 전하고 싶어요. ' + end(a('deliver')));
  }

  if (a('future')) {
    paras.push('이 편지를 읽는 ' + ga(who) + ', ' + end(a('future')) + ' 그런 모습이면 좋겠습니다.');
  }

  paras.push('제 마음이, 오늘 이 편지를 통해 ' + who + '에게 가만히 닿기를 바라요.');
  return paras;
}
var letterParas=[], editing=false;
function toApprove(){
  var who = D.nick || D.target || '그분';
  var ans = { express:sel[1], reason:sel[2], change:sel[3], deliver:sel[4], future:sel[5] };
  letterParas = buildLetterAI(ans, who) || buildLetterTemplate(ans, who);
  var h='<div class="draft-wrap"><div class="draft-head"><div class="em">💌</div>';

  h+='<div class="letter-paper" id="letterView">';
  for(var k=0;k<letterParas.length;k++){ h+='<div class="lp">'+esc(letterParas[k])+'</div>'; }
  h+='<div class="frm">From. 당신의 마음을 담아</div></div>';
  h+='<textarea class="draft-edit" id="letterEdit">'+letterParas.join('\n\n')+'</textarea>';
  h+='<div class="draft-note">✍️ 이대로 마음을 전하시거나, 직접 손질하실 수 있어요.</div>';
  h+='<div class="draft-btns"><button class="btn-edit" onclick="toggleEdit()">✏️ 손질하기</button>';
  h+='<button class="btn-approve" onclick="approveLetter()">이 편지로 마음을 전할게요</button></div></div>';
  var st=document.getElementById('stage'); st.innerHTML=h;
  document.querySelector('.nav').classList.add('hide');
  document.getElementById('bar').style.width='100%';
  document.getElementById('pcount').textContent='';
}
function toggleEdit(){
  editing=!editing;
  document.getElementById('letterView').style.display=editing?'none':'block';
  document.getElementById('letterEdit').style.display=editing?'block':'none';
  var b=document.querySelector('.btn-edit');
  if(editing){ b.textContent='✓ 손질 끝'; }
  else { b.textContent='✏️ 손질하기'; var v=document.getElementById('letterEdit').value; letterParas=v.split(/\n\n+/); var lv=document.getElementById('letterView'); lv.innerHTML=''; for(var k=0;k<letterParas.length;k++){ var d=document.createElement('div'); d.className='lp'; d.textContent=letterParas[k]; lv.appendChild(d); } var f=document.createElement('div'); f.className='frm'; f.textContent='From. 당신의 마음을 담아'; lv.appendChild(f); }
}
var LINK={home:'/',certificate:'/certificate.html'};
/* [v2] 편지 완성 — 저장하고 마무리 화면으로.

   ★여행지도 복사본이라 엉뚱한 화면이 뜹니다. 증서는 별건으로 미룹니다. */
function approveLetter(){
  enterLetter();
  var box  = document.getElementById('letterEdit');
  var body = box ? box.value.trim() : letterParas.join('\n\n');
  var who  = D.nick || D.target || '그분';

  document.getElementById('stage').innerHTML =
    '<div class="waiting"><div class="halo">💌</div><p>당신의 마음을<br>편지로 엮고 있어요…</p></div>';

  try{
    fetch(LETTER_GAS, { method:'POST', mode:'no-cors', body: JSON.stringify({
      action:'saveLetter', passport: myPassport(),
      rel: D.target, relName: D.nick, letter: body
    })});
  }catch(e){}

  setTimeout(function(){ showDone(body, who); }, 1400);
}

function showDone(body, who){
  var h = '<div class="draft-wrap"><div class="draft-head"><div class="em">🌸</div>';
  h += '<h2>편지가<br>완성되었어요.</h2>';
  h += '<p>오늘 당신은, 오래 담아둔 마음을<br>한 통의 편지로 꺼내놓으셨어요.</p></div>';
  h += '<div class="letter-paper">';
  var ps = body.split('\n\n');
  for (var k2 = 0; k2 < ps.length; k2++) {
    if (ps[k2].trim()) { h += '<div class="lp">' + esc(ps[k2]) + '</div>'; }
  }
  h += '<div class="frm">From. 당신의 마음을 담아</div></div>';
  h += '<div class="draft-note">✦ 이 편지를 손으로 옮겨 적어 전해보세요. 손의 온기가 마음을 움직입니다.</div>';
  h += '<div class="draft-btns">'
     + '<button class="btn-edit" onclick="saveLetterPDF()">💾 이 편지 저장하기</button>'
     + '<button class="btn-ok" onclick="shareLetter()">🔗 링크 복사</button></div>';
  h += '<div class="homeout"><a href="/">&lsaquo; 홈으로</a></div>';
  document.getElementById('stage').innerHTML = h;
}

function saveLetterPDF(){
  if (!confirm('이 편지를 저장할까요?\n\n인쇄 화면이 열립니다. 거기서 PDF로 저장하시면 됩니다.')) { return; }
  window.print();
}

function shareLetter(){
  var url = 'https://www.loveflow.ai.kr';
  try{ navigator.clipboard.writeText(url); alert('사랑흐름 링크를 복사했어요.'); }
  catch(e){ alert(url); }
}
function go(d){
  if(d>0 && !answered()){ var b=document.getElementById("stage"); b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); return; }
  var n=i+d; if(n<0)return; if(n>=steps.length){ return; } i=n; fade();
}
function fade(){ var b=document.getElementById("stage"), slow=(steps[i]&&steps[i].t==="rite"); b.classList.add("fade"); setTimeout(function(){ paint(); setTimeout(function(){ b.classList.remove("fade"); },30); }, slow?560:380); }
