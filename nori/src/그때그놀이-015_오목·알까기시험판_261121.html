<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오목 · 알까기 시험판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Song+Myung&family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
<style>
/* 그때그놀이-015 · 오목 · 알까기 시험판 v2 — 상대는 컴퓨터가 아니라 「우리 가게 주인장」 */
:root{
  --ink:#1B1A1F; --red:#E1262D; --yel:#FFC21A; --blu:#2457D6; --org:#FF7A1A;
  --line:#E2D6B4; --muted:#6B5A30;
  --sign:"Black Han Sans"; --brand:"Song Myung";
  --body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#E9DDBA;color:var(--ink);font-family:var(--body);line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 0%,#FFF8E6 0,#F7EFD8 55%,#EFE4C6 100%)}
.top{position:sticky;top:0;z-index:5;height:56px;display:flex;align-items:center;justify-content:center;padding:0 10px;padding-top:env(safe-area-inset-top,0px);background:#16181D;color:#fff;box-sizing:content-box}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:4px;background:linear-gradient(90deg,var(--red) 0 25%,var(--yel) 25% 50%,var(--blu) 50% 75%,var(--org) 75%)}
.snd{position:absolute;right:8px;bottom:8px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:0;border-radius:12px;background:transparent;color:#fff;cursor:pointer}
.snd[aria-pressed="false"]{color:#8C8C8C}
.ttl{font-family:var(--sign),var(--body);font-size:20px;letter-spacing:.04em}
.dk{flex:1;padding:18px max(14px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.shopset{display:grid;grid-template-columns:1.3fr 1fr;gap:8px;background:#fffdf6;border-radius:14px;padding:10px;box-shadow:inset 0 0 0 1.5px var(--line)}
.shopset label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:700;color:var(--muted)}
.shopset input,.shopset select{font:inherit;font-size:15px;font-weight:800;padding:7px 10px;border-radius:10px;border:1.5px solid #CDBF9B;background:#fff;color:var(--ink);width:100%;min-width:0}
.set.one{grid-template-columns:1fr}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tabs button{font:inherit;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:16px;border:1.5px solid #CDBF9B;background:#fffdf6;cursor:pointer;color:var(--ink)}
.tabs button svg{width:46px;height:46px;flex:none}
.tabs button b{font-family:var(--sign),var(--body);font-weight:400;font-size:20px;letter-spacing:.03em}
.tabs button[aria-selected="true"]{background:#16181D;border-color:#16181D;color:#fff}
.pane{display:none;flex-direction:column;gap:12px}
.pane.on{display:flex}
.set{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.set label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:700;color:var(--muted)}
.set select,.set input{font:inherit;font-size:15px;font-weight:700;padding:8px 10px;border-radius:12px;border:1.5px solid #CDBF9B;background:#fffdf6;color:var(--ink);width:100%;min-width:0}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--blu);outline-offset:2px}
.who{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:800;padding:0 4px}
.who span{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;max-width:48%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.who span.now{background:#16181D;color:var(--yel)}
.who i{width:14px;height:14px;border-radius:50%;flex:none;display:block}
.who i.k{background:radial-gradient(circle at 35% 30%,#666,#111 60%)}
.who i.w{background:radial-gradient(circle at 35% 30%,#fff,#d9d6cf 70%);box-shadow:inset 0 0 0 1px #aaa}
.brd{width:100%;aspect-ratio:1;display:block;border-radius:10px;box-shadow:0 6px 14px rgba(60,40,10,.25);touch-action:none;user-select:none;-webkit-user-select:none}
.say{min-height:50px;text-align:center;background:#fff;border-radius:14px;padding:9px 10px;font-size:14.5px;line-height:1.45;box-shadow:inset 0 0 0 1.5px var(--line)}
.say b{color:var(--red)}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;border-radius:16px;font-weight:800;border:0;font-family:var(--body);cursor:pointer;width:100%}
.gift{min-height:54px;background:var(--red);color:#fff;font-size:17px;box-shadow:0 3px 0 rgba(120,10,15,.3)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.half{min-height:48px;background:#fff;color:var(--ink);border:1.5px solid #D8D5CC;font-size:15px}
.ghost{min-height:44px;background:transparent;color:#5A4A22;border:1.5px dashed #CDBF9B;font-size:14px}
.done{display:none;flex-direction:column;gap:10px;text-align:center}
.done.on{display:flex}
.big{font-family:var(--sign),sans-serif;font-size:28px;line-height:1.2}
.big em{font-style:normal;color:var(--red)}
.lure{margin:0;font-size:14px;color:#5A4A22}
.lure b{color:var(--red)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.undo{min-height:44px;background:#fff;color:var(--ink);border:1.5px solid #CDBF9B;font-size:14px}
.undo[disabled]{opacity:.45;cursor:default}
.shopset,.tabs,.set,#oNew,#aNew{display:none!important}
.row{grid-template-columns:1fr!important}
.pick{position:fixed;inset:0;z-index:30;background:rgba(22,24,29,.55);display:none;align-items:flex-end;justify-content:center}
.pick.on{display:flex}
.pick .sheet{width:100%;max-width:480px;background:#FFF8E6;border-radius:22px 22px 0 0;padding:18px 16px calc(84px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.pick h3{margin:0 0 4px;text-align:center;font-family:var(--brand),serif;font-weight:400;font-size:24px}
.pick button{font:inherit;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;border:1.5px solid #CDBF9B;background:#fff;cursor:pointer;text-align:left;color:var(--ink)}
.pick button b{font-size:16px}
.pick button small{display:block;color:#6B5A30;font-size:12.5px;font-weight:600}
.pick .tag{margin-left:auto;font-size:12px;font-weight:900;padding:4px 10px;border-radius:999px;color:#fff;flex:none}
.pick .who{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;flex:none}
.done{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#FFF8E6;border-radius:22px 22px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.2);padding:18px 16px calc(84px + env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto}
.who span em{display:inline-flex;align-items:center;white-space:nowrap}
.lvt{font-size:10px;font-weight:900;padding:1px 6px;border-radius:999px;color:#fff;background:#C0392B;margin-left:4px;flex:none}
.note{font-size:11.5px;color:#8A7A50;text-align:center;margin:4px 0 0}

/* ★첫째 원칙 (대표 261122): 놀이는 복고여도 화면은 산만하지 않게 — 테두리 · 음영 없음 */
button,.btn,.bt,.pk,.pick button,.say,.vs div,.vs .p,.hb,.act .spd,.rl,.card,.room,.fam a,.tabs button,.half,.two button,.set select,.shopset input,.shopset select,.sheet,.done,.cap2,.box{box-shadow:none!important;border:0!important;text-shadow:none!important}
.pick button,.pk,.hb,.half,.two button,.bt.o,.act .spd{background:#EFEAE0!important}
.say,.rl{background:#fff!important}
.vs div,.vs .p{background:#fff!important}
button:active{filter:brightness(.93)}
.bt.o[aria-pressed=true]{background:#FFC21A!important}
</style>
</head>
<body>
<div class="app">
  <div class="top"><span class="ttl">오목 · 알까기</span></div>
  <div class="dk">
    <div class="shopset">
      <label for="shop">상호<input id="shop" value="다복" maxlength="8"></label>
      <label for="ho">부르는 말<select id="ho"><option selected>사장님</option><option>할아버지</option><option>할머니</option><option>이모</option></select></label>
    </div>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tO" aria-selected="true" aria-controls="pO">
        <svg viewBox="0 0 46 46" aria-hidden="true"><rect x="2" y="2" width="42" height="42" rx="5" fill="#E3B873"/><path d="M8 8H38M8 15.5H38M8 23H38M8 30.5H38M8 38H38M8 8V38M15.5 8V38M23 8V38M30.5 8V38M38 8V38" stroke="#7A5428" stroke-width=".9"/><circle cx="8" cy="38" r="3.4" fill="#16181D"/><circle cx="15.5" cy="30.5" r="3.4" fill="#16181D"/><circle cx="23" cy="23" r="3.4" fill="#16181D"/><circle cx="30.5" cy="15.5" r="3.4" fill="#16181D"/><circle cx="38" cy="8" r="3.4" fill="#16181D"/><circle cx="15.5" cy="15.5" r="3.4" fill="#fff" stroke="#999" stroke-width=".6"/><circle cx="30.5" cy="30.5" r="3.4" fill="#fff" stroke="#999" stroke-width=".6"/></svg>
        <b>오목</b></button>
      <button type="button" role="tab" id="tA" aria-selected="false" aria-controls="pA">
        <svg viewBox="0 0 46 46" aria-hidden="true"><rect x="2" y="2" width="42" height="42" rx="5" fill="#E3B873"/><path d="M8 34H30" stroke="#16181D" stroke-width="1.4" stroke-dasharray="2 2.4"/><circle cx="10" cy="34" r="5" fill="#16181D"/><circle cx="31" cy="30" r="5" fill="#fff" stroke="#999" stroke-width=".7"/><circle cx="40" cy="16" r="5" fill="#fff" stroke="#999" stroke-width=".7" opacity=".55"/><path d="M34 26 L38 20" stroke="#7A5428" stroke-width="1.6" stroke-linecap="round"/></svg>
        <b>알까기</b></button>
    </div>

    <!-- 오목 -->
    <div class="pane on" id="pO" role="tabpanel" aria-labelledby="tO">
      <div class="set one">
        <label for="oM">누구랑 둘까요
          <select id="oM"><option value="cpu0">하수</option><option value="cpu1">중수</option><option value="cpu2" selected>고수</option><option value="two">친구</option></select></label>
      </div>
      <div class="who"><span id="oW1" class="now"><i class="k"></i>나 · 검은 돌</span><span id="oW2"><i class="w"></i><em style="font-style:normal" id="oNm">다복 사장님</em></span></div>
      <svg class="brd" id="oB" viewBox="0 0 300 300" role="img" aria-label="오목판 열다섯 줄"></svg>
      <div class="say" id="oS"></div>
      <div class="done" id="oD">
        <div class="big" id="oBig"></div>
        <p class="lure"><span class="shopN">다복</span>에서 <b>푸짐한 선물</b>을 드립니다</p>
        <button class="btn gift" type="button">선물 받기</button>
        <div class="pair"><button class="btn half" type="button" id="oAgain">다시 하기</button><button class="btn half" type="button">이야기방에 남기기</button></div>
      </div>
      <div class="row" id="oRow"><button class="btn undo" type="button" id="oUndo">한 수 무르기 · 3</button><button class="btn ghost" type="button" id="oNew">새 판</button></div>
    </div>

    <!-- 알까기 -->
    <div class="pane" id="pA" role="tabpanel" aria-labelledby="tA">
      <div class="set">
        <label for="aM">누구랑 칠까요
          <select id="aM"><option value="cpu0">하수</option><option value="cpu1">중수</option><option value="cpu2" selected>고수</option><option value="two">친구</option></select></label>
        <label for="aK">알 수
          <select id="aK"><option>3</option><option selected>5</option><option>7</option></select></label>
      </div>
      <div class="who"><span id="aW1" class="now"><i class="k"></i>나 · <b id="aC1">5</b>알</span><span id="aW2"><i class="w"></i><em style="font-style:normal" id="aNm">다복 사장님</em> · <b id="aC2">5</b>알</span></div>
      <canvas class="brd" id="aB" aria-label="알까기 판"></canvas>
      <div class="say" id="aS"></div>
      <div class="done" id="aD">
        <div class="big" id="aBig"></div>
        <p class="lure"><span class="shopN">다복</span>에서 <b>푸짐한 선물</b>을 드립니다</p>
        <button class="btn gift" type="button">선물 받기</button>
        <div class="pair"><button class="btn half" type="button" id="aAgain">다시 하기</button><button class="btn half" type="button">이야기방에 남기기</button></div>
      </div>
      <button class="btn ghost" type="button" id="aNew">새 판</button>
    </div>

    <p class="note">그때 그 놀이 · 오목 · 알까기 시험판 v5 · 하수 · 중수 · 고수 · 아래 막대 · 한 수 무르기 · 소리 · 상호는 이 폰에만 저장 · 선물 받기 · 이야기방은 아직 연결 전</p>
  </div>
</div>
<div class="pick" id="pick" role="dialog" aria-labelledby="pickT"><div class="sheet">
  <h3 id="pickT">누구랑 할까요?</h3>
  <button type="button" data-v="cpu1"><span><b class="pn" data-k="cpu1">다복 사장님</b><small>이 가게 사장님과 한 판</small></span></button>
  <button type="button" data-v="two"><span><b>친구와 같이 하기</b><small>폰 하나로 번갈아 합니다</small></span></button>
</div></div>
<script>
/* 놀이 결과를 손님 입구에 알리고, 「선물 받기」를 입구의 선물 창으로 넘김 */
window.noriResult=function(r){ window.__noriLast=r; try{ if(window.parent!==window){ window.parent.postMessage({nori:'result',r:r},'*'); } }catch(e){} };
document.addEventListener('click',function(e){ var b=e.target.closest&&e.target.closest('.gift'); if(!b) return;
  var framed=false; try{ framed=window.parent!==window; }catch(x){ framed=true; }
  if(framed){ try{ window.parent.postMessage({nori:'gift'},'*'); }catch(x){} return; }
  var t=document.getElementById('noriToast'); if(!t){ t=document.createElement('div'); t.id='noriToast'; t.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#16181D;color:#fff;font:700 14px "Noto Sans KR",sans-serif;padding:11px 16px;border-radius:14px;z-index:99;max-width:88vw;text-align:center'; document.body.appendChild(t); }
  t.textContent='선물은 손님 입구(다복 · 그때 그 놀이)에서 받아요'; t.style.display='block'; clearTimeout(t._t); t._t=setTimeout(function(){ t.style.display='none'; },2400); });

/* 그때 그 놀이 · 아래 막대(모든 놀이 공통) — 「놀이 방법」 「그때 그 놀이(홈, 가운데)」 「새 판」 (261122 v5)
   손님 입구 안에서 열렸으면 입구에게 알리고, 따로 열렸으면 그 놀이 주소로 옮김 */
/* ★ 사장님 세기 설정표 (049 원칙 · 261123) — 놀이마다 사장님 세기는 여기 한 곳에서만 고침.
   lv: 0 하수 · 1 중수 · 2 고수 — 손님 화면 사장님 = 「중상급」 1.5(중수와 고수 사이) · 판마다 컨디션 ±sway 로 조금씩 들쭉날쭉(손님은 모름).
   손님 승률 목표 약 45% · 운 놀이(가위바위보 · 홀짝 · 엿치기)는 50% 그대로. 승률 기록이 쌓이면 아래 숫자만 조금씩 맞춤. */
window.BOSS=window.BOSS||{lv:1.5, sway:.2,
  arm:[6,7],        /* 팔씨름: 사장님이 1초에 두드리는 횟수(최소 · 최대) */
  sab:.72,          /* 사방치기: 사장님이 던져 칸에 넣는 비율 */
  sugLap:1.8,       /* 수건돌리기: 술래 한 바퀴 초 */
  jegi:[9,16],      /* 제기차기: 사장님 연속 차기(최소 · 최대) */
  gong:.70,         /* 공기놀이: 사장님이 한 번 줍고 받기에 성공하는 비율(단계마다 조금씩 내려감) */
  mugung:{say:[1.0,3.0],cyc:5,need:30}   /* 무궁화꽃: 술래가 한 번 외는 초(최소 · 최대) · 외는 횟수 · 술래까지 걸음 */
  };
(function(){ function pick(){ BOSS.cur=Math.max(1,Math.min(2,BOSS.lv+(Math.random()*2-1)*BOSS.sway)); } pick(); BOSS.pick=pick;
  document.addEventListener('click',function(e){ var b=e.target&&e.target.closest&&e.target.closest('button[data-a=new]'); if(b) pick(); },true); })();
/* 세기 표(하수 · 중수 · 고수 세 값)에서 지금 사장님 값 고르기 — 중수(1) 자리는 그 판 컨디션(1~2)으로 사이 값을 씀 */
window.bossV=function(arr,L){ if(L!==1||!BOSS.cur) return arr[L]; var x=BOSS.cur, i=Math.min(arr.length-2,Math.floor(x)), f=x-i; return arr[i]+(arr[i+1]-arr[i])*f; };
/* 좌우 점수 기둥 (261122 v5) — 나·내 편 = 왼쪽 파랑, 사장님·친구 = 오른쪽 빨강. 위 점수줄(.vs)의 이름·점수를 옮겨 보이고 그 줄은 숨김. 차례인 쪽이 진하게 */
(function(){
  var d=document, st=null, W=null, LAB='', RN='';
  function opp(){ if(RN) return RN; if(window.__naTwo) return '친구'; var s=d.querySelector('.shopN'); return (s&&s.textContent.trim()?s.textContent.trim():'다복')+' 사장님'; }
  function init(){ if(st) return st;
    var css=d.createElement('style');
    css.textContent='.nside{position:fixed;top:10px;bottom:calc(66px + env(safe-area-inset-bottom,0px));width:32px;z-index:20;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;pointer-events:none;font-family:"Noto Sans KR",system-ui,sans-serif;transition:background .2s,color .2s}'
     +'.nside.l{left:2px;background:#E4EBFB;color:#2457D6}.nside.r{right:2px;background:#FBE4E5;color:#E1262D}'
     +'.nside.l.on{background:#2457D6;color:#fff}.nside.r.on{background:#E1262D;color:#fff}'
     +'.nside .nm{writing-mode:vertical-rl;font-weight:800;font-size:11px;letter-spacing:.06em;max-height:34%;overflow:hidden;white-space:nowrap}'
     +'.nside .sc{font-weight:900;font-size:19px;line-height:1;font-variant-numeric:tabular-nums}.nside .sc:empty{display:none}'
     +'.nside .un{font-weight:800;font-size:11px;line-height:1;margin-top:-3px}.nside .ex{font-weight:800;font-size:11px;line-height:1;opacity:.85}'
     +'.nside .tn{margin-top:auto;writing-mode:vertical-rl;font-weight:900;font-size:12px;letter-spacing:.1em;opacity:0}.nside.on .tn{opacity:1}'
     +'body.nside-on{padding-left:38px!important;padding-right:38px!important}body.ncard-on .nside{display:none}'
     +'.act .spd>span{display:none!important}.act .spd button{white-space:nowrap}'
     +'.nside-hide{display:none!important}.vs.nside-mid{grid-template-columns:1fr!important}.vs.nside-mid .p{display:none!important}';

      s.vx*=.982; s.vy*=.982; if(Math.hypot(s.vx,s.vy)<.05){ s.vx=0; s.vy=0; } else { moving=true; }
    });
    draw(); who();
    if(moving){ raf=requestAnimationFrame(step); } else { running=false; after(); }
  }
  function shoot(s,vx,vy){ SND.flick(Math.hypot(vx,vy)/12); s.vx=vx; s.vy=vy; shooter=s.c; running=true; aim=null; drag=null; raf=requestAnimationFrame(step); }
  function after(){
    var a=cnt(1), b=cnt(2);
    if(a===0||b===0){ over=true; who();
      var two=mode()==='two', h;
      if(a===0&&b===0){ h='둘 다 떨어졌어요 · <em>한 판 더!</em>'; }
      else if(two){ h=(b===0?'검은 알':'흰 알')+' <em>이겼어요!</em>'; }
      else { h= b===0 ? '<em>다 까냈다!</em> 이겼어요' : '아이고, <em>졌어요</em>'; }
      noriResult({game:'ak',gname:'알까기',opp:two?'친구':oppOf(mode()),lv:two?'':mode(),win:!two&&b===0&&a>0,detail:'내 알 '+a+'개 남음',sc:[a,b],u:'알',out:(a===0&&b===0)?'draw':((b===0&&a>0)?'win':'lose')});
      if(two||b===0&&a>0){ SND.win(); } else if(a===0&&b>0){ SND.lose(); }
      $('aBig').innerHTML=h; say.innerHTML= b===0&&a>0 ? '남은 내 알 '+a+'개' : '판이 끝났습니다.';
      $('aD').classList.add('on'); $('aNew').style.display='none'; if(window.noriSide){ noriSide(null); } return; }
    turn=3-turn; who();
    if(window.noriSide){ noriSide(turn===1?0:1, turn===1?(mode()==='two'?nm(1)+' 차례':'내 차례'):(mode()==='two'?nm(2):oppOf(mode()))+(turn===1?'':' 차례')); }
    if(mode()!=='two'&&turn===2){ say.innerHTML=esc(oppOf(mode()))+' 차례 · 노리는 중…'; setTimeout(cpu,500); }
    else { say.innerHTML='<b>'+(nm(turn)==='나'?'내':nm(turn))+'</b> 차례 · 내 알을 뒤로 당겼다 놓기'; }
  }
  function cpu(){
    var mine=S.filter(function(s){return s.c===2&&!s.out;}), yours=S.filter(function(s){return s.c===1&&!s.out;}), best=null, bs=1e9;
    mine.forEach(function(m){ yours.forEach(function(y){
      var dx=y.x-m.x, dy=y.y-m.y, d=Math.hypot(dx,dy), ux=dx/d, uy=dy/d;
      var t=Math.min(ux>0?(BX+BS-y.x)/ux:ux<0?(BX-y.x)/ux:1e9, uy>0?(BY+BS-y.y)/uy:uy<0?(BY-y.y)/uy:1e9);
      var block=0; S.forEach(function(o){ if(o.out||o===m||o===y){return;} var px=o.x-m.x, py=o.y-m.y, pr=px*ux+py*uy; if(pr>0&&pr<d&&Math.abs(px*uy-py*ux)<2*R){ block=1; } });
      var sc=d*.6+t+block*400; if(sc<bs){ bs=sc; best={m:m,y:y,d:d,t:t}; } }); });
    if(!best){ return; }
    var err=bossV([13,7,3.5],{cpu0:0,cpu1:1,cpu2:2}[mode()]||0)*(Math.random()*2-1)*Math.PI/180, ang=Math.atan2(best.y.y-best.m.y,best.y.x-best.m.x)+err;
    var p=Math.min(15,7+best.d*.025+best.t*.045);
    aim={s:best.m,px:best.m.x-Math.cos(ang)*p*6.5,py:best.m.y-Math.sin(ang)*p*6.5}; draw();
    setTimeout(function(){ shoot(best.m,Math.cos(ang)*p,Math.sin(ang)*p); },450);
  }
  function pt(e){ var r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*W}; }
  cv.addEventListener('pointerdown',function(e){
    if(running||over){ return; } if(mode()!=='two'&&turn!==1){ return; }
    var p=pt(e), hit=null, hd=R+10;
    S.forEach(function(s){ if(s.c===turn&&!s.out){ var d=Math.hypot(s.x-p.x,s.y-p.y); if(d<hd){ hd=d; hit=s; } } });
    if(!hit){ return; } e.preventDefault(); cv.setPointerCapture(e.pointerId); drag={s:hit,px:p.x,py:p.y}; draw();
  });
  cv.addEventListener('pointermove',function(e){ if(!drag){ return; } var p=pt(e); drag.px=p.x; drag.py=p.y; draw(); });
  function up(){ if(!drag){ return; } var s=drag.s, dx=s.x-drag.px, dy=s.y-drag.py, L=Math.hypot(dx,dy);
    if(L<8){ drag=null; draw(); return; } var P=Math.min(L,100)/100*16; shoot(s,dx/L*P,dy/L*P); }
  cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',function(){ drag=null; draw(); });
  $('aM').addEventListener('change',reset); $('aK').addEventListener('change',reset);
  $('aNew').addEventListener('click',reset); $('aAgain').addEventListener('click',reset);
  window.addEventListener('resize',fit);
  reset(); fit();
  return {fit:fit, who:who};
})();
/* 놀이 하나만 따로 열기 — 주소 끝 #omok 또는 #alkkagi */
function solo(k){
  var m={omok:['tO','오목'], alkkagi:['tA','알까기']}[k]; if(!m) return;
  $(m[0]).click(); document.querySelector('.tabs').style.display='none'; document.querySelector('.top .ttl').textContent=m[1]; document.title=m[1];
}
var CUR=location.hash==='#alkkagi'?'alkkagi':'omok', picked={omok:false,alkkagi:false};
function setGame(k){ CUR=k; solo(k); $('oD').classList.remove('on'); $('aD').classList.remove('on'); if(!picked[k]){ $('pick').classList.add('on'); } }
(function(){
  var bs=document.querySelectorAll('#pick button');
  for(var i=0;i<bs.length;i++){ bs[i].addEventListener('click',function(){ var id=CUR==='omok'?'oM':'aM'; $(id).value=this.getAttribute('data-v'); $(id).dispatchEvent(new Event('change')); picked[CUR]=true; $('pick').classList.remove('on'); SND.stone(.6); if(CUR==='alkkagi'){ ALK.fit(); } }); }
  noriNav({here:function(){ return CUR==='omok'?'om':'ak'; }, local:{om:function(){ setGame('omok'); }, ak:function(){ setGame('alkkagi'); }},
    onNew:function(){ $('oD').classList.remove('on'); $('aD').classList.remove('on'); picked[CUR]=false; $('pick').classList.add('on'); }});
})();
setGame(CUR);
['shop','ho'].forEach(function(id){ $(id).addEventListener('input',relabel); $(id).addEventListener('change',relabel); });
relabel();
SND.button(document.querySelector('.top'));
</script>
