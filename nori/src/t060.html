var BN={LO:.22,HOLD:1.4,A:330}, N={}, nraf=0;
(function(){ var a=0; BW.forEach(function(w){ w.s=a; a+=w[1]; w.e=a; }); })();

/* 돌기: 처음 빠르기 = 뗀 힘 · 일정하게 느려짐 → 멈출 자리는 힘 하나로 정해짐 */
function bnSpin(q){ var g=S.gen, go=$('bnGo'); if(go) go.disabled=true; N.ph='turn'; var pc=N.turn===0?'l':'r'; col(pc,{pw:0,good:null});
  if(q<BN.LO){ var R0=N.R, t0=performance.now(); snd('clack',.3); (function nb(){ if(g!==S.gen) return; var k=Math.min(1,(performance.now()-t0)/500); bnRot(R0+Math.sin(Math.PI*k)*14); if(k<1){ requestAnimationFrame(nb); return; }
      fx('살살~',36); $('say').innerHTML='<em>너무 살살 돌렸어요</em> · 판이 한 바퀴는 돌아야 해요 · 동전은 그대로, 다시'; setTimeout(function(){ if(g===S.gen) bnTurn(); },1300); })(); return; }
  var w0=Math.round((520+q*880)*4)/4, A=BN.A, T=w0/A, R0=N.R-q*8, t0=performance.now(), id=++N.loop, last=bnAt(R0), nl=$('bnnail'), lt=0;
  (function lp(){ if(g!==S.gen||id!==N.loop) return; var t=Math.min(T,(performance.now()-t0)/1000), R=R0+w0*t-A*t*t/2; bnRot(R); var i=bnAt(R);
    if(i!==last){ last=i; var now=performance.now(); if(now-lt>45){ lt=now; snd('clack',.22); } if(nl){ nl.classList.add('tk'); clearTimeout(nl.__t); nl.__t=setTimeout(function(){ nl.classList.remove('tk'); },60); } }
    if(t<T){ nraf=requestAnimationFrame(lp); return; } N.R=R; bnStop(i); })(); }
function bnStop(i){ var g=S.gen, x=BW[i], p=N.turn, who=p===0?'':esc(nm(1))+' ';
  if(x[2]<0){ N.more=true; N.order.splice(N.ti+1,0,p); fx('한 번 더!',40); snd('ding',.5); $('say').innerHTML='<b>'+who+'「한 번 더」</b> · 동전 없이 한 번 더 돌려요'; }
  else if(x[2]===0){ fx('꽝!',60); snd('thud',.7); $('say').innerHTML='<em>'+who+'꽝</em> · 이번엔 빈 고깔'; }
  else { N.tot[p]+=x[2]; fx(x[0]+'!',x[2]>=3?44:40); snd(x[2]>=3?'win':'ding',x[2]>=3?.6:.5); $('say').innerHTML=(p===0?'<b>'+x[0]+'!</b> 번데기 '+x[2]+'고깔 담았어요':'<em>'+who+x[0]+'</em> 담았어요'); }
  bnScore(); vs(null);
  setTimeout(function(){ if(g!==S.gen) return; N.ti++;
    if(N.ti>=N.order.length){ if(N.tot[0]===N.tot[1]){ N.order.push(0,1); $('say').innerHTML='<b>고깔 수가 같아요!</b> 한 번씩 더'; setTimeout(function(){ if(g===S.gen) bnTurn(); },1200); return; }
      var meWin=N.tot[0]>N.tot[1]; S.over=true; bnScore(); fx(meWin?'이겼다!':(two()?'친구 이겼다!':'졌다…'),38);
      $('say').innerHTML='나 <b>'+N.tot[0]+'고깔</b> · '+esc(nm(1))+' <b>'+N.tot[1]+'고깔</b>'; S.over=false; setTimeout(function(){ if(g===S.gen) finish(meWin,N.tot[0],N.tot[1]); },900); return; }
    bnTurn(); },x[2]<0?1000:1500); }
function bnCpu(){ if(S.over) return; var go=$('bnGo'); if(go) go.textContent=nm(1)+' 꾹…'; bnHold(BN.LO+.06+Math.random()*(1-BN.LO-.06)); }
window.addEventListener('resize',function(){ if($('bnw')&&!S.over) bnLay(); });

/* ───────── 고르기 · 시작 ───────── */
function setGame(k){ S.gen++; try{ PEN.stop(); }catch(e){} NA.unpoint(); S.k=k; S.over=true; S.sc=[0,0]; $('done').classList.remove('on'); $('ttl').textContent=GN[k]; document.title=GN[k]+' · 그때 그 놀이';
  $('board').innerHTML=''; $('act').innerHTML=''; $('say').innerHTML=''; vs(null);
  NA.pre({who:true, opp:shopName()+' 사장님', onGo:function(bet,who){ S.bet=bet; S.mode=who==='two'?'two':'cpu1'; window.__naTwo=two(); window.__noriBetName=bet==='none'?'':NA.betName(bet); snd('stone',.6); start(); },
    onCancel:function(){ if(window.noriHome) noriHome(); }}); }
function start(){ S.gen++; try{ PEN.stop(); }catch(e){} S.over=false; S.sc=[0,0]; $('done').classList.remove('on'); col('l',{pw:0,on:null,good:null}); col('r',{pw:0,on:null,good:null}); bunStart(); }
(function(){
  $('again').addEventListener('click',function(){ setGame(S.k); });
  $('helpBtn').addEventListener('click',function(){ $('helpT').textContent=GN[S.k]+' · 놀이 방법'; $('helpB').innerHTML=rules(S.k); $('help').classList.add('on'); });
  $('help').addEventListener('click',function(e){ if(e.target.id==='help'||e.target.closest('[data-x]')) $('help').classList.remove('on'); });
  noriNav({here:function(){ return CODE[S.k]; }, onNew:function(){ $('done').classList.remove('on'); setGame(S.k); },
    onOpen:function(){ if(S.over&&!document.querySelector('.ncard.on')&&!document.querySelector('.pn-sc')) setGame(S.k); }});
})();
function solo(k){ if(GN[k]) setGame(k); }
setGame('bun');
</script>
