<style>
/* 그때그놀이-030 · 팔씨름 · 엿치기 v1 (261123 · 3차) — 시안 v5.1 에서 옮김 · 디자인 A · 시작 전 「무엇을 걸까요?」 · 벌칙 · 결과 카드
   ★첫째 원칙: 테두리 · 음영 없음 · 빨간 방사형 · 빨간 원 금지 · 힘은 옆 기둥 */
:root{--ink:#1C1D21;--blu:#2F64E0;--red:#E04848;--yel:#FFC21A;--sub:#7A6E55;--chip:#F2EBDB;--btn:#F6F1E6;--skin:#F6C99B;
  --body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;--sign:"Black Han Sans";--brand:"Song Myung"}
*{box-sizing:border-box}
html,body{margin:0;background:#FFF8E6;color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent;overflow:hidden}
.app{max-width:480px;margin:0 auto;height:calc(100vh - 62px - env(safe-area-inset-bottom,0px));height:calc(100dvh - 62px - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
.top{flex:none;height:48px;display:flex;align-items:center;justify-content:center;position:relative;background:#FFC93C;color:var(--ink);font-family:var(--brand),serif;font-size:20px;padding-top:env(safe-area-inset-top,0px);box-sizing:content-box;margin:0 -38px}
.dk{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;padding:6px 6px 8px}
#vs{display:none!important}
.strip{flex:none;display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:0 -30px}
.strip span{font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--chip);color:var(--sub);white-space:nowrap}
.say{flex:none;text-align:center;font-size:13.5px;line-height:1.45;font-weight:700;color:var(--sub);word-break:keep-all;min-height:20px}
.say b{color:var(--blu)}.say em{font-style:normal;color:var(--red)}
.board{flex:1;min-height:180px;border-radius:18px;background:#fff;position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.act{flex:none;display:flex;flex-direction:column;gap:6px}
.tap{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tap button,.big{font:inherit;border:0;border-radius:16px;min-height:62px;font-weight:900;font-size:18px;color:#fff;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.tap .a{background:var(--blu)}.tap .b{background:var(--red)}.tap button:disabled,.big:disabled{background:var(--chip);color:var(--sub)}
.big{width:100%;background:var(--blu);font-size:16px;min-height:52px}
.sbrow{display:flex;gap:8px}.sbrow .big{flex:1}.redo{flex:none;font:inherit;border:0;border-radius:16px;min-height:52px;padding:0 14px;font-weight:900;font-size:14px;background:var(--btn);color:var(--ink);cursor:pointer}
button:active{filter:brightness(.93)}
.pow{position:absolute;left:50%;top:30%;font-family:var(--sign),sans-serif;opacity:0;pointer-events:none;white-space:nowrap;z-index:5}.pow.go{animation:pw .75s ease forwards}
@keyframes pw{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}65%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-62%) scale(1)}}
.board.shake{animation:sh .36s ease}@keyframes sh{0%,100%{transform:none}20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-4px)}60%{transform:translate(-5px,2px)}80%{transform:translate(3px,-1px)}}
/* 팔씨름 */
.table{position:absolute;left:10px;right:10px;bottom:16px;height:16px;border-radius:8px;background:#C9A26A}
.fore{position:absolute;height:30px;border-radius:15px;transform-origin:0 50%}
.fore.a{background:linear-gradient(90deg,var(--blu) 0 36%,var(--skin) 36%)}.fore.b{background:linear-gradient(90deg,var(--red) 0 36%,var(--skin) 36%)}
.grip{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;font-size:52px;line-height:64px;text-align:center;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.elb{position:absolute;bottom:26px;width:34px;height:20px;border-radius:10px;background:#B78C56}
.mark{position:absolute;top:10px;font-size:12px;font-weight:800}.mark.a{left:12px;color:var(--blu)}.mark.b{right:12px;color:var(--red)}

.yeots{position:absolute;left:0;right:0;top:50%;display:flex;justify-content:center;gap:16px;transform:translateY(-50%)}
.yeot{position:relative;width:50px;height:min(176px,52vh);border-radius:25px;background:linear-gradient(90deg,#D9A75E,#F0CB8A 45%,#D9A75E);cursor:pointer;transition:transform .15s,opacity .2s}
.yeot.pick{transform:translateY(-10px)}.yeot.cpu{opacity:.4}
.yeot b{position:absolute;left:0;right:0;bottom:-24px;text-align:center;font-size:13px;color:var(--sub)}
.cuts{position:absolute;inset:0;display:none;align-items:center;justify-content:space-around;padding:0 4px}.cuts.on{display:flex}
.cut{display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:800;font-size:13.5px}
.cut canvas{width:min(124px,34vw);height:min(124px,34vw)}

.sb{position:absolute;left:50%;transform:translateX(-50%)}
.sbc{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:6px;background:#F3E6C8;color:#B59A66;font-weight:900;font-size:17px;transition:background .2s}

.aimline{position:absolute;width:4px;margin-left:-2px;transform-origin:50% 100%;z-index:2;background:repeating-linear-gradient(to top,#1E6B34 0 9px,transparent 9px 15px);opacity:.7;display:none}.sbc.sky{border-radius:50% 50% 8px 8px;font-size:13px;letter-spacing:.1em}
.sbline{position:absolute;height:3px;border-radius:2px;background:#C9A26A}
.stone{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#8C8578;z-index:3;transition:left .45s cubic-bezier(.3,.7,.4,1),top .45s cubic-bezier(.3,.7,.4,1)}
.stone.b{background:#9A6A5A}.stone.aim{opacity:.45}
.sbc.tg{animation:tgp 1.2s ease-in-out infinite}@keyframes tgp{50%{background:#9FDCAD}}
.sbtip{position:absolute;left:8px;right:8px;top:8px;z-index:6;text-align:center;font-size:14px;font-weight:800;line-height:1.45;color:var(--ink);background:#FFF1C2;border-radius:12px;padding:8px 10px;word-break:keep-all}
.sbtip small{display:block;font-size:12px;font-weight:700;color:var(--sub)}
.hop{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;z-index:4;display:none;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:900}
.hop.on{display:flex}.hop.a{background:var(--blu)}.hop.b{background:var(--red)}
/* 수건돌리기 (261123 시안) */
.sgseat{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:#E4DCCB;color:#8A7C60;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900}
.sgseat.a{background:var(--blu);color:#fff}.sgseat.b{background:var(--red);color:#fff}
.sgit{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;z-index:3}
.towel{position:absolute;width:22px;height:12px;margin:-6px 0 0 -11px;border-radius:4px;background:#F2B53A;z-index:4}
.towel.down{opacity:.6;z-index:2}
.hsheet{position:fixed;inset:0;z-index:72;background:rgba(28,29,33,.3);display:none;align-items:flex-end;justify-content:center}.hsheet.on{display:flex}
.hsheet .sheet{width:100%;max-width:480px;background:#fff;border-radius:24px 24px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.hsheet h3{margin:0;text-align:center;font-size:17px;font-weight:900}.rl{background:#FFF8E6;border-radius:14px;padding:10px 12px 10px 4px;font-size:14px;line-height:1.55}.rl ol{margin:0;padding-left:24px}.rl b{color:#C23434}
.ok{font:inherit;min-height:50px;border:0;border-radius:14px;background:var(--btn);color:var(--ink);font-weight:800;font-size:16px;cursor:pointer}
.done{display:none}
</style>

<script>
var $=function(id){ return document.getElementById(id); };
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function shopName(){ try{ var v=JSON.parse(localStorage.getItem('nori-shop')||'null'); if(v&&v.s) return v.s; }catch(e){} return '다복'; }
var S={k:'arm',mode:'cpu1',bet:NA.bet(),gen:0,sc:[0,0],over:true,u:'판'};
function two(){ return S.mode==='two'; }
function nm(p){ return p===0?'나':(two()?'친구':shopName()+' 사장님'); }
function snd(k,v){ try{ SND[k](v); }catch(e){} }
var GN={arm:'팔씨름',yeot:'엿치기',sab:'사방치기',sug:'수건돌리기'}, MID={arm:'끝까지 넘기면 이김',yeot:'두 번 먼저 이기면 끝',sab:'8번까지 먼저 다녀오면 이김',sug:'3점 먼저 내면 이김'}, CODE={arm:'aw',yeot:'yt',sab:'sb',sug:'sg'};
var RULE={arm:['두 사람이 손을 맞잡아요. <b>「준비 … 시작!」</b> 하면 힘을 써요.','<b>힘 주는 법: 단추를 빠르게 톡톡톡 두드려요.</b> 빨리 칠수록 힘이 세져요. 꾹 누르고만 있으면 힘이 안 들어가요.','양옆 기둥이 각자의 힘이에요(나 = 왼쪽 파랑). 힘이 센 쪽으로 손이 넘어가요.','상대 손등을 탁자까지 넘기면 이겨요. 친구와 할 때는 한 폰으로 각자 자기 단추를 두드려요.'],
  sab:['<b>번호 순서대로 던져요.</b> 1번 칸 → 2번 칸 → … → 8번 칸. 이번에 던질 칸은 <b style="color:#1E6B34">초록 「여기!」</b> 칸이에요.','<b>① 방향:</b> 초록 줄이 왼쪽 오른쪽으로 흔들려요. 줄이 초록 칸을 가리킬 때 단추를 톡 눌러 멈춰요.','<b>② 힘:</b> 단추를 꾹 누르고 있으면 흐린 돌이 줄을 따라 앞으로 가요. 돌이 초록 칸 안에 오면 손을 떼요. 그러면 돌이 날아가요.','돌이 칸 안에 쏙 들어가면 깡충깡충 하늘까지 다녀와요(저절로). 그리고 다음 번호를 또 던져요. 빗나가면 상대 차례예요.','<b>8번 칸까지 먼저 다녀오면 이겨요!</b>'],
  sug:['둥글게 앉은 자리 둘레를 <b>술래가 수건을 들고</b> 빠르게 돕니다.','자리는 모두 같은 색이에요. 시작할 때 <b>파란불이 켜진 자리가 나</b>예요. 중간에 <b>자리가 빙글 섞이니</b> 내 자리를 눈으로 따라가요.','술래가 <b>몰래 수건을 떨어뜨립니다.</b> 내 자리 뒤에 떨어졌으면 술래가 한 바퀴 돌아오기 전에 <b>「내 뒤에 수건!」</b>을 누르세요.','알아채면 1점 · 놓치거나 괜히 누르면 상대 1점. <b>3점 먼저</b> 내면 이깁니다.'],
  yeot:['엿 세 개 중 하나를 고릅니다. 상대는 남은 것 중 하나를 고릅니다.','아래 단추를 <b>꾹 눌러 엿을 휘었다가 놓으면 「뚝!」</b> 부러집니다. 덜 휘면 다시.','부러진 단면의 <b>구멍이 큰 쪽</b>이 이깁니다. <b>두 번 먼저 이기면</b> 끝.']};
function rules(k){ return '<ol>'+RULE[k].concat(['진 쪽은 시작할 때 고른 <b>벌칙</b>을 받습니다. 「선물만」이면 벌칙 없이 끝.']).map(function(x){ return '<li>'+x+'</li>'; }).join('')+'</ol>'; }
function vs(on){ $('vs').innerHTML='<div class="p a"><span>나</span><em>'+S.sc[0]+' '+S.u+'</em></div><div class="mid">'+MID[S.k]+'</div><div class="p b"><span>'+esc(nm(1))+'</span><em>'+S.sc[1]+' '+S.u+'</em></div>';
  $('stBet').textContent='걸린 것 · '+NA.betName(S.bet); $('stRule').textContent=MID[S.k]; if(window.noriSide) noriSide(on==null?null:on, on===0?'내 차례':(on===1?nm(1)+' 차례':'')); }
function fx(word,size){ var b=$('board'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); var p=b.querySelector('.pow'); if(!p){ p=document.createElement('div'); p.className='pow'; b.appendChild(p); } p.textContent=word; p.style.fontSize=(size||(word.length>3?38:60))+'px'; p.classList.remove('go'); void p.offsetWidth; p.classList.add('go'); }
function col(s,o){ if(window.noriCol) noriCol(s,o); }
/* 끝: 기록 → 벌칙 → 결과 카드 (손놀이와 같은 흐름) */
function finish(meWin,a,b){ S.over=true; S.sc=[a,b]; vs(null); col('l',{pw:0,on:null}); col('r',{pw:0,on:null}); NA.unpoint();
  noriResult({game:CODE[S.k],gname:GN[S.k],opp:two()?'친구':nm(1),lv:two()?'':'cpu1',win:!two()&&meWin,detail:a+' 대 '+b,sc:[a,b],u:S.u,out:meWin?'win':'lose'});
  if(meWin||two()) snd('win'); else snd('lose');
  var g=S.gen, lw=meWin?0:1;
  if(S.bet==='none'||!PEN.has(S.bet)){ setTimeout(function(){ if(g===S.gen) $('done').classList.add('on'); },900); return; }
  var o2= two() ? {me:true,victim:lw===0?'친구':'나',side:lw===0?'l':'r'} : (lw===0?{me:true,victim:nm(1),side:'l'}:{me:false,victim:'나',side:'r'});
  $('say').innerHTML= two() ? (lw===0?'<b>내가 이겼다!</b> 친구에게 ':'<em>친구 이겼다!</em> 나에게 ')+PEN.name(S.bet)+'!' : (lw===0?'<b>이겼다!</b> 이제 '+esc(nm(1))+'께 '+PEN.name(S.bet)+'!':'<em>졌다…</em> '+esc(nm(1))+'한테 '+PEN.name(S.bet)+' 😣');
  setTimeout(function(){ if(g!==S.gen) return; $('act').innerHTML=''; PEN.run($('board'),S.bet,o2,function(){ if(g===S.gen) $('done').classList.add('on'); }); },1300); }

/* ───────── 팔씨름 ───────── */
var A={}, HOLD={a:false,b:false};
function armDraw(){ var st=$('board'), w=st.clientWidth, h=st.clientHeight, ey=h-36, lift=A.x*A.x*h*.22, gx=w/2+A.x*(w*.30), gy=h*.40+lift, g=$('grip'); if(!g) return;
  var ea={x:w*.17,y:ey}, eb={x:w*.83,y:ey}; $('elbA').style.left=(ea.x-17)+'px'; $('elbB').style.left=(eb.x-17)+'px';
  function fore(el,e){ var dx=gx-e.x, dy=gy-e.y, L=Math.hypot(dx,dy); el.style.left=e.x+'px'; el.style.top=(e.y-15)+'px'; el.style.width=L+'px'; el.style.transform='rotate('+Math.atan2(dy,dx)+'rad)'; }
  fore($('foreA'),ea); fore($('foreB'),eb); g.style.left=gx+'px'; g.style.top=gy+'px'; g.style.transform='rotate('+(A.x*60)+'deg)'; }
/* 팔씨름 v3 (261123 19:13 대표 결정): 힘 = 빠르게 톡톡톡 두드리기(한 번 칠 때마다 확실히 잡힘) · 「꾹」 말 모두 뺌
   흐름: 미리 보기(3.5초 · 건너뛰기) → 손 맞잡고 「준비…」(팔 떨림) → 「시작!」 → 그때부터 두드리기 · 누르고만 있으면 바로 알려 줌 · 사장님 1초에 6~7번(중상급 · 설정표 BOSS.arm) */
function armStart(){ A={on:false,ready:false,x:0,pa:0,pb:0,raf:0,last:0,cpuT:0,t:0,cr:(window.BOSS?BOSS.arm[0]+Math.random()*(BOSS.arm[1]-BOSS.arm[0]):6.5),gen:S.gen,lastTap:{a:0,b:0},holdT:{a:0,b:0},warn:0}; HOLD={a:false,b:false}; S.u='판';
  $('board').innerHTML='<span class="mark a">나</span><span class="mark b">'+esc(nm(1))+'</span><div class="table"></div><div class="elb" id="elbA"></div><div class="elb" id="elbB"></div><div class="fore a" id="foreA"></div><div class="fore b" id="foreB"></div><div class="grip" id="grip">🤝</div>';
  $('act').innerHTML='<div class="tap"><button class="a" type="button" id="armA">나 · 톡톡톡!</button><button class="b" type="button" id="armB"'+(two()?'':' disabled')+'>'+(two()?'친구 · 톡톡톡!':'사장님 (자동)')+'</button></div>';
  requestAnimationFrame(armDraw); vs(0);
  function down(side){ return function(e){ e.preventDefault(); if(S.over) return; NA.unpoint(); HOLD[side]=true; A.holdT[side]=performance.now(); armPush(side); }; }
  function up(side){ return function(){ HOLD[side]=false; }; }
  var ba=$('armA'), bb=$('armB'); ba.addEventListener('pointerdown',down('a')); bb.addEventListener('pointerdown',function(e){ if(two()) down('b')(e); });
  ['pointerup','pointercancel','pointerleave'].forEach(function(t){ ba.addEventListener(t,up('a')); bb.addEventListener(t,up('b')); });
  armDemo(armReady); }
