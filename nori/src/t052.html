function mugungStart(){ var C=BOSS.mugung||{}; M={gen:S.gen,step:0,need:C.need||30,life:2,cyc:0,cycMax:C.cyc||5,ph:'wait',seen:0}; S.u='걸음'; S.sc=[0,0];
  var h='<div class="mgtrack"></div><div class="mgit" id="mgit"><span id="mgface">술래</span></div><div class="mgw" id="mgw">'; MW.forEach(function(c){ h+='<span>'+c+'</span>'; }); h+='</div><div class="mgme" id="mgme">나</div><div class="mglife" id="mglife"></div>';
  $('board').innerHTML=h; $('act').innerHTML='<button class="big" type="button" id="mgGo">앞으로!</button>';
  $('mgGo').addEventListener('pointerdown',function(e){ e.preventDefault(); mgStep(); });
  vs(0); mgDraw(); setTimeout(function(){ if(M.gen===S.gen) mgCycle(); },900); }
function mgDraw(){ var G=mgGeo(), me=$('mgme'); if(!me) return; me.style.top=(G.y0-(G.y0-G.y1-40)*M.step/M.need)+'px'; me.style.left=(G.w/2)+'px';
  $('mgit').style.top=G.y1-36+'px'; $('mgit').style.left=(G.w/2)+'px';
  $('mglife').innerHTML='걸릴 수 있는 수 '+'●'.repeat(M.life)+'<i>'+'●'.repeat(2-M.life)+'</i> · 외기 '+Math.min(M.cyc,M.cycMax)+'/'+M.cycMax;
  col('l',{pw:M.step/M.need,on:true}); col('r',{pw:M.cyc/M.cycMax,on:false}); S.sc=[M.step,M.cyc]; }
/* 한 번 외기: 글자 사이 시간을 들쭉날쭉하게 · 가끔 끝 세 글자를 몰아서 */
function mgCycle(){ if(S.over) return; var g=S.gen, C=BOSS.mugung||{}, say=C.say||[1.0,3.0], T=say[0]+Math.random()*(say[1]-say[0]), gaps=[], tot=0, rush=Math.random()<.35;
  if(M.cyc>=M.cycMax){ mgEnd(false,'time'); return; } M.cyc++; mgDraw();
  for(var i=0;i<MW.length;i++){ var v=.4+Math.random()*1.2; if(rush&&i>=MW.length-3) v=.12; gaps.push(v); tot+=v; } gaps=gaps.map(function(v){ return v/tot*T; });
  var ws=$('mgw').children; for(var i=0;i<ws.length;i++) ws[i].className='';
  M.ph='say'; $('mgit').className='mgit'; $('mgface').textContent='술래'; $('say').innerHTML='술래가 돌아서서 외는 중 · <b>톡톡 앞으로!</b> · 「다」가 켜지면 멈춤';
  if(!M.tip){ M.tip=1; NA.point($('mgGo'),'글자가 켜지는 동안 톡톡 · 「다」 전에 멈추기',.5,.4); }
  var i=0; (function nx(){ if(g!==S.gen||M.ph!=='say') return; ws[i].className='on'; snd('clack',.12+.02*i); i++;
    if(i>=MW.length){ mgLook(); return; } M.t=setTimeout(nx,gaps[i]*1000); })(); }
function mgLook(){ var g=S.gen; M.ph='look'; $('mgit').className='mgit look'; $('mgface').textContent='👀'; snd('target',.5); $('say').innerHTML='<em>술래가 돌아봤어요!</em> 움직이면 걸려요';
  var look=1.2+Math.random()*.7; M.t=setTimeout(function(){ if(g!==S.gen||M.ph!=='look') return; mgCycle(); },look*1000); }
function mgStep(){ if(S.over) return; NA.unpoint();
  if(M.ph==='look'){ mgCaught(); return; } if(M.ph!=='say') return;
  M.step++; snd('putt',.35); mgDraw(); if(M.step>=M.need){ mgEnd(true,'touch'); } }
function mgCaught(){ var g=S.gen; M.ph='wait'; clearTimeout(M.t); M.life--; M.step=Math.max(0,M.step-5); fx('걸렸다!',42); snd('thud',.8); mgDraw();
  if(M.life<=0){ mgEnd(false,'caught'); return; }
  $('say').innerHTML='<em>움직여서 걸렸어요</em> · 다섯 걸음 뒤로 · 한 번 더 걸리면 끝';
  M.t=setTimeout(function(){ if(g===S.gen) mgCycle(); },1700); }
function mgEnd(win,why){ var g=S.gen; M.ph='wait'; clearTimeout(M.t); $('mgGo').disabled=true;
  fx(win?'찜! 쳤다':(why==='time'?'시간 끝':'졌다…'),38); if(win){ $('mgit').className='mgit got'; }
  $('say').innerHTML=win?'<b>술래를 쳤어요!</b>':(why==='time'?'<em>술래까지 못 갔어요</em> · 외는 동안 더 많이 톡톡':'<em>두 번 걸렸어요</em>');
  setTimeout(function(){ if(g===S.gen) finish(win,win?1:0,win?0:1); },800); }

window.addEventListener('resize',function(){ if(S.k==='jegi'&&$('jgz')) jgLay(); if(S.k==='gong'&&$('kgh')) kgLay(); if(S.k==='mugung'&&$('mgme')) mgDraw(); });

/* ───────── 고르기 · 시작 ───────── */
function setGame(k){ S.gen++; try{ PEN.stop(); }catch(e){} NA.unpoint(); S.k=k; S.over=true; S.sc=[0,0]; $('done').classList.remove('on'); $('ttl').textContent=k==='mugung'?'무궁화꽃':GN[k]; document.title=GN[k]+' · 그때 그 놀이';
  $('board').innerHTML=''; $('act').innerHTML=''; $('say').innerHTML=''; vs(null);
  NA.pre({who:false, opp:shopName()+' 사장님', onGo:function(bet,who){ S.bet=bet; S.mode='cpu1'; window.__noriBetName=bet==='none'?'':NA.betName(bet); snd('stone',.6); start(); },
    onCancel:function(){ if(window.noriHome) noriHome(); }}); }
function start(){ S.gen++; try{ PEN.stop(); }catch(e){} S.over=false; S.sc=[0,0]; $('done').classList.remove('on'); col('l',{pw:0,on:null}); col('r',{pw:0,on:null}); if(S.k==='jegi') jegiStart(); else if(S.k==='gong') gongStart(); else mugungStart(); }
(function(){
  $('again').addEventListener('click',function(){ setGame(S.k); });
  $('helpBtn').addEventListener('click',function(){ $('helpT').textContent=GN[S.k]+' · 놀이 방법'; $('helpB').innerHTML=rules(S.k); $('help').classList.add('on'); });
  $('help').addEventListener('click',function(e){ if(e.target.id==='help'||e.target.closest('[data-x]')) $('help').classList.remove('on'); });
  noriNav({here:function(){ return CODE[S.k]; }, onNew:function(){ $('done').classList.remove('on'); setGame(S.k); },
    onOpen:function(){ if(S.over&&!document.querySelector('.ncard.on')&&!document.querySelector('.pn-sc')) setGame(S.k); }});
})();
function solo(k){ if(GN[k]) setGame(k); }
setGame(GN[(location.hash||'').slice(1)]?(location.hash||'').slice(1):'jegi');
</script>
