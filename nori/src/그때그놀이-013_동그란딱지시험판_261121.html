<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>동그란 딱지 시험판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Song+Myung&family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
<style>
/* 동그란 딱지 시험판 v3 — 뒷면 가게 광고판, 우리 가게 딱지 만들기, 앞면 노랑 테 뺌 */
:root{
  --ink:#1B1A1F; --red:#E1262D; --yel:#FFC21A; --blu:#2457D6; --org:#FF7A1A;
  --paper:#F7EFD8; --line:#E2D6B4; --muted:#6B5A30;
  --sign:"Black Han Sans"; --brand:"Song Myung";
  --body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#E9DDBA;color:var(--ink);font-family:var(--body);line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 0%,#FFF8E6 0,#F7EFD8 55%,#EFE4C6 100%)}
.top{position:sticky;top:0;z-index:5;height:56px;display:flex;align-items:center;justify-content:center;padding:0 10px;padding-top:env(safe-area-inset-top,0px);background:#16181D;color:#fff;box-sizing:content-box}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:4px;background:linear-gradient(90deg,var(--red) 0 25%,var(--yel) 25% 50%,var(--blu) 50% 75%,var(--org) 75%)}
.snd{position:absolute;right:8px;bottom:8px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:0;border-radius:12px;background:transparent;color:#fff;cursor:pointer}
.snd[aria-pressed="false"]{color:#8C8C8C}
.ttl{font-family:var(--sign),var(--body);font-size:20px;letter-spacing:.04em}
.dk{flex:1;padding:18px max(14px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
h3{margin:0;text-align:center;font-family:var(--brand),serif;font-weight:400;font-size:25px;letter-spacing:.04em}
.set{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.set label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:700;color:var(--muted)}
.set select,.set input{font:inherit;font-size:15px;font-weight:700;padding:8px 10px;border-radius:12px;border:1.5px solid #CDBF9B;background:#fffdf6;color:var(--ink);width:100%;min-width:0}
.rules{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.rules button{font:inherit;font-size:14px;font-weight:800;padding:8px 13px;border-radius:999px;border:1.5px solid #CDBF9B;background:#fffdf6;color:#5A4A22;cursor:pointer}
.rules button[aria-pressed="true"]{background:#16181D;border-color:#16181D;color:var(--yel)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--blu);outline-offset:2px}
.board{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:4px}
.side{display:flex;flex-direction:column;align-items:center;gap:6px}
.side small{font-size:13px;font-weight:800;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flip{width:min(100%,150px);aspect-ratio:1;perspective:700px}
.flip .in{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .face.f{transform:rotateY(180deg)}
.flip.win .face.f svg{filter:drop-shadow(0 0 10px rgba(255,194,26,.95))}
.say{min-height:56px;text-align:center;background:#fff;border-radius:14px;padding:9px 10px;font-size:14.5px;line-height:1.45;box-shadow:inset 0 0 0 1.5px var(--line)}
.say b{color:var(--red)}
.tally{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:800;color:#5A4A22;padding:0 4px}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.dots i{width:12px;height:12px;border-radius:50%;background:#E3D6B2;display:block}
.dots i.w{background:var(--blu)}.dots i.l{background:var(--red)}
.pile{display:flex;justify-content:center;flex-wrap:wrap;min-height:44px;padding-left:14px}
.pile svg{width:40px;height:40px;margin-left:-14px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;border-radius:16px;font-weight:800;border:0;font-family:var(--body);cursor:pointer;width:100%}
.btn svg{width:19px;height:19px}
.play{min-height:60px;background:var(--blu);color:#fff;font-size:19px;box-shadow:0 3px 0 rgba(18,40,110,.35)}
.play[disabled]{opacity:.5;cursor:default}
.gift{min-height:54px;background:var(--red);color:#fff;font-size:17px;box-shadow:0 3px 0 rgba(120,10,15,.3)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.half{min-height:48px;background:#fff;color:var(--ink);border:1.5px solid #D8D5CC;font-size:15px}
.done{display:none;flex-direction:column;gap:10px;text-align:center}
.done.on{display:flex}
.big{font-family:var(--sign),sans-serif;font-size:28px;line-height:1.2}
.big em{font-style:normal;color:var(--red)}
.shop{margin-top:6px;background:#fffdf6;border-radius:16px;box-shadow:inset 0 0 0 1.5px var(--line)}
.shop>summary{list-style:none;cursor:pointer;padding:13px 14px;font-weight:900;font-size:15.5px;display:flex;align-items:center;justify-content:space-between}
.shop>summary::-webkit-details-marker{display:none}
.shop>summary::after{content:"";width:9px;height:9px;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(45deg);margin-top:-4px}
.shop[open]>summary::after{transform:rotate(-135deg);margin-top:4px}
.shop .bd{padding:0 14px 14px;display:flex;flex-direction:column;gap:14px}
.sec{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:start}
.sec h4{grid-column:1/-1;margin:0;font-size:13.5px;font-weight:900;color:#5A4A22;border-top:1px dashed #D9CBA4;padding-top:12px}
.sec:first-child h4{border-top:0;padding-top:0}
.pv{width:96px;height:96px}
.fl{display:flex;flex-direction:column;gap:7px;min-width:0}
.fl label{display:flex;flex-direction:column;gap:2px;font-size:11.5px;font-weight:800;color:var(--muted)}
.fl input[type=text],.fl input[type=number],.fl select{font:inherit;font-size:14.5px;font-weight:700;padding:7px 9px;border-radius:10px;border:1.5px solid #CDBF9B;background:#fff;color:var(--ink);width:100%;min-width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.up{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.up label.fb{flex-direction:row;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--ink);background:#F3EBD3;border-radius:10px;padding:7px 11px;cursor:pointer}
.up input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.up button,.mini{font:inherit;font-size:12.5px;font-weight:800;border:0;background:none;color:#8A7A50;text-decoration:underline;cursor:pointer;padding:6px 2px}
.cols{display:flex;gap:7px;flex-wrap:wrap}
.cols button{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px #CDBF9B;cursor:pointer;padding:0}
.cols button[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--ink)}
.add{min-height:46px;background:#16181D;color:var(--yel);font-size:15px}
.mine{display:flex;gap:10px;flex-wrap:wrap}
.mine div{position:relative;width:58px;height:58px}
.mine button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:#16181D;color:#fff;font-size:13px;line-height:22px;padding:0;cursor:pointer}
.hint{font-size:11.5px;color:#8A7A50;margin:0}
.lure{margin:0;font-size:14px;color:#5A4A22}
.lure b{color:var(--red)}
.done{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#FFF8E6;border-radius:22px 22px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.2);padding:18px 16px calc(84px + env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto}
.note{font-size:11.5px;color:#8A7A50;text-align:center;margin:4px 0 0}

/* ★첫째 원칙 (대표 261122): 놀이는 복고여도 화면은 산만하지 않게 — 테두리 · 음영 없음 */
button,.btn,.bt,.pk,.pick button,.say,.vs div,.vs .p,.hb,.act .spd,.rl,.card,.room,.fam a,.tabs button,.half,.two button,.set select,.shopset input,.shopset select,.sheet,.done,.cap2,.box{box-shadow:none!important;border:0!important;text-shadow:none!important}
.pick button,.pk,.hb,.half,.two button,.bt.o,.act .spd{background:#EFEAE0!important}
.say,.rl{background:#fff!important}
.vs div,.vs .p{background:#fff!important}
button:active{filter:brightness(.93)}
.bt.o[aria-pressed=true]{background:#FFC21A!important}
</style>
</head>
<body>
<div class="app">
  <div class="top"><span class="ttl">동그란 딱지</span></div>
  <div class="dk">
    <h3>무엇으로 겨룰까요?</h3>
    <div class="rules" role="group" aria-label="겨루기">
      <button type="button" data-r="star" aria-pressed="true">★ 별 높기</button>
      <button type="button" data-r="name" aria-pressed="false">글자 많기</button>
      <button type="button" data-r="num" aria-pressed="false">숫자 높기</button>
    </div>
    <div class="set" style="display:none">
      <label for="rounds">몇 판
        <select id="rounds"><option>3</option><option selected>5</option><option>7</option><option>10</option></select></label>
      <label for="opn">상대 이름
        <input id="opn" value="다복 사장님" maxlength="10"></label>
    </div>
    <div class="board">
      <div class="side"><div class="flip" id="me"><div class="in"><div class="face b"></div><div class="face f"></div></div></div><small>나</small></div>
      <div class="side"><div class="flip" id="op"><div class="in"><div class="face b"></div><div class="face f"></div></div></div><small id="opl">다복 사장님</small></div>
    </div>
    <div class="say" id="say"></div>
    <div class="tally"><span id="rl">다섯 판</span><span class="dots" id="dots"></span><span id="cnt">딴 딱지 0장</span></div>
    <div class="pile" id="pile" aria-label="딴 딱지"></div>
    <button class="btn play" id="go" type="button"><svg viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z" fill="currentColor"/></svg><span id="gol">딱지 내기</span></button>
    <div class="done" id="done">
      <div class="big" id="big"></div>
      <p class="lure">다복에서 <b>푸짐한 선물</b>을 드립니다</p>
      <button class="btn gift" type="button">선물 받기</button>
      <div class="pair"><button class="btn half" type="button" id="again">다시 하기</button><button class="btn half" type="button">이야기방에 남기기</button></div>
    </div>
    <details class="shop" open>
      <summary>매장 설정 <small style="font-weight:700;color:#8A7A50;font-size:12px">관리자 자리 · 시험</small></summary>
      <div class="bd">
        <div class="sec">
          <h4>딱지 뒷면 = 우리 가게 광고판</h4>
          <div class="pv" id="pvB"></div>
          <div class="fl">
            <label for="adN">가게 이름<input type="text" id="adN" value="다복" maxlength="8"></label>
            <label for="adT">한 줄 문구<input type="text" id="adT" value="다복 사랑해요" maxlength="12"></label>
            <div class="up"><label class="fb" for="adI">로고 · 사진 올리기<input type="file" id="adI" accept="image/*"></label><button type="button" id="adX">그림 빼기</button></div>
          </div>
        </div>
        <div class="sec">
          <h4>우리 가게 딱지 만들기</h4>
          <div class="pv" id="pvF"></div>
          <div class="fl">
            <label for="cN">딱지 글자<input type="text" id="cN" value="다복 사랑해요" maxlength="8"></label>
            <div class="row2">
              <label for="cS">별<select id="cS"><option>1</option><option>2</option><option>3</option><option>4</option><option selected>5</option></select></label>
              <label for="cV">숫자<input type="number" id="cV" value="999" min="1" max="999" inputmode="numeric"></label>
            </div>
            <div class="cols" id="cC" role="group" aria-label="테두리 색"></div>
            <div class="up"><label class="fb" for="cI">가운데 그림 올리기<input type="file" id="cI" accept="image/*"></label><button type="button" id="cX">그림 빼기</button></div>
          </div>
        </div>
        <button class="btn add" type="button" id="cAdd">이 딱지를 놀이 묶음에 넣기</button>
        <div class="mine" id="mineList" aria-label="넣은 가게 딱지"></div>
        <p class="hint" id="deckN"></p>
      </div>
    </details>
    <p class="note">그때 그 놀이 · 동그란 딱지 시험판 v3.3 · 아래 막대 · 소리 · 매장 설정은 이 폰에만 저장 · 선물 받기 · 이야기방은 아직 연결 전</p>
  </div>
</div>
<script>
/* 놀이 결과를 손님 입구에 알리고, 「선물 받기」를 입구의 선물 창으로 넘김 */
window.noriResult=function(r){ window.__noriLast=r; try{ if(window.parent!==window){ window.parent.postMessage({nori:'result',r:r},'*'); } }catch(e){} };
document.addEventListener('click',function(e){ var b=e.target.closest&&e.target.closest('.gift'); if(!b) return;
  var framed=false; try{ framed=window.parent!==window; }catch(x){ framed=true; }
  if(framed){ try{ window.parent.postMessage({nori:'gift'},'*'); }catch(x){} return; }
  var t=document.getElementById('noriToast'); if(!t){ t=document.createElement('div'); t.id='noriToast'; t.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#16181D;color:#fff;font:700 14px "Noto Sans KR",sans-serif;padding:11px 16px;border-radius:14px;z-index:99;max-width:88vw;text-align:center'; document.body.appendChild(t); }
  t.textContent='선물은 손님 입구(다복 · 그때 그 놀이)에서 받아요'; t.style.display='block'; clearTimeout(t._t); t._t=setTimeout(function(){ t.style.display='none'; },2400); });

/* 그때 그 놀이 · 아래 막대(모든 놀이 공통) — 「놀이 방법」 「그때 그 놀이(홈, 가운데)」 「새 판」 (261122 v5)
   손님 입구 안에서 열렸으면 입구에게 알리고, 따로 열렸으면 그 놀이 주소로 옮김 */
/* ★ 사장님 세기 설정표 (049 원칙 · 261123) — 놀이마다 사장님 세기는 여기 한 곳에서만 고침.
   lv: 0 하수 · 1 중수 · 2 고수 — 손님 화면 사장님 = 「중상급」 1.5(중수와 고수 사이) · 판마다 컨디션 ±sway 로 조금씩 들쭉날쭉(손님은 모름).
   손님 승률 목표 약 45% · 운 놀이(가위바위보 · 홀짝 · 엿치기)는 50% 그대로. 승률 기록이 쌓이면 아래 숫자만 조금씩 맞춤. */
window.BOSS=window.BOSS||{lv:1.5, sway:.2,
  arm:[6,7],        /* 팔씨름: 사장님이 1초에 두드리는 횟수(최소 · 최대) */
  sab:.72,          /* 사방치기: 사장님이 던져 칸에 넣는 비율 */
  sugLap:1.8,       /* 수건돌리기: 술래 한 바퀴 초 */
  jegi:[9,16],      /* 제기차기: 사장님 연속 차기(최소 · 최대) */
  gong:.75,         /* 공기놀이: 사장님이 한 번 줍고 받기에 성공하는 비율(단계마다 조금씩 내려감) */
  mugung:{say:[1.0,3.0],cyc:5,need:30}   /* 무궁화꽃: 술래가 한 번 외는 초(최소 · 최대) · 외는 횟수 · 술래까지 걸음 */
  };
(function(){ function pick(){ BOSS.cur=Math.max(1,Math.min(2,BOSS.lv+(Math.random()*2-1)*BOSS.sway)); } pick(); BOSS.pick=pick;
  document.addEventListener('click',function(e){ var b=e.target&&e.target.closest&&e.target.closest('button[data-a=new]'); if(b) pick(); },true); })();
/* 세기 표(하수 · 중수 · 고수 세 값)에서 지금 사장님 값 고르기 — 중수(1) 자리는 그 판 컨디션(1~2)으로 사이 값을 씀 */
window.bossV=function(arr,L){ if(L!==1||!BOSS.cur) return arr[L]; var x=BOSS.cur, i=Math.min(arr.length-2,Math.floor(x)), f=x-i; return arr[i]+(arr[i+1]-arr[i])*f; };
/* 좌우 점수 기둥 (261122 v5) — 나·내 편 = 왼쪽 파랑, 사장님·친구 = 오른쪽 빨강. 위 점수줄(.vs)의 이름·점수를 옮겨 보이고 그 줄은 숨김. 차례인 쪽이 진하게 */
(function(){
  var d=document, st=null, W=null, LAB='', RN='';
  function opp(){ if(RN) return RN; if(window.__naTwo) return '친구'; var s=d.querySelector('.shopN'); return (s&&s.textContent.trim()?s.textContent.trim():'다복')+' 사장님'; }
  function init(){ if(st) return st;
    var css=d.createElement('style');
    css.textContent='.nside{position:fixed;top:10px;bottom:calc(66px + env(safe-area-inset-bottom,0px));width:32px;z-index:20;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;pointer-events:none;font-family:"Noto Sans KR",system-ui,sans-serif;transition:background .2s,color .2s}'
     +'.nside.l{left:2px;background:#E4EBFB;color:#2457D6}.nside.r{right:2px;background:#FBE4E5;color:#E1262D}'
     +'.nside.l.on{background:#2457D6;color:#fff}.nside.r.on{background:#E1262D;color:#fff}'
     +'.nside .nm{writing-mode:vertical-rl;font-weight:800;font-size:11px;letter-spacing:.06em;max-height:34%;overflow:hidden;white-space:nowrap}'
     +'.nside .sc{font-weight:900;font-size:19px;line-height:1;font-variant-numeric:tabular-nums}.nside .sc:empty{display:none}'
     +'.nside .un{font-weight:800;font-size:11px;line-height:1;margin-top:-3px}.nside .ex{font-weight:800;font-size:11px;line-height:1;opacity:.85}'
     +'.nside .tn{margin-top:auto;writing-mode:vertical-rl;font-weight:900;font-size:12px;letter-spacing:.1em;opacity:0}.nside.on .tn{opacity:1}'
     +'body.nside-on{padding-left:38px!important;padding-right:38px!important}body.ncard-on .nside{display:none}'
     +'.act .spd>span{display:none!important}.act .spd button{white-space:nowrap}'
     +'.nside-hide{display:none!important}.vs.nside-mid{grid-template-columns:1fr!important}.vs.nside-mid .p{display:none!important}';
    if(window.NORI_A){ css.textContent+='.nside{bottom:auto;width:26px;border-radius:13px;padding:7px 0;gap:4px;overflow:hidden}'
      +'.nside.l{left:7px;background:#E6EDFC;color:#2F64E0}.nside.r{right:7px;background:#FCE8E8;color:#E04848}.nside.l.on{background:#2F64E0;color:#fff}.nside.r.on{background:#E04848;color:#fff}'

  function esc(t){ return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  /* 뒷면 = 가게 광고판: 마분지 바탕에 가게 그림(있으면) · 가게 이름 · 문구. 아무것도 없으면 빈 마분지 */
  var AD={name:'',text:'',img:''};
  function setAd(o){ AD.name=o.name||''; AD.text=o.text||''; AD.img=o.img||''; }
  function back(){
    var id='bk'+(uid++), inner='';
    if(AD.img){
      inner+='<clipPath id="ci'+id+'"><circle cx="60" cy="48" r="24"/></clipPath><circle cx="60" cy="48" r="24" fill="#fff"/><image href="'+AD.img+'" x="36" y="24" width="48" height="48" preserveAspectRatio="xMidYMid slice" clip-path="url(#ci'+id+')"/><circle cx="60" cy="48" r="24" fill="none" stroke="#5C4320" stroke-width="1.4"/>';
      if(AD.name){ inner+='<text x="60" y="86" text-anchor="middle" font-size="15" font-family="Song Myung, serif" fill="#3B2A12">'+esc(AD.name)+'</text>'; }
      if(AD.text){ inner+='<text x="60" y="100" text-anchor="middle" font-size="9.5" font-family="Noto Sans KR, sans-serif" font-weight="700" fill="#5C4320">'+esc(AD.text)+'</text>'; }
    } else {
      if(AD.name){ inner+='<text x="60" y="'+(AD.text?58:66)+'" text-anchor="middle" font-size="'+(AD.name.length>4?18:24)+'" font-family="Song Myung, serif" fill="#3B2A12">'+esc(AD.name)+'</text>'; }
      if(AD.text){ inner+='<text x="60" y="'+(AD.name?78:64)+'" text-anchor="middle" font-size="10.5" font-family="Noto Sans KR, sans-serif" font-weight="700" fill="#5C4320">'+esc(AD.text)+'</text>'; }
    }
    return '<svg viewBox="0 0 120 120" width="100%" height="100%" role="img" aria-label="딱지 뒷면'+(AD.name?' · '+esc(AD.name):'')+'">'
      +'<defs><pattern id="p'+id+'" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="2" r=".7" fill="#7A5A2E" opacity=".3"/><circle cx="5" cy="5.5" r=".5" fill="#fff" opacity=".3"/></pattern></defs>'
      +'<circle cx="62.5" cy="62.5" r="57" fill="rgba(0,0,0,.2)"/>'
      +'<circle cx="60" cy="60" r="57" fill="#D9BD8C" stroke="'+INK+'" stroke-width="2.2"/>'
      +'<circle cx="60" cy="60" r="57" fill="url(#p'+id+')"/>'
      +inner+'</svg>';
  }
  return { CARDS:CARDS, face:face, back:back, setAd:setAd, esc:esc };
})();

(function(){
  var NUMK=['','한','두','세','네','다섯','여섯','일곱','여덟','아홉','열'];
  var COLS=['#FF7A1A','#2457D6','#2E7D46','#7A2E8E','#0E8C9A','#8B5A2B'];
  function glen(d){ return d.n.replace(/\s/g,'').length; }
  var RULE={star:{f:function(d){return d.s;},u:function(d){return '★'+d.s;},w:'별이 많은 쪽'},
            name:{f:glen,u:function(d){return '「'+DDAK.esc(d.n)+'」 '+glen(d)+'글자';},w:'이름 글자가 많은 쪽'},
            num:{f:function(d){return d.v;},u:function(d){return String(d.v);},w:'숫자가 높은 쪽'}};
  var rule='star', total=5, round=0, won=0, busy=false, mine=[];
  var $=function(id){return document.getElementById(id);};
  var me=$('me'), op=$('op'), say=$('say'), go=$('go');
  /* 매장 설정 — 이 폰에만 저장(시험). 본 서비스에서는 관리자 화면 → 시트 */
  var ST={ad:{name:'다복',text:'다복 사랑해요',img:''}, mine:[{n:'다복 사랑해요',s:5,v:999,c:'#FF7A1A',img:''}]};
  try{ var sv=JSON.parse(localStorage.getItem('ddak-shop')||'null'); if(sv&&sv.ad&&sv.mine){ ST=sv; } }catch(e){}
  function save(){ try{ localStorage.setItem('ddak-shop',JSON.stringify(ST)); }catch(e){} }
  var draft={n:'다복 사랑해요',s:5,v:999,c:COLS[0],img:''};
  function deck(){ return DDAK.CARDS.concat(ST.mine); }
  function opName(){ return ($('opn').value.trim()||'상대'); }
  function intro(){ say.innerHTML='딱지를 내면 두 장이 함께 뒤집힙니다.<br><b>'+RULE[rule].w+'</b>이 두 장을 다 가져가요.'; }
  function layout(){
    total=parseInt($('rounds').value,10); $('rl').textContent=(NUMK[total]||total)+' 판';
    var h=''; for(var i=0;i<total;i++){ h+='<i></i>'; } $('dots').innerHTML=h;
  }
  function backs(){ DDAK.setAd(ST.ad); var b=DDAK.back(); me.querySelector('.b').innerHTML=b; op.querySelector('.b').innerHTML=DDAK.back(); $('pvB').innerHTML=DDAK.back(); }
  function reset(){
    round=0; won=0; mine=[]; $('pile').innerHTML=''; $('cnt').textContent='딴 딱지 0장';
    me.classList.remove('on','win'); op.classList.remove('on','win'); backs();
    $('done').classList.remove('on'); go.style.display=''; go.disabled=false; $('gol').textContent='딱지 내기';
    layout(); intro(); lock(false);
  }
  function lock(on){ $('rounds').disabled=on; var rb=document.querySelectorAll('.rules button'); for(var i=0;i<rb.length;i++){ rb[i].disabled=on; } }
  var rb=document.querySelectorAll('.rules button');
  for(var i=0;i<rb.length;i++){ rb[i].addEventListener('click',function(){
    rule=this.getAttribute('data-r');
    for(var k=0;k<rb.length;k++){ rb[k].setAttribute('aria-pressed', rb[k]===this?'true':'false'); }
    intro();
  }); }
  $('rounds').addEventListener('change',function(){ if(round===0){ layout(); } });
  $('opn').addEventListener('input',function(){ $('opl').textContent=opName(); });
  go.addEventListener('click',function(){
    if(busy||round>=total){ return; }
    busy=true; go.disabled=true; lock(true);
    me.classList.remove('on','win'); op.classList.remove('on','win');
    setTimeout(function(){
      var D=deck(), R=RULE[rule], a=D[Math.floor(Math.random()*D.length)], b, n=0;
      do{ b=D[Math.floor(Math.random()*D.length)]; n++; }while((b===a || R.f(b)===R.f(a)) && n<200);
      me.querySelector('.f').innerHTML=DDAK.face(a); op.querySelector('.f').innerHTML=DDAK.face(b);
      me.classList.add('on'); SND.slap(); setTimeout(function(){ op.classList.add('on'); SND.slap(.75); },140);
      setTimeout(function(){
        var x=R.f(a), y=R.f(b), d=$('dots').children[round];
        var line='나 '+R.u(a)+' · '+DDAK.esc(opName())+' '+R.u(b)+'<br>';
        if(x>y){ SND.glass(.8); won+=2; mine.push(a,b); me.classList.add('win'); d.className='w'; say.innerHTML=line+'<b>탁! 두 장 땄다!</b>'; }
        else { SND.fall(.6); op.classList.add('win'); d.className='l'; say.innerHTML=line+'<b>아이고, 뺏겼네!</b>'; }
        round++; $('cnt').textContent='딴 딱지 '+won+'장';
        var h=''; for(var j=0;j<mine.length;j++){ h+=DDAK.face(mine[j]); } $('pile').innerHTML=h;
        if(round>=total){ noriResult({game:'rd',gname:'동그란 딱지',opp:opName(),lv:'',win:won>total,detail:'딱지 '+won+'장 땀',sc:[won,null],u:'장',out:won>total?'win':(won===total?'draw':'lose')}); setTimeout(won>0?SND.win:SND.lose,300); $('big').innerHTML = won>0 ? '딱지 <em>'+won+'</em>장 땄어요!' : '이번엔 <em>한 장도</em> 못 땄어요'; $('done').classList.add('on'); go.style.display='none'; }
        else { go.disabled=false; $('gol').textContent=(round+1)+'판째 딱지 내기'; }
        busy=false;
      },720);
    },60);
  });
  $('again').addEventListener('click',reset);

  /* 그림 올리기 — 폰 사진도 가볍게: 가로세로 240 이하로 줄여 저장 */
  function shrink(file,cb){
    if(!file){ return; } var r=new FileReader();
    r.onload=function(){ var im=new Image(); im.onload=function(){
      var k=Math.min(1,240/Math.max(im.width,im.height)), cv=document.createElement('canvas');
      cv.width=Math.round(im.width*k); cv.height=Math.round(im.height*k);
      cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
      var png=cv.toDataURL('image/png'), jpg=cv.toDataURL('image/jpeg',.85);
      cb(png.length<jpg.length*1.6?png:jpg);
    }; im.src=r.result; }; r.readAsDataURL(file);
  }
  $('adN').value=ST.ad.name; $('adT').value=ST.ad.text;
  function adChg(){ ST.ad.name=$('adN').value.trim(); ST.ad.text=$('adT').value.trim(); save(); if(!me.classList.contains('on')){ backs(); } else { DDAK.setAd(ST.ad); $('pvB').innerHTML=DDAK.back(); } }
  $('adN').addEventListener('input',adChg); $('adT').addEventListener('input',adChg);
  $('adI').addEventListener('change',function(){ shrink(this.files[0],function(u){ ST.ad.img=u; adChg(); }); this.value=''; });
  $('adX').addEventListener('click',function(){ ST.ad.img=''; adChg(); });

  var cc=$('cC'), ch='';
  for(var q=0;q<COLS.length;q++){ ch+='<button type="button" style="background:'+COLS[q]+'" data-c="'+COLS[q]+'" aria-label="테두리 색 '+(q+1)+'" aria-pressed="'+(q===0)+'"></button>'; }
  cc.innerHTML=ch;
  function pv(){ $('pvF').innerHTML=DDAK.face(draft); }
  function dChg(){ draft.n=$('cN').value.trim()||'우리 가게'; draft.s=parseInt($('cS').value,10);
    var v=parseInt($('cV').value,10); draft.v=isNaN(v)?1:Math.max(1,Math.min(999,v)); pv(); }
  ['cN','cS','cV'].forEach(function(id){ $(id).addEventListener('input',dChg); $(id).addEventListener('change',dChg); });
  cc.addEventListener('click',function(e){ var t=e.target.closest('button'); if(!t){return;} draft.c=t.getAttribute('data-c');
    var bs=cc.querySelectorAll('button'); for(var k=0;k<bs.length;k++){ bs[k].setAttribute('aria-pressed', bs[k]===t?'true':'false'); } pv(); });
  $('cI').addEventListener('change',function(){ shrink(this.files[0],function(u){ draft.img=u; pv(); }); this.value=''; });
  $('cX').addEventListener('click',function(){ draft.img=''; pv(); });
  function list(){
    var h=''; for(var k=0;k<ST.mine.length;k++){ h+='<div>'+DDAK.face(ST.mine[k])+'<button type="button" data-i="'+k+'" aria-label="'+DDAK.esc(ST.mine[k].n)+' 빼기">✕</button></div>'; }
    $('mineList').innerHTML=h;
    $('deckN').textContent='놀이 묶음: 기본 딱지 '+DDAK.CARDS.length+'장 + 우리 가게 딱지 '+ST.mine.length+'장';
  }
  $('mineList').addEventListener('click',function(e){ var t=e.target.closest('button'); if(!t){return;} ST.mine.splice(parseInt(t.getAttribute('data-i'),10),1); save(); list(); });
  $('cAdd').addEventListener('click',function(){ if(ST.mine.length>=8){ $('deckN').textContent='가게 딱지는 여덟 장까지 넣을 수 있어요.'; return; }
    ST.mine.push({n:draft.n,s:draft.s,v:draft.v,c:draft.c,img:draft.img}); save(); list(); });
  dChg(); list(); reset();
})();
SND.button(document.querySelector('.top'));
noriNav({here:function(){ return 'rd'; }, onNew:function(){ document.getElementById('again').click(); }});
</script>
</body>
