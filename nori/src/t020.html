<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>골프 · 활쏘기 시안 v6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Song+Myung&family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
<style>
/* 그때그놀이-020 · 골프 · 활쏘기 시안 v6 — 한 화면 놀이판 · 상대 고르기 창(하수 · 중수 · 고수) · 아래 막대 · 캐디 · 활터 사람 · 망원경 조준 · 땡그랑 (018 바탕) — 상대는 「상호 주인장」, 소리 · 푸짐한 선물 */
:root{
  --ink:#1B1A1F; --red:#E1262D; --yel:#FFC21A; --blu:#2457D6; --org:#FF7A1A;
  --line:#E2D6B4; --muted:#6B5A30;
  --sign:"Black Han Sans"; --brand:"Song Myung";
  --body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#E9DDBA;color:var(--ink);font-family:var(--body);line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 0%,#FFF8E6 0,#F7EFD8 55%,#EFE4C6 100%)}
.top{position:sticky;top:0;z-index:5;height:56px;display:flex;align-items:center;justify-content:center;padding:0 10px;padding-top:env(safe-area-inset-top,0px);background:#16181D;color:#fff;box-sizing:content-box}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:4px;background:linear-gradient(90deg,var(--red) 0 25%,var(--yel) 25% 50%,var(--blu) 50% 75%,var(--org) 75%)}
.snd{position:absolute;right:8px;bottom:8px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:0;border-radius:12px;background:transparent;color:#fff;cursor:pointer}
.snd[aria-pressed="false"]{color:#8C8C8C}
.ttl{font-family:var(--sign),var(--body);font-size:20px;letter-spacing:.04em}
.dk{flex:1;padding:18px max(14px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.shopset{display:grid;grid-template-columns:1.3fr 1fr;gap:8px;background:#fffdf6;border-radius:14px;padding:10px;box-shadow:inset 0 0 0 1.5px var(--line)}
.shopset label,.set label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:700;color:var(--muted)}
.shopset input,.shopset select{font:inherit;font-size:15px;font-weight:800;padding:7px 10px;border-radius:10px;border:1.5px solid #CDBF9B;background:#fff;color:var(--ink);width:100%;min-width:0}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tabs button{font:inherit;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:16px;border:1.5px solid #CDBF9B;background:#fffdf6;cursor:pointer;color:var(--ink)}
.tabs button svg{width:46px;height:46px;flex:none}
.tabs button b{font-family:var(--sign),var(--body);font-weight:400;font-size:20px;letter-spacing:.03em}
.tabs button[aria-selected="true"]{background:#16181D;border-color:#16181D;color:#fff}
.pane{display:none;flex-direction:column;gap:12px}
.pane.on{display:flex}
.set{display:grid;grid-template-columns:1fr;gap:8px}
.set select{font:inherit;font-size:15px;font-weight:700;padding:8px 10px;border-radius:12px;border:1.5px solid #CDBF9B;background:#fffdf6;color:var(--ink);width:100%}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--blu);outline-offset:2px}
.card{display:grid;grid-template-columns:auto repeat(var(--n,3),1fr) auto;gap:0;font-size:13px;font-weight:800;background:#fff;border-radius:12px;overflow:hidden;box-shadow:inset 0 0 0 1.5px var(--line)}
.card span{padding:5px 6px;text-align:center;border-bottom:1px solid #F0E7CF}
.card span.h{background:#16181D;color:#fff;font-weight:700}
.card span.nm{text-align:left;max-width:9em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.card span.now{background:#FFF2C4}
.card span.tot{background:#F7EFD8}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vs div{display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);font-weight:800;font-size:14px;opacity:.5;min-width:0}
.vs div.b{flex-direction:row-reverse}
.vs div.on{opacity:1;box-shadow:inset 0 0 0 2.5px currentColor}
.vs .a{color:#2457D6}.vs .b{color:#E1262D}
.vs i{width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 3px currentColor;flex:none}
.vs span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.vs em{font-style:normal;color:var(--ink);white-space:nowrap}
.vs div.a em{margin-left:auto}.vs div.b em{margin-right:auto}
.brd{width:100%;display:block;border-radius:12px;box-shadow:0 6px 14px rgba(60,40,10,.25);touch-action:none;user-select:none;-webkit-user-select:none}
.say{min-height:50px;text-align:center;background:#fff;border-radius:14px;padding:9px 10px;font-size:14.5px;line-height:1.45;box-shadow:inset 0 0 0 1.5px var(--line)}
.say b{color:var(--red)}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;border-radius:16px;font-weight:800;border:0;font-family:var(--body);cursor:pointer;width:100%}
.gift{min-height:54px;background:var(--red);color:#fff;font-size:17px;box-shadow:0 3px 0 rgba(120,10,15,.3)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.half{min-height:48px;background:#fff;color:var(--ink);border:1.5px solid #D8D5CC;font-size:15px}
.hb{font:inherit;font-size:13px;font-weight:800;border:1.5px solid var(--line);background:#fff;border-radius:12px;min-height:44px;color:var(--ink);cursor:pointer;width:100%}
.rl{font-size:14px;line-height:1.55;color:var(--ink);background:#fff;border-radius:14px;padding:10px 12px 10px 4px;box-shadow:inset 0 0 0 1.5px #CDBF9B}
.rl ol{margin:0;padding-left:24px}.rl li{margin:3px 0}.rl b{color:#C0392B}
.pick .ok{justify-content:center;font-weight:900;background:#16181D;color:#fff;border:0}
.ghost{min-height:44px;background:transparent;color:#5A4A22;border:1.5px dashed #CDBF9B;font-size:14px}
.done{display:none;flex-direction:column;gap:10px;text-align:center}
.done.on{display:flex}
.big{font-family:var(--sign),sans-serif;font-size:28px;line-height:1.2}
.big em{font-style:normal;color:var(--red)}
.lure{margin:0;font-size:14px;color:#5A4A22}
.lure b{color:var(--red)}
.note{font-size:11.5px;color:#8A7A50;text-align:center;margin:4px 0 0}
.shopset,.tabs,.set,.ghost{display:none!important}
.dk{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))!important;gap:10px!important}
.brd{margin:0 auto}
.vs div{font-size:13px!important;padding:8px 8px!important}
.lv{font-size:10px;font-weight:800;padding:1px 6px;border-radius:999px;background:currentColor;flex:none}
.lv b{color:#fff;font-weight:800}
/* 아래 막대 — 늘 떠 있음 */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:rgba(22,24,29,.96);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
.bar div{width:100%;max-width:480px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.bar button{font:inherit;font-size:14px;font-weight:800;color:#fff;background:rgba(255,255,255,.1);border:0;border-radius:12px;min-height:48px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.bar button svg{width:18px;height:18px;fill:none;stroke:var(--yel);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
/* 상대 고르기 창 */
.pick{position:fixed;inset:0;z-index:30;background:rgba(22,24,29,.55);display:none;align-items:flex-end;justify-content:center}
.pick.on{display:flex}
.pick .sheet{width:100%;max-width:480px;background:#FFF8E6;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.pick h3{margin:0 0 4px;text-align:center;font-family:var(--brand),serif;font-weight:400;font-size:24px}
.pick button{font:inherit;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;border:1.5px solid #CDBF9B;background:#fff;cursor:pointer;text-align:left;color:var(--ink)}
.pick button b{font-size:16px}
.pick button small{display:block;color:#6B5A30;font-size:12.5px;font-weight:600}
.pick .tag{margin-left:auto;font-size:12px;font-weight:900;padding:4px 10px;border-radius:999px;color:#fff;flex:none}
.pick .who{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;flex:none}
/* 끝난 뒤 창 — 아래에서 올라옴 */
.done{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#FFF8E6;border-radius:22px 22px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.2);padding:18px 16px calc(84px + env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto}


/* ★첫째 원칙 (대표 261122): 놀이는 복고여도 화면은 산만하지 않게 — 테두리 · 음영 없음 */
button,.btn,.bt,.pk,.pick button,.say,.vs div,.vs .p,.hb,.act .spd,.rl,.card,.room,.fam a,.tabs button,.half,.two button,.set select,.shopset input,.shopset select,.sheet,.done,.cap2,.box{box-shadow:none!important;border:0!important;text-shadow:none!important}
.pick button,.pk,.hb,.half,.two button,.bt.o,.act .spd{background:#EFEAE0!important}
.say,.rl{background:#fff!important}
.vs div,.vs .p{background:#fff!important}
button:active{filter:brightness(.93)}
.bt.o[aria-pressed=true]{background:#FFC21A!important}
</style>
</head>
<body>
<div class="app">
  <div class="top"><span class="ttl">골프 · 활쏘기</span></div>
  <div class="dk">
    <div class="shopset">
      <label for="shop">상호<input id="shop" value="다복" maxlength="8"></label>

    </div>

    <!-- 퍼팅 -->
    <div class="pane on" id="pP" role="tabpanel" aria-labelledby="tP">

      <div class="set"><label for="bM">누구랑 쏠까요
        <select id="bM"><option value="cpu0">하수</option><option value="cpu1">중수</option><option value="cpu2" selected>고수</option><option value="two">친구</option></select></label></div>

  </div>
</div>

<script>

var $=function(id){return document.getElementById(id);};
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function shopName(){ return ($('shop').value.trim()||'우리 가게'); }
function opName(){ return shopName()+' '+$('ho').value; }
(function(){ try{ var v=JSON.parse(localStorage.getItem('nori-shop')||'null'); if(v){ $('shop').value=v.s||'다복'; $('ho').value='사장님'; } }catch(e){} })();
var LVNAME={}, LVTAG={}, LVN={cpu0:0,cpu1:1,cpu2:2};
function names(mode){ return mode==='two' ? ['첫째','둘째'] : ['나', LVNAME[mode] ? shopName()+' '+LVNAME[mode] : opName()]; }
function lvTag(mode){ return LVTAG[mode]||''; }
function relabel(){
  var pn=document.querySelectorAll('.pn'); for(var q2=0;q2<pn.length;q2++){ var k=pn[q2].getAttribute('data-k'); pn[q2].textContent= LVNAME[k]? shopName()+' '+LVNAME[k] : opName(); }
  var sn=document.querySelectorAll('.shopN'); for(var q=0;q<sn.length;q++){ sn[q].textContent=shopName(); }
  try{ localStorage.setItem('nori-shop',JSON.stringify({s:$('shop').value.trim(),h:$('ho').value})); }catch(e){}
  if(window.PUT){ PUT.card(); } if(window.BOW){ BOW.card(); }
}
/* 배터리 칸 눈금 — n칸 중 v칸 채움, 낮을수록 풀빛 · 높을수록 붉게 */
function cells(c,x,y,label,v,n,dir,warn){
  c.fillStyle='#fff'; c.font='800 11px "Noto Sans KR",sans-serif'; c.textAlign='left'; c.textBaseline='middle'; c.fillText(label,x,y);
  var lx=x+c.measureText(label).width+6;
  if(dir!==undefined&&dir!==null){ c.save(); c.translate(lx+7,y); c.rotate(dir); c.fillStyle='#FFC21A'; c.beginPath(); c.moveTo(7,0); c.lineTo(-4,-5); c.lineTo(-1,0); c.lineTo(-4,5); c.closePath(); c.fill(); c.restore(); lx+=18; }
  var cw=n>6?9:12, gap=2.5;
  c.strokeStyle='rgba(255,255,255,.7)'; c.lineWidth=1; c.strokeRect(lx-1.5,y-8,n*(cw+gap)+1,16);
  c.fillStyle='rgba(255,255,255,.7)'; c.fillRect(lx+n*(cw+gap),y-3.5,2.5,7);
  for(var i=0;i<n;i++){ var f=i<v, k=n>1?i/(n-1):0, col= warn ? '#E1262D' : (k<.45?'#6FD36A':(k<.75?'#FFC21A':'#FF6A3D'));
    c.fillStyle= f ? col : 'rgba(255,255,255,.14)'; c.fillRect(lx+i*(cw+gap),y-5.5,cw,11); }
  c.textBaseline='alphabetic';
  return lx+n*(cw+gap)+6;
}
/* 같은 크기 눈금 둘 — 왼쪽 반 · 오른쪽 반. heat=false 이면 한 가지 색(세기만), true 이면 풀빛→빨강(많이 당길수록) */
function gauge(c,x,y,label,frac,heat,dir,word,warn){
  var w=140, n=10, lab=40, arw=18, cw=(w-lab-arw-8)/n, gap=1.6;
  c.fillStyle='#fff'; c.font='800 11px "Noto Sans KR",sans-serif'; c.textAlign='left'; c.textBaseline='middle'; c.fillText(label,x,y);
  var ax=x+lab+arw/2;
  if(dir!==null&&dir!==undefined){ c.save(); c.translate(ax,y); c.rotate(dir); c.fillStyle='#FFC21A'; c.beginPath(); c.moveTo(8,0); c.lineTo(-5,-6); c.lineTo(-1.5,0); c.lineTo(-5,6); c.closePath(); c.fill(); c.restore(); }
  var bx=x+lab+arw, v=Math.round(Math.max(0,Math.min(1,frac))*n);
  c.strokeStyle='rgba(255,255,255,.7)'; c.lineWidth=1; c.strokeRect(bx-1.5,y-8,n*cw+1,16);
  c.fillStyle='rgba(255,255,255,.7)'; c.fillRect(bx+n*cw,y-3.5,2.5,7);
  for(var i=0;i<n;i++){ var k=i/(n-1), col= warn?'#E1262D' : (heat ? (k<.45?'#6FD36A':(k<.75?'#FFC21A':'#FF6A3D')) : '#7FC8FF');
    c.fillStyle= i<v ? col : 'rgba(255,255,255,.14)'; c.fillRect(bx+i*cw,y-5.5,cw-gap,11); }
  if(word){ c.fillStyle='rgba(255,255,255,.75)'; c.font='700 10px "Noto Sans KR",sans-serif'; c.textAlign='center'; c.fillText(word,bx+n*cw/2,y); }
  c.textBaseline='alphabetic'; c.textAlign='left';
}
/* 위 눈금 띠 — 두 줄: 윗줄은 이름, 아랫줄은 칸. 왼쪽 반 = 방향(화살표) + 세기, 오른쪽 반 = 힘 */
function cellBox(c,x,y,w,frac,heat,warn,word){

    $('bD').classList.add('on'); $('bNew').style.display='none';
  }
  function cpu(){
    if(over) return; var p=[.35,.5,.66][LVN[mode()]||0], good=Math.random()<p, x, y;
    if(good){ x=TX+(Math.random()*2-1)*TW*.4; y=TY+(Math.random()*2-1)*TH*.4; } else { var side=Math.random()<.5?-1:1; x=TX+side*(TW/2+3+Math.random()*12); y=TY+(Math.random()*2-1)*TH*.7; }
    setTimeout(function(){ BOWANG=0; launch(x-wind*7,y,1); },500);
  }
  function pt(e){ var r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*(H+HUD)-HUD}; }
  cv.addEventListener('pointerdown',function(e){ if(over||fly) return; if(who===1&&mode()!=='two') return; e.preventDefault(); cv.setPointerCapture(e.pointerId); var p=pt(e); hold=true; held0=performance.now(); base={x:p.x,y:p.y,ox:off.x,oy:off.y}; });
  cv.addEventListener('pointermove',function(e){ if(!hold) return; var p=pt(e); off.x=Math.max(-90,Math.min(90,base.ox+(p.x-base.x)*.22)); off.y=Math.max(-80,Math.min(80,base.oy+(p.y-base.y)*.22)); });
  function up(){ if(!hold) return; var s=(performance.now()-held0)/1000, sg=sight(); hold=false; if(s<.5){ say.innerHTML='조금 더 <b>당겼다가</b> 놓으세요'; return; } release(sg.x,sg.y); }
  cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',function(){ hold=false; });
  $('bM').addEventListener('change',reset); $('bNew').addEventListener('click',reset); $('bAgain').addEventListener('click',reset);
  function fit(){ ctx=fitCanvas(cv,W,H+HUD); }
  function show(v){ on=v; if(on){ fit(); if(!raf){ raf=requestAnimationFrame(loop); } } }
  window.addEventListener('resize',function(){ if(on){ fit(); } });
  reset();
  return {card:function(){ card(); vs(); }, show:show};
})();

  noriNav({here:function(){ return CUR==='putt'?'pt':'bw'; }, local:{pt:function(){ setGame('putt'); }, bw:function(){ setGame('bow'); }},
    onNew:function(){ $('pD').classList.remove('on'); $('bD').classList.remove('on'); picked[CUR]=false; openPick(); }});

})();

 golf:['공을 <b>누른 채 뒤로 당겼다(백스윙) 놓으면</b> 당긴 <b>반대쪽</b>으로 굴러갑니다. 많이 당길수록 셉니다.','위 막대의 <b>기울기 방향 · 세기</b>를 보세요. 그린이 기운 쪽으로 공이 휘니, 그만큼 <b>비껴서</b> 치세요.','그린 오른쪽 아래 <b>캐디 언니</b>가 말풍선으로 귀띔해 줍니다.','<b>나와 상대가 번갈아</b> 칩니다. 홀을 다 돌아 <b>타수가 적은 사람</b>이 이깁니다.'],

 var hp=document.getElementById('help');

 hp.addEventListener('click',function(e){ if(e.target===hp||e.target.closest('[data-x]')){ hp.classList.remove('on'); } });
