<style>
/* 그때그놀이-017 · 다복 손님용 놀이 입구(링크 하나로 바로 놂) — 016 메인 7차 바탕 — 놀이 일곱 칸(오목 · 알까기 더함) · 놀이마다 고유 소리 · 상대는 「상호 주인장」 */
:root{
  --bg:#F3F2EE; --surface:#FFFFFF; --ink:#16181D; --muted:#5E6068; --line:#E3E1DA;
  --red:#E1262D; --yel:#FFC21A; --blu:#2457D6; --org:#FF7A1A; --cream:#FBF6EA; --tile:#F7F3EA; --pale:#FFF6D9;
  --brand:"Song Myung"; --sign:"Black Han Sans";
  --body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.wrap{max-width:1240px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-right,0px)) 64px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:26px}
.strip{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--red) 0 25%,var(--yel) 25% 50%,var(--blu) 50% 75%,var(--org) 75%)}
h1{font-family:var(--sign),var(--body);font-weight:400;font-size:clamp(1.7rem,4.4vw,2.5rem);line-height:1.18;margin:0;text-wrap:balance}
h2{font-family:var(--sign),var(--body);font-weight:400;font-size:1.15rem;margin:0}
.eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.1em;color:var(--red)}
.lead{color:var(--muted);max-width:72ch;margin:0}
.small{font-size:.84rem;color:var(--muted)}
.grid3{display:grid;grid-template-columns:350px minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:760px){.grid3{grid-template-columns:1fr}.phone{margin:0 auto}}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.cap{font-size:.82rem;color:var(--muted);text-align:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card ol{margin:6px 0 0;padding-left:1.25em;display:flex;flex-direction:column;gap:6px;font-size:.91rem}
.ask{border:2px solid var(--red)}
button:focus-visible{outline:3px solid var(--blu);outline-offset:2px}

/* ── 휴대폰 공통 ── */
.phone{width:350px;max-width:100%;border:10px solid #0D0E11;border-radius:44px;background:#0D0E11;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.18)}
.scr-unused{background:#fff;color:var(--ink);height:800px;overflow-y:auto;position:relative;font-size:14px;line-height:1.5}
.top{position:sticky;top:0;z-index:5;height:56px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 10px;background:#16181D;color:#fff}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:4px;background:linear-gradient(90deg,var(--red) 0 25%,var(--yel) 25% 50%,var(--blu) 50% 75%,var(--org) 75%)}
.logo{width:42px;height:42px;flex:0 0 42px;display:block}
.ttl{flex:1;text-align:center;font-family:var(--sign),var(--body);font-size:20px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.burger,.backb{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;flex:0 0 38px;color:#fff;border:0}
svg.i{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.mq{margin-top:4px;background:var(--pale);overflow:hidden;white-space:nowrap;height:34px;display:flex;align-items:center}
.mq-in{display:inline-flex;animation:flow 22s linear infinite;padding-left:100%}
.mq span{font-size:13.5px;font-weight:500;color:#3A2E00;padding-right:26px}
.mq b{color:var(--red);font-weight:800;margin-right:5px}
.mq .tag{color:#fff;background:var(--red);border-radius:5px;padding:1px 7px;margin-right:12px;font-size:12px;font-weight:800}
@keyframes flow{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.body{padding:16px 16px 0;display:flex;flex-direction:column;gap:12px}
.brand{text-align:center;font-family:var(--brand),serif;font-size:34px;line-height:1.05;letter-spacing:.04em;color:#1C1C1C;margin:2px 0 2px}
.brand i{font-style:normal;color:var(--red)}

/* 놀이 칸 — 테두리 · 그림자 없앰, 옅은 바탕만 */
.games{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--tile);border-radius:18px;padding:10px 6px 10px;position:relative;cursor:pointer;transition:background .15s}
.g:hover{background:#F1EBDD}
.g svg.pic{width:84px;height:68px;display:block;overflow:hidden}
.g b{font-size:15px;font-weight:700;letter-spacing:-.01em}
.g .new{position:absolute;top:8px;left:9px;font-size:10.5px;font-weight:800;color:var(--red)}
.g.more{justify-content:center;background:none;border:1.5px dashed #D9D3C4}
.g.more b{font-weight:500;color:var(--muted);font-size:14px}

/* 단추 — 납작하게, 그림자는 옅게 */
.btn{display:flex;align-items:center;justify-content:center;gap:9px;border-radius:16px;font-weight:800;letter-spacing:-.01em;border:0;font-family:var(--body)}
.start{min-height:58px;background:var(--blu);color:#fff;font-size:19px;box-shadow:0 3px 0 rgba(18,40,110,.35)}
.gift{min-height:52px;background:var(--red);color:#fff;font-size:17px;box-shadow:0 3px 0 rgba(120,10,15,.3)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.half{min-height:46px;background:#fff;color:var(--ink);border:1.5px solid #D8D5CC;font-size:15px;font-weight:700}
.room{display:flex;align-items:center;gap:10px;min-height:52px;border-radius:16px;border:1.5px solid #D8D5CC;background:#fff;font-size:15.5px;font-weight:700;padding:0 12px 0 14px}
.room .ci{width:30px;height:30px;border-radius:50%;background:var(--org);color:#fff;display:grid;place-items:center;flex:0 0 30px}
.room .ci svg.i{width:15px;height:15px}
.chev{margin-left:auto;width:26px;height:26px;display:grid;place-items:center;color:var(--ink)}
.chev svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.way{display:flex;justify-content:center;gap:26px;margin-top:2px}
.way span{width:44px;height:44px;border-radius:50%;background:#16181D;color:var(--yel);display:grid;place-items:center}
.way svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.fam{display:flex;justify-content:center;gap:8px}
.fam a{display:inline-flex;align-items:center;gap:6px;padding:6px 8px 6px 7px;border:1.5px solid #E1DED5;border-radius:999px;color:#333;text-decoration:none;font-size:13px;font-weight:700;background:#fff}
.fam .fi{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff}
.fam .fi svg.i{width:12px;height:12px}
.fam .ar{width:16px;height:16px;fill:none;stroke:#555;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.lfft{margin:4px -16px 0;padding:12px 16px 16px;border-top:1px solid #EFE7DA;background:#FBF8F2;color:#9d8f80}
.lfft-brand{text-align:center;font-family:var(--brand),serif;font-size:18px;color:#1C1C1C;letter-spacing:.04em;margin-bottom:4px}
.lfft-brand i{font-style:normal;color:var(--red)}
.lfft-links{font-size:11px;line-height:1.8}
.lfft-links a{color:#9d8f80;margin-right:10px;white-space:nowrap}
.lfft-links a.pv{font-weight:700;color:#7d6f60}
.lfft-biz{font-size:9px;line-height:1.75;margin-top:3px}

/* ── 움직이는 놀이 그림 ── */
.pic *{transform-box:view-box}
/* 원판 다트: 판이 돌다 멈추고 다트가 날아와 꽂힘 */
.wh-spin{transform-origin:40px 34px;animation:whspin 3.6s cubic-bezier(.15,.7,.25,1) infinite}
@keyframes whspin{0%{transform:rotate(0)}55%{transform:rotate(600deg)}100%{transform:rotate(600deg)}}
.dart{animation:dart 3.6s ease-in infinite}
@keyframes dart{0%,40%{transform:translate(-34px,30px) rotate(-70deg);opacity:0}42%{opacity:1}48%{transform:translate(-26px,0) rotate(-45deg)}54%{transform:translate(-14px,-14px) rotate(-15deg)}60%{transform:translate(-4px,-6px) rotate(5deg)}64%{transform:translate(0,0) rotate(0);opacity:1}65%{transform:translate(1px,1px)}66%,90%{transform:translate(0,0);opacity:1}100%{opacity:0;transform:translate(0,0)}}
.hit{transform-origin:33px 26px;animation:hit 3.6s ease-out infinite;opacity:0}
@keyframes hit{0%,63%{opacity:0;transform:scale(.4)}65%{opacity:1;transform:scale(1)}74%{opacity:0;transform:scale(1.5)}100%{opacity:0}}
/* 구슬치기: 친 구슬이 굴러와 탁 — 맞은 구슬이 튕겨 나감 */
.shooter{animation:shoot 3.2s cubic-bezier(.3,.6,.4,1) infinite}
@keyframes shoot{0%{transform:translateX(-46px)}38%{transform:translateX(0)}44%{transform:translateX(-3px)}100%{transform:translateX(-3px)}}
.shooter .vane{transform-origin:28px 46px;animation:roll 3.2s linear infinite}
@keyframes roll{0%{transform:rotate(-260deg)}38%,100%{transform:rotate(0)}}
.target{animation:knock 3.2s cubic-bezier(.2,.8,.3,1) infinite}
@keyframes knock{0%,38%{transform:translateX(0)}70%,100%{transform:translateX(18px)}}
.target .vane{transform-origin:52px 46px;animation:roll2 3.2s linear infinite}
@keyframes roll2{0%,38%{transform:rotate(0)}70%,100%{transform:rotate(200deg)}}
.clack{transform-origin:40px 44px;animation:hit 3.2s ease-out infinite;animation-delay:-0.75s;opacity:0}
/* 딱지치기: 위에서 내리쳐 탁 — 밑 딱지가 뒤집힘 */
.slam{animation:slam 3.4s cubic-bezier(.55,0,.8,.4) infinite}
@keyframes slam{0%{transform:translate(8px,-10px) rotate(-14deg);opacity:0}8%{opacity:1}30%{transform:translate(2px,14px) rotate(-6deg);opacity:1}34%{transform:translate(0,20px) rotate(0);opacity:1}42%{transform:translate(-20px,22px) rotate(-18deg);opacity:1}55%,100%{transform:translate(-30px,24px) rotate(-22deg);opacity:0}}
.fr{transform-origin:42px 41px;animation:flipA 3.4s ease-in-out infinite}
.bk{transform-origin:42px 41px;animation:flipB 3.4s ease-in-out infinite}
@keyframes flipA{0%,34%{transform:scaleY(1)}44%,100%{transform:scaleY(0)}}
@keyframes flipB{0%,44%{transform:scaleY(0)}54%,92%{transform:scaleY(1)}100%{transform:scaleY(0)}}
.flipjump{animation:jump 3.4s ease-out infinite}
@keyframes jump{0%,34%{transform:translateY(0)}44%{transform:translateY(-12px)}56%,100%{transform:translateY(0)}}
.whap{transform-origin:42px 54px;animation:hit 3.4s ease-out infinite;animation-delay:-.0s;opacity:0}
/* 투호: 화살이 포물선으로 날아 퐁 — 병이 살짝 흔들림 */
.arrow{animation:arc 3.4s linear infinite}
@keyframes arc{0%{transform:translate(-40px,8px) rotate(-60deg);opacity:0}6%{opacity:1}18%{transform:translate(-28px,-14px) rotate(-30deg)}30%{transform:translate(-14px,-20px) rotate(0deg)}42%{transform:translate(-4px,-10px) rotate(25deg)}50%{transform:translate(0,0) rotate(28deg);opacity:1}52%,88%{transform:translate(0,4px) rotate(28deg);opacity:1}100%{transform:translate(0,4px) rotate(28deg);opacity:0}}
.jar{transform-origin:42px 66px;animation:wob 3.4s ease-in-out infinite}
@keyframes wob{0%,50%{transform:rotate(0)}56%{transform:rotate(-5deg)}62%{transform:rotate(4deg)}68%{transform:rotate(-2deg)}74%,100%{transform:rotate(0)}}
.pong{transform-origin:43px 22px;animation:ring 3.4s ease-out infinite;opacity:0}
@keyframes ring{0%,50%{opacity:0;transform:scale(.3)}54%{opacity:1}72%{opacity:0;transform:scale(1.6)}100%{opacity:0}}
/* 동그란 딱지: 한 장이 휙 뒤집혀 별 · 숫자가 나옴 */
.rd{transform-origin:42px 34px;animation:rdflip 3s ease-in-out infinite}
@keyframes rdflip{0%,30%{transform:scaleX(1)}40%{transform:scaleX(0)}50%,85%{transform:scaleX(1)}95%{transform:scaleX(0)}100%{transform:scaleX(1)}}
.rd-back{animation:rdb 3s steps(1) infinite}
.rd-front{animation:rdf 3s steps(1) infinite}
@keyframes rdb{0%{opacity:1}40%{opacity:0}95%{opacity:1}}
@keyframes rdf{0%{opacity:0}40%{opacity:1}95%{opacity:0}}
@media (prefers-reduced-motion:reduce){.pic *{animation:none!important}.dart,.rd-front{opacity:1!important}.hit,.clack,.whap,.pong,.rd-back{opacity:0!important}.bk{transform:scaleY(0)}.mq-in{animation:none;padding-left:0}}


a.g{color:inherit;text-decoration:none}
.g:active{transform:scale(.97)}
.topr{display:flex;gap:6px;align-items:center}
.top .logo{margin-right:40px} /* 오른쪽 단추 둘과 폭을 맞춰 가게 이름을 한가운데에 */
.top .snd{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.14);border:0;color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.top .snd[aria-pressed="false"]{color:#8C8C8C}
/* 동그란 딱지 — 딱지 세 장 부채 */
.g .fan{width:84px;height:68px;position:relative;overflow:hidden}
.g .fan span{position:absolute;left:21px;top:8px;width:42px;height:42px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}
.g .fan span.l{transform:translateX(-19px) rotate(-14deg)}
.g .fan span.r{transform:translateX(19px) rotate(14deg)}
.g .fan span.m{animation:pop 3.2s ease-in-out infinite;z-index:2}
@keyframes pop{0%,20%{transform:translateY(0) rotateY(0)}35%{transform:translateY(-7px) rotateY(90deg)}50%,85%{transform:translateY(-3px) rotateY(0)}100%{transform:translateY(0)}}
/* 딱지치기 — 연한 풀빛 · 접힌 줄만 */
.fr2{transform-origin:55px 50px;animation:flipA 3.4s ease-in-out infinite}
.bk2{transform-origin:55px 50px;animation:flipB 3.4s ease-in-out infinite}
/* 오목 — 검은 돌이 하나씩 놓여 다섯 줄 → 노랗게 빛남 */
.om{transform-box:fill-box!important;transform-origin:center;animation:omin 4s ease-out infinite both}
@keyframes omin{0%{opacity:0;transform:scale(1.7)}6%{opacity:1;transform:scale(1)}86%{opacity:1}94%,100%{opacity:0}}
.omg{animation:omg 4s ease-in-out infinite}
@keyframes omg{0%,44%{opacity:0}52%,84%{opacity:.9}94%,100%{opacity:0}}
/* 알까기 — 검은 알이 탁 쳐서 흰 알이 판 밖으로 */
.aks{animation:aks 3s cubic-bezier(.3,.7,.4,1) infinite}
@keyframes aks{0%,12%{transform:translateX(0)}36%{transform:translateX(20px)}46%,100%{transform:translateX(18px)}}
.akt{animation:akt 3s ease-out infinite}
@keyframes akt{0%,34%{transform:translate(0,0);opacity:1}62%{transform:translate(26px,-3px);opacity:1}74%{transform:translate(32px,-4px);opacity:0}100%{opacity:0}}
.akh{transform-origin:45px 38px;animation:hit 3s ease-out infinite;animation-delay:-.0s;opacity:0}
@keyframes akh{0%,34%{opacity:0;transform:scale(.4)}37%{opacity:1;transform:scale(1)}48%{opacity:0;transform:scale(1.5)}100%{opacity:0}}
.akh{animation-name:akh}
.pb{animation:pb 3.4s ease-in infinite}
@keyframes pb{0%,8%{transform:translate(0,0);opacity:1}22%{transform:translate(9px,-10px)}38%{transform:translate(24px,-20px)}52%{transform:translate(36px,-29px);opacity:1}58%{transform:translate(39px,-33px) scale(.4);opacity:0}100%{opacity:0;transform:translate(0,0)}}
.ar{animation:ar 3s cubic-bezier(.3,.6,.5,1) infinite}
@keyframes ar{0%{transform:translate(14px,62px) rotate(-38deg);opacity:0}8%{opacity:1}30%{transform:translate(30px,26px) rotate(-12deg)}48%{transform:translate(60px,30px) rotate(14deg);opacity:1}86%{transform:translate(60px,30px) rotate(14deg);opacity:1}96%,100%{opacity:0;transform:translate(60px,30px) rotate(14deg)}}
.hitb{transform-origin:59px 30px;animation:hitb 3s ease-out infinite;opacity:0}
@keyframes hitb{0%,46%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}62%{opacity:0;transform:scale(1.4)}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.pb,.ar,.hitb{animation:none!important}.hitb{opacity:0}.ar{transform:translate(60px,30px) rotate(14deg)}}
@media (prefers-reduced-motion:reduce){.g .fan span.m,.fr2,.bk2,.om,.omg,.aks,.akt,.akh{animation:none!important}.bk2{transform:scaleY(0)}.akh{opacity:0}}
.info .card b{color:var(--ink)}
.lk{color:var(--blu);font-weight:800}
.lure{text-align:center;font-family:var(--brand),serif;font-size:19px;color:#3A2E00;margin:-6px 0 2px;letter-spacing:.02em}
.lure b{font-weight:400;color:var(--red)}

html,body{margin:0;background:#E9E6DE}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:#fff;position:relative}
.app .top{padding-top:env(safe-area-inset-top,0px);box-sizing:content-box}
.app .body{padding-bottom:calc(env(safe-area-inset-bottom,0px))}
button.g{font:inherit;color:inherit;border:0;width:100%;-webkit-tap-highlight-color:transparent}
button.btn{cursor:pointer;width:100%}
a.room{color:inherit;text-decoration:none}
.fam a{white-space:nowrap}
.g .soon{position:absolute;top:8px;right:9px;font-size:10px;font-weight:800;color:#9A8E70}
.g.ready{animation:nudge .5s ease-in-out 2}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:#16181D;color:#fff;font-size:14.5px;font-weight:700;padding:11px 16px;border-radius:14px;max-width:88vw;text-align:center;opacity:0;transition:.25s;z-index:30;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.ov{position:fixed;inset:0;z-index:20;background:#F7EFD8;display:none}
