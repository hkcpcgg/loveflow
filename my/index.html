<style>

body{margin:0;font-family:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);background:linear-gradient(180deg,#EEF0F7 0%,#F6F1EA 100%);min-height:100vh;-webkit-font-smoothing:antialiased}

<script src="/my/qrcode.js?v=1"></script>
<script>
(function () {
  'use strict';
  var GAS = 'https://script.google.com/macros/s/AKfycbxLIG_LRAZD3AMJH26gPhefdkwLbXmA5ip_UurBfQ-53bxgq2T63dSre6YO9j4hxBZM1A/exec';
  var MEM_K = 'lf_my_k';
  var PART = { map: '마음 여행지도', letter: '마음 여행편지', memoir: '한 편의 기록' };
  var ICON = { map: '🗺', letter: '✉️', memoir: '✍️' };
  /* 단추 말 — [처음, 쓰는 중, 다 씀] */
  var BTN = {
    map:    ['마음 여행지도 시작하기', '마음 여행지도 이어서 하기', '마음 여행지도 결과 보기'],
    letter: ['마음 여행편지 쓰기', '마음 여행편지 쓰기', '지난 마음 여행편지 보기'],
    memoir: ['한 편의 기록 시작하기', '한 편의 기록 이어 쓰기', '쓴 글 보기']
  };
  var ORDER = ['map', 'letter', 'memoir'];
  var $ = function (id) { return document.getElementById(id); };
  var D = null, K = '';

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function ls(k, v) { try { if (v === undefined) { return localStorage.getItem(k) || ''; } localStorage.setItem(k, v); } catch (e) { } return ''; }
  function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove('on'); }, 2200); }
  function ding() {
    try {
      var C = window.AudioContext || window.webkitAudioContext; if (!C) { return; }
      var a = new C(), t = a.currentTime;
      [880, 1318.5].forEach(function (f, i) { var o = a.createOscillator(), g = a.createGain(); o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t + i * 0.12); g.gain.exponentialRampToValueAtTime(0.08, t + i * 0.12 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.12 + 0.5); o.connect(g); g.connect(a.destination); o.start(t + i * 0.12); o.stop(t + i * 0.12 + 0.55); });
    } catch (e) { }
  }

  /* ── 열쇠 — 주소(?k=) 먼저, 없으면 이 휴대폰이 기억한 것 ── */
  function keyOf() {
    var q = new URLSearchParams(location.search), k = String(q.get('k') || '').trim();
    if (/^[A-Za-z0-9]{10}$/.test(k)) { ls(MEM_K, k); return k; }
    var m = ls(MEM_K);
    if (/^[A-Za-z0-9]{10}$/.test(m)) {
      /* 주소에 열쇠를 다시 붙여 둠 — 아이폰은 「홈 화면에 추가」를 누른 그 주소로 아이콘을 만듦 */
      try { history.replaceState(null, '', '/my/?k=' + m); } catch (e) { }
      return m;
    }
    return '';
  }

  function jsonp(params, done) {
    var cb = 'lfMy' + Date.now() + Math.floor(Math.random() * 1000), fin = false, s = document.createElement('script');
    var timer = setTimeout(function () { if (fin) { return; } fin = true; cleanup(); done(null); }, 15000);
    function cleanup() { try { delete window[cb]; } catch (e) { window[cb] = undefined; } if (s.parentNode) { s.parentNode.removeChild(s); } }
    window[cb] = function (r) { if (fin) { return; } fin = true; clearTimeout(timer); cleanup(); done(r); };
    var u = GAS + '?callback=' + cb;
    for (var k in params) { u += '&' + k + '=' + encodeURIComponent(params[k]); }
    s.src = u; s.onerror = function () { if (fin) { return; } fin = true; clearTimeout(timer); cleanup(); done(null); };
    document.body.appendChild(s);
  }

  function stateBox(icon, title, text, extra) {
    $('my').innerHTML = '<div class="state"><i>' + icon + '</i><b>' + title + '</b>' + text + (extra || '') + '</div>';
  }

  function open() {
    K = keyOf();
    if (!K) {
      stateBox('🔑', '사랑흐름 여권 화면', '이 휴대폰에서 연 적이 없는 사랑흐름 여권입니다.<br>사랑흐름 여권번호로 찾으시면 바로 열립니다.',
        '<br><a class="again" href="/find/">사랑흐름 여권 찾기</a>');
      return;
    }
    jsonp({ action: 'passOpen', k: K }, function (r) {
      if (!r) {
        stateBox('📶', '연결이 잠시 늦어지고 있습니다', '조금 뒤에 다시 열어 주세요.', '<br><button type="button" class="again" id="reBtn">다시 열기</button>');
        $('reBtn').onclick = function () { $('my').innerHTML = '<div class="state"><b>사랑흐름 여권</b>사랑흐름 여권을 여는 중입니다<div class="wave"><span></span><span></span><span></span></div></div>'; open(); };
        return;
      }
      if (r.status === 'expired') {
        stateBox('🧾', '결제가 취소된 사랑흐름 여권입니다', '궁금하신 점은 아래 카카오톡 문의로 알려 주세요.');
        return;
      }
      if (r.status !== 'ok') {
        if (ls(MEM_K) === K) { try { localStorage.removeItem(MEM_K); } catch (e) { } }
        stateBox('🔑', '열리지 않는 링크입니다', '링크가 바뀌었거나 끝까지 복사되지 않았습니다.<br>사랑흐름 여권번호로 찾으시면 바로 열립니다.',
          '<br><a class="again" href="/find/">사랑흐름 여권 찾기</a>');
        return;
      }
      D = r;
      try { sessionStorage.setItem('lf_passport', r.passport); localStorage.setItem('lf_passport', r.passport); sessionStorage.setItem('lf_unlock', '1'); } catch (e) { }
      paint();
    });
  }

  /* ── 그리기 ── */
  function has(k) { return D.parts && D.parts[k] > 0; }
  function stage(k) { var u = D.used[k] || 0, g = D.parts[k] || 0; return u === 0 ? 0 : (u < g ? 1 : 2); }
  function gusText() {
    var out = [];
    ORDER.forEach(function (k) { if (has(k)) { out.push(PART[k] + ' ' + D.parts[k] + '편'); } });
    return out.join(' · ');
  }
  function journeyName() {
    var m = has('map'), l = has('letter'), r = has('memoir');
    if (m && l && r) { return '두 분의 여정'; }
    if (m && l) { return '마음여행'; }
    if (m && !l && !r) { return '마음 여행지도'; }
    if (r && !m && !l) { return '한 편의 기록'; }
    if (l && !m && !r) { return '마음 여행편지'; }
    return '사랑흐름 여행';
  }
  function giftLine() {
    if (!D.from || !D.from.length) { return ''; }
    var f = D.from[0], n = (f.tog && f.tog.length) ? ' 외 ' + f.tog.length + '분' : '';
    return f.giver ? f.giver + ' 님' + n : '';
  }

  function paint() {
    var h = '';
    h += '<div class="passWrap rise" id="pw"><canvas id="cv" width="1080" height="1880" role="img" aria-label="사랑흐름 여권"></canvas><div class="shine"></div></div>';
    h += '<div class="main" id="mainBtns">';
    var first = true, any = false;
    ORDER.forEach(function (k) {
      if (!has(k)) { return; }
      any = true;
      var st = stage(k), left = D.left[k] || 0;
      var line = (st === 2) ? PART[k] + ' ' + D.parts[k] + '편 다 씀' : PART[k] + ' ' + left + '편 남음';
      var cls = (st === 2) ? 'doneBtn' : (first ? 'bigBtn' : 'subBtn');
      if (st !== 2) { first = false; }
      h += '<button type="button" class="partBtn ' + cls + '" data-k="' + k + '" data-st="' + st + '">' + ICON[k] + ' ' + BTN[k][st] + '<span class="left">' + line + '</span></button>';
    });
    if (!any) { h += '<div class="memo">이 사랑흐름 여권에 담긴 여행을 아직 찾지 못했습니다. 아래 카카오톡 문의로 알려 주시면 바로 확인해 드립니다.</div>'; }
    h += '</div>';

    var gl = giftLine(), lts = D.letters || [];
    if (gl || lts.length) {
      h += '<div class="zone">' + (lts.length ? '✉️ 지난 마음 여행편지 ' + lts.length + '편' : '🎁 받은 선물') + '</div>';
      if (lts.length) {
        h += '<div class="letters" id="letters">';
        lts.forEach(function (L, i) {
          var d = L.d ? L.d.slice(5).replace('-', '.') : '';
          h += '<div class="lt" data-i="' + i + '"><button type="button"><span>' + esc(L.to ? L.to : '마음 여행편지') + '</span><em>' + esc(d) + ' ›</em></button><div class="body">' + esc(L.text) + '</div></div>';
        });
        h += '</div>';
      }
      if (gl) { h += '<div class="fromGift">🎁 ' + esc(gl) + '이 보낸 선물입니다</div>'; }
    }

    h += '<div class="zone">📲 이 휴대폰에 두기</div>';
    h += '<div class="tools">'
      + '<button type="button" class="tool" id="tHome"><i>📲</i>홈 화면에<br>추가</button>'
      + '<button type="button" class="tool" id="tSelf"><i>💬</i>나에게<br>보내기</button>'
      + '<button type="button" class="tool" id="tImg"><i>🖼</i>이미지<br>저장</button>'
      + '<button type="button" class="tool" id="tCopy"><i>📋</i>사랑흐름<br>여권번호 복사</button>'
      + '</div>';
    h += '<div class="memo">사랑흐름 여권번호를 외우지 않으셔도 됩니다.<br>「홈 화면에 추가」를 누르시면 휴대폰 첫 화면에 사랑흐름 아이콘이 생깁니다.</div>';
    $('my').innerHTML = h;

    var drawNow = function () { drawPass($('cv')); };
    try { if (document.fonts && document.fonts.load) { Promise.all([document.fonts.load("800 70px 'Nanum Myeongjo'"), document.fonts.load("800 40px 'Noto Sans KR'"), document.fonts.load("500 22px 'Noto Sans KR'")]).then(drawNow, drawNow); setTimeout(drawNow, 2500); } else { drawNow(); } } catch (e) { drawNow(); }
    drawNow();
    ding();

    Array.prototype.forEach.call(document.querySelectorAll('.partBtn'), function (b) { b.onclick = function () { goPart(b.getAttribute('data-k'), Number(b.getAttribute('data-st'))); }; });
    Array.prototype.forEach.call(document.querySelectorAll('.lt>button'), function (b) { b.onclick = function () { b.parentNode.classList.toggle('on'); }; });
    $('tHome').onclick = homeAdd; $('tSelf').onclick = sendSelf; $('tImg').onclick = saveImg; $('tCopy').onclick = copyNo;
  }

  function goPart(k, st) {
    var pp = encodeURIComponent(D.passport);
    if (k === 'map')    { location.href = (st === 2) ? '/journey/result.html?id=' + pp : '/journey/?id=' + pp; return; }
    if (k === 'letter') {
      if (st === 2 && $('letters')) { $('letters').scrollIntoView({ behavior: 'smooth', block: 'start' }); var f = $('letters').querySelector('.lt'); if (f) { f.classList.add('on'); } return; }
      location.href = '/letter/?id=' + pp; return;
    }
    if (k === 'memoir') { location.href = (st === 2) ? '/memoir/book.html?id=' + pp : '/memoir/home.html?id=' + pp; }
  }

  /* ── ③ 부가 ── */
  function myUrl() { return location.origin + '/my/?k=' + K; }
