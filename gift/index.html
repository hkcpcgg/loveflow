<!-- (이전) gift/index.html · v1 · 261111 · [공사 칸 ⑤ · 대표 OK 261111 17:07 「개인 간 소통에 간섭하지 말 것 · 복잡한 것 빼기」] 새 화면 — 선물함(보내는 분만 · 받는 분께 링크를 보내는 곳 하나).
     · 여는 길: 결제 화면이 결제 뒤 /gift/?no=G-0000&k=열쇠 로 보냄 → 이 휴대폰이 기억(lf_gift_boxes) → 다시 열면 그대로.
       다른 기기 · 기억이 없으면 「카카오 로그인 · 내 선물함」(588 리다이렉트 URI https://www.loveflow.ai.kr/gift/ · https://loveflow.ai.kr/gift/).
     · 보이는 것: 상품 · 편 · 몇 분께 한 줄 → [1번 선물 보내기] … (카카오톡으로 보내기 · 보낼 글 복사). 누른 단추는 이 휴대폰에서만 「보냄」.
     · ★두지 않는 것(대표 17:00): 받음 · 받기 전 · 받지 않음 표시 · 진행 막대 · 받는 분 답 · 마음 더하기 확인 · 링크 다시 만들기 · 선물 내역 · 견적서.
       받았는지는 서버 기록으로만(환불 판단 · 본부) — 화면에 띄우지 않음.
     · 계좌이체: 입금 전이면 「입금을 확인하고 있습니다」 + [입금 확인하기](giftPaid) — 본부에서 입금확인하면 보내기 단추가 열림.
     · 서버 = 개인 계정 「사랑흐름 유료여행지도」(…xBZM1A) ⑦ gift.gs v5 — giftBox · giftPaid · giftKakao(서버 고침 없음). -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>선물함 · 사랑흐름</title>
<meta name="theme-color" content="#1E4A76">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1E4A76;--night:#0E1736;--ink:#1E2A3A;--sub:#6B6680;--line:#E4DFEE;--violet:#8A6FC9}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);background:linear-gradient(180deg,#EEF0F7 0%,#F6F1EA 100%);min-height:100vh;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:480px;margin:0 auto;padding:16px 14px 40px}
.state{text-align:center;padding:48px 18px;color:var(--sub);font-size:15px;line-height:1.7}
.state i{display:block;font-style:normal;font-size:40px;margin-bottom:8px}
.state b{display:block;color:var(--night);font-size:17px;margin-bottom:4px}
.wave{display:inline-flex;gap:6px;margin-top:12px}
.wave span{width:8px;height:8px;border-radius:50%;background:var(--violet);animation:wv 1.1s infinite ease-in-out}
.wave span:nth-child(2){animation-delay:.15s}.wave span:nth-child(3){animation-delay:.3s}
@keyframes wv{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-7px);opacity:1}}
.head{text-align:center;background:linear-gradient(140deg,#0E1736,#2A2370 65%,#3B2F72);color:#fff;border-radius:18px;padding:20px 14px 16px;position:relative;overflow:hidden;box-shadow:0 10px 24px rgba(14,23,54,.25)}
.head:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,#7FE3D6,#8A6FC9,#E6A9C8,#F3E3B5)}
.head i{display:block;font-style:normal;font-size:34px}
.head b{display:block;font-family:'Nanum Myeongjo',serif;font-size:20px;color:#F3E3B5;margin-top:4px;line-height:1.45;word-break:keep-all}
.head span{display:block;font-size:12.5px;margin-top:6px;color:#CFC9EA}
.sample{display:inline-block;margin-top:8px;background:#B8323A;color:#fff;font-size:12px;font-weight:800;border-radius:999px;padding:3px 12px}
.zone{font-size:12px;font-weight:800;color:#5B4A9A;letter-spacing:.3px;margin:20px 2px 8px}
.wait{background:#fff;border:1.5px solid #D9D0F0;border-radius:16px;padding:16px 14px;text-align:center;font-size:15px;line-height:1.6;color:var(--night);word-break:keep-all}
.sends{display:flex;flex-direction:column;gap:10px}
.send{display:flex;align-items:center;gap:10px;width:100%;border:1.5px solid #CFC6E8;background:#fff;color:#3B2F72;border-radius:16px;padding:14px;font-size:16.5px;font-weight:800;text-align:left}
.send .n{flex:none;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#2A2370,#1E4A76);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center}
.send .t{flex:1;min-width:0}
.send em{font-style:normal;font-size:12px;font-weight:800;color:#1D9E75;background:#E3F5EE;border-radius:999px;padding:3px 10px;flex:none}
.send.first{border:0;color:#fff;background:linear-gradient(135deg,#2A2370,#1E4A76 55%,#2C6E8F);box-shadow:0 8px 20px rgba(30,74,118,.28)}
.send.first .n{background:rgba(255,255,255,.18)}
.send.first em{background:rgba(255,255,255,.2);color:#fff}
.send[disabled]{opacity:.55}
.list{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.list a,.list button{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px;border:0;border-bottom:1px solid #F0ECF5;background:#fff;font-size:15px;color:var(--ink);text-decoration:none;text-align:left}
.list a:last-child,.list button:last-child{border-bottom:0}
.list em{font-style:normal;color:#A39DB8}
.mine{display:flex;flex-direction:column;gap:8px}
.mine button{display:flex;justify-content:space-between;align-items:center;width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 14px;font-size:15px;color:var(--ink);text-align:left}
.mine small{display:block;color:var(--sub);font-size:12.5px;margin-top:2px}
.kakao{display:block;width:100%;margin-top:14px;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:800;background:#FEE500;color:#191600}
.again{display:inline-block;margin-top:14px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);border-radius:14px;padding:11px 18px;font-size:15px;font-weight:700;text-decoration:none}
.dim{position:fixed;inset:0;background:rgba(14,23,54,.45);z-index:2147483000;display:none}
.dim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:2147483001;background:#fff;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto;transform:translateY(105%);transition:transform .25s}
.sheet.on{transform:none}
.sheet h3{margin:0 0 10px;font-size:17px;text-align:center;color:var(--night)}
.sheet .msg{background:#F7F4FF;border:1px solid #E2DAF7;border-radius:14px;padding:12px 14px;font-size:14.5px;line-height:1.7;white-space:pre-wrap;word-break:break-all;color:#3B2F72}
.sheet .sub{display:block;width:100%;margin-top:8px;border:1.5px solid #CFC6E8;background:#fff;color:#3B2F72;border-radius:14px;padding:13px;font-size:15px;font-weight:700}
.sheet .x{display:block;width:100%;margin-top:8px;border:0;background:none;color:var(--sub);font-size:14px;padding:8px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);background:rgba(14,23,54,.92);color:#fff;font-size:14px;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:2147483100;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body data-lf-title="선물함">
<div class="wrap" id="box">
  <div class="state"><b>선물함</b>선물함을 여는 중입니다<div class="wave"><span></span><span></span><span></span></div></div>
</div>
<div id="lfFoot"></div>
<div class="dim" id="dim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';
  var GAS = 'https://script.google.com/macros/s/AKfycbxLIG_LRAZD3AMJH26gPhefdkwLbXmA5ip_UurBfQ-53bxgq2T63dSre6YO9j4hxBZM1A/exec';
  var KAKAO_REST = 'fe792945db813c2a38cacfbe273cba8d';
  var HERE = 'https://' + (location.host === 'loveflow.ai.kr' ? 'loveflow.ai.kr' : 'www.loveflow.ai.kr') + '/gift/';
  var MEM = 'lf_gift_boxes', SENT = 'lf_gift_sent', KK = 'lf_gift_kk';
  var $ = function (id) { return document.getElementById(id); };
  var B = null, NO = '', K = '';

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function lsSet(k, v) { try { if (v === null) { localStorage.removeItem(k); } else { localStorage.setItem(k, v); } } catch (e) { } }
  function lsJson(k, def) { try { var v = JSON.parse(lsGet(k) || 'null'); return v || def; } catch (e) { return def; } }
  function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove('on'); }, 2400); }
  function jsonp(params, done, wait) {
    var cb = 'lfGb' + Date.now() + Math.floor(Math.random() * 1000), fin = false, s = document.createElement('script');
    var timer = setTimeout(function () { if (fin) { return; } fin = true; cleanup(); done(null); }, wait || 20000);
    function cleanup() { try { delete window[cb]; } catch (e) { window[cb] = undefined; } if (s.parentNode) { s.parentNode.removeChild(s); } }
    window[cb] = function (r) { if (fin) { return; } fin = true; clearTimeout(timer); cleanup(); done(r); };
    var u = GAS + '?callback=' + cb;
    for (var k in params) { u += '&' + k + '=' + encodeURIComponent(params[k]); }
    s.src = u; s.onerror = function () { if (fin) { return; } fin = true; clearTimeout(timer); cleanup(); done(null); };
    document.body.appendChild(s);
  }
  function okNo(v) { return /^G-\d{4,}$/.test(v); }
  function okK(v) { return /^[A-Za-z0-9]{12}$/.test(v); }

  /* ── 이 휴대폰이 기억하는 선물함 (가장 최근이 앞) ── */
  function remember(no, k) {
    var a = lsJson(MEM, []).filter(function (x) { return x && x.no !== no; });
    a.unshift({ no: no, k: k });
    lsSet(MEM, JSON.stringify(a.slice(0, 30)));
  }
  function sentMap() { return lsJson(SENT, {}); }
  function markSent(no, n) { var m = sentMap(); m[no + '-' + n] = 1; lsSet(SENT, JSON.stringify(m)); }

  function state(icon, title, text, extra) {
    $('box').innerHTML = '<div class="state"><i>' + icon + '</i><b>' + title + '</b>' + text + (extra || '') + '</div>';
  }
  function loading(t) { $('box').innerHTML = '<div class="state"><b>선물함</b>' + t + '<div class="wave"><span></span><span></span><span></span></div></div>'; }

  /* ── 카카오 로그인 · 내 선물함 ── */
  function kakao() {
    lsSet(KK, (NO && K) ? NO + '|' + K : '-');
    location.href = 'https://kauth.kakao.com/oauth/authorize?client_id=' + KAKAO_REST + '&redirect_uri=' + encodeURIComponent(HERE) + '&response_type=code&state=gift&scope=profile_nickname';
  }
  function kakaoBack(code) {
    loading('내 선물함을 여는 중입니다');
    var kk = lsGet(KK), no = '', k = '';
    if (kk && kk.indexOf('|') > 0) { no = kk.split('|')[0]; k = kk.split('|')[1]; }
    lsSet(KK, null);
    try { history.replaceState(null, '', '/gift/'); } catch (e) { }
    jsonp({ action: 'giftKakao', code: code, redirect: HERE, no: no, k: k }, function (r) {
      if (!r || r.status !== 'ok') {
        state('🗂', '카카오 로그인을 다시 해 주세요', (r && r.msg) ? esc(r.msg) : '연결이 잠시 늦어지고 있습니다.', '<button type="button" class="kakao" id="kBtn">카카오 로그인 · 내 선물함</button>');
        $('kBtn').onclick = kakao; return;
      }
      mine(r.list || []);
    });
  }
  function mine(list) {
    list = list.filter(function (x) { return x.kind !== '구매'; });
    if (!list.length) {
      state('🗂', '내 선물함', '이 카카오 계정으로 이어 둔 선물이 아직 없습니다.<br>선물을 결제하신 휴대폰에서 선물함을 연 뒤 「내 선물함」을 누르시면 이어집니다.',
        '<br><a class="again" href="/pay.html?mode=gift">🎁 선물하기</a>');
      return;
    }
    var h = '<div class="head"><i>🗂</i><b>내 선물함</b><span>보내신 선물 ' + list.length + '건</span></div><div class="zone">🎁 보내신 선물</div><div class="mine">';
    list.forEach(function (x, i) {
      h += '<button type="button" data-i="' + i + '"><span>' + esc(x.itemName) + ' · ' + x.count + '명<small>' + esc(x.made) + (x.state === '결제 전' ? ' · 입금 확인 중' : '') + '</small></span><em style="font-style:normal;color:#A39DB8">›</em></button>';
    });
    h += '</div>';
    $('box').innerHTML = h;
    Array.prototype.forEach.call(document.querySelectorAll('.mine button'), function (b) {
      b.onclick = function () { var x = list[Number(b.getAttribute('data-i'))]; remember(x.no, x.k); go(x.no, x.k); };
    });
  }

  /* ── 선물함 하나 ── */
  function go(no, k) {
    NO = no; K = k;
    try { history.replaceState(null, '', '/gift/?no=' + encodeURIComponent(no) + '&k=' + encodeURIComponent(k)); } catch (e) { }
    loading('선물함을 여는 중입니다');
    jsonp({ action: 'giftBox', no: no, k: k }, function (r) {
      if (!r) {
        state('📶', '연결이 잠시 늦어지고 있습니다', '조금 뒤에 다시 열어 주세요.', '<br><button type="button" class="again" id="re">다시 열기</button>');
        $('re').onclick = function () { go(no, k); }; return;
      }
      if (r.status !== 'ok') {
        state('🗂', '선물함을 열 수 없습니다', '카카오 로그인으로 「내 선물함」을 열어 주세요.', '<button type="button" class="kakao" id="kBtn">카카오 로그인 · 내 선물함</button>');
        $('kBtn').onclick = function () { NO = ''; K = ''; kakao(); }; return;
      }
      B = r; remember(no, k); paint();
    });
  }
  function names() {
    var ns = [B.giver].concat(B.tog || []).filter(function (x) { return String(x || '').trim(); });
    if (!ns.length) { return ''; }
    return ns.length <= 3 ? ns.join(' · ') + ' 님' : ns.slice(0, 3).join(' · ') + ' 님 외 ' + (ns.length - 3) + '분';
  }
  function giftWord() { var ns = [B.giver].concat(B.tog || []).filter(function (x) { return String(x || '').trim(); }); return ns.length > 1 ? '이 함께 선물하신' : '이 선물하신'; }
  function paint() {
    var h = '<div class="head"><i>🎁</i><b>' + esc(B.itemName) + ' · ' + B.pyeon + '편씩 · ' + B.count + '명</b>'
      + '<span>선물 번호 ' + esc(B.no) + ' · ' + esc(B.made) + '</span>'
      + (B.state === '견본' ? '<span class="sample">견본</span>' : '') + '</div>';
    var open = (B.state === '확정' || B.state === '견본');
    if (!open) {
      if (B.way === '계좌') {
        h += '<div class="zone">🏦 입금</div><div class="wait">입금을 확인하고 있습니다.<br>확인되면 받는 분께 보내실 수 있습니다.'
          + '<button type="button" class="kakao" style="background:linear-gradient(135deg,#2A2370,#1E4A76);color:#fff" id="paidBtn">입금 확인하기</button></div>';
      } else {
        h += '<div class="zone">💳 결제</div><div class="wait">결제가 확인되지 않은 선물입니다.<br>카드에서 돈이 나갔다면 아래 카카오톡 문의로 알려 주세요.</div>';
      }
    } else {
      var sm = sentMap(), first = true;
      h += '<div class="zone">🎁 받는 분께 보내기</div><div class="sends">';
      (B.rows || []).forEach(function (x) {
        var sent = !!sm[B.no + '-' + x.n] || !x.key;
        var label = x.name ? x.name + ' 님께 선물 보내기' : x.n + '번 선물 보내기';
        var cls = (!sent && first) ? 'send first' : 'send';
        if (!sent) { first = false; }
        h += '<button type="button" class="' + cls + '" data-n="' + x.n + '"' + (x.key ? '' : ' disabled') + '><span class="n">' + x.n + '</span><span class="t">' + esc(label) + '</span>' + (sent ? '<em>보냄</em>' : '') + '</button>';
      });
      h += '</div>';
    }
    h += '<div class="list">'
      + '<button type="button" id="mineBtn"><span>🗂 내 선물함 · 보낸 선물 모두 보기</span><em>›</em></button>'
      + '<a href="/pay.html?mode=gift"><span>🎁 다른 분께 선물하기</span><em>›</em></a>'
      + '</div>';
    $('box').innerHTML = h;
    Array.prototype.forEach.call(document.querySelectorAll('.send'), function (b) { b.onclick = function () { sendSheet(Number(b.getAttribute('data-n'))); }; });
    if ($('paidBtn')) {
      $('paidBtn').onclick = function () {
        var pb = $('paidBtn'); pb.disabled = true; pb.textContent = '확인하는 중입니다…';
        jsonp({ action: 'giftPaid', no: B.no }, function (r) {
          pb.disabled = false; pb.textContent = '입금 확인하기';
          if (r && r.status === 'ok') { go(NO, K); return; }
          toast('아직 입금이 확인되지 않았습니다');
        });
      };
    }
    $('mineBtn').onclick = kakao;
  }

  /* ── 보내기 ── */
  function rowOf(n) { for (var i = 0; i < B.rows.length; i++) { if (B.rows[i].n === n) { return B.rows[i]; } } return null; }
  function giftText(x) {
    var u = location.origin.replace(/^http:\/\/(localhost|127\.0\.0\.1)[^/]*/, 'https://www.loveflow.ai.kr') + '/g/?t=' + x.key;
    return '[사랑흐름] ' + (x.name ? x.name + ' 님께 ' : '') + '선물이 도착했습니다.\n'
      + (names() ? names() + giftWord() + ' 사랑흐름 여권입니다.\n' : '')
      + '아래 링크를 누르시면 선물이 열립니다.\n' + u;
  }
  function closeSheet() { $('dim').classList.remove('on'); $('sheet').classList.remove('on'); }
  $('dim').onclick = closeSheet;
  function copyText(t, ok) {
    function fb() { var a = document.createElement('textarea'); a.value = t; a.setAttribute('readonly', ''); a.style.cssText = 'position:fixed;left:-9999px;top:-9999px'; document.body.appendChild(a); a.select(); var r = false; try { r = document.execCommand('copy'); } catch (e) { } document.body.removeChild(a); toast(r ? ok : '글을 길게 눌러 복사해 주세요'); }
    try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(t).then(function () { toast(ok); }, fb); } else { fb(); } } catch (e) { fb(); }
  }
  function sendSheet(n) {
    var x = rowOf(n); if (!x || !x.key) { return; }
    var m = giftText(x);
    $('sheet').innerHTML = '<h3>🎁 ' + esc(x.name ? x.name + ' 님께' : n + '번 선물') + ' 보내기</h3>'
      + '<div class="msg">' + esc(m) + '</div>'
      + '<button type="button" class="kakao" id="shareBtn">카카오톡으로 보내기</button>'
      + '<button type="button" class="sub" id="copyBtn">보낼 글 복사</button>'
      + '<button type="button" class="x" id="xBtn">닫기</button>';
    $('dim').classList.add('on'); $('sheet').classList.add('on');
    $('xBtn').onclick = closeSheet;
    $('copyBtn').onclick = function () { copyText(m, '보낼 글을 복사했습니다 · 카카오톡에 붙여 넣으세요'); markSent(B.no, n); paint(); };
    $('shareBtn').onclick = function () {
      markSent(B.no, n);
      if (navigator.share) {
        navigator.share({ text: m })['catch'](function () { });
        closeSheet(); paint(); return;
      }
      copyText(m, '보낼 글을 복사했습니다 · 카카오톡에 붙여 넣으세요'); paint();
    };
  }

  /* ── 시작 ── */
  function boot() {
    var q = new URLSearchParams(location.search);
    var code = q.get('code'), no = String(q.get('no') || '').trim().toUpperCase(), k = String(q.get('k') || '').trim();
    if (code) { kakaoBack(code); return; }
    if (q.get('error')) { try { history.replaceState(null, '', '/gift/'); } catch (e) { } }
    if (okNo(no) && okK(k)) { go(no, k); return; }
    var a = lsJson(MEM, []);
    if (a.length && okNo(a[0].no) && okK(a[0].k)) { go(a[0].no, a[0].k); return; }
    state('🗂', '선물함', '보내신 선물은 카카오 로그인으로 여실 수 있습니다.', '<button type="button" class="kakao" id="kBtn">카카오 로그인 · 내 선물함</button><br><a class="again" href="/pay.html?mode=gift">🎁 선물하기</a>');
    $('kBtn').onclick = kakao;
  }
  window.LF_GIFT = { boot: boot, data: function () { return B; } };   /* 견본 시험용 */
  boot();
})();
</script>
