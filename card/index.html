*{margin:0;padding:0;box-sizing:border-box}
img{max-width:100%;height:auto;display:block}
body{font-family:'Noto Sans KR',sans-serif;background:linear-gradient(#10294a,#1d4a6e 45%,#2c5f86);color:#2b2321;min-height:100vh;display:flex;flex-direction:column}

.lf-menu.open{transform:translateX(0)}
.lf-menu-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:#163A5C;margin-bottom:6px}
.lf-menu-head .t{color:#fff;font-weight:800;font-size:15px}
.lf-menu-close{background:none;border:none;font-size:24px;color:#fff;cursor:pointer;line-height:1;font-family:inherit}

.lang{width:max-content;margin:0 auto 18px;display:flex;background:rgba(255,255,255,.92);border-radius:999px;padding:3px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.lang button{border:0;background:none;font:600 13px 'Noto Sans KR',sans-serif;padding:7px 14px;border-radius:999px;color:#555;cursor:pointer}
.lang button.on{background:#b3242c;color:#fff}

.state{text-align:center;color:#eef4fa;padding:70px 10px;font-size:16px;line-height:1.8}
.state .big{font-family:'Gowun Batang',serif;font-size:22px;font-weight:700;margin-bottom:8px}
.state a{color:#ffd98a;font-weight:600;text-decoration:none}
.dot{display:inline-block;animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}

/* 봉투 */
.env{position:relative;max-width:460px;margin:0 auto;aspect-ratio:1.3/1;cursor:pointer;perspective:1200px;transition:transform .5s ease,opacity .5s ease}
.env .back{position:absolute;inset:0;background:linear-gradient(135deg,#c2313a,#8e1b24);border-radius:16px;box-shadow:0 18px 40px rgba(0,0,0,.4)}
.env .flap{position:absolute;left:0;right:0;top:0;height:58%;transform-origin:top;transition:transform .9s ease,opacity .35s ease .55s;z-index:3}
.env .flap svg{width:100%;height:100%;display:block}
.env .front{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 20px 24px;color:#fff;text-align:center}
.env .seal{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:radial-gradient(#e7c873,#b88a2c);display:grid;place-items:center;font-size:26px;z-index:4;box-shadow:0 3px 8px rgba(0,0,0,.35);transition:opacity .4s}
.env .whom{font-family:'Gowun Batang',serif;font-size:21px;font-weight:700;word-break:keep-all}
.env .from{font-size:14px;opacity:.92;margin-top:4px}
.env .hint{font-size:13px;margin-top:10px;background:rgba(255,255,255,.2);padding:5px 14px;border-radius:999px}
.env.open .flap{transform:rotateX(180deg);opacity:0}
.env.open .seal{opacity:0}
.env.gone{transform:translateY(-12px) scale(.96);opacity:0;pointer-events:none;position:absolute;left:16px;right:16px}

.cardwrap{opacity:0;transform:translateY(18px);transition:opacity .8s ease,transform .8s ease}
.cardwrap.show{opacity:1;transform:none}
.frame{padding:10px;border-radius:20px;background:repeating-linear-gradient(45deg,#c62b34 0 14px,#fff 14px 28px);max-width:460px;margin:0 auto;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.frame.plain{background:linear-gradient(135deg,#f6dc8e,#b8862b 40%,#f3d27a 60%,#a97721);padding:6px}

.pic.hp{height:auto}
.snow i{position:absolute;top:-10px;width:5px;height:5px;border-radius:50%;background:#fff;opacity:.8;animation:fall linear infinite}@keyframes fall{to{transform:translateY(300px)}}
.tw{animation:tw 1.6s ease-in-out infinite}.tw2{animation:tw 1.6s ease-in-out .8s infinite}@keyframes tw{50%{opacity:.25}}

.pic img{width:100%}

.pic .art small{display:block;font-size:15px;color:#1f5a3c}
.pic .wait{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:13px;color:#5b6b7b}
.body{padding:22px 22px 18px}

.hand{max-height:56px;width:auto;display:inline-block;vertical-align:middle}
.msg{font-family:'Gowun Batang',serif;font-size:17px;line-height:1.85;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.endhand{margin-top:12px}

.sign .hand{max-height:64px;margin-left:auto;display:block}
.date{text-align:right;font-size:13.5px;color:#5b6273;margin-top:8px;line-height:1.6}
.voice{display:flex;align-items:center;gap:10px;width:100%;margin-top:16px;background:#fff3e6;border:1.5px solid #f0d2b4;border-radius:14px;padding:12px 14px;font:600 15px 'Noto Sans KR',sans-serif;color:#7d1520;cursor:pointer;text-align:left}
.voice .ic{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#b3242c;color:#fff;font-size:15px;flex-shrink:0}
.btns{display:flex;flex-direction:column;gap:9px;margin-top:18px}
.btn{display:block;width:100%;text-align:center;text-decoration:none;font:600 16px 'Noto Sans KR',sans-serif;border-radius:12px;padding:13px;border:0;cursor:pointer}
.btn.main{background:#b3242c;color:#fff}
.btn.sub{background:#fff;color:#7d1520;border:1.5px solid #e4cfc2}
.cfoot{border-top:1px dashed #eadfce;margin-top:18px;padding-top:12px;text-align:center;font-size:13px;color:#8a7a6a;line-height:1.7}
.cfoot a{color:#7d1520;font-weight:600;text-decoration:none}
.rep{display:inline-block;margin-top:6px;background:none;border:0;color:#b5a796;font:12px 'Noto Sans KR',sans-serif;cursor:pointer;padding:4px 8px}
.tour{max-width:460px;margin:18px auto 0;background:rgba(255,255,255,.94);border-radius:16px;padding:12px 14px 6px;box-shadow:0 8px 22px rgba(0,0,0,.22)}.tour .tt{font-size:13px;font-weight:700;color:#8a7a6a;text-align:center;margin-bottom:4px}.tour a{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid #f0e7da;text-decoration:none;color:#2b2321;font-size:15px;font-weight:600}.tour a:first-of-type{border-top:0}.tour a .i{font-size:18px}.tour a b{margin-left:auto;color:#b5a796}
.mine{margin:14px auto 0;max-width:460px;background:rgba(255,255,255,.14);color:#fff;border-radius:14px;padding:12px 16px;font-size:14px;line-height:1.7;text-align:center}

/* 바닥 시트 */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1650;display:none;align-items:flex-end;justify-content:center}

.sheet{background:#fff;width:100%;max-width:500px;border-radius:20px 20px 0 0;padding:22px 20px calc(26px + env(safe-area-inset-bottom))}

.sheet textarea{width:100%;margin-top:12px;border:1.5px solid #ddd;border-radius:12px;padding:12px;font:15px 'Noto Sans KR',sans-serif;min-height:90px;resize:vertical}
.sheet .row{display:flex;gap:10px;margin-top:16px}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.3s;z-index:1660;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
#lfFoot{position:relative;z-index:1}
</style>

var L = 'ko'; try{ if(localStorage.getItem('lfCardLang')==='en') L='en'; }catch(e){}
function t(k){ return T[L][k]; }
function $(id){ return document.getElementById(id); }
function paintLang(){
  document.documentElement.lang = L;
  document.querySelectorAll('[data-t]').forEach(function(e){ var v=T[L][e.dataset.t]; if(typeof v==='string') e.textContent=v; });
  document.querySelectorAll('[data-tp]').forEach(function(e){ e.placeholder=T[L][e.dataset.tp]; });
  document.querySelectorAll('.lang button').forEach(function(b){ b.classList.toggle('on', b.dataset.l===L); });
  if (window.__card) { fillCard(window.__card, true); }
  if (window.__state) { showState(window.__state); }
}
document.querySelectorAll('.lang button').forEach(function(b){ b.addEventListener('click', function(){ L=b.dataset.l; try{localStorage.setItem('lfCardLang',L);}catch(e){} paintLang(); }); });

function toast(m){ var el=$('toast'); el.textContent=m; el.classList.add('on'); clearTimeout(el.__h); el.__h=setTimeout(function(){el.classList.remove('on');},2600); }

function showState(code){
  window.__state = code;
  $('load').style.display='none'; $('envBox').style.display='none'; $('cardWrap').style.display='none';
  var map = {none:['none','noneP'],hidden:['hidden','hiddenP'],expired:['expired','expiredP'],err:['err','errP'],make:['make','makeP']};
  var m = map[code] || map.err, box = $('err');
  box.innerHTML=''; var big=document.createElement('div'); big.className='big'; big.textContent=t(m[0]);
  var p=document.createElement('div'); p.textContent=t(m[1]);
  var a=document.createElement('a'); a.href='/'; a.textContent=t('goHome'); a.style.display='inline-block'; a.style.marginTop='14px';
  box.appendChild(big); box.appendChild(p); box.appendChild(a); box.style.display='block';
}

/* 보내는 분 기기에 남은 고침열쇠 (만들기 화면이 저장할 때 lfCardKeys 에 넣음) */
function myKey(c){ try{ var o=JSON.parse(localStorage.getItem('lfCardKeys')||'{}'); return o[c]||''; }catch(e){ return ''; } }

var Q = new URLSearchParams(location.search), CID = (Q.get('c')||'').trim(), PV = Q.get('pv')==='1';

function api(params){
  var u = CARD_API + '?' + Object.keys(params).map(function(k){ return k+'='+encodeURIComponent(params[k]); }).join('&');
  return fetch(u).then(function(r){ return r.json(); });
}

function handImg(src, cls){ var i=new Image(); i.src=src; i.alt=''; i.className=cls||'hand'; return i; }

function fillCard(d, again){
  var c = d.card || {}, h = d.hands || {};
  $('envTo').textContent = c.to ? c.to : t('dear');
  $('envFrom').textContent = c.from ? t('from')(c.from.replace(/\s*드림$/,'')) : '';
  var to = $('to'); to.innerHTML='';
  var g1=(c.greeting||'').split('\n')[0]; to.style.display='';
  if (h.to) { to.appendChild(handImg(h.to)); } else if (/(께|에게)$/.test(g1)) { to.style.display='none'; } else { to.textContent = c.to ? c.to : t('dear'); }
  $('msg').textContent = c.greeting || '';
  var eh = $('endHand'); eh.innerHTML=''; if (h.end) { eh.appendChild(handImg(h.end)); }
  var sg = $('sign'); sg.innerHTML=''; if (h.me) { sg.appendChild(handImg(h.me)); }
  var dt = $('date'); dt.textContent=''; if (c.date) { dt.appendChild(document.createTextNode(c.date)); } if (c.from) { if (c.date) dt.appendChild(document.createElement('br')); dt.appendChild(document.createTextNode(c.from)); }
  if (!again) { paintFrame(c); }
  if (!again) {
    var pic = $('pic'); pic.innerHTML='';
    if (d.has && d.has.photo) {
      var w=document.createElement('div'); w.className='art'; w.style.height='220px'; w.textContent='';
      var wt=document.createElement('div'); wt.className='wait'; wt.textContent=t('photoWait'); pic.appendChild(w); pic.appendChild(wt);
      api({a:'media', c:CID, m:'photo'}).then(function(r){ if(r&&r.ok&&r.data){ pic.innerHTML=''; var im=new Image(); im.alt=''; im.className='ph'; im.src=r.data; pic.classList.add('hp'); pic.style.background='#fff'; pic.appendChild(im); } else { drawArt(); } }).catch(drawArt);
    } else { drawArt(); }
  }
  var vb = $('voiceBox'); vb.innerHTML='';
  if (d.has && d.has.voice) {
    var b=document.createElement('button'); b.type='button'; b.className='voice';
    var ic=document.createElement('span'); ic.className='ic'; ic.textContent='▶'; var tx=document.createElement('span'); tx.textContent=t('voice');
    b.appendChild(ic); b.appendChild(tx); vb.appendChild(b);
    var au=null;
    b.addEventListener('click', function(){
      if (au) { if (au.paused) { au.play(); ic.textContent='❚❚'; } else { au.pause(); ic.textContent='▶'; } return; }
      tx.textContent=t('voiceLoad');
      api({a:'media', c:CID, m:'voice'}).then(function(r){
        tx.textContent=t('voice'); if(!r||!r.ok){ toast(t('fail')); return; }
        au=new Audio(r.data); au.onended=function(){ ic.textContent='▶'; };
        au.play().then(function(){ ic.textContent='❚❚'; }).catch(function(){ toast(t('fail')); });
      }).catch(function(){ tx.textContent=t('voice'); toast(t('fail')); });
    });
  }
  var bx = $('btns'); bx.innerHTML='';
  var list = (c.buttons||[]).slice(0,3);
  if (c.video) { list.push({type:'video', label:t('video'), value:c.video, safe:true}); }
  list.forEach(function(x, i){
    var a=document.createElement('a'); a.className='btn '+(i===0?'main':'sub');
    a.textContent = x.label || (x.type==='tel' ? x.value : t('go'));
    if (x.type==='tel') { a.href='tel:'+x.value; }
    else { a.href=x.value; a.target='_blank'; a.rel='noopener noreferrer';
      if (!x.safe) { a.addEventListener('click', function(e){ e.preventDefault(); askLeave(x.value); }); } }
    bx.appendChild(a);
  });
  var mb=$('mineBox');
  if (d.mine) { mb.style.display='block'; mb.textContent = t('mineT')+' · '+(d.opened ? t('opened')(d.opened) : t('notYet'))+(d.locked ? ' '+t('lockT') : ''); } else { mb.style.display='none'; }
}

function artOf(){ var k=(window.__card&&window.__card.card&&window.__card.card.art)||''; for(var i=0;i<ART.length;i++){ if(ART[i].k===k) return ART[i]; } return null; }
function drawArt(){
  var pic=$('pic'); pic.innerHTML=''; var A=artOf();
  if (A) { pic.style.background=A.bg; pic.innerHTML=art(A.k,A.a)+(A.snow?snow():''); return; }
  var a=document.createElement('div'); a.className='art';
  var s1=document.createElement('div'); s1.textContent='❄ '+t('art')+' ❄'; var s2=document.createElement('small'); s2.textContent=t('art2');
  s1.appendChild(s2); a.appendChild(s1); pic.appendChild(a);
}
function paintFrame(c){
  var A=artOf(), x=(c.mood==='xmas')||(A&&A.k.charAt(0)==='x');
  $('frame').classList.toggle('plain', !x);
  if (A) { var env=$('env'); env.querySelector('.back').style.background='linear-gradient(135deg,'+A.e[1]+','+A.e[2]+')'; env.querySelector('.flap path').setAttribute('fill', A.e[0]); }
}

function askLeave(url){
  var host=''; try{ host=new URL(url).hostname; }catch(e){ host=url; }
  $('leaveHost').textContent = t('leaveP')(host);
  $('leaveGo').href = url; $('leaveSheet').classList.add('on');
}
$('leaveNo').onclick=function(){ $('leaveSheet').classList.remove('on'); };
$('leaveGo').addEventListener('click', function(){ setTimeout(function(){ $('leaveSheet').classList.remove('on'); }, 300); });
$('repBtn').onclick=function(){ $('repSheet').classList.add('on'); };
$('repNo').onclick=function(){ $('repSheet').classList.remove('on'); };
$('repGo').onclick=function(){
  var why=$('repWhy').value; $('repGo').disabled=true;
  fetch(CARD_API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({a:'report', c:CID, why:why})})
    .then(function(r){ return r.json(); }).then(function(r){ $('repSheet').classList.remove('on'); toast(r&&r.ok ? t('repDone') : t('fail')); })
    .catch(function(){ toast(t('fail')); }).then(function(){ $('repGo').disabled=false; });
};

function openEnv(){
  var env=$('env'); if (env.classList.contains('open')) return;
  env.classList.add('open');
  if (window.LFFx && LFFx.twinkle) { try{ LFFx.twinkle(); }catch(e){} }
  setTimeout(function(){ $('cardWrap').style.display='block'; env.classList.add('gone');
    requestAnimationFrame(function(){ $('cardWrap').classList.add('show'); }); }, 700);
}
$('env').addEventListener('click', openEnv);
$('env').addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openEnv(); } });

(function start(){
  paintLang();
  if (!CID) { showState('make'); return; }
  if (!/^[a-z0-9]{6,20}$/.test(CID)) { showState('none'); return; }
  var k = myKey(CID), p = {a:'get', c:CID};
  if (k) p.k = k; if (PV) p.pv = '1';
  api(p).then(function(d){
    if (!d || !d.ok) { showState(d && d.code ? d.code : 'err'); return; }
    window.__card = d; window.__state = null;
    fillCard(d, false);
    $('load').style.display='none'; $('envBox').style.display='block';
  }).catch(function(){ showState('err'); });
})();

/* 은은한 눈 · 한 화면 한 움직임 */
(function(){
  var c=$('snow'), x=c.getContext('2d'), W, H, f=[], still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){ W=c.width=innerWidth; H=c.height=innerHeight; } size(); addEventListener('resize', size);
  for (var i=0;i<60;i++) f.push({x:Math.random()*W, y:Math.random()*H, r:1+Math.random()*2.2, s:.3+Math.random()*.7, d:Math.random()*6});
  function tick(){ x.clearRect(0,0,W,H); x.fillStyle='rgba(255,255,255,.7)';
    f.forEach(function(p){ x.beginPath(); x.arc(p.x,p.y,p.r,0,7); x.fill(); if(!still){ p.y+=p.s; p.x+=Math.sin((p.y+p.d*50)/60)*.3; if(p.y>H+5){ p.y=-5; p.x=Math.random()*W; } } });
    if(!still) requestAnimationFrame(tick); }
  tick();
})();
