  $('wH').onclick=function(){ window.scrollTo({top:0,behavior:'smooth'}); };
  $('wF').onclick=function(){ history.forward(); };

  /* 우리 이야기 마당 사진 한 줄 — 우리 이야기 서버 recPlaza(마당과 같은 사진) · 못 받으면 줄을 감춤(꾸민 사진은 넣지 않음) */
  var C=window.LF_CONFIG||{}, GAS=(C.gas&&C.gas.rec)||'';
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function hide(){ $('pz').hidden=true; }
  function draw(d){
    /* ★v7 들어올 때마다 무작위 · 한 방 3장까지 · 모자라면 사랑흐름 방(main)으로 채움 */
    var rooms=d.rooms||[], items=d.items||[], h='', n=0, cells=[], seen={}, real=[], promo=[];
    function bgOf(x){ if(x.yt){ return 'https://i.ytimg.com/vi/'+encodeURIComponent(x.yt)+'/mqdefault.jpg'; } if(x.u&&/^[A-Za-z0-9_-]{10,80}$/.test(x.u)){ return 'https://drive.google.com/thumbnail?id='+encodeURIComponent(x.u)+'&sz=w400'; } return ''; }
    function put(x,r){ if(!x||!r||seen[x.id]){ return; } var bg=bgOf(x); if(!bg){ return; } seen[x.id]=1; (r.main?promo:real).push({x:x,r:r,bg:bg}); }
    function mix(a){ for(var q=a.length-1;q>0;q--){ var w=Math.floor(Math.random()*(q+1)), t=a[q]; a[q]=a[w]; a[w]=t; } return a; }
    for(var i=0;i<items.length;i++){ put(items[i],rooms[items[i].c]); }
    for(var k=0;k<rooms.length;k++){ put(rooms[k].cover,rooms[k]); }
    var per={}, pick=[], src=mix(real).concat(mix(promo));
    for(var s2=0;s2<src.length&&pick.length<9;s2++){ var ck=src[s2].r.com||src[s2].r.name; if(!src[s2].r.main&&(per[ck]||0)>=3){ continue; } per[ck]=(per[ck]||0)+1; pick.push(src[s2]); }
    pick=mix(pick);
    for(var m=0;m<pick.length&&n<9;m++){
      var x=pick[m].x, r=pick[m].r, bg=pick[m].bg;
      cells.push('<button type="button" class="pt wait" data-bg="'+esc(bg)+'" aria-label="'+esc((x.t||'사진')+' · '+(r.name||''))+'">'+(x.yt?'<span class="pl">▶</span>':'')+'<i>'+esc(r.name||'')+'</i></button>');
      n++;
    }
    n=n-(n%3); if(n<3){ hide(); return; } h=cells.slice(0,n).join('');
    $('pzs').innerHTML=h; $('pzw').hidden=true;
    var ts=$('pzs').querySelectorAll('.pt');
    for(var j=0;j<ts.length;j++){ (function(t){
      var u=t.getAttribute('data-bg'), im=new Image();
      im.onload=function(){ if(im.naturalWidth>1){ t.style.backgroundImage='url("'+u+'")'; t.classList.remove('wait'); } else { t.classList.remove('wait'); } };
      im.onerror=function(){ t.classList.remove('wait'); };   /* 못 불러온 칸도 자리는 지킴 — 바둑판이 깨지지 않게 */
      im.src=u; t.onclick=function(){ go(PLAZA); };
    })(ts[j]); }
  }
  if(!GAS){ hide(); return; }
  var done=false; function fin(d){ if(done){ return; } done=true; if(d&&d.status==='ok'){ draw(d); } else { hide(); } }
  function jsonp(){
    var nm='hz_'+Date.now(), sc=document.createElement('script');
    window[nm]=function(d){ try{ delete window[nm]; }catch(e){} fin(d); };
    sc.onerror=function(){ fin(null); };
    sc.src=GAS+'?action=recPlaza&n=48&callback='+nm+'&t='+Date.now(); document.body.appendChild(sc);
  }
  try{
    fetch(GAS,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'recPlaza',n:'48'})})
      .then(function(r){ return r.text(); }).then(function(t){ fin(JSON.parse(t)); })
      .catch(function(){ jsonp(); });
  }catch(e){ jsonp(); }
  setTimeout(function(){ fin(null); },20000);
})();
</script>
