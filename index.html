.door b{position:relative;font-size:19px;font-weight:800;letter-spacing:-.01em;margin-top:2px}
.door small{position:relative;font-size:12.5px;line-height:1.45;color:rgba(255,255,255,.82);min-height:36px}
.door .go{position:relative;margin-top:auto;font-size:13px;font-weight:700;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:6px 15px}

.mkone:active{transform:scale(.98)}
.mkone .pl{font-size:20px;line-height:1}

<script>
(function(){
  function $(i){ return document.getElementById(i); }
  function go(u){ location.href=u; }
  try{ sessionStorage.removeItem('lf_home'); }catch(e){}
  var PLAZA='/rec/?plaza=1';
  $('aMake').onclick=function(){ go('/rec/?open=form'); };
  var gs=document.querySelectorAll('[data-go]'); for(var gi=0;gi<gs.length;gi++){ gs[gi].onclick=function(){ go(this.getAttribute('data-go')); }; }
  /* ← ⌂ → */
  var inSite=false; try{ inSite=!!document.referrer && document.referrer.indexOf(location.host)>=0 && history.length>1; }catch(e){}
  if(!inSite){ $('wB').classList.add('off'); }
  $('wB').onclick=function(){ if(inSite){ history.back(); } };
  $('wH').onclick=function(){ window.scrollTo({top:0,behavior:'smooth'}); };
  $('wF').onclick=function(){ history.forward(); };

  /* 우리 이야기 마당 사진 한 줄 — 우리 이야기 서버 recPlaza(마당과 같은 사진) · 못 받으면 줄을 감춤(꾸민 사진은 넣지 않음) */
  var C=window.LF_CONFIG||{}, GAS=(C.gas&&C.gas.rec)||'';
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  var RND=Math.random().toString(36).slice(2,10);   /* ★v55 들어올 때마다 다른 차례 */
  function hide(){ $('pz').hidden=true; }
  function draw(d){
    /* ★v7 들어올 때마다 무작위 · 한 방 3장까지 · 모자라면 사랑흐름 방(main)으로 채움 */
    var rooms=d.rooms||[], items=d.items||[], h='', n=0, cells=[], seen={}, real=[], promo=[];
    function bgOf(x){ if(x.yt){ return 'https://i.ytimg.com/vi/'+encodeURIComponent(x.yt)+'/mqdefault.jpg'; } if(x.u&&/^[A-Za-z0-9_-]{10,80}$/.test(x.u)){ return 'https://drive.google.com/thumbnail?id='+encodeURIComponent(x.u)+'&sz=w400'; } return ''; }
    function put(x,r){ if(!x||!r||seen[x.id]){ return; } var bg=bgOf(x); if(!bg){ return; } seen[x.id]=1; (r.main?promo:real).push({x:x,r:r,bg:bg}); }
    function mix(a){ for(var q=a.length-1;q>0;q--){ var w=Math.floor(Math.random()*(q+1)), t=a[q]; a[q]=a[w]; a[w]=t; } return a; }
    for(var i=0;i<items.length;i++){ put(items[i],rooms[items[i].c]); }
    for(var k=0;k<rooms.length;k++){ put(rooms[k].cover,rooms[k]); }
    var per={}, pick=[], src=mix(real).concat(mix(promo));
    for(var s2=0;s2<src.length&&pick.length<9;s2++){ var ck=src[s2].r.com||src[s2].r.name; if(!src[s2].r.main&&(per[ck]||0)>=3){ continue; } per[ck]=(per[ck]||0)+1; pick.push(src[s2]); }
    pick=mix(pick);
    /* ★v57 대표 18:20 「옆으로 밀어 더 보게」 — 첫 9칸 뒤로 남은 사진을 붙여 최대 36칸 */
    var pk0={}; pick.forEach(function(o){ pk0[o.x.id]=1; }); src.forEach(function(o){ if(pick.length<36&&!pk0[o.x.id]){ pick.push(o); } });
    for(var m=0;m<pick.length&&n<36;m++){
      var x=pick[m].x, r=pick[m].r, bg=pick[m].bg;
      cells.push('<button type="button" class="pt wait" data-cur="'+esc(x.id)+'" data-bg="'+esc(bg)+'"'+(r.g?' data-pk="'+esc('/rec/?g='+encodeURIComponent(r.g)+'&r='+encodeURIComponent(x.b||x.id))+'"':'')+'" aria-label="'+esc((x.t||'사진')+' · '+(r.name||''))+'">'+(x.yt?'<span class="pl">▶</span>':'')+'<i class="go"><span>🏠 '+esc(r.name||'')+'</span><b>›</b></i></button>');
      n++;
    }
    n=n-(n%3); if(n<3){ hide(); return; } h=cells.slice(0,n).join('');
    $('pzs').innerHTML=h; $('pzw').hidden=true;
    /* ★v57 › ‹ 단추 — PC 는 마우스로 밀기 어려워 한 판(3×3)씩 넘김 */
    (function(){ var g=$('pzs'), L=$('pzL'), R=$('pzR'); if(g.scrollWidth<=g.clientWidth+4){ return; } $('pzM').hidden=false;
      function st(){ L.hidden=g.scrollLeft<8; R.hidden=g.scrollLeft+g.clientWidth>=g.scrollWidth-8; }
      L.onclick=function(){ g.scrollBy({left:-(g.clientWidth+4),behavior:'smooth'}); }; R.onclick=function(){ g.scrollBy({left:g.clientWidth+4,behavior:'smooth'}); };
      g.addEventListener('scroll',st,{passive:true}); st(); })();
    var ts=$('pzs').querySelectorAll('.pt');
    for(var j=0;j<ts.length;j++){ (function(t){
      var u=t.getAttribute('data-bg'), im=new Image();
      im.onload=function(){ if(im.naturalWidth>1){ t.style.backgroundImage='url("'+u+'")'; t.classList.remove('wait'); } else { t.classList.remove('wait'); } };
      im.onerror=function(){ t.classList.remove('wait'); };   /* 못 불러온 칸도 자리는 지킴 — 바둑판이 깨지지 않게 */
      im.src=u; t.onclick=function(){ var pk=t.getAttribute('data-pk'); if(pk){ try{ sessionStorage.setItem('lf_from_pz','home'); }catch(e){} go(pk); } else { go(PLAZA); } };   /* ★v54 562 그 방 안 그 사진 · ★v55 바뀐 사진 따라감 */
    })(ts[j]); }
    /* ★v55 4초마다 한 칸 — 고르지 않은 사진(rest)과 맞바꿈 · 화면이 보일 때만 */
    var used={}; pick.forEach(function(o){ used[o.x.id]=1; }); var rest=src.filter(function(o){ return !used[o.x.id]; });
    if(rest.length){ setInterval(function(){ if(document.hidden){ return; } var ts2=$('pzs').querySelectorAll('.pt'); if(!ts2.length){ return; }
      var t=ts2[Math.floor(Math.random()*ts2.length)], o=rest.shift(), im2=new Image();
      im2.onload=function(){ t.style.transition='opacity .45s'; t.style.opacity='.1'; setTimeout(function(){ t.style.backgroundImage='url("'+o.bg+'")'; var sp=t.querySelector('i span'); if(sp){ sp.textContent='🏠 '+(o.r.name||''); }
        if(o.r.g){ t.setAttribute('data-pk','/rec/?g='+encodeURIComponent(o.r.g)+'&r='+encodeURIComponent(o.x.b||o.x.id)); } t.setAttribute('aria-label',(o.x.t||'사진')+' · '+(o.r.name||'')); t.style.opacity='1';
        var old=t.getAttribute('data-cur'); t.setAttribute('data-cur',o.x.id); if(old){ var back=src.filter(function(z){ return z.x.id===old; })[0]; if(back){ rest.push(back); } } },450); };
      im2.onerror=function(){ }; im2.src=o.bg; },4000); }
  }
  if(!GAS){ hide(); return; }
  var done=false; function fin(d){ if(done){ return; } done=true; if(d&&d.status==='ok'){ draw(d); } else { hide(); } }
  function jsonp(){
    var nm='hz_'+Date.now(), sc=document.createElement('script');
    window[nm]=function(d){ try{ delete window[nm]; }catch(e){} fin(d); };
    sc.onerror=function(){ fin(null); };
    sc.src=GAS+'?action=recPlaza&n=48&rnd='+RND+'&callback='+nm+'&t='+Date.now(); document.body.appendChild(sc);
  }
  try{
    fetch(GAS,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'recPlaza',n:'48',rnd:RND})})
      .then(function(r){ return r.text(); }).then(function(t){ fin(JSON.parse(t)); })
      .catch(function(){ jsonp(); });
  }catch(e){ jsonp(); }
  setTimeout(function(){ fin(null); },20000);
})();
</script>
