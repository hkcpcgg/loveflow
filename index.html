:root{--navy:#1E4A76;--gold:#C9A96E;--gold2:#C0872E;--cream:#FFFCF7;--sand:#F4EEE4;--ink:#2E3A46;--sub:#7d7465;--line:#EADFCF}

html,body{margin:0;background:var(--cream);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;word-break:keep-all;-webkit-tap-highlight-color:transparent}

.home{max-width:520px;margin:0 auto;min-height:calc(100vh - 124px);min-height:calc(100svh - 124px);display:flex;flex-direction:column;gap:clamp(10px,2.2vh,22px);padding:clamp(12px,2.6vh,26px) 18px clamp(12px,2.2vh,20px)}

.pass .ci{width:40px;height:40px;flex-basis:40px;background:var(--gold)}
.pass b{display:block;color:var(--navy);font-size:15.5px}.pass small{display:block;color:#9a7a3a;font-size:12.5px}

/* 올라오는 판 */
.hdim{position:fixed;inset:0;z-index:1600;background:rgba(30,40,55,.38);opacity:0;visibility:hidden;transition:.2s}
.hdim.on{opacity:1;visibility:visible}
.hsheet{position:fixed;left:0;right:0;bottom:0;z-index:1700;max-width:560px;margin:0 auto;background:#fff;border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease;box-shadow:0 -8px 22px rgba(0,0,0,.16)}

.hsh{display:flex;gap:12px;align-items:center}.hsh .ci{width:48px;height:48px;flex-basis:48px}

.hbo,.hbn{display:block;width:100%;border-radius:14px;padding:13px;font-size:15.5px;font-weight:800;text-align:center;white-space:nowrap;margin-top:10px}

function hEsc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function hOpen(k){
  var d=HS[k]; if(!d) return;
  var h='<div class="grab"></div><div class="hsh"><span class="ci" style="background:'+d.c+'"><svg viewBox="0 0 24 24">'+HIC[d.ic]+'</svg></span><div><b>'+hEsc(d.t)+'</b><small>'+hEsc(d.s)+'</small></div></div>'
   +'<p class="hsp">'+hEsc(d.p)+'</p>'
   +(d.more?'<button class="hbo" data-u="'+d.more[1]+'">'+hEsc(d.more[0])+'</button>':'')
   +'<button class="hbn" data-u="'+d.go[1]+'">'+hEsc(d.go[0])+'</button>';
  var sh=document.getElementById('hSheet'); sh.innerHTML=h;
  var bs=sh.querySelectorAll('button[data-u]'); for(var i=0;i<bs.length;i++){ bs[i].onclick=function(){ location.href=this.getAttribute('data-u'); }; }
  document.getElementById('hDim').classList.add('on'); sh.classList.add('on');
  try{ gtag('event','home_tile',{k:k}); }catch(e){}
}
function hClose(){ document.getElementById('hDim').classList.remove('on'); document.getElementById('hSheet').classList.remove('on'); }
document.getElementById('hDim').onclick=hClose;
(function(){ var ts=document.querySelectorAll('.tile'); for(var i=0;i<ts.length;i++){ ts[i].onclick=function(){ hOpen(this.getAttribute('data-k')); }; } })();
(function(){ var y0=null, sh=document.getElementById('hSheet');
  sh.addEventListener('touchstart',function(e){ y0=e.touches[0].clientY; },{passive:true});
  sh.addEventListener('touchend',function(e){ if(y0!==null && e.changedTouches[0].clientY-y0>60){ hClose(); } y0=null; });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ hClose(); } });
})();
