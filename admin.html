<!DOCTYPE html>
<!-- ═══════════════════════════════════════════════════════════════════
     사랑흐름 · admin.html   v6 · 260714

     ★이 화면이 무엇인가 (대표 확정 260714) — 착각하지 말 것
       진짜 DB 는 ★구글 시트입니다. 정산 · 집계 · 이력은 거기서 봅니다.
       이 화면은 ★밖에 나가서 폰으로 입금 확인하고 여권 내주는 도구입니다.
       그 이상 만들지 않습니다. 시트를 화면에 옮겨오려 하지 마십시오.

     [v6 · 260714] ★보이는 줄 수 고르기 — 10 / 20 / 30 / 50 / 전체
       기본 20줄. 「더 보기」로 늘립니다. 창이 끝없이 길어지지 않게.

     [v5] ★표 도구 — 검색 · 기간 · 정렬 · 상태
       대표 지적: "최소의 기능은 있어야 뭘 일을 하지."  맞습니다. 표만 깔고 도구를 안 줬습니다.

       ① 검색 — ★한 칸. 입금자명 · 접수번호 · 뒤4 · 여권번호를 한 칸에서 찾습니다.
                 칸을 넷으로 나누지 않습니다. 아무거나 치면 걸립니다.
       ② 기간 — 오늘 / 이번 달 / 지난 달 / 전체  (+ 달 고르기 month 입력)
       ③ 정렬 — 표 머리를 누르면 오르내림. ▲▼ 로 보입니다.
       ④ 상태 — 기다림 / 발급됨 / 전체.  ★한 표에서 걸러 봅니다(관리자 표준).
                 v4 처럼 두 표로 갈라놓지 않습니다.

       ★전부 화면 안에서 처리합니다. GAS 무변경 · 재배포 없음.
       ★공용 부품(LFTable): 「결과 보기」·「문의」 탭이 그대로 갖다 씁니다. 두 번 안 짭니다.

       [미결 · GAS] adminList 의 done 은 ★최근 10건만 줍니다(if done.length < 10).
         지난달 발급분을 찾으려면 그 한 줄을 풀어야 합니다 → 게시판 GAS v5-2 별건.

     [v4] 관리자 표준 표 — 한 줄 = 한 건. 금액 드롭다운 + 확인 버튼 하나.
     [v3] 열쇠를 주소에서 뺐습니다(?k= 폐기). 화면 칸에 직접 · 이 기기가 기억.
          ※열쇠 바꾸기: 게시판 GAS 편집기 → var ADMIN_KEY 한 줄 →
            저장 → 배포관리 → 연필 → 새 버전 → 배포. (열쇠는 거기 한 군데뿐)
          데스크톱(≥900px) = 표 / 폰 = 카드. 데이터 · 자바스크립트는 하나.
     [v2] 이사회 확정(260707~08 관리시스템 설계서 v1) 골격
          ★3탭 ①결과 보기(잠금) ②입금·발급(켬) ③문의(잠금) — 자리를 심습니다. 다시 안 짭니다.
          ★3레벨 L1/L2/L3 → 변수 LEVEL 자리. 계정 테이블은 이사회가 「나중(B)」으로 확정.
          ★동명이인 — 줄은 접수번호로 찾고, 눈은 입금자명입니다. 같은 이름이 둘 이상이면 표시.
          ★소속 자리(r.org) — 주문대장에 소속 칸이 생기면 그대로 뜹니다.

     [★폐기] 여권 비표 LFM-/LFL- (260713 이사회 만장일치). 여권은 LF- 하나. 상품은 주문대장 J열.
     [미결] 주문대장 O소속 · P입력자 · Q입력방식 — 다음 작업(issuePassport)에서 심습니다.
     [★안 켬] 「결과 보기」 탭은 GAS 서빙으로 옮기기 전엔 안 켭니다(서술형 전문이 깔리는 화면).
     [안 건드림] 네이버 발급 동선 · 주문대장 · 여권 판별(LF-) · journey 잠금 · apply · gate · find
═══════════════════════════════════════════════════════════════════ -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>관리 · 사랑흐름</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1E4A76; --gold:#D4AF37; --cream:#FFFBF5; --coral:#FF7A59;
  --line:#EEE9DF; --sub:#8B8371; --text:#2E2A24; --hair:#F2EEE6;
}
*{box-sizing:border-box}
body{
  margin:0; background:#E7E1D6;
  font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;
  color:var(--text); min-height:100vh; display:flex; justify-content:center; padding:20px 12px;
}
.phone{
  position:relative; width:100%; max-width:412px; background:var(--cream);
  border-radius:24px; overflow:hidden;
  box-shadow:0 18px 50px rgba(46,58,70,.18);
  display:flex; flex-direction:column; min-height:86vh;
}

.bar{display:flex; align-items:center; justify-content:space-between; padding:16px 18px 14px; background:#fff; border-bottom:1px solid var(--line)}
.bar .ttl{font-size:15px; font-weight:900; color:var(--navy); letter-spacing:-.3px}
.bar .rt{display:flex; align-items:center; gap:8px}
.bar .cnt{font-size:11.5px; color:var(--sub); font-weight:700}
.bar .refresh{
  border:1.5px solid var(--line); background:#fff; color:var(--navy);
  width:34px; height:34px; border-radius:10px; font-size:15px; cursor:pointer;
  display:none; align-items:center; justify-content:center;
}
.bar .refresh:active{background:var(--cream)}

.tabs{display:none; background:#fff; border-bottom:1px solid var(--line); padding:0 10px}
.tabs.on{display:flex}
.tab{
  flex:1; background:none; border:0; border-bottom:2.5px solid transparent;
  padding:12px 2px 10px; font-family:inherit; font-size:12.5px; font-weight:700;
  color:var(--sub); cursor:pointer; line-height:1.3; text-align:center;
}
.tab.sel{color:var(--navy); border-bottom-color:var(--navy)}
.tab.lock{color:#C6C0B4; cursor:default}
.tab.lock small{display:block; font-size:9.5px; font-weight:400; margin-top:2px}

.body{padding:14px 14px 24px; flex:1}

/* ── 열쇠 ── */
.keybox{padding:40px 6px}
.keybox .kt{font-size:14px; font-weight:700; color:var(--navy); margin-bottom:10px}
.keybox input{width:100%; padding:13px 14px; border:1.5px solid var(--line); border-radius:12px; font-size:15px; font-family:inherit; background:#fff; outline:none}
.keybox input:focus{border-color:var(--navy)}
.keybox button{width:100%; height:44px; margin-top:10px; border:0; border-radius:22px; background:var(--navy); color:#fff; font-size:14.5px; font-weight:700; font-family:inherit; cursor:pointer}
.keybox .kn{font-size:11.5px; color:var(--sub); margin-top:12px; line-height:1.7; text-align:center}

/* ══ ★표 도구 (LFTable 공용) ══ */
.tools{margin-bottom:12px}
.search{position:relative; margin-bottom:8px}
.search input{
  width:100%; height:40px; padding:0 34px 0 13px;
  border:1.5px solid var(--line); border-radius:10px; background:#fff;
  font-family:inherit; font-size:13.5px; color:var(--text); outline:none;
}
.search input:focus{border-color:var(--navy)}
.search .x{
  position:absolute; right:6px; top:6px; width:28px; height:28px; border:0; border-radius:8px;
  background:none; color:var(--sub); font-size:15px; cursor:pointer; display:none;
}
.search .x.on{display:block}

.chips{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.chip{
  height:30px; padding:0 12px; border:1.5px solid var(--line); border-radius:15px;
  background:#fff; color:var(--sub); font-family:inherit; font-size:12px; font-weight:700; cursor:pointer;
}
.chip.on{background:var(--navy); border-color:var(--navy); color:#fff}
.chips .gap{width:1px; height:18px; background:var(--line); margin:0 3px}
.chips input[type=month]{
  height:30px; padding:0 8px; border:1.5px solid var(--line); border-radius:15px;
  background:#fff; color:var(--sub); font-family:inherit; font-size:11.5px; font-weight:700;
  outline:none; cursor:pointer;
}
.chips input[type=month].on{border-color:var(--navy); color:var(--navy)}
.cntsel{
  height:30px; padding:0 6px; border:1.5px solid var(--line); border-radius:15px;
  background:#fff; color:var(--sub); font-family:inherit; font-size:11.5px; font-weight:700;
  outline:none; cursor:pointer;
}
.cntsel:focus{border-color:var(--navy)}
.more{
  width:100%; height:40px; margin-top:10px; border:1.5px solid var(--line); border-radius:10px;
  background:#fff; color:var(--navy); font-family:inherit; font-size:13px; font-weight:700; cursor:pointer;
}
.more:hover{border-color:var(--navy)}

.state{font-size:12.5px; color:var(--sub); text-align:center; padding:32px 0; line-height:1.8}
.state b{color:var(--navy)}

/* ── 표 머리 (데스크톱) ── */
.thead{display:none}
.thead > div{cursor:pointer; user-select:none; white-space:nowrap}
.thead > div.no-sort{cursor:default}
.thead .ar{color:var(--navy); font-size:10px; margin-left:2px}

/* ══ 한 줄 = 한 건 ══ */
.row{
  background:#fff; border:1px solid var(--line); border-radius:10px;
  padding:11px 13px; margin-bottom:7px;
}
.r1{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.when{font-size:12px; color:var(--sub); flex-shrink:0}
.no{font-size:14px; font-weight:900; color:var(--navy); letter-spacing:-.2px}
.who{font-size:13px; font-weight:700; color:var(--text)}
.dim2{font-size:12px; color:var(--sub)}
.flag{
  font-size:10.5px; font-weight:700; color:#B84A2C;
  background:#FFF4F0; border:1px solid var(--coral); border-radius:8px; padding:1px 7px;
}
.r2{display:flex; gap:7px; margin-top:9px; align-items:center}
.sel{
  flex:1; height:38px; padding:0 10px; border:1.5px solid var(--line); border-radius:9px;
  background:#fff; color:var(--text); font-family:inherit; font-size:13px; font-weight:700;
  outline:none; cursor:pointer;
}
.sel:focus{border-color:var(--navy)}
.ok{
  width:88px; height:38px; border:1.5px solid var(--line); border-radius:9px;
  background:#fff; color:#C6C0B4; font-family:inherit; font-size:13px; font-weight:700;
  cursor:default; flex-shrink:0;
}
.ok.on{background:var(--navy); border-color:var(--navy); color:#fff; cursor:pointer}

.row.done{background:#F7F4EE}
.row.done .no{color:var(--sub); font-weight:700}
.pp{
  font-size:13px; font-weight:900; color:var(--navy); letter-spacing:.5px;
  background:#fff; border:1px solid var(--line); border-radius:8px; padding:3px 9px;
}

/* ── 잠긴 탭 ── */
.locked{padding:34px 8px; text-align:center}
.locked .lt{font-size:14px; font-weight:900; color:var(--navy); margin-bottom:8px}
.locked .lm{font-size:12.5px; color:var(--sub); line-height:1.8}
.locked .ll{display:inline-block; margin-top:14px; padding:8px 14px; border-radius:16px; background:#fff; border:1px solid var(--line); font-size:11.5px; color:var(--sub)}

/* ── 팝업 ── */
.dim{position:fixed; inset:0; background:rgba(30,42,58,.5); z-index:900; display:none; align-items:center; justify-content:center; padding:24px}
.dim.on{display:flex}
.modal{width:100%; max-width:340px; background:var(--cream); border-radius:18px; padding:22px 20px 18px}
.modal .mt{font-size:15px; font-weight:900; color:var(--navy); margin-bottom:12px; text-align:center}
.dl{background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:14px}
.dl .r{display:flex; justify-content:space-between; gap:10px; font-size:12.5px; padding:4px 0; line-height:1.6}
.dl .r .k{color:var(--sub); flex-shrink:0}
.dl .r .v{color:var(--text); font-weight:700; text-align:right; word-break:break-all}
.dl .r .v.big{color:var(--navy); font-size:14px; font-weight:900}
.warn{margin-bottom:12px; padding:9px 12px; border-radius:10px; border:1.5px solid var(--coral); background:#FFF4F0; font-size:11.5px; font-weight:700; color:#B84A2C; line-height:1.6}
.mm{font-size:12px; color:var(--sub); text-align:center; line-height:1.7; margin-bottom:14px}
.mbtns{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.mbtn{height:44px; border-radius:22px; border:0; font-family:inherit; font-size:14px; font-weight:700; cursor:pointer}
.m-no{background:#fff; color:var(--sub); border:1.5px solid var(--line)}
.m-ok{background:var(--navy); color:#fff}
.mbtn:disabled{opacity:.55; cursor:default}

.foot{border-top:1px solid var(--line); padding:14px 16px 18px; font-size:10.5px; color:var(--sub); text-align:center; line-height:1.7}

/* ══════════════════════════════════════════════════════════
   ★데스크톱 (≥900px) — 진짜 표
   ══════════════════════════════════════════════════════════ */
@media (min-width: 900px){
  body{padding:26px 22px; background:#EDE9E1}
  .phone{
    max-width:1180px; border-radius:14px; min-height:0;
    display:grid; grid-template-columns:200px 1fr; grid-template-rows:auto 1fr auto;
    box-shadow:0 10px 34px rgba(46,58,70,.12);
  }
  .bar{grid-column:1 / -1; padding:16px 22px}
  .bar .ttl{font-size:16px}

  .tabs{
    grid-column:1; grid-row:2; flex-direction:column; align-items:stretch;
    border-bottom:0; border-right:1px solid var(--line);
    padding:14px 10px; gap:3px; background:#FCFAF6;
  }
  .tab{flex:none; text-align:left; border-bottom:0; border-radius:9px; padding:11px 13px; font-size:13px}
  .tab.sel{background:var(--navy); color:#fff}
  .tab.lock small{display:inline; margin:0 0 0 6px}

  .body{grid-column:2; grid-row:2; padding:16px 22px 26px; overflow:auto}
  .foot{grid-column:1 / -1; grid-row:3; text-align:left; padding:12px 22px}
  .keybox{max-width:330px; margin:0 auto}

  /* 도구를 한 줄로 */
  .tools{display:flex; align-items:center; gap:12px; margin-bottom:14px}
  .search{margin-bottom:0; width:280px; flex-shrink:0}
  .chips{flex:1}

  /* 표 */
  .thead{
    display:grid;
    grid-template-columns:98px 150px 106px 112px 52px 1fr 96px;
    gap:10px; align-items:center;
    padding:0 13px 8px;
    font-size:11.5px; font-weight:900; color:var(--sub); letter-spacing:.3px;
    border-bottom:1.5px solid var(--line);
  }
  .row{
    display:grid;
    grid-template-columns:98px 150px 106px 112px 52px 1fr 96px;
    gap:10px; align-items:center;
    border:0; border-bottom:1px solid var(--hair); border-radius:0;
    padding:8px 13px; margin-bottom:0; background:transparent;
  }
  .row:hover{background:#fff}
  .row.done{background:transparent; opacity:.86}
  .row.done:hover{background:#fff; opacity:1}
  .r1{display:contents}
  .r2{display:contents}
  .when{font-size:12.5px}
  .no{font-size:13.5px}
  .who{font-size:13.5px}
  .flag{justify-self:start}
  .sel{height:34px; font-size:12.5px}
  .ok{width:100%; height:34px; font-size:12.5px}
  .pp{justify-self:stretch; text-align:center}
  .state{padding:44px 0}
  .modal{max-width:380px}
}
</style>
</head>
<body>

<div class="phone">

  <div class="bar">
    <div class="ttl" id="barTtl">관리</div>
    <div class="rt">
      <span class="cnt" id="cnt"></span>
      <button class="refresh" id="btnRefresh" onclick="load()" title="다시 불러오기">&#8635;</button>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab lock" onclick="lockMsg()">결과 보기<small>준비 중</small></button>
    <button class="tab sel" id="tab2" onclick="go('pay')">입금 · 발급</button>
    <button class="tab lock" onclick="lockMsg()">문의<small>준비 중</small></button>
  </div>

  <div class="body">

    <!-- 열쇠 -->
    <div class="keybox" id="keyView">
      <div class="kt">열쇠를 넣어 주세요</div>
      <input id="keyInput" type="password" autocomplete="off" placeholder="관리자 열쇠"
             onkeydown="if(event.key==='Enter'){useKey()}">
      <button onclick="useKey()">들어가기</button>
      <div class="state" id="keyErr" style="display:none; color:#C0392B; padding:14px 0">열쇠가 맞지 않습니다.</div>
      <div class="kn">한 번 넣으면 이 기기가 기억합니다.<br>주소창에는 아무것도 남지 않습니다.</div>
    </div>

    <!-- ② 입금 · 발급 -->
    <div id="payView" style="display:none">

      <!-- ★표 도구 -->
      <div class="tools">
        <div class="search">
          <input id="q" type="search" autocomplete="off"
                 placeholder="입금자명 · 접수번호 · 뒤4 · 여권번호"
                 oninput="onQuery()">
          <button class="x" id="qx" onclick="clearQuery()" title="지우기">&times;</button>
        </div>
        <div class="chips" id="chips">
          <button class="chip"    data-f="st" data-v="wait" onclick="setF(this)">기다림</button>
          <button class="chip"    data-f="st" data-v="done" onclick="setF(this)">발급됨</button>
          <button class="chip on" data-f="st" data-v="all"  onclick="setF(this)">전체</button>
          <span class="gap"></span>
          <button class="chip"    data-f="pd" data-v="today" onclick="setF(this)">오늘</button>
          <button class="chip"    data-f="pd" data-v="month" onclick="setF(this)">이번 달</button>
          <button class="chip"    data-f="pd" data-v="prev"  onclick="setF(this)">지난 달</button>
          <button class="chip on" data-f="pd" data-v="all"   onclick="setF(this)">전체</button>
          <input type="month" id="mon" onchange="onMonth()" title="달 고르기">
          <span class="gap"></span>
          <select class="cntsel" id="lim" onchange="onLimit()" title="보이는 줄 수">
            <option value="10">10줄</option>
            <option value="20" selected>20줄</option>
            <option value="30">30줄</option>
            <option value="50">50줄</option>
            <option value="0">전체</option>
          </select>
        </div>
      </div>

      <div class="state" id="stateBox">불러오는 중입니다…</div>
      <div id="thead"></div>
      <div id="rows"></div>
    </div>

    <!-- 잠긴 탭 -->
    <div id="lockView" style="display:none">
      <div class="locked">
        <div class="lt">아직 열지 않았습니다</div>
        <div class="lm">
          이사회 확정 관리자 화면은 <b>세 칸</b>입니다.<br>
          결과 보기 · 입금 · 발급 · 문의.<br>
          지금은 <b>입금 · 발급</b>만 켜 두었습니다.
        </div>
        <div class="ll">검색 · 기간 · 정렬은 공용 부품입니다. 다음 탭이 그대로 씁니다.</div>
      </div>
    </div>

  </div>

  <div class="foot">
    대표 황규찬 &middot; 사랑흐름 &nbsp;|&nbsp;
    &copy; 2026 사랑흐름 &middot; LFRI&trade;. 무단복제 &middot; 상업적 이용 금지.
  </div>

</div>

<div class="dim" id="dim" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="mt" id="mTitle">입금을 확인하셨습니까?</div>
    <div id="mBody"></div>
    <div class="mbtns">
      <button class="mbtn m-no" id="mNo" onclick="closeModal()">아니요</button>
      <button class="mbtn m-ok" id="mOk" onclick="doPaid()">확인 &middot; 발급</button>
    </div>
  </div>
</div>

<script>
/* ── 게시판 GAS (접수 · 관리자) ── ★열쇠는 이 파일에 없습니다. GAS 안에만 있습니다. */
var GAS = 'https://script.google.com/macros/s/AKfycbxaUOkw181xKRNJj4kxVd31PXL8cEQW4e0B6D2alEw-s_jTrPQhNku2jUeGY-TjuXZNzw/exec';

var KEY = '';
var LEVEL = 1;        /* ★이사회 3레벨 자리. 지금은 L1(대표) 하나. */
var ALL = [];         /* 대기 + 발급 전부를 한 배열로 (★한 표에서 걸러 봅니다) */
var DUPES = {};
var PENDING = null;

/* ★표 상태 — 공용 부품 */
var T = { q:'', st:'all', pd:'all', mon:'', sort:'when', dir:-1, lim:20 };

/* ── JSONP ── */
var seq = 0;
function jsonp(params, done, fail){
  seq++;
  var name = 'lfcb' + Date.now() + '_' + seq;
  var s = document.createElement('script');
  var timer = setTimeout(function(){ cleanup(); if(fail) fail('시간이 지났습니다. 다시 불러와 주십시오.'); }, 20000);
  function cleanup(){
    clearTimeout(timer);
    try{ delete window[name]; }catch(e){ window[name] = undefined; }
    if(s.parentNode) s.parentNode.removeChild(s);
  }
  window[name] = function(res){ cleanup(); done(res); };
  var q = [];
  for(var k in params){ if(params.hasOwnProperty(k)) q.push(k + '=' + encodeURIComponent(params[k])); }
  q.push('callback=' + name);
  s.src = GAS + '?' + q.join('&');
  s.onerror = function(){ cleanup(); if(fail) fail('연결이 되지 않았습니다.'); };
  document.body.appendChild(s);
}

/* ── 열쇠 ── */
function saveKey(k){ try{ localStorage.setItem('lf_admin_key', k); }catch(e){} }
function readKey(){ try{ return localStorage.getItem('lf_admin_key') || ''; }catch(e){ return ''; } }
function dropKey(){ try{ localStorage.removeItem('lf_admin_key'); }catch(e){} }

function useKey(){
  var v = document.getElementById('keyInput').value.trim();
  if(!v) return;
  KEY = v;
  document.getElementById('keyErr').style.display = 'none';
  enter();
}
function enter(){
  document.getElementById('keyView').style.display = 'none';
  document.getElementById('tabs').classList.add('on');
  go('pay');
}
function backToKey(){
  KEY = ''; dropKey();
  document.getElementById('payView').style.display = 'none';
  document.getElementById('lockView').style.display = 'none';
  document.getElementById('tabs').classList.remove('on');
  document.getElementById('btnRefresh').style.display = 'none';
  document.getElementById('keyView').style.display = 'block';
  document.getElementById('keyErr').style.display = 'block';
  document.getElementById('keyInput').value = '';
  document.getElementById('barTtl').textContent = '관리';
  document.getElementById('cnt').textContent = '';
}

/* ── 탭 ── */
function go(which){
  document.getElementById('payView').style.display  = (which === 'pay')  ? 'block' : 'none';
  document.getElementById('lockView').style.display = (which === 'lock') ? 'block' : 'none';
  document.getElementById('barTtl').textContent = (which === 'pay') ? '입금 · 발급' : '관리';
  document.getElementById('btnRefresh').style.display = (which === 'pay') ? 'flex' : 'none';
  document.getElementById('tab2').classList.toggle('sel', which === 'pay');
  if(which === 'pay'){ load(); } else { document.getElementById('cnt').textContent = ''; }
}
function lockMsg(){ go('lock'); }

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function setState(t){
  var b = document.getElementById('stateBox');
  b.style.display = 'block';
  b.innerHTML = t;
}

/* ★금액 = 상품. 게시판 GAS PRICE_ITEM 과 같아야 합니다. */
var PRICES = [
  { amount:14900, name:'마음 여행지도' },
  { amount:19900, name:'마음 여행편지' },
  { amount:29800, name:'마음여행' },
  { amount:59800, name:'인생여행' }
];
function won(n){ return Number(n).toLocaleString(); }
function priceName(a){
  for(var i=0;i<PRICES.length;i++){ if(PRICES[i].amount === a) return PRICES[i].name; }
  return '';
}

/* ── 목록 불러오기 ── */
function load(){
  setState('불러오는 중입니다…');
  document.getElementById('thead').innerHTML = '';
  document.getElementById('rows').innerHTML = '';

  jsonp({ action:'adminList', key:KEY }, function(res){
    if(!res || res.status !== 'ok'){
      if(res && res.msg && res.msg.indexOf('권한') >= 0){ backToKey(); return; }
      setState((res && res.msg) ? res.msg : '불러오지 못했습니다.');
      return;
    }
    saveKey(KEY);
    if(res.level) LEVEL = Number(res.level);

    /* ★대기 · 발급을 한 배열로 합칩니다. 상태 칩으로 걸러 봅니다. */
    ALL = [];
    var w = res.waiting || [], d = res.done || [];
    for(var i=0;i<w.length;i++){ w[i].paid = false; ALL.push(w[i]); }
    for(var j=0;j<d.length;j++){ d[j].paid = true;  ALL.push(d[j]); }

    /* 동명이인 — ★기다리는 줄끼리만 셉니다(발급된 건 이미 갈렸으므로) */
    DUPES = {};
    for(var k=0;k<w.length;k++){
      var nm = String(w[k].payer || '').trim();
      if(nm) DUPES[nm] = (DUPES[nm] || 0) + 1;
    }

    render();
  }, function(msg){ setState(msg); });
}

/* ══ ★표 도구 (LFTable) — 검색 · 기간 · 정렬 · 상태 ══ */

function onQuery(){
  T.q = document.getElementById('q').value.trim().toLowerCase();
  document.getElementById('qx').classList.toggle('on', !!T.q);
  render();
}
function clearQuery(){
  document.getElementById('q').value = '';
  T.q = '';
  document.getElementById('qx').classList.remove('on');
  render();
}
function setF(btn){
  var f = btn.getAttribute('data-f'), v = btn.getAttribute('data-v');
  T[f] = v;
  if(f === 'pd'){ T.mon = ''; document.getElementById('mon').value = ''; document.getElementById('mon').classList.remove('on'); }
  var all = document.querySelectorAll('.chip[data-f="' + f + '"]');
  for(var i=0;i<all.length;i++){ all[i].classList.toggle('on', all[i] === btn); }
  render();
}
function onMonth(){
  var m = document.getElementById('mon');
  T.mon = m.value;                        /* yyyy-MM */
  m.classList.toggle('on', !!T.mon);
  if(T.mon){
    T.pd = 'pick';
    var all = document.querySelectorAll('.chip[data-f="pd"]');
    for(var i=0;i<all.length;i++){ all[i].classList.remove('on'); }
  }
  render();
}
function onLimit(){
  T.lim = Number(document.getElementById('lim').value) || 0;   /* 0 = 전체 */
  render();
}
function more(){
  T.lim = T.lim + 20;
  render();
}
function sortBy(k){
  if(T.sort === k){ T.dir = -T.dir; }
  else { T.sort = k; T.dir = (k === 'when') ? -1 : 1; }
  render();
}

/* when 은 GAS 가 "MM.dd HH:mm" 으로 줍니다. 올해 기준으로 읽습니다. */
function whenParts(s){
  var m = String(s || '').match(/^(\d{2})\.(\d{2})\s+(\d{2}):(\d{2})$/);
  if(!m) return null;
  var now = new Date();
  return { mm:Number(m[1]), dd:Number(m[2]), hh:Number(m[3]), mi:Number(m[4]), yy:now.getFullYear() };
}
function whenKey(s){
  var p = whenParts(s);
  if(!p) return 0;
  return ((p.mm * 100 + p.dd) * 100 + p.hh) * 100 + p.mi;
}

function inPeriod(r){
  var p = whenParts(r.when);
  if(!p) return T.pd === 'all';
  var now = new Date();
  var thisM = now.getMonth() + 1, today = now.getDate();
  var prevM = (thisM === 1) ? 12 : (thisM - 1);

  if(T.pd === 'all')   return true;
  if(T.pd === 'today') return (p.mm === thisM && p.dd === today);
  if(T.pd === 'month') return (p.mm === thisM);
  if(T.pd === 'prev')  return (p.mm === prevM);
  if(T.pd === 'pick' && T.mon){
    var mm = Number(T.mon.split('-')[1]);
    return (p.mm === mm);
  }
  return true;
}

function hit(r){
  if(!T.q) return true;
  var hay = [r.no, r.payer, r.phone4, r.pp, r.bank, r.org].join(' ').toLowerCase();
  return hay.indexOf(T.q) >= 0;
}

function view(){
  var out = [];
  for(var i=0;i<ALL.length;i++){
    var r = ALL[i];
    if(T.st === 'wait' && r.paid) continue;
    if(T.st === 'done' && !r.paid) continue;
    if(!inPeriod(r)) continue;
    if(!hit(r)) continue;
    out.push(r);
  }
  var k = T.sort, d = T.dir;
  out.sort(function(a, b){
    var x, y;
    if(k === 'when'){ x = whenKey(a.when); y = whenKey(b.when); }
    else if(k === 'payer'){ x = String(a.payer||''); y = String(b.payer||''); }
    else if(k === 'no'){ x = String(a.no||''); y = String(b.no||''); }
    else if(k === 'bank'){ x = String(a.bank||''); y = String(b.bank||''); }
    else { x = 0; y = 0; }
    if(x < y) return -1 * d;
    if(x > y) return  1 * d;
    return 0;
  });
  return out;
}

function ar(k){ return (T.sort === k) ? '<span class="ar">' + (T.dir > 0 ? '&#9650;' : '&#9660;') + '</span>' : ''; }

function render(){
  var all = view();
  var total = all.length;

  /* ★보이는 줄 수 — 기다리는 줄은 안 자릅니다(일감이라서). 자르는 건 전체 목록 길이입니다. */
  var list = (T.lim > 0) ? all.slice(0, T.lim) : all;

  var waitN = 0;
  for(var i=0;i<ALL.length;i++){ if(!ALL[i].paid) waitN++; }
  document.getElementById('cnt').textContent =
    '기다림 ' + waitN + ' · ' + list.length + ' / ' + total;

  if(total === 0){
    document.getElementById('thead').innerHTML = '';
    document.getElementById('rows').innerHTML = '';
    setState(T.q
      ? '<b>' + esc(document.getElementById('q').value) + '</b> — 찾지 못했습니다.'
      : '해당하는 줄이 <b>없습니다</b>.');
    return;
  }
  document.getElementById('stateBox').style.display = 'none';

  document.getElementById('thead').innerHTML =
      '<div class="thead">'
    +   '<div onclick="sortBy(\'when\')">접수일시' + ar('when') + '</div>'
    +   '<div onclick="sortBy(\'no\')">접수번호' + ar('no') + '</div>'
    +   '<div onclick="sortBy(\'payer\')">입금자명' + ar('payer') + '</div>'
    +   '<div onclick="sortBy(\'bank\')">은행' + ar('bank') + '</div>'
    +   '<div class="no-sort">뒤4</div>'
    +   '<div class="no-sort">받은 금액</div>'
    +   '<div class="no-sort">처리</div>'
    + '</div>';

  var h = '';
  for(var j=0;j<list.length;j++){
    var r = list[j];
    var id = esc(r.no);
    var nm = String(r.payer || '').trim();
    var dup = (!r.paid && nm) ? (DUPES[nm] || 0) : 0;

    h += '<div class="row' + (r.paid ? ' done' : '') + '">';
    h +=   '<div class="r1">';
    h +=     '<span class="when">' + esc(r.when) + '</span>';
    h +=     '<span class="no">' + id + '</span>';
    h +=     '<span class="who">' + esc(nm || '(없음)')
       +        (dup > 1 ? ' <span class="flag">동명 ' + dup + '</span>' : '') + '</span>';
    h +=     '<span class="dim2">' + esc(r.bank || '-') + '</span>';
    h +=     '<span class="dim2">'
       +        (r.phone4 ? esc(r.phone4) : '<span class="flag">없음</span>') + '</span>';
    h +=   '</div>';

    if(r.paid){
      h += '<span class="dim2">' + esc(r.state || '') + '</span>';
      h += '<span class="pp">' + esc(r.pp || '-') + '</span>';
    }else{
      h += '<div class="r2">';
      h +=   '<select class="sel" id="s_' + id + '" onchange="pick(\'' + id + '\')">';
      h +=     '<option value="">받은 금액</option>';
      for(var p=0;p<PRICES.length;p++){
        h +=   '<option value="' + PRICES[p].amount + '">'
           +      won(PRICES[p].amount) + ' · ' + PRICES[p].name + '</option>';
      }
      h +=   '</select>';
      h +=   '<button class="ok" id="b_' + id + '" onclick="askPaid(\'' + id + '\')">확인</button>';
      h += '</div>';
    }
    h += '</div>';
  }
  if(T.lim > 0 && total > list.length){
    h += '<button class="more" onclick="more()">더 보기 &nbsp;·&nbsp; '
       +   (total - list.length) + '줄 남음</button>';
  }
  document.getElementById('rows').innerHTML = h;
}

/* 금액을 고르면 그 줄의 [확인]이 켜집니다 */
function pick(no){
  var s = document.getElementById('s_' + no);
  var b = document.getElementById('b_' + no);
  if(!s || !b) return;
  b.classList.toggle('on', !!s.value);
}

/* ── 확인 팝업 — 마지막 대조 ── */
function rowOf(no){
  for(var i=0;i<ALL.length;i++){ if(String(ALL[i].no) === String(no)) return ALL[i]; }
  return {};
}

function askPaid(no){
  var s = document.getElementById('s_' + no);
  if(!s || !s.value) return;                 /* 금액을 안 골랐으면 안 열립니다 */
  var amount = Number(s.value);
  var r = rowOf(no);
  var name = priceName(amount);
  PENDING = { no:no, amount:amount, name:name };

  var nm = String(r.payer || '').trim();
  var dup = nm ? (DUPES[nm] || 0) : 0;

  var b = '';
  if(dup > 1){
    b += '<div class="warn">같은 입금자명 ' + dup + '건이 기다립니다. '
       + '<b>은행과 접수시각</b>을 은행 문자와 맞춰 보셨습니까?</div>';
  }
  b += '<div class="dl">';
  b +=   '<div class="r"><span class="k">접수번호</span><span class="v big">' + esc(no) + '</span></div>';
  b +=   '<div class="r"><span class="k">입금자명</span><span class="v">' + esc(nm || '없음') + '</span></div>';
  b +=   '<div class="r"><span class="k">은행</span><span class="v">' + esc(r.bank || '-') + '</span></div>';
  b +=   '<div class="r"><span class="k">연락처 뒤 4자리</span><span class="v">' + esc(r.phone4 || '없음') + '</span></div>';
  b +=   '<div class="r"><span class="k">접수시각</span><span class="v">' + esc(r.when || '-') + '</span></div>';
  b +=   '<div class="r"><span class="k">받은 금액</span><span class="v big">' + won(amount) + '원</span></div>';
  b +=   '<div class="r"><span class="k">드릴 여행</span><span class="v">' + esc(name) + '</span></div>';
  b += '</div>';
  b += '<div class="mm">확인을 누르면 <b>마음 여행여권</b>이 발급됩니다.<br>문자는 보내지 않습니다. 손님이 접수번호로 찾아갑니다.</div>';

  document.getElementById('mTitle').textContent = '입금을 확인하셨습니까?';
  document.getElementById('mBody').innerHTML = b;

  var ok = document.getElementById('mOk');
  ok.disabled = false; ok.textContent = '확인 · 발급'; ok.onclick = doPaid;
  document.getElementById('mNo').disabled = false;
  document.getElementById('dim').classList.add('on');
}

function closeModal(){
  document.getElementById('dim').classList.remove('on');
  PENDING = null;
}
function endModal(ok, title, html){
  document.getElementById('mTitle').textContent = title;
  document.getElementById('mBody').innerHTML = html;
  ok.textContent = '닫기'; ok.disabled = false;
  ok.onclick = function(){ closeModal(); load(); };
  document.getElementById('mNo').disabled = false;
}

function doPaid(){
  if(!PENDING) return;
  var ok = document.getElementById('mOk');
  ok.disabled = true; ok.textContent = '발급 중…';
  document.getElementById('mNo').disabled = true;

  jsonp({ action:'adminPaid', key:KEY, orderNo:PENDING.no, amount:PENDING.amount },
    function(res){
      if(res && res.status === 'ok'){
        endModal(ok, '발급했습니다',
            '<div class="dl" style="text-align:center">'
          +   '<div style="font-size:22px;font-weight:900;color:#1E4A76;letter-spacing:1px;padding:8px 0">'
          +     esc(res.passport) + '</div>'
          +   '<div style="font-size:12px;color:#8B8371">' + esc(res.name || '') + '</div>'
          + '</div>'
          + '<div class="mm">손님이 접수번호로 들어오면 스스로 받아 갑니다.</div>');
      }else{
        endModal(ok, '발급하지 못했습니다',
          '<div class="mm">' + esc((res && res.msg) ? res.msg : '알 수 없는 오류입니다.') + '</div>');
      }
    },
    function(msg){
      endModal(ok, '발급하지 못했습니다', '<div class="mm">' + esc(msg) + '</div>');
    });
}

/* ── 진입 — ★주소에서 열쇠를 안 읽습니다. 이 기기에 저장된 것만. ── */
(function(){
  var k = readKey();
  if(k){ KEY = k; enter(); }
})();
</script>

</body>
</html>
