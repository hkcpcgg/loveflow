<!DOCTYPE html>
<!-- ★ 현재 버전 ▶ rec/index.html · 넘기는 문 v1 · 261116 · [우리이야기] S6 분리 — 우리 이야기는 https://uriyagi.kr/ 로 옮김(화면 v179부터 저장소 hkcpcgg/uriyagi). 옛 주소로 온 분은 뒤 꼬리(?g= · &f= · &r= · ?c= · ?plaza=1 …)를 그대로 붙여 새 주소로 · 이 휴대폰의 열쇠는 # 칸(서버로 안 감)에 실어 건네 다시 로그인 없이 이어짐 · ?hq=1 과 본부 카카오 로그인(state m=hq)은 /hq/ 로 · 그 밖 카카오 로그인 중이던 분은 새 주소에서 한 번 더 로그인 · 이 문은 없애지 않음(카톡방에 남은 옛 링크 · 붙인 QR). 이전 화면 원본(v178)은 hq/index.html 과 저장소 uriyagi 에. -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>우리 이야기</title>
<link rel="canonical" href="https://uriyagi.kr/">
<meta property="og:type" content="website">
<meta property="og:title" content="우리 이야기">
<meta property="og:description" content="모임 · 가게 · 마을의 사진과 기억을 함께 모으는 곳">
<meta property="og:image" content="https://www.loveflow.ai.kr/og-image.png">
<meta property="og:url" content="https://uriyagi.kr/">
<script>
(function(){
  var s=location.search||'', sp;
  try{ sp=new URLSearchParams(s); }catch(e){ sp={get:function(){ return null; }}; }
  if(sp.get('hq')==='1'){ location.replace('/hq/'+s+location.hash); return; }
  var code=sp.get('code'), st=null; try{ st=JSON.parse(sp.get('state')||'null'); }catch(e){}
  if((code||sp.get('error'))&&st&&st.m==='hq'){ location.replace('/hq/'+s); return; }
  var q=s; if(code||sp.get('error')){ q=(st&&st.g&&/^[a-f0-9]{32}$/i.test(st.g))?'?g='+st.g:''; }
  var h='';
  try{
    var k=localStorage.getItem('lf_rec_k')||'', ks=localStorage.getItem('lf_rec_keys')||'', lg=localStorage.getItem('lf_rec_lastg')||'';
    if(/^[a-f0-9]{32}$/.test(k)){ h='#k='+k+(ks&&ks.length<3000?'&ks='+encodeURIComponent(ks):'')+(/^[a-f0-9]{32}$/i.test(lg)?'&lg='+lg:''); }
  }catch(e){}
  location.replace('https://uriyagi.kr/'+q+h);
})();
</script>
<style>body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#FFFCF7;color:#2E3A46;display:grid;place-items:center;min-height:100vh;text-align:center}a{color:#1E4A76}</style>
</head>
<body>
<div><p>🍇 우리 이야기가 새 주소로 옮겼습니다.</p><p><a href="https://uriyagi.kr/">uriyagi.kr 로 가기 ›</a></p></div>
</body>
</html>
