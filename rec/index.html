<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>사랑흐름 · 함께 남기는 우리 기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#FDFBF5;color:#2b2b2b;font-family:'Noto Sans KR',system-ui,sans-serif;font-size:16px;line-height:1.65}
.app{max-width:560px;margin:0 auto;min-height:100vh}
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:10px 14px;background:#1E4A76;color:#fff}
.top img{height:32px;width:32px;background:#fff;border-radius:8px;padding:2px}
.top .nm{flex:1;min-width:0}
.top .nm b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .nm span{font-size:12px;opacity:.85}
.test{background:#FFF4D6;color:#7a5a12;font-size:12.5px;text-align:center;padding:5px 10px}
.wrap{padding:16px 16px 40px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:10px 6px;border-radius:11px;border:1.5px solid #d9cfb4;background:#fff;font-size:15px;cursor:pointer;font-family:inherit;color:#4a4335}
.tabs button.on{border-color:#1E4A76;background:#1E4A76;color:#fff;font-weight:700}
.tabs .dot{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:#C0392B;color:#fff;font-size:11.5px;margin-left:4px}
.card{background:#fff;border:1px solid #e8e0cc;border-radius:16px;padding:16px;margin-bottom:12px}
h1{font-family:'Noto Serif KR',serif;font-size:22px;color:#163a5e;line-height:1.4;margin-bottom:6px}
h2{font-family:'Noto Serif KR',serif;font-size:18px;color:#163a5e;margin-bottom:6px}
.lead{font-size:14px;color:#7d7465;word-break:keep-all}
label.f{display:block;font-weight:700;color:#163a5e;margin:12px 0 4px;font-size:15px}
label.f small{font-weight:400;color:#9a907e;font-size:12.5px;margin-left:4px}
input.t,textarea,select{width:100%;font-family:inherit;font-size:16px;padding:10px 12px;border:1.5px solid #d9cfb4;border-radius:11px;background:#fff;color:#2b2b2b}
textarea{min-height:90px;resize:vertical}
input.t:focus,textarea:focus,select:focus{outline:none;border-color:#1E4A76}
.btn{display:block;width:100%;padding:13px;border-radius:12px;border:1px solid #1E4A76;background:#1E4A76;color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:12px}
.btn.line{background:#fff;color:#1E4A76}
.btn:disabled{opacity:.45;cursor:default}
.sbtn{padding:7px 11px;border-radius:9px;border:1px solid #1E4A76;background:#fff;color:#1E4A76;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.sbtn.red{border-color:#B03A2E;color:#B03A2E}.sbtn.fill{background:#1E4A76;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{padding:6px 12px;border-radius:999px;border:1.5px solid #d9cfb4;background:#fff;font-size:14px;cursor:pointer;font-family:inherit;color:#4a4335}
.chip.on{border-color:#1E4A76;background:#EAF1F8;color:#1E4A76;font-weight:700}
.chip.add{border-style:dashed;color:#B8913A;border-color:#d9c38f}
.chip.cand{border-style:dashed}
.row{display:flex;gap:8px;align-items:center}
.row > *{flex:1}
.item{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid #e8e0cc;border-radius:14px;background:#fff;margin-bottom:8px;cursor:pointer}
.item .th{width:64px;height:64px;border-radius:10px;background:#F4EEE4 center/cover no-repeat;flex:none;display:flex;align-items:center;justify-content:center;color:#9a907e;font-size:12px;position:relative}
.item .th .yt{position:absolute;right:3px;bottom:3px;background:#C4302B;color:#fff;font-size:10px;border-radius:4px;padding:0 4px}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;color:#163a5e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tx span{font-size:13px;color:#7d7465}
.tag{display:inline-block;font-size:11.5px;border-radius:7px;padding:0 7px;font-weight:700;margin-left:4px;vertical-align:1px}
.t-wait{background:#FFF4D6;color:#7a5a12}.t-hide{background:#F6E1DE;color:#9a2f24}.t-on{background:#E7F5EC;color:#2f8a4c}
.t-own{background:#EAF1F8;color:#1E4A76}.t-oth{background:#F4EEE4;color:#6b5f48}
.year{font-size:13px;font-weight:700;color:#B8913A;margin:14px 0 6px;letter-spacing:.05em}
.media{width:100%;border-radius:12px;display:block;background:#F4EEE4;margin:8px 0}
.ytbox{position:relative;cursor:pointer}
.ytbox .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:44px;background:rgba(196,48,43,.92);border-radius:12px}
.ytbox .play:after{content:'';position:absolute;left:26px;top:13px;border-left:16px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent}
.ytnote{font-size:13px;color:#7d7465;text-align:center;margin-top:-2px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14.5px;margin:8px 0}
.facts dt{color:#9a907e}.facts dd{color:#2b2b2b;word-break:keep-all}
.facts dd.empty{color:#c2b8a3}
.mem{border-left:3px solid #d9c38f;padding:6px 10px;margin:8px 0;background:#FFFDF7;border-radius:0 10px 10px 0}
.mem b{font-size:13px;color:#B8913A}.mem p{font-size:15px;white-space:pre-wrap;word-break:keep-all}
.ask{border:1.5px dashed #d9c38f;border-radius:14px;padding:14px;background:#FFFDF7;margin-top:12px}
.ask .q{font-family:'Noto Serif KR',serif;font-size:17px;color:#163a5e;margin-bottom:8px;word-break:keep-all}
.note{font-size:13px;color:#7d7465;margin-top:6px;word-break:keep-all}
.msg{padding:28px 10px;text-align:center;color:#7d7465;word-break:keep-all}
.err{color:#B03A2E;font-size:14px;margin-top:8px;word-break:keep-all}
.ok{color:#2f8a4c;font-size:14px;margin-top:8px}
.seg{display:flex;border:1.5px solid #d9cfb4;border-radius:11px;overflow:hidden}
.seg button{flex:1;padding:9px 4px;border:none;background:#fff;font-family:inherit;font-size:14.5px;cursor:pointer;color:#4a4335}
.seg button+button{border-left:1.5px solid #d9cfb4}
.seg button.on{background:#1E4A76;color:#fff;font-weight:700}
.prev{max-width:100%;max-height:260px;border-radius:12px;display:block;margin:8px auto 0}
.back{background:none;border:none;color:#1E4A76;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:8px;padding:4px 0}
.qitem{border:1px solid #e8e0cc;border-radius:12px;padding:12px;margin-bottom:8px;background:#fff}
.qitem .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.foot{font-size:12px;color:#a59c8a;text-align:center;padding:20px 0 30px}
</style>
</head>
<body>
<div class="app">
  <div class="top"><img src="/logo.png" alt="사랑흐름"><div class="nm"><b id="comName">함께 남기는 우리 기록</b><span id="meName"></span></div></div>
  <div class="test">시험 화면 · 검증 2 — 시험이 끝나면 기록은 지울 수 있습니다</div>
  <div class="wrap" id="main"><div class="msg">열고 있어요…</div></div>
  <div class="foot">© 2026 사랑흐름 · LFRI™</div>
</div>
<script>
var GAS='https://script.google.com/macros/s/AKfycbxJSELNi3T6YXJP5qGuGcMAFPZBXsUOejNFNFLw0RDWX0qFJlOtVhV38QXWCTKTv6yA/exec';
var KEY='lf_rec_k', K='', ME=null, CATS=[], TAB='see', F={kind:'',made:'',cat:'',q:''}, ITEMS=[], QN=0, BUSY=false;
function $(i){ return document.getElementById(i); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function sget(k){ try{ return localStorage.getItem(k)||''; }catch(e){ return ''; } }
function sset(k,v){ try{ if(v){ localStorage.setItem(k,v); } else { localStorage.removeItem(k); } }catch(e){} }
/* 서버 — POST(text/plain)로 보내고 답을 읽음. 막히면 작은 요청은 JSONP 로 한 번 더 */
function api(p, cb){
  if(K && !p.k){ p.k=K; }
  var done=false; function fin(d){ if(done){return;} done=true; cb(d||{status:'err',msg:'지금은 이어지지 않아요. 잠시 후 다시 해 주세요.'}); }
  try{
    fetch(GAS,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)})
      .then(function(r){ return r.json(); }).then(fin)
      .catch(function(){ if(JSON.stringify(p).length<1800){ jsonp(p,fin); } else { fin(null); } });
  }catch(e){ jsonp(p,fin); }
  setTimeout(function(){ fin(null); }, 60000);
}
function jsonp(p, cb){
  var name='rcb_'+Date.now()+'_'+Math.floor(Math.random()*1e6), sc=document.createElement('script'), done=false;
  function fin(d){ if(done){return;} done=true; try{ delete window[name]; }catch(e){} try{ sc.parentNode.removeChild(sc); }catch(e){} cb(d); }
  window[name]=fin; sc.onerror=function(){ fin(null); };
  var q=[]; for(var k in p){ q.push(k+'='+encodeURIComponent(p[k])); }
  sc.src=GAS+'?'+q.join('&')+'&callback='+name+'&t='+Date.now(); document.body.appendChild(sc);
  setTimeout(function(){ fin(null); }, 25000);
}
function roleName(r){ return {'관리자':'관리자','확인자':'확인하는 분','올리는 사람':'올리는 분','참여자':'함께하는 분','보는 사람':'보는 분'}[r]||r; }
function isBoss(){ return ME && (ME.role==='관리자'||ME.role==='확인자'); }
function canAdd(){ return ME && (isBoss()||ME.role==='올리는 사람'); }
function canTell(){ return ME && ME.role!=='보는 사람'; }

/* ── 들어오기 ── */
function boot(){
  var sp=new URLSearchParams(location.search), g=(sp.get('g')||'').trim(), k=(sp.get('k')||'').trim();
  if(k){ sset(KEY,k.toLowerCase()); }
  if(k||g){ try{ history.replaceState(null,'',location.pathname+(g&&!k?'?g='+encodeURIComponent(g):'')); }catch(e){} }
  K=sget(KEY);
  if(K){ loadMe(g); return; }
  if(g){ joinForm(g); return; }
  $('main').innerHTML='<div class="msg">받으신 초대 링크로 들어와 주세요.<br>이 기록은 초대받은 분만 볼 수 있어요.</div>';
}
function joinForm(g, err){
  $('main').innerHTML='<div class="card"><h1>함께 남기는 우리 기록</h1><p class="lead">초대받은 분만 들어오는 곳이에요. 성명만 적으시면 이 기기에서 바로 이어집니다. 전화번호 · 연락처는 받지 않아요.</p>'+
    '<label class="f">성명</label><input class="t" id="jn" maxlength="20" autocomplete="name">'+
    '<label style="display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-size:15px"><input type="checkbox" id="ja" style="margin-top:6px;width:18px;height:18px"> 만 14세 이상입니다</label>'+
    '<button class="btn" id="jb">들어가기</button><div class="err" id="je">'+esc(err||'')+'</div></div>';
  $('jb').onclick=function(){
    var n=$('jn').value.trim(); if(!n){ $('je').textContent='성명을 적어 주세요.'; return; }
    if(!$('ja').checked){ $('je').textContent='만 14세 이상인지 확인해 주세요.'; return; }
    this.disabled=true; $('je').textContent='';
    api({action:'recJoin',g:g,name:n,age14:'1'},function(d){
      if(d.status==='ok'){ sset(KEY,d.key); K=d.key; try{ history.replaceState(null,'',location.pathname); }catch(e){} loadMe(); }
      else { $('jb').disabled=false; $('je').textContent=d.msg||'들어가지 못했어요.'; }
    });
  };
}
function loadMe(g){
  api({action:'recMe'},function(d){
    if(d.status!=='ok'){
      if(d.reason==='NO_KEY'){ sset(KEY,''); K=''; if(g){ joinForm(g); return; } }
      $('main').innerHTML='<div class="msg">'+esc(d.msg||'열지 못했어요.')+'</div>'; return;
    }
    ME=d; $('comName').textContent=d.comName||'함께 남기는 우리 기록'; $('meName').textContent=d.name+' · '+roleName(d.role);
    loadCats(function(){ show('see'); });
    if(isBoss()){ api({action:'recQueue'},function(q){ if(q.status==='ok'){ QN=q.items.length+q.links.length+(q.cats||[]).length; tabsDraw(); } }); }
  });
}
function loadCats(cb){ api({action:'recCats'},function(d){ CATS=(d.status==='ok')?d.items:[]; if(cb){cb();} }); }

/* ── 탭 ── */
function tabsHtml(){
  var t='<div class="tabs" id="tabs"><button data-t="see">모아 보기</button>';
  if(canAdd()){ t+='<button data-t="add">올리기</button>'; }
  if(isBoss()){ t+='<button data-t="chk">확인'+(QN?'<span class="dot">'+QN+'</span>':'')+'</button>'; }
  t+='<button data-t="me">내 것</button></div>'; return t;
}
function tabsDraw(){ var el=$('tabs'); if(!el){return;} el.outerHTML=tabsHtml(); bindTabs(); }
function bindTabs(){ var bs=$('tabs').querySelectorAll('button'); for(var i=0;i<bs.length;i++){ bs[i].classList.toggle('on',bs[i].getAttribute('data-t')===TAB); bs[i].onclick=function(){ show(this.getAttribute('data-t')); }; } }
function show(t){
  TAB=t; $('main').innerHTML=tabsHtml()+'<div id="body"></div>'; bindTabs(); window.scrollTo(0,0);
  if(t==='see'){ seeView(); } else if(t==='add'){ addView(); } else if(t==='chk'){ chkView(); } else { meView(); }
}

/* ── 모아 보기 ── */
function seeView(){
  var cats=CATS.filter(function(c){ return c.state==='사용'; });
  var h='<div class="row"><input class="t" id="fq" placeholder="찾기 — 이름 · 곳 · 해 · 한마디" value="'+esc(F.q)+'"><button class="sbtn fill" id="fgo" style="flex:none">찾기</button></div>'+
    '<div class="chips" id="fk">'+[['','전체'],['사진','사진'],['영상','영상'],['글','글']].map(function(x){ return '<button class="chip'+(F.kind===x[0]?' on':'')+'" data-v="'+x[0]+'">'+x[1]+'</button>'; }).join('')+'</div>';
  if(F.kind==='영상'){ h+='<div class="chips" id="fm">'+[['','모든 영상'],['직접 만든 영상','직접 만든 영상'],['다른 사람 영상','다른 사람 영상']].map(function(x){ return '<button class="chip'+(F.made===x[0]?' on':'')+'" data-v="'+x[0]+'">'+x[1]+'</button>'; }).join('')+'</div>'; }
  if(cats.length){ h+='<div class="chips" id="fc"><button class="chip'+(!F.cat?' on':'')+'" data-v="">모든 갈래</button>'+cats.map(function(c){ return '<button class="chip'+(F.cat===c.name?' on':'')+'" data-v="'+esc(c.name)+'">'+esc(c.name)+'</button>'; }).join('')+'</div>'; }
  h+='<div id="list"><div class="msg">불러오는 중…</div></div>';
  $('body').innerHTML=h;
  function chipBind(id,key){ var el=$(id); if(!el){return;} var bs=el.querySelectorAll('button'); for(var i=0;i<bs.length;i++){ bs[i].onclick=function(){ F[key]=this.getAttribute('data-v'); if(key==='kind'&&F.kind!=='영상'){ F.made=''; } seeView(); }; } }
  chipBind('fk','kind'); chipBind('fm','made'); chipBind('fc','cat');
  $('fgo').onclick=function(){ F.q=$('fq').value.trim(); seeView(); };
  $('fq').onkeydown=function(e){ if(e.key==='Enter'){ F.q=this.value.trim(); seeView(); } };
  var p={action:'recList',mode:'time'}; if(F.q){p.q=F.q;} if(F.kind){p.kind=F.kind;} if(F.made){p.made=F.made;} if(F.cat){p.cat=F.cat;}
  api(p,function(d){
    if(d.status!=='ok'){ $('list').innerHTML='<div class="msg">'+esc(d.msg||'불러오지 못했어요.')+'</div>'; return; }
    ITEMS=d.items; drawList($('list'), d.items, !F.q);
  });
}
function thumb(it){
  if(it.video){ return '<div class="th" style="background-image:url('+esc(it.video.thumb)+')"><span class="yt">영상</span></div>'; }
  if(it.photo){ return '<div class="th" data-ph="'+esc(it.id)+'">사진</div>'; }
  return '<div class="th">'+(it.kind==='기억'?'기억':'글')+'</div>';
}
function stTag(it){
  if(!it.state){ return ''; }
  var m={'기다림':'t-wait','가림':'t-hide','실림':'t-on','거둠':'t-hide'};
  return '<span class="tag '+(m[it.state]||'t-wait')+'">'+esc(it.state==='기다림'?'확인 기다림':it.state)+'</span>';
}
function drawList(el, items, byYear){
  if(!items.length){ el.innerHTML='<div class="msg">아직 볼 수 있는 기록이 없어요.'+(canAdd()?'<br>「올리기」에서 첫 기록을 남겨 주세요.':'')+'</div>'; return; }
  var h='', last=null;
  items.forEach(function(it){
    if(byYear){ var y=(it.y&&it.y<9999)?Math.floor(it.y)+'년':'때를 모르는 기록'; if(y!==last){ h+='<div class="year">'+y+'</div>'; last=y; } }
    var sub=[it.when,it.where,it.who].filter(Boolean).join(' · ')||(it.cat||'');
    h+='<div class="item" data-id="'+esc(it.id)+'">'+thumb(it)+'<div class="tx"><b>'+esc(it.title||'(제목 없음)')+stTag(it)+'</b><span>'+esc(sub)+(it.made?' <span class="tag '+(it.made==='직접 만든 영상'?'t-own':'t-oth')+'">'+esc(it.made==='직접 만든 영상'?'직접':'다른 사람')+'</span>':'')+'</span></div></div>';
  });
  el.innerHTML=h;
  var ds=el.querySelectorAll('.item'); for(var i=0;i<ds.length;i++){ ds[i].onclick=function(){ openItem(this.getAttribute('data-id')); }; }
  lazyPhotos(el);
}
var PHC={};
function lazyPhotos(el){
  var ts=el.querySelectorAll('[data-ph]'), i=0;
  (function next(){ if(i>=ts.length){return;} var t=ts[i++], id=t.getAttribute('data-ph');
    photo(id,function(src){ if(src){ t.style.backgroundImage='url('+src+')'; t.textContent=''; } next(); }); })();
}
function photo(id, cb){
  if(PHC[id]){ cb(PHC[id]); return; }
  api({action:'recPhoto',id:id},function(d){ if(d.status==='ok'){ PHC[id]='data:'+d.type+';base64,'+d.data; cb(PHC[id]); } else { cb(''); } });
}

/* ── 기록 하나 ── */
function openItem(id){
  $('main').innerHTML=tabsHtml()+'<div id="body"><div class="msg">여는 중…</div></div>'; bindTabs(); window.scrollTo(0,0);
  api({action:'recGet',id:id},function(d){
    if(d.status!=='ok'){ $('body').innerHTML='<button class="back" onclick="show(TAB)">← 목록</button><div class="msg">'+esc(d.msg||'볼 수 있는 기록이 아니에요.')+'</div>'; return; }
    var it=d.item, h='<button class="back" id="bk">← 목록</button><div class="card"><h2>'+esc(it.title||'(제목 없음)')+stTag(it)+'</h2>';
    if(it.video){
      h+='<div class="ytbox" id="yt"><img class="media" src="'+esc(it.video.thumb)+'" alt="영상 썸네일"><div class="play"></div></div><div class="ytnote">누르면 유튜브로 넘어갑니다 · '+esc(it.made||'')+'</div>';
    } else if(it.photo){ h+='<img class="media" id="ph" alt="사진" style="min-height:120px">'; }
    if(it.text){ h+='<p style="white-space:pre-wrap;margin:8px 0;word-break:keep-all">'+esc(it.text)+'</p>'; }
    h+='<dl class="facts">'+[['언제','when'],['어디서','where'],['누구와','who'],['무슨 일','what'],['갈래','cat']].map(function(x){ var v=it[x[1]]; return '<dt>'+x[0]+'</dt><dd'+(v?'':' class="empty"')+'>'+esc(v||'아직 몰라요')+'</dd>'; }).join('')+'</dl>';
    if(it.by){ h+='<div class="note">올린 분 · '+esc(it.by)+'</div>'; }
    h+='</div>';
    var mems=it.linked.filter(function(x){ return x.kind==='기억'; }), others=it.linked.filter(function(x){ return x.kind!=='기억'; });
    if(mems.length){ h+='<div class="card"><h2>이어진 기억</h2>'+mems.map(function(m){ return '<div class="mem"><b>'+esc(m.by||'')+(m.title&&m.title!=='저도 기억해요'?' · '+esc(m.title):'')+'</b>'+stTag(m)+'<p>'+esc(m.text)+'</p></div>'; }).join('')+
      (it.together.length?'<div class="note">함께 보탠 분들 · '+esc(it.together.join(' · '))+'</div>':'')+'</div>'; }
    if(others.length){ h+='<div class="card"><h2>함께 보면 좋은 기록</h2><div id="oth"></div></div>'; }
    if(canTell()){
      var q=it.next;
      h+='<div class="ask"><div class="q">'+esc(q?q.q:'이 기록에 대해 기억나는 것이 있으신가요?')+'</div><textarea id="tt" placeholder="떠오르는 대로 적어 주세요"></textarea><button class="btn" id="tb">기억 남기기</button><div class="note">남기신 기억은 확인한 뒤 함께 보입니다.</div><div id="tm"></div></div>';
    }
    h+='<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="sbtn red" id="td">내려 주세요</button>'+
      (ME && it.state && d.item.by===ME.name && it.state!=='거둠'?'<button class="sbtn" id="wd">내 기록 거두기</button>':'')+'</div>'+
      '<div class="note">「내려 주세요」를 누르시면 바로 가려집니다(나 · 가족이 나온 사진, 원치 않는 기록).'+(it.video?' 유튜브에 있는 영상 자체는 올린 분이 유튜브에서 지워야 합니다.':'')+'</div>';
    $('body').innerHTML=h;
    $('bk').onclick=function(){ show(TAB==='me'?'me':(TAB==='chk'?'chk':'see')); };
    if(it.video){ $('yt').onclick=function(){ if(confirm('유튜브로 넘어갑니다. 여시겠어요?')){ window.open(it.video.url,'_blank','noopener'); } }; }
    if(it.photo && !it.video){ photo(it.id,function(src){ if(src){ $('ph').src=src; $('ph').style.minHeight=''; } }); }
    if(others.length){ drawList($('oth'), others, false); }
    if($('tb')){ $('tb').onclick=function(){
      var tx=$('tt').value.trim(); if(!tx){ $('tm').innerHTML='<div class="err">기억을 적어 주세요.</div>'; return; }
      var b=this; b.disabled=true;
      api({action:'recTell',id:it.id,q:(it.next?it.next.no:''),text:tx},function(r){
        if(r.status==='ok'){ $('tt').value=''; $('tm').innerHTML='<div class="ok">담았어요. 확인한 뒤 함께 보입니다.'+(r.filled?' (「'+esc(r.filled)+'」 칸도 채웠어요)':'')+'</div>'; setTimeout(function(){ openItem(it.id); },1200); }
        else { b.disabled=false; $('tm').innerHTML='<div class="err">'+esc(r.msg||'담지 못했어요.')+'</div>'; }
      });
    }; }
    $('td').onclick=function(){
      var why=prompt('까닭을 짧게 적어 주세요 (예: 제 얼굴이 나와요)'); if(why===null){return;}
      api({action:'recTakeDown',id:it.id,why:why},function(r){ alert(r.status==='ok'?'바로 가렸어요. 관리자가 확인합니다.':(r.msg||'하지 못했어요.')); show('see'); });
    };
    if($('wd')){ $('wd').onclick=function(){ if(!confirm('이 기록을 거두시겠어요? 다른 분들에게 더 보이지 않습니다.')){return;} api({action:'recWithdraw',id:it.id},function(r){ alert(r.status==='ok'?'거두었어요.':(r.msg||'하지 못했어요.')); show('me'); }); }; }
  });
}

/* ── 올리기 ── */
var A={type:'사진',photo:'',src:'',scope:'공동체',cat:'',vsrc:''};
function addView(){
  A={type:A.type||'사진',photo:'',src:'',scope:'공동체',cat:'',vsrc:''};
  var h='<div class="card"><h2>기록 올리기</h2><p class="lead">사진 한 장, 영상 하나, 한마디면 충분해요. 나머지 칸은 함께 물으며 채워집니다.</p>'+
    '<div class="seg" id="ty" style="margin-top:12px">'+['사진','영상','글'].map(function(x){ return '<button data-v="'+x+'"'+(A.type===x?' class="on"':'')+'>'+x+'</button>'; }).join('')+'</div>'+
    '<div id="tyBox"></div>'+
    '<label class="f">제목 <small>짧게</small></label><input class="t" id="at" maxlength="60" placeholder="예: 운동회 날">'+
    '<label class="f">한마디 <small>적지 않으셔도 돼요</small></label><textarea id="ax" placeholder="이 기록에 얽힌 이야기"></textarea>'+
    '<label class="f">갈래</label><div class="chips" id="ac"></div><div id="acAdd"></div>'+
    '<details style="margin-top:12px"><summary style="cursor:pointer;color:#1E4A76;font-weight:700">아는 것이 있으면 더 적기 (언제 · 어디서 · 누구와 · 무슨 일)</summary>'+
    '<label class="f">언제</label><input class="t" id="aw" maxlength="80" placeholder="예: 1978년 가을">'+
    '<label class="f">어디서</label><input class="t" id="ap" maxlength="80">'+
    '<label class="f">누구와</label><input class="t" id="ah" maxlength="80">'+
    '<label class="f">무슨 일</label><input class="t" id="ae" maxlength="80"></details>'+
    '<label class="f">누구에게 보일까요</label><select id="as"><option value="공동체">우리 공동체 모두</option><option value="비공개">나만</option></select>'+
    '<button class="btn" id="ab">올리기</button><div id="am"></div><div class="note">올린 기록은 확인한 뒤 함께 보입니다. 바깥 주소(링크)는 넣을 수 없어요.</div></div>';
  $('body').innerHTML=h;
  var bs=$('ty').querySelectorAll('button'); for(var i=0;i<bs.length;i++){ bs[i].onclick=function(){ A.type=this.getAttribute('data-v'); addView(); }; }
  tyDraw(); catDraw();
  $('ab').onclick=addSend;
}
function tyDraw(){
  var b=$('tyBox'), h='';
  if(A.type==='사진'){
    h='<label class="f">사진</label><input type="file" id="af" accept="image/*"><img id="apv" class="prev" style="display:none" alt="">'+
      '<label class="f">이 사진은</label><div class="chips" id="asrc">'+['직접 찍음','가진 사진','바깥에서 가져옴','출처 모름','AI로 만들었다고 밝힘'].map(function(x){ return '<button class="chip" data-v="'+x+'">'+x+'</button>'; }).join('')+'</div>';
  } else if(A.type==='영상'){
    h='<label class="f">유튜브 주소 <small>쇼츠도 돼요</small></label><input class="t" id="av" inputmode="url" placeholder="https://youtube.com/shorts/…">'+
      '<img id="avp" class="prev" style="display:none" alt="">'+
      '<label class="f">이 영상은 <small>꼭 골라 주세요</small></label><div class="chips" id="avs">'+['직접 만든 영상','다른 사람 영상'].map(function(x){ return '<button class="chip" data-v="'+x+'">'+x+'</button>'; }).join('')+'</div>'+
      '<div class="note">영상은 유튜브에 그대로 두고, 여기에는 썸네일만 보입니다. 누르면 유튜브로 넘어갑니다. 「비공개」 영상은 열리지 않으니 「일부공개」나 「공개」로 올려 주세요.</div>';
  }
  b.innerHTML=h;
  function pick(id,key){ var el=$(id); if(!el){return;} var cs=el.querySelectorAll('.chip'); for(var i=0;i<cs.length;i++){ cs[i].onclick=function(){ A[key]=this.getAttribute('data-v'); for(var j=0;j<cs.length;j++){ cs[j].classList.toggle('on',cs[j]===this); } }; } }
  pick('asrc','src'); pick('avs','vsrc');
  if($('af')){ $('af').onchange=function(){ var f=this.files&&this.files[0]; if(!f){return;} shrink(f,function(u){ A.photo=u; $('apv').src=u; $('apv').style.display=u?'block':'none'; if(!u){ alert('이 사진은 열 수 없어요. 다른 사진을 골라 주세요.'); } }); }; }
  if($('av')){ $('av').oninput=function(){ var id=ytId(this.value); $('avp').style.display=id?'block':'none'; if(id){ $('avp').src='https://i.ytimg.com/vi/'+id+'/hqdefault.jpg'; } }; }
}
function ytId(s){
  s=String(s||'').trim(); if(/^[A-Za-z0-9_-]{11}$/.test(s)){ return s; }
  var m=/^(?:https?:\/\/)?(?:www\.|m\.|music\.)?(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/.exec(s);
  return m?m[1]:'';
}
function shrink(file, cb){
  var MAX=1600;
  function draw(img,w,h){ var r=Math.min(1,MAX/Math.max(w,h)), c=document.createElement('canvas'); c.width=Math.round(w*r); c.height=Math.round(h*r); c.getContext('2d').drawImage(img,0,0,c.width,c.height); cb(c.toDataURL('image/jpeg',0.82)); }
  if(window.createImageBitmap){ createImageBitmap(file,{imageOrientation:'from-image'}).then(function(b){ draw(b,b.width,b.height); }).catch(fallback); } else { fallback(); }
  function fallback(){ var u=URL.createObjectURL(file), im=new Image(); im.onload=function(){ draw(im,im.naturalWidth,im.naturalHeight); URL.revokeObjectURL(u); }; im.onerror=function(){ cb(''); }; im.src=u; }
}
/* 갈래 — 시트에 탭 더하듯 「+ 갈래 더하기」 */
function catDraw(){
  var el=$('ac'); if(!el){return;}
  el.innerHTML=CATS.map(function(c){ return '<button class="chip'+(c.state==='후보'?' cand':'')+(A.cat===c.name?' on':'')+'" data-v="'+esc(c.name)+'">'+esc(c.name)+(c.state==='후보'?' <small>(확인 전)</small>':'')+'</button>'; }).join('')+'<button class="chip add" id="acPlus">+ 갈래 더하기</button>';
  var cs=el.querySelectorAll('.chip:not(.add)'); for(var i=0;i<cs.length;i++){ cs[i].onclick=function(){ var v=this.getAttribute('data-v'); A.cat=(A.cat===v)?'':v; catDraw(); }; }
  $('acPlus').onclick=function(){
    $('acAdd').innerHTML='<div class="row" style="margin-top:8px"><input class="t" id="acN" maxlength="20" placeholder="새 갈래 이름 (예: 우리집 강아지)"><button class="sbtn fill" id="acB" style="flex:none">더하기</button></div><div class="note">'+(isBoss()?'더하시면 바로 모두의 갈래가 됩니다.':'더하시면 내 기록에는 바로 쓰이고, 다른 분들에게는 관리자가 확인한 뒤 보입니다.')+'</div><div id="acM"></div>';
    $('acN').focus();
    $('acB').onclick=function(){
      var n=$('acN').value.trim(); if(!n){return;}
      api({action:'recCatAdd',name:n},function(r){
        if(r.status==='ok'){ A.cat=r.name; loadCats(function(){ $('acAdd').innerHTML=''; catDraw(); }); }
        else { $('acM').innerHTML='<div class="err">'+esc(r.msg||'더하지 못했어요.')+'</div>'; }
      });
    };
  };
}
function addSend(){
  if(BUSY){return;}
  var p={action:'recAdd',title:$('at').value.trim(),text:$('ax').value.trim(),cat:A.cat,when:$('aw').value.trim(),where:$('ap').value.trim(),who:$('ah').value.trim(),what:$('ae').value.trim(),scope:$('as').value};
  var m=$('am');
  if(A.type==='사진'){ if(!A.photo){ m.innerHTML='<div class="err">사진을 골라 주세요.</div>'; return; } p.photo=A.photo; p.kind='사진'; if(A.src){ p.src=A.src; } }
  else if(A.type==='영상'){
    var v=$('av').value.trim(); if(!ytId(v)){ m.innerHTML='<div class="err">유튜브 주소(쇼츠 포함)를 붙여 주세요.</div>'; return; }
    if(!A.vsrc){ m.innerHTML='<div class="err">직접 만든 영상인지, 다른 사람 영상인지 골라 주세요.</div>'; return; }
    p.video=v; p.src=A.vsrc;
  } else { if(!p.title&&!p.text){ m.innerHTML='<div class="err">제목이나 한마디를 적어 주세요.</div>'; return; } p.kind='글'; }
  BUSY=true; $('ab').disabled=true; m.innerHTML='<div class="note">올리는 중…</div>';
  api(p,function(r){
    BUSY=false; $('ab').disabled=false;
    if(r.status==='ok'){ m.innerHTML='<div class="ok">올렸어요. 확인한 뒤 함께 보입니다.</div>'; if(isBoss()){ QN++; } setTimeout(function(){ show('me'); },1000); }
    else { m.innerHTML='<div class="err">'+esc(r.msg||'올리지 못했어요.')+'</div>'; }
  });
}

/* ── 내 것 ── */
function meView(){
  $('body').innerHTML='<div class="card"><h2>'+esc(ME.name)+' 님</h2><p class="lead">'+esc(roleName(ME.role))+' · 이 기기에서 이어집니다. 다른 기기에서는 받으신 초대 링크로 다시 들어오세요.</p></div><div id="mine"><div class="msg">불러오는 중…</div></div>'+
    '<button class="btn line" id="out" style="margin-top:20px">이 기기에서 나가기</button>';
  api({action:'recMe'},function(d){ if(d.status==='ok'){ ME=d; drawList($('mine'), d.mine, false); } });
  $('out').onclick=function(){ if(confirm('이 기기에서 나가시겠어요? 다시 들어오려면 초대 링크가 필요해요.')){ sset(KEY,''); location.href=location.pathname; } };
}

/* ── 확인(관리자 · 확인자) ── */
function chkView(){
  $('body').innerHTML='<div id="cq"><div class="msg">불러오는 중…</div></div>';
  api({action:'recQueue'},function(d){
    if(d.status!=='ok'){ $('cq').innerHTML='<div class="msg">'+esc(d.msg||'')+'</div>'; return; }
    QN=d.items.length+d.links.length+(d.cats||[]).length;
    var h='';
    if(!QN){ h='<div class="msg">확인할 것이 없어요.</div>'; }
    if(d.items.length){ h+='<h2 style="margin:4px 0 8px">기록 '+d.items.length+'</h2>'+d.items.map(function(it){
      return '<div class="qitem" data-id="'+esc(it.id)+'"><div class="item" style="margin:0;border:none;padding:0" data-open="'+esc(it.id)+'">'+thumb(it)+'<div class="tx"><b>'+esc(it.title||'(제목 없음)')+stTag(it)+'</b><span>'+esc(it.by||'')+(it.made?' · '+esc(it.made):'')+'</span></div></div>'+
        (it.text?'<p style="font-size:14px;margin-top:6px;white-space:pre-wrap">'+esc(it.text.slice(0,300))+'</p>':'')+
        (it.takeDown?'<div class="err">내려 주세요 · '+esc(it.takeDown)+'</div>':'')+
        '<div class="acts"><button class="sbtn fill" data-a="실음">실음</button><button class="sbtn" data-a="가림">가림</button>'+(ME.role==='관리자'?'<button class="sbtn red" data-a="지움">지움</button>':'')+'</div></div>'; }).join(''); }
    if(d.cats&&d.cats.length){ h+='<h2 style="margin:16px 0 8px">새 갈래 '+d.cats.length+'</h2>'+d.cats.map(function(c){ return '<div class="qitem" data-cat="'+esc(c.name)+'"><b>'+esc(c.name)+'</b> <span class="note">· '+esc(c.by||'')+' 님이 더함</span><div class="acts"><button class="sbtn fill" data-c="갈래 확인">모두의 갈래로</button><button class="sbtn" data-c="갈래 거둠">거둠</button></div></div>'; }).join(''); }
    if(d.links.length){ h+='<h2 style="margin:16px 0 8px">이어 보기 '+d.links.length+'</h2>'+d.links.map(function(l){ return '<div class="qitem" data-link="'+esc(l.no)+'">'+esc(l.a)+' — '+esc(l.rel)+' — '+esc(l.b)+'<div class="acts"><button class="sbtn fill" data-l="관계 확인">확인</button><button class="sbtn" data-l="관계 거둠">거둠</button></div></div>'; }).join(''); }
    $('cq').innerHTML=h; tabsDraw();
    lazyPhotos($('cq'));
    var os=$('cq').querySelectorAll('[data-open]'); for(var i=0;i<os.length;i++){ os[i].onclick=function(){ openItem(this.getAttribute('data-open')); }; }
    var as=$('cq').querySelectorAll('[data-a]'); for(var j=0;j<as.length;j++){ as[j].onclick=function(){
      var act=this.getAttribute('data-a'), id=this.closest('.qitem').getAttribute('data-id'), p={action:'recReview',act:act,id:id};
      if(act==='지움'&&!confirm('지우면 되돌릴 수 없어요. 사진도 함께 지웁니다. 지우시겠어요?')){return;}
      var go=function(){ api(p,function(r){ if(r.status==='ok'){ chkView(); } else if(r.reason==='TAKEDOWN'){ if(confirm(r.msg+'\n\n확인하셨으면 다시 실을까요?')){ p.force='1'; go(); } } else { alert(r.msg||'하지 못했어요.'); } }); };
      go();
    }; }
    var cs=$('cq').querySelectorAll('[data-c]'); for(var k=0;k<cs.length;k++){ cs[k].onclick=function(){ var n=this.closest('.qitem').getAttribute('data-cat'); api({action:'recReview',act:this.getAttribute('data-c'),name:n},function(){ loadCats(chkView); }); }; }
    var ls=$('cq').querySelectorAll('[data-l]'); for(var l=0;l<ls.length;l++){ ls[l].onclick=function(){ var n=this.closest('.qitem').getAttribute('data-link'); api({action:'recReview',act:this.getAttribute('data-l'),id:n},function(){ chkView(); }); }; }
  });
}
boot();
</script>
