:root{

.t-own{background:#EAF1F8;color:var(--navy)}.t-oth{background:var(--sand);color:#6B5F48}.t-ai{background:#F3EAF9;color:#6A3F94}

/* 공감 줄 (153) */
.ln{display:flex;align-items:center;gap:4px 10px;flex-wrap:wrap;margin-top:7px;font-size:13.5px;color:var(--sub)}
.ln > span{display:inline-flex;align-items:center;gap:4px}
.ln .g{color:var(--violet)}
.ln .when{margin-right:auto}
.ud{display:inline-flex;gap:6px}
.ud button{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 11px;font-size:13.5px;color:var(--sub);cursor:pointer;min-height:34px}
.ud button.on.up{border-color:var(--orange);color:var(--orange);background:#FFF5EC;font-weight:800}
.ud button.on.dn{border-color:#8A8F99;color:#4E5560;background:#F1F2F4;font-weight:800}
.ud button.on svg.i{fill:currentColor}

/* 오른쪽 아래 단추 */
.fab{position:fixed;right:max(16px,calc(50vw - 264px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:6px;height:54px;padding:0 20px 0 16px;border-radius:999px;border:none;background:var(--orange);color:#fff;font-size:16px;font-weight:800;box-shadow:0 8px 22px rgba(232,119,30,.38);cursor:pointer}
.fab svg.i{width:22px;height:22px;stroke-width:2.4}

/* 하위 화면 */
.sub{display:flex;align-items:center;gap:8px;padding:12px 0 6px}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:none;color:var(--navy);font-size:15.5px;font-weight:800;cursor:pointer;padding:6px 2px;min-height:40px}
.sub .grow{flex:1}
h2{font-family:var(--f-disp);font-size:19px;color:var(--navy2);text-wrap:balance}
.lead{font-size:14.5px;color:var(--sub)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.note{font-size:13.5px;color:var(--sub);margin-top:6px}
label.f{display:block;font-weight:700;color:var(--navy2);margin:14px 0 6px;font-size:15px}
label.f small{font-weight:400;color:#9A907E;font-size:12.5px;margin-left:4px}
input.t,textarea{width:100%;font-family:inherit;font-size:16px;padding:10px 12px;border:1.5px solid #DCCFB6;border-radius:12px;background:var(--paper);color:var(--ink)}
textarea{min-height:96px;resize:vertical}
input.t:focus,textarea:focus{outline:none;border-color:var(--navy)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:12px;border-radius:14px;border:1.5px solid var(--navy);background:var(--navy);color:#fff;font-size:16.5px;font-weight:800;cursor:pointer;margin-top:12px}
.btn.line{background:var(--paper);color:var(--navy)}
.btn.warm{background:var(--orange);border-color:var(--orange)}
.btn.red{background:var(--red);border-color:var(--red)}
.btn:disabled{opacity:.45;cursor:default}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair .btn{margin-top:0}

/* 말로 쓰기 (154) */
.mf{position:relative}
.mf textarea,.mf input.t{padding-right:58px}
.mic{position:absolute;right:6px;top:6px;width:44px;height:44px;border-radius:50%;border:none;background:#FFF0E3;color:var(--orange);display:grid;place-items:center;cursor:pointer}
.mic svg.i{width:22px;height:22px}
.mic.on{background:var(--orange);color:#fff;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,119,30,.45)}50%{box-shadow:0 0 0 10px rgba(232,119,30,0)}}
.voice{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:13px;color:var(--violet);background:#F4EFFB;border-radius:999px;padding:3px 11px}
.hear{font-size:13px;color:var(--orange);font-weight:700;margin-top:4px;min-height:20px}

/* 올리기 단계 (167) */
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:4px 0 14px}
.steps div{text-align:center;font-size:12px;color:#A99E89;line-height:1.3}
.steps div i{display:block;height:5px;border-radius:3px;background:#EADFCF;margin-bottom:5px}
.steps div.done i{background:var(--gold)}
.steps div.now i{background:var(--orange)}
.steps div.now{color:var(--orange);font-weight:800}
.steps div.done{color:var(--gold2)}
.kind{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kind button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 6px;border:1.5px solid var(--line);border-radius:16px;background:var(--paper);font-size:16px;font-weight:700;color:var(--ink);cursor:pointer}
.kind button small{font-size:12.5px;color:var(--sub);font-weight:400}
.kind button.on{border-color:var(--navy);background:#F6F9FC;color:var(--navy)}
.kmini{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.kmini button{display:flex;align-items:center;justify-content:center;gap:4px;min-height:42px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);font-size:14.5px;color:var(--ink);cursor:pointer}
.kmini button.on{border-color:var(--navy);background:var(--navy);color:#fff;font-weight:800}
.addp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.addp div{position:relative;aspect-ratio:1/1;border-radius:10px;background:var(--sand) center/cover no-repeat;cursor:zoom-in}
.addp div b{position:absolute;left:4px;bottom:4px;font-size:11px;background:rgba(255,255,255,.92);color:var(--navy2);border-radius:6px;padding:0 5px;font-weight:700}
.yearh{display:flex;align-items:center;gap:10px;margin:18px 0 10px;color:var(--gold2);font-weight:800;font-size:15px}
.yearh:before,.yearh:after{content:'';flex:1;height:1.5px;background:var(--gold)}
.sortb{flex:none;display:inline-flex;border:1.5px solid var(--gold);border-radius:999px;overflow:hidden;background:#FFFBF2}
.sortb button{border:none;background:none;font-size:13.5px;padding:5px 11px;color:var(--gold2);font-weight:700;cursor:pointer;white-space:nowrap}
.sortb button.on{background:var(--gold2);color:#fff}
.search{display:flex;align-items:center;height:42px;border:1.5px solid #DCCFB6;border-radius:999px;background:var(--paper);padding-left:14px;min-width:0}
.search:focus-within{border-color:var(--navy)}
.search input{flex:1;min-width:0;border:none;outline:none;background:none;font-family:inherit;font-size:15.5px;color:var(--ink)}
.search button{width:40px;height:38px;border:none;background:none;color:var(--navy);display:grid;place-items:center;cursor:pointer}
.qline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--sub);margin:-2px 0 12px}
.qline b{color:var(--navy2)}
.qex{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 12px}
.bo3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.bo3 button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 4px;border:1.5px solid var(--line);border-radius:14px;background:var(--paper);font-size:15px;font-weight:700;color:var(--ink);cursor:pointer}
.adl{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:8px;background:var(--soft)}
.adl .tx{min-width:0;flex:1}
.adl small{display:block;color:var(--sub);font-size:12.5px}
.ci{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;color:#fff}
.c-peach{background:#E8A07E}.c-rose{background:var(--rose)}.c-violet{background:var(--violet)}.c-navy{background:var(--navy)}.c-gold{background:var(--gold2)}.c-green{background:var(--green)}.c-gray{background:#9A907E}
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,252,247,.97);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.navbar .in{max-width:528px;margin:0 auto;display:grid;grid-template-columns:1fr 2fr;gap:10px}
.navbar .btn{margin-top:0}

/* 사진 한 줄에 한 장 (155) */
.prow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #F0E8DA}
.prow:last-child{border-bottom:none}
.prow .ph{width:78px;height:78px;border-radius:12px;background:var(--sand) center/cover no-repeat;flex:none;position:relative}
.prow .ph b{position:absolute;left:4px;top:4px;background:rgba(22,58,92,.8);color:#fff;font-size:11.5px;border-radius:6px;padding:0 6px}
.prow .ph button{position:absolute;right:-6px;top:-6px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:#3B4652;color:#fff;font-size:14px;line-height:1;cursor:pointer}
.dots{display:flex;flex-wrap:wrap;gap:6px;min-width:0;flex:1}
.dot{display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:none;cursor:pointer;font-size:11.5px;color:var(--sub);width:48px}
.dot i{width:30px;height:30px;border-radius:50%;border:2px solid #DCCFB6;background:var(--paper);display:grid;place-items:center}
.dot.on i{border-color:var(--navy);background:var(--navy)}
.dot.on i:after{content:'';width:10px;height:10px;border-radius:50%;background:#fff}
.dot.on{color:var(--navy);font-weight:800}
.allrow{background:#F6F9FC;border:1px solid #D9E4EF;border-radius:14px;padding:10px 12px;margin-bottom:6px}
.allrow b{font-size:14px;color:var(--navy)}
.pbig{border:1.5px dashed #DCCFB6;border-radius:16px;padding:18px;text-align:center;background:var(--soft)}

/* 네 칸 큰 단추 (154) */
.four{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.four button{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;min-height:118px;border:1.5px dashed #DCCFB6;border-radius:16px;background:var(--soft);cursor:pointer;text-align:left;color:var(--ink)}
.four button.on{border-style:solid;border-color:#E6CF9F;background:#FFF7E6}
.four button b{font-size:16px;color:var(--navy2)}
.four button span{font-size:14px;color:#B9AC93;line-height:1.45}
.four button.on span{color:var(--ink)}
.blanks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 4px}
.blank{border-radius:12px;padding:8px 10px;border:1.5px dashed #DCCFB6;background:var(--soft)}
.blank.on{border-style:solid;border-color:#E6CF9F;background:#FFF7E6}
.blank small{display:block;font-size:12px;color:var(--sub)}
.blank span{font-size:14.5px}
.blank:not(.on) span{color:#B9AC93}

/* 언제 (151) */
.dec{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dec button,.yrs button{min-height:48px;border:1.5px solid #DCCFB6;border-radius:12px;background:var(--paper);font-size:16px;color:var(--ink);cursor:pointer}
.dec button.on,.yrs button.on{border-color:var(--navy);background:var(--navy);color:#fff;font-weight:800}
.yrs{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.yrs button{font-size:15px;min-height:46px}
.season{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.season .chip{justify-content:center}
.wout{text-align:center;font-size:20px;font-weight:800;color:var(--navy);margin-top:12px;min-height:30px;font-family:var(--f-disp)}
.lab2{font-size:13.5px;font-weight:700;color:var(--sub);margin:14px 0 6px;display:block}
.wab{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14.5px;cursor:pointer}
.wab input{width:20px;height:20px}

/* 기록 하나 */
.big{padding:0;overflow:hidden}
.big .pad{padding:14px 16px}
.acts3{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.acts3 button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:11px 2px 10px;border:none;background:var(--paper);color:var(--navy);cursor:pointer;min-height:64px}
.acts3 button + button{border-left:1px solid var(--line)}
.acts3 button b{font-size:13.5px}
.acts3 button small{font-size:12px;color:var(--sub)}
.acts3 .rx{color:var(--rose)}
.acts3 .rx.on{background:#FFF4F7}
.acts3 .rx.on svg.i{fill:var(--rose)}
.grapes{display:flex;flex-wrap:wrap;gap:10px 14px;margin:10px 0 2px}
.grape{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--sub);min-width:46px}
.grape i{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#B79BE6,#7B5BBF 70%)}
.mem{border-left:3px solid var(--gold);padding:7px 11px;margin:9px 0;background:#FFFCF4;border-radius:0 12px 12px 0}
.mem b{font-size:13px;color:var(--gold2)}
.mem p{font-size:15px;white-space:pre-wrap}
.ask{border:1.5px solid #EBD7AE;border-radius:18px;padding:16px;background:linear-gradient(#FFFBF2,#FFF7EA)}
.ask .q{font-family:var(--f-disp);font-size:18px;color:var(--navy2);margin:2px 0 10px}
.delrow{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:14px;font-size:14px;color:var(--sub)}
.sbtn{padding:8px 13px;border-radius:10px;border:1.5px solid var(--navy);background:var(--paper);color:var(--navy);font-size:14px;font-weight:800;cursor:pointer;white-space:nowrap}
.sbtn.red{border-color:var(--red);color:var(--red)}
.big .g9 i{cursor:zoom-in}
.lkbig{display:block;border:1.5px solid #D9E4EF;border-radius:16px;margin:14px 16px 0;padding:2px 0 12px;background:#FAFCFE}

/* 판(아래에서 올라옴) */
.dim{position:fixed;inset:0;background:rgba(30,48,80,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--paper);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.mrow{display:flex;gap:12px;align-items:center;width:100%;padding:10px 4px;border:none;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;color:var(--ink)}
.mrow b{display:block;font-size:16px}
.mrow small{display:block;color:var(--sub);font-size:13px}
.lb img{width:100%;border-radius:14px;display:block}
.chk li{list-style:none;display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #F0E8DA;font-size:14.5px}
.chk li b{flex:none;color:var(--orange);font-variant-numeric:tabular-nums;width:34px}
.chk li span small{display:block;color:var(--sub);font-size:12.5px}
.safe{background:#F2F8F5;border:1px solid #CFE6DA;border-radius:14px;padding:10px 14px;font-size:13.5px;color:#2F5E49;margin-top:12px}
.safe b{display:block;font-size:13.5px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--paper);border:1.5px solid #EBD7AE;border-radius:16px;padding:12px 16px;box-shadow:0 8px 24px rgba(30,48,80,.15);z-index:200;text-align:center;min-width:260px;max-width:92vw}
.toast b{display:block;font-family:var(--f-disp);color:var(--navy2);font-size:16px}
.toast small{color:var(--orange);font-weight:800;font-size:13px}
.outv{text-align:center;padding:60px 10px}
.outv h2{margin:10px 0 6px}
.foot{font-size:12px;color:#A59C8A;text-align:center;padding:16px 0 10px}
@media (prefers-reduced-motion:reduce){.mic.on,.sheet{animation:none}}

/* ── v22 더한 것: 사랑흐름 틀(frame.js) 아래 붙기 · v21에서 가져온 부품 ── */
.lfx-tab{display:none!important}
html.lfx body{padding-bottom:0!important}
.head{top:52px}
.test{margin-inline:-16px}
.waitbox{text-align:center;padding:22px 6px 10px}.waitbox b{display:block;font-size:15px;color:var(--navy2);font-weight:700}
.msg{padding:26px 10px;text-align:center;color:var(--sub)}
.err{color:var(--red);font-size:14.5px;margin-top:8px}
.rnd.me .dot{position:absolute;top:-4px;right:-5px;min-width:20px;padding:0 5px;border-radius:10px;background:var(--orange);color:#fff;font-size:11.5px;font-weight:800;line-height:20px;border:2px solid #fff}
.pic.wait,.g9 i.wait{color:#C9BDA6}
.btn.kakao{background:#FEE500;border-color:#FEE500;color:#191919;font-size:17px;min-height:56px}
.btn.kakao svg{width:22px;height:22px;fill:#191919;stroke:none}
.kk-note{font-size:13.5px;color:var(--sub);text-align:center;margin-top:10px;line-height:1.6}
.joinhero{border-radius:18px;padding:16px;margin:14px 0;background:linear-gradient(135deg,#FFF6EA 0%,#FDF1E7 45%,#EEF3F8 100%);border:1px solid var(--line);text-align:center}
.joinhero .who{font-size:13px;color:var(--gold2);font-weight:700}
.joinhero h1{font-family:var(--f-disp);font-size:21px;color:var(--navy2)}
.joinhero .five{font-size:13px;color:var(--sub)}.joinhero .five b{color:var(--orange)}
.busy{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:16px;padding:12px 18px 10px;box-shadow:0 8px 24px rgba(30,48,80,.25);z-index:3100;text-align:center;min-width:240px;max-width:92vw}
.busy b{display:block;font-size:15.5px;font-weight:700}
.busy .lf-wave{height:18px;margin-top:6px}
.tag.t-wait{background:#FFF1DC;color:#9A5B12}.tag.t-hide{background:#F6E1DE;color:#9a2f24}.tag.t-on{background:#E3F4EC;color:#16795A}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #EFE8DA}
.sw:last-child{border-bottom:none}
.sw b{display:block;font-size:15.5px}.sw small{display:block;color:var(--sub);font-size:13px}
.tg{flex:none;width:52px;height:30px;border-radius:15px;border:none;background:#D9D2C3;position:relative;cursor:pointer}
.tg::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.tg.on{background:var(--green)}.tg.on::after{left:25px}
.tg:disabled{opacity:.5}
.qitem{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;background:var(--paper)}
.qitem .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.item{display:flex;gap:12px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:16px;background:var(--paper);margin-bottom:8px;cursor:pointer}
.item .th{width:68px;height:68px;border-radius:12px;background:var(--sand) center/cover no-repeat;flex:none;display:grid;place-items:center;color:#B9AC93;position:relative}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;color:var(--navy2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
.item .tx .s2{font-size:13px;color:var(--sub);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl1{border-radius:14px;background:#F7F4EE;padding:9px 12px;margin-bottom:8px}
.tl1.me{background:#EEF4FA}
.th1{display:flex;align-items:center;gap:8px}
.th1 b{font-size:14px;color:var(--navy2)}
.th1 small{font-size:12px;color:var(--sub)}
.tdel{margin-left:auto;border:none;background:none;color:var(--sub);font-family:inherit;font-size:12.5px;text-decoration:underline;cursor:pointer}
.tl1 p{font-size:15px;white-space:pre-wrap}
.rnames{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--rose);margin:-4px 4px 12px}
.grape.new i{animation:fill 3.2s ease-out both}
@keyframes fill{0%{transform:scale(.3);opacity:.2}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.big img.media{width:100%;display:block;max-height:70vh;object-fit:contain;background:var(--sand)}
.linkbox{font-size:13.5px;word-break:break-all;background:#F6F9FC;border:1px solid #D9E4EF;border-radius:12px;padding:10px 12px;margin-top:8px}
.foot2{margin-top:18px}
@media (prefers-reduced-motion:reduce){.grape.new i{animation:none}}
[hidden]{display:none!important}
/* ── v26 첫 머리 · 새 소식 · 퍼짐 ── */
.hero{border-radius:20px;padding:18px 16px 16px;margin:6px 0 14px;background:linear-gradient(160deg,#FFF4E4 0%,#FDEFE6 50%,#EAF1F8 100%);border:1px solid var(--line);text-align:center}
.hero .hk{font-size:13px;color:var(--gold2);font-weight:700;letter-spacing:.02em}

  setTimeout(function(){ fin(null); },25000);
}

  el.innerHTML='<div class="card"><h2>대표 사진 <small style="font-family:var(--f-body);font-size:13px;color:var(--sub);font-weight:400" id="bN">'+BPICK.length+' / 6</small></h2><p class="lead">첫 화면 맨 위 6칸입니다. 누르는 차례대로 1~6번 자리에 놓입니다. 다시 누르면 빠집니다. 비워 두면 기억이 많이 달린 사진이 저절로 놓입니다.</p><div id="bG"></div><div class="pair" style="margin-top:10px"><button class="btn line" id="bClr" type="button">모두 비우기</button><button class="btn" id="bOk" type="button">저장</button></div></div>';
  wait($('bG'),'사진을 모으는 중입니다');
  api({action:'recList',grid:'1',lite:'1',mode:'new',n:'30',from:'0'},function(d){ if(VIEW!=='deco'){ return; } BCAND=(d.items||[]).filter(function(x){ return !x.state||x.state==='실림'; });
    var have={}; BCAND.forEach(function(x){ have[x.id]=1; }); BPICK=BPICK.filter(function(id){ return have[id]; }); bestGrid(); });
  $('bClr').onclick=function(){ BPICK=[]; bestGrid(); };
  $('bOk').onclick=function(){ var b=this; b.disabled=true; api({action:'recComSet',best:BPICK.join(','),_busy:'대표 사진을 거는 중입니다'},function(r){ b.disabled=false; if(r.status!=='ok'){ toast(r.msg||'걸지 못했습니다'); return; } DECO.c=r; homeDirty(); toast(BPICK.length?'대표 사진 '+BPICK.length+'장을 걸었습니다':'대표 사진을 비웠습니다','첫 화면에 바로 실립니다'); }); };
}
function bestGrid(){
  var g=$('bG'); if(!g){ return; }
  if(!BCAND.length){ g.innerHTML='<p class="note">공개된 사진 · 영상이 아직 없습니다.</p>'; return; }
  g.innerHTML='<div class="tgrid">'+BCAND.map(function(it){ var n=BPICK.indexOf(it.id); return tile(it,false,'').replace('class="tl','class="tl pk'+(n>-1?' on':'')).replace('</button>',(n>-1?'<span class="pn">'+(n+1)+'</span>':'')+'</button>'); }).join('')+'</div>';
  $('bN').textContent=BPICK.length+' / 6';
  each(g,'[data-tid]',function(t){ t.onclick=function(){ var id=t.getAttribute('data-tid'), n=BPICK.indexOf(id); if(n>-1){ BPICK.splice(n,1); } else { if(BPICK.length>=6){ toast('대표 사진은 6장까지입니다','먼저 하나를 눌러 빼 주십시오'); return; } BPICK.push(id); } bestGrid(); }; });
  pvLoad(g);
}
function txDraw(){
  var el=$('dTx'); if(!el||!DECO){ return; } var g=DECO.g, c=DECO.c;
  var F5=[['tIn','소개 한 줄','바로가기 위에 한 줄','intro',g.intro||'',60,'go'],['tOut','나갈 문구','바로가기를 누를 때 잠깐 보임','outText',g.outText||'',80,'go'],['tBack','돌아올 문구','바깥에서 돌아왔을 때 보임','backText',g.backText||'',80,'go'],
    ['tBt','대표 사진 문구','첫 칸 사진 위 한 줄 · 비우면 「아는 분 계세요?」','bestText',c.bestText||'',60,'com'],['tInv','초대 문구','카톡으로 보낼 때 링크 위에 붙는 글','invText',c.invText||'',500,'com']];
  el.innerHTML='<div class="card"><h2>문구</h2>'+F5.map(function(x){ return '<label class="f">'+x[1]+' <small>'+x[2]+'</small></label>'+(x[5]>100?'<textarea id="'+x[0]+'" maxlength="'+x[5]+'" style="min-height:90px">'+esc(x[4])+'</textarea>':'<input class="t" id="'+x[0]+'" maxlength="'+x[5]+'" value="'+esc(x[4])+'">'); }).join('')+
    '<button class="btn" id="txOk" type="button" style="margin-top:12px">문구 저장</button></div>';
  $('txOk').onclick=function(){ var b=this, pg={action:'recGoSet',act:'text'}, pc={action:'recComSet'};
    F5.forEach(function(x){ (x[6]==='go'?pg:pc)[x[3]]=$(x[0]).value.trim(); }); b.disabled=true;
    api(pg,function(r1){ if(r1.status!=='ok'){ b.disabled=false; toast(r1.msg||'저장하지 못했습니다'); return; } DECO.g=r1; if(ME){ ME.intro=r1.intro; ME.outText=r1.outText; ME.backText=r1.backText; }
      api(pc,function(r2){ b.disabled=false; if(r2.status!=='ok'){ toast(r2.msg||'저장하지 못했습니다'); return; } DECO.c=r2; if(ME){ ME.bestText=r2.bestText; ME.invText=r2.invText; } homeDirty(); toast('문구를 저장했습니다','첫 화면에 바로 실립니다'); }); }); };
}

/* ══ 승인 관리(관리자 · 확인자 — v26: 새 분 · 멈춘 분 더함) ══ */
function chkView(){
  $('body').innerHTML='<div id="cq"></div>'; wait($('cq'),'확인할 기록을 모으는 중입니다');
  api({action:'recQueue'},function(d){
    if(VIEW!=='chk'){ return; }
    if(d.status!=='ok'){ $('cq').innerHTML='<div class="msg">'+esc(d.msg||'')+'</div>'; return; }
    var PP=d.people||[]; QN=d.items.length+d.links.length+(d.cats||[]).length+PP.length;
    var h='';
    if(!QN){ h='<div class="card" style="text-align:center"><h2>승인 대기 중인 기록이 없습니다</h2><p class="lead">새 기록이 들어오면 여기에 숫자가 뜹니다.</p></div>'; }
    var waitN=d.items.filter(function(it){ return it.state==='기다림'&&!it.takeDown; }).length+(d.cats||[]).length+d.links.length;
    if(waitN){ h+='<button class="btn" id="allOk" type="button" style="margin:0 0 14px">'+ic('check')+'모두 승인 ('+waitN+')</button>'; }
    if(PP.length){ h+='<h2 style="margin:4px 0 8px">등록 신청 · 작성 제한 '+PP.length+'</h2>'+PP.map(function(x){ return '<div class="qitem"><b>'+esc(x.name||'(이름 없음)')+'</b> '+(x.wait?'<span class="tag t-wait">등록 신청</span>':'<span class="tag t-hide">작성 제한</span>')+'<p class="note" style="margin-top:4px">'+(x.rel?'관계 · '+esc(x.rel):'관계 미입력')+(x.by?' · '+esc(byTxt(x.by)):'')+(x.stop&&!x.wait?' · 삭제 요청 2건':'')+'</p><div class="acts">'+(x.wait?'<button type="button" class="sbtn" style="background:var(--navy);color:#fff" data-pok="'+esc(x.no)+'" data-act="받기">승인</button>':'<button type="button" class="sbtn" data-pok="'+esc(x.no)+'" data-act="풀기">제한 해제</button>')+(ME.role==='관리자'?'<button type="button" class="sbtn red" data-pout="'+esc(x.no)+'" data-nm="'+esc(x.name||'')+'">내보내기</button>':'')+'</div></div>'; }).join('')+'<div style="height:10px"></div>'; }
    if(d.items.length){ h+='<h2 style="margin:4px 0 8px">승인 대기 기록 · 기억 '+d.items.length+'</h2>'+d.items.map(function(it){
      var th=it.video?'<div class="th" style="background-image:url('+esc(it.video.thumb)+')"></div>':(it.photo?'<div class="th" data-ph="'+esc(it.id)+'" data-small="1"'+(it.pv?' style="background-image:url('+it.pv+')"':'')+'></div>':'<div class="th">'+ic(it.kind==='기억'?'talk':it.kind==='링크'?'link':'text')+'</div>');
      return '<div class="qitem" data-id="'+esc(it.id)+'"><div class="item" style="margin:0;border:none;padding:0" data-open="'+esc(it.id)+'">'+th+'<div class="tx"><b>'+esc(it.title||'(제목 없음)')+stTag(it)+'</b><span class="s2">'+esc(it.by||'')+(it.kind==='링크'&&it.link?' · '+esc(it.link.dom):'')+(it.made?' · '+esc(srcL(it.made)):'')+(it.src?' · '+esc(srcL(it.src)):'')+(it.from?' · 보탠 것':'')+'</span></div></div>'+
        (it.text?'<p style="font-size:14.5px;margin-top:6px;white-space:pre-wrap">'+esc(it.text.slice(0,300))+'</p>':'')+
        (it.takeDown?'<div class="err"><b>삭제 요청</b> · '+esc(it.takeDown)+'</div>':'')+
        '<div class="acts"><button type="button" class="sbtn" style="background:var(--navy);color:#fff" data-a="실음">승인</button><button type="button" class="sbtn" data-a="가림">비공개</button>'+(ME.role==='관리자'?'<button type="button" class="sbtn red" data-a="지움">삭제</button>':'')+'</div></div>'; }).join(''); }
    if(d.cats&&d.cats.length){ h+='<h2 style="margin:16px 0 8px">새 분류 '+d.cats.length+'</h2>'+d.cats.map(function(c){ return '<div class="qitem" data-cat="'+esc(c.name)+'"><b>'+esc(c.name)+'</b> <span class="note">· '+esc(c.by||'')+' 님이 더함</span><div class="acts"><button type="button" class="sbtn" style="background:var(--navy);color:#fff" data-c="갈래 확인">승인</button><button type="button" class="sbtn" data-c="갈래 거둠">반려</button></div></div>'; }).join(''); }
    if(d.links.length){ h+='<h2 style="margin:16px 0 8px">연결된 기록 '+d.links.length+'</h2>'+d.links.map(function(l){ return '<div class="qitem" data-link="'+esc(l.no)+'">'+esc(l.a)+' — '+esc(l.rel)+' — '+esc(l.b)+'<div class="acts"><button type="button" class="sbtn" style="background:var(--navy);color:#fff" data-l="관계 확인">승인</button><button type="button" class="sbtn" data-l="관계 거둠">반려</button></div></div>'; }).join(''); }
    $('cq').innerHTML=h; drawBadge(); lazyPhotos($('cq'));
    if($('allOk')){ $('allOk').onclick=function(){ var b=this; sheet('<h2>모두 승인</h2><p class="lead" style="margin-top:6px">승인 대기 '+waitN+'건을 모두 승인합니다. 삭제 요청이 들어온 기록은 그대로 남습니다.</p><div class="pair" style="margin-top:16px"><button class="btn line" id="aaNo" type="button">취소</button><button class="btn" id="aaGo" type="button">모두 승인</button></div>',function(){ $('aaNo').onclick=closeSheet; $('aaGo').onclick=function(){ closeSheet(); b.disabled=true; api({action:'recApproveAll'},function(r){ if(r.status==='ok'){ toast('모두 승인했습니다',(r.n+r.cats+r.links)+'건'+(r.skip?' · 삭제 요청 '+r.skip+'건은 남김':'')); LKEY=''; loadCats(chkView); } else { b.disabled=false; toast(r.msg||'처리하지 못했습니다'); } }); }; }); }; }
    each($('cq'),'[data-pok]',function(b){ b.onclick=function(){ b.disabled=true; api({action:'recPersonOk',no:b.getAttribute('data-pok'),act:b.getAttribute('data-act')},function(r){ if(r.status==='ok'){ toast(b.getAttribute('data-act')==='받기'?'등록을 승인했습니다':'작성 제한을 해제했습니다'); chkView(); } else { b.disabled=false; toast(r.msg||'처리하지 못했습니다'); } }); }; });
    each($('cq'),'[data-pout]',function(b){ b.onclick=function(){ outSheet(b.getAttribute('data-pout'),b.getAttribute('data-nm'),chkView); }; });
    each($('cq'),'[data-open]',function(o){ o.onclick=function(){ go('item',o.getAttribute('data-open')); }; });
    each($('cq'),'[data-a]',function(a){ a.onclick=function(){
      var act=a.getAttribute('data-a'), id=a.closest('.qitem').getAttribute('data-id'), p={action:'recReview',act:act,id:id};
      if(act==='지움'&&!confirm('삭제하면 되돌릴 수 없습니다. 사진도 함께 삭제됩니다. 삭제하시겠습니까?')){ return; }
      var send=function(){ api(p,function(r){ if(r.status==='ok'){ LKEY=''; chkView(); } else if(r.reason==='TAKEDOWN'){ if(confirm('삭제 요청이 있는 기록입니다.\n\n확인하셨으면 다시 공개하시겠습니까?')){ p.force='1'; send(); } } else { toast(r.msg||'처리하지 못했습니다'); } }); };
      send();
    }; });
    each($('cq'),'[data-c]',function(c){ c.onclick=function(){ var n=c.closest('.qitem').getAttribute('data-cat'); api({action:'recReview',act:c.getAttribute('data-c'),name:n},function(){ loadCats(chkView); }); }; });
    each($('cq'),'[data-l]',function(l){ l.onclick=function(){ var n=l.closest('.qitem').getAttribute('data-link'); api({action:'recReview',act:l.getAttribute('data-l'),id:n},function(){ chkView(); }); }; });
  });
}
