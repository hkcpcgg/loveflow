<style>
/* 레이아웃: rec v21 화면 틀 그대로(위 한 줄 · 큰 카드 · 오른쪽 아래 「기록 남기기」) — 사랑흐름 색(딥네이비 틀 · 골드 · 주황) · 밝은 한 가지 모습으로 고정 */
:root{
  --navy:#1E4A76;--navy2:#163A5C;--gold:#C9A96E;--gold2:#C0872E;--orange:#E8771E;--rose:#C25B7C;--violet:#7B5BBF;--green:#1D9E75;--red:#B03A2E;
  --cream:#FFFCF7;--sand:#F4EEE4;--paper:#FFFFFF;--ink:#2E3A46;--sub:#7D7465;--line:#EADFCF;--soft:#FFFDF8;
  --f-body:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;
  --f-disp:'Noto Serif KR','Nanum Myeongjo',serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere}
button{font-family:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:14px;height:14px;stroke-width:2}
svg.i.lg{width:30px;height:30px;stroke-width:1.6}

/* 시험판 띠 */
.test{margin-inline:-16px;background:#FFF4D6;color:#7A5A12;font-size:13px;display:flex;align-items:center;gap:8px;padding:6px 16px}
.test span{flex:1;min-width:0}
.test button{flex:none;border:1.5px solid #D9B65E;background:#FFFBEA;color:#7A5A12;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:800;cursor:pointer}

/* 위 한 줄 */
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;margin:0 -16px 12px;background:rgba(255,252,247,.97);border-bottom:1px solid var(--line)}
.bar{display:grid;grid-template-columns:42px 1fr 42px;gap:10px;align-items:center;padding:9px 16px 7px}
.rnd{width:42px;height:42px;border-radius:50%;border:none;display:grid;place-items:center;cursor:pointer;position:relative}
.rnd.home{background:#FFF3DE;color:var(--gold2);box-shadow:inset 0 0 0 1.5px #EBD7AE}
.rnd.me{background:var(--navy);color:#fff;font-size:17px;font-weight:800}
.ttl{text-align:center;font-family:var(--f-disp);font-weight:700;color:var(--navy2);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip{display:flex;gap:7px;overflow-x:auto;padding:2px 16px 10px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:999px;border:1.5px solid #DCCFB6;background:var(--paper);font-size:14.5px;cursor:pointer;color:var(--ink);line-height:1.3;white-space:nowrap}
.chip.on{border-color:var(--navy);background:var(--navy);color:#fff;font-weight:700}
.chip.s{padding:5px 11px;font-size:13.5px}

/* 큰 카드 */
.fc{background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:16px;cursor:pointer;box-shadow:0 2px 10px rgba(30,48,80,.05)}
.pic{position:relative;aspect-ratio:4/3;max-width:100%;background:var(--sand) center/cover no-repeat}
.pic .badge{position:absolute;left:10px;bottom:10px;background:rgba(22,58,92,.84);color:#fff;font-size:12px;border-radius:8px;padding:2px 8px}
.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:44px;background:rgba(211,58,44,.94);border-radius:13px}
.play:after{content:'';position:absolute;left:25px;top:12px;border-left:17px solid #fff;border-top:10px solid transparent;border-bottom:10px solid transparent}
.vid{background:linear-gradient(135deg,#3A4A5E,#1F2B3A)}
.g9{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--paper);position:relative}
.g9 i{aspect-ratio:1/1;background:var(--sand) center/cover no-repeat;display:block}
.g9 .badge{position:absolute;right:8px;bottom:8px;left:auto;background:rgba(22,58,92,.84);color:#fff;font-size:12px;border-radius:8px;padding:2px 8px}
.meta{padding:11px 15px 13px}
.meta > b{display:block;font-size:17px;color:var(--navy2);line-height:1.4}
.s2{font-size:13.5px;color:var(--sub)}
/* 글 카드 (156) */
.txt{padding:20px 18px 6px;background:linear-gradient(160deg,#FFF6EA,#FFFDF8 60%)}

.txt h3{font-family:var(--f-disp);font-size:20px;color:var(--navy2);margin:4px 0 6px;text-wrap:balance;line-height:1.4}
.txt p{font-family:var(--f-disp);font-size:17px;line-height:1.8;color:#3B4652;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.txt p.open{display:block}
.more{border:none;background:none;color:var(--navy);font-weight:800;font-size:14.5px;padding:6px 0 8px;cursor:pointer}
/* 링크 카드 (164) */
.lk{display:flex;gap:12px;padding:16px 15px 6px;align-items:flex-start}
.lk .fav{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;flex:none}
.lk .tx{min-width:0;flex:1}
.lk .dom{font-size:12.5px;color:var(--sub);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.lk h3{font-size:17px;color:var(--navy2);line-height:1.4;margin:2px 0}
.lk p{font-size:14.5px;color:var(--ink)}
.tag{display:inline-block;font-size:11.5px;border-radius:7px;padding:0 7px;font-weight:700;vertical-align:1px}
.t-out{background:#EEF2F7;color:#40566E;border:1px dashed #9BB0C6}
.t-own{background:#EAF1F8;color:var(--navy)}.t-oth{background:var(--sand);color:#6B5F48}.t-ai{background:#F3EAF9;color:#6A3F94}

/* 공감 줄 (153) */
.ln{display:flex;align-items:center;gap:4px 10px;flex-wrap:wrap;margin-top:7px;font-size:13.5px;color:var(--sub)}
.ln > span{display:inline-flex;align-items:center;gap:4px}
.ln .g{color:var(--violet)}
.ln .when{margin-right:auto}
.ud{display:inline-flex;gap:6px}
.ud button{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 11px;font-size:13.5px;color:var(--sub);cursor:pointer;min-height:34px}
.ud button.on.up{border-color:var(--orange);color:var(--orange);background:#FFF5EC;font-weight:800}
.ud button.on.dn{border-color:#8A8F99;color:#4E5560;background:#F1F2F4;font-weight:800}
.ud button.on svg.i{fill:currentColor}

/* 오른쪽 아래 단추 */
.fab{position:fixed;right:max(16px,calc(50vw - 264px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:6px;height:54px;padding:0 20px 0 16px;border-radius:999px;border:none;background:var(--orange);color:#fff;font-size:16px;font-weight:800;box-shadow:0 8px 22px rgba(232,119,30,.38);cursor:pointer}
.fab svg.i{width:22px;height:22px;stroke-width:2.4}

/* 하위 화면 */
.sub{display:flex;align-items:center;gap:8px;padding:12px 0 6px}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:none;color:var(--navy);font-size:15.5px;font-weight:800;cursor:pointer;padding:6px 2px;min-height:40px}
.sub .grow{flex:1}
h2{font-family:var(--f-disp);font-size:19px;color:var(--navy2);text-wrap:balance}
.lead{font-size:14.5px;color:var(--sub)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.note{font-size:13.5px;color:var(--sub);margin-top:6px}
label.f{display:block;font-weight:700;color:var(--navy2);margin:14px 0 6px;font-size:15px}
label.f small{font-weight:400;color:#9A907E;font-size:12.5px;margin-left:4px}
input.t,textarea{width:100%;font-family:inherit;font-size:16px;padding:10px 12px;border:1.5px solid #DCCFB6;border-radius:12px;background:var(--paper);color:var(--ink)}
textarea{min-height:96px;resize:vertical}
input.t:focus,textarea:focus{outline:none;border-color:var(--navy)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:12px;border-radius:14px;border:1.5px solid var(--navy);background:var(--navy);color:#fff;font-size:16.5px;font-weight:800;cursor:pointer;margin-top:12px}
.btn.line{background:var(--paper);color:var(--navy)}
.btn.warm{background:var(--orange);border-color:var(--orange)}

.btn:disabled{opacity:.45;cursor:default}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair .btn{margin-top:0}

/* 말로 쓰기 (154) */
.mf{position:relative}
.mf textarea,.mf input.t{padding-right:58px}
.mic{position:absolute;right:6px;top:6px;width:44px;height:44px;border-radius:50%;border:none;background:#FFF0E3;color:var(--orange);display:grid;place-items:center;cursor:pointer}
.mic svg.i{width:22px;height:22px}
.mic.on{background:var(--orange);color:#fff;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,119,30,.45)}50%{box-shadow:0 0 0 10px rgba(232,119,30,0)}}
.voice{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:13px;color:var(--violet);background:#F4EFFB;border-radius:999px;padding:3px 11px}

/* 올리기 단계 (167) */
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:4px 0 14px}

.steps div.done{color:var(--gold2)}
.kind{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kind button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 6px;border:1.5px solid var(--line);border-radius:16px;background:var(--paper);font-size:16px;font-weight:700;color:var(--ink);cursor:pointer}

.kmini button.on{border-color:var(--navy);background:var(--navy);color:#fff;font-weight:800}
.addp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.addp div{position:relative;aspect-ratio:1/1;border-radius:10px;background:var(--sand) center/cover no-repeat;cursor:zoom-in}

.sortb{flex:none;display:inline-flex;border:1.5px solid var(--gold);border-radius:999px;overflow:hidden;background:#FFFBF2}

.search{display:flex;align-items:center;height:42px;border:1.5px solid #DCCFB6;border-radius:999px;background:var(--paper);padding-left:14px;min-width:0}
.search:focus-within{border-color:var(--navy)}
.search input{flex:1;min-width:0;border:none;outline:none;background:none;font-family:inherit;font-size:15.5px;color:var(--ink)}
.search button{width:40px;height:38px;border:none;background:none;color:var(--navy);display:grid;place-items:center;cursor:pointer}
.qline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--sub);margin:-2px 0 12px}
.qline b{color:var(--navy2)}
.qex{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 12px}
.bo3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.bo3 button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 4px;border:1.5px solid var(--line);border-radius:14px;background:var(--paper);font-size:15px;font-weight:700;color:var(--ink);cursor:pointer}
.adl{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:8px;background:var(--soft)}
.adl .tx{min-width:0;flex:1}

.ci{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;color:#fff}
.c-peach{background:#E8A07E}.c-rose{background:var(--rose)}.c-violet{background:var(--violet)}.c-navy{background:var(--navy)}.c-gold{background:var(--gold2)}.c-green{background:var(--green)}.c-gray{background:#9A907E}
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,252,247,.97);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.navbar .in{max-width:528px;margin:0 auto;display:grid;grid-template-columns:1fr 2fr;gap:10px}
.navbar .btn{margin-top:0}

/* 사진 한 줄에 한 장 (155) */
.prow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #F0E8DA}
.prow:last-child{border-bottom:none}
.prow .ph{width:78px;height:78px;border-radius:12px;background:var(--sand) center/cover no-repeat;flex:none;position:relative}
.prow .ph b{position:absolute;left:4px;top:4px;background:rgba(22,58,92,.8);color:#fff;font-size:11.5px;border-radius:6px;padding:0 6px}
.prow .ph button{position:absolute;right:-6px;top:-6px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:#3B4652;color:#fff;font-size:14px;line-height:1;cursor:pointer}
.dots{display:flex;flex-wrap:wrap;gap:6px;min-width:0;flex:1}
.dot{display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:none;cursor:pointer;font-size:11.5px;color:var(--sub);width:48px}

.dot.on i{border-color:var(--navy);background:var(--navy)}
.dot.on i:after{content:'';width:10px;height:10px;border-radius:50%;background:#fff}
.dot.on{color:var(--navy);font-weight:800}
.allrow{background:#F6F9FC;border:1px solid #D9E4EF;border-radius:14px;padding:10px 12px;margin-bottom:6px}
.allrow b{font-size:14px;color:var(--navy)}
.pbig{border:1.5px dashed #DCCFB6;border-radius:16px;padding:18px;text-align:center;background:var(--soft)}

/* 네 칸 큰 단추 (154) */
.four{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.four button{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;min-height:118px;border:1.5px dashed #DCCFB6;border-radius:16px;background:var(--soft);cursor:pointer;text-align:left;color:var(--ink)}

.four button.on span{color:var(--ink)}
.blanks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 4px}
.blank{border-radius:12px;padding:8px 10px;border:1.5px dashed #DCCFB6;background:var(--soft)}

.blank small{display:block;font-size:12px;color:var(--sub)}
.blank span{font-size:14.5px}
.blank:not(.on) span{color:#B9AC93}

/* 사진 — 첫 화면 큰 칸은 원본(1600px) · 3×3 칸은 작은 그림을 한 번에 */
var PHC={}, NEEDPV={};
function photo(id,small,cb,noDu){
  var k=(small?'s:':'')+id; if(PHC[k]){ cb(PHC[k]); return; }
  if(DU[id]&&!noDu){ duLoad(id,small?480:1600,function(u){ if(u){ PHC[k]=u; cb(u); } else { photo(id,small,cb,1); } }); return; }   /* ★v53 333 서버를 거치지 않고 */
  api({action:'recPhoto',id:id,small:small?'1':''},function(d){ if(d.status==='ok'){ PHC[k]='data:'+d.type+';base64,'+d.data; pvHeal(id,PHC[k]); cb(PHC[k]); } else { cb(''); } });
}
/* ★v25 스스로 채우기 — 미리보기 없는 옛 사진을 이 폰이 처음 열면 작은 사진을 만들어 서버에 남김(다음부터 모두 빨리) */
function pvHeal(id,url){
  if(!NEEDPV[id]){ return; } delete NEEDPV[id];
  var im=new Image(); im.onload=function(){ var sz=[[480,0.6],[400,0.5],[320,0.45]], w=im.naturalWidth, h=im.naturalHeight;
    for(var k=0;k<sz.length;k++){ var r=Math.min(1,sz[k][0]/Math.max(w,h)), c=document.createElement('canvas'); c.width=Math.round(w*r); c.height=Math.round(h*r); c.getContext('2d').drawImage(im,0,0,c.width,c.height); var u=c.toDataURL('image/jpeg',sz[k][1]); if(u.length<=45000){ api({action:'recPvSet',id:id,pv:u},function(){}); var l=findL(id); if(l){ l.pv=u; } return; } } };
  im.src=url;
}
function lazyPhotos(el){
  /* ★v24 미리보기는 목록과 함께 이미 그려짐 → 큰 칸만 원본으로 바꿔 끼움 · 동시에 셋씩 */
  var one=Array.prototype.filter.call(el.querySelectorAll('[data-ph]'),function(t){ return !(t.getAttribute('data-small')&&t.style.backgroundImage); }), i=0, run=0;
  function next(){ while(run<3&&i<one.length){ (function(t){ run++; photo(t.getAttribute('data-ph'),!!t.getAttribute('data-small'),function(src){ run--; if(src){ t.style.backgroundImage='url('+src+')'; t.classList.remove('wait'); } next(); }); })(one[i++]); } }
  next();
  var grids=el.querySelectorAll('.g9');
  Array.prototype.forEach.call(grids,function(g){
    var tiles=g.querySelectorAll('[data-phs]'), need=[], map={};
    Array.prototype.forEach.call(tiles,function(t){ var id=t.getAttribute('data-phs'); map[id]=t; if(PHC['s:'+id]){ t.style.backgroundImage='url('+PHC['s:'+id]+')'; t.classList.remove('wait'); } else if(DU[id]){ photo(id,true,function(u){ if(u){ t.style.backgroundImage='url('+u+')'; t.classList.remove('wait'); } }); } else { need.push(id); } });   /* ★v53 333 */
    if(!need.length){ return; }
    api({action:'recPhotos',ids:need.join(','),small:'1'},function(d){ if(d.status!=='ok'){ return; } d.items.forEach(function(x){ var u='data:'+x.type+';base64,'+x.data; PHC['s:'+x.id]=u; pvHeal(x.id,u); if(map[x.id]){ map[x.id].style.backgroundImage='url('+u+')'; map[x.id].classList.remove('wait'); } }); });
  });

function qrLib(cb){ if(window.QRCode){ cb(true); return; } var s=document.createElement('script'); s.src='/rec/qr.js?v=1'; s.onload=function(){ cb(!!window.QRCode); }; s.onerror=function(){ cb(false); }; document.head.appendChild(s); }

    function drawT(){
      $('emW').innerHTML=''; $('emGo').disabled=!ready();

var ALOG_W={'꽂힘':'모임 연결','꽂힘 풂':'모임 연결 끊음','꽂힘 표 만듦':'모임 연결 링크 만듦'};
function alogWhat(w){ return ALOG_W[w]||String(w||'').replace(/꽂힘/g,'모임 연결'); }
function alogLoad(el,n){
  if(!el){ return; } wait(el,'관리 기록을 모으는 중입니다');
  api({action:'recAdminLog'},function(d){
    if(!el.isConnected){ return; }

    el.innerHTML=it.length?it.map(function(x,i){ return '<div class="sw alr"><span><b>'+esc(alogWhat(x.what))+(x.back?' <span class="tag t-out">되돌림</span>':'')+'</b><small>'+esc(x.who||'')+' · '+esc(x.at||'')+(x.why?' · '+esc(x.why):'')+'</small></span>'+(x.undo?'<button type="button" class="sbtn" data-un="'+i+'">되돌리기</button>':'')+'</div>'; }).join(''):'<p class="note">아직 관리 기록이 없습니다.</p>';

    $('main').innerHTML='<div class="sub"><button class="sbtn" id="ckB" type="button">본부로</button><span class="grow"></span><b style="font-size:17px;color:var(--navy2)">살펴볼 것 '+items.length+'건</b><span class="grow"></span><span style="width:52px"></span></div>'+
      '<p class="note" style="margin:0 2px 12px">걸린 것은 지금 가려져 있습니다. 「그대로」를 누르면 원래대로 보이고, 「가림」을 누르면 그대로 숨겨 둡니다.</p>'+
      (items.length?items.map(function(x){
        var pic=x.pv?'<img src="'+x.pv+'" alt="" style="width:100%;border-radius:12px;margin:8px 0">':(x.thumb?'<img src="'+esc(x.thumb)+'" alt="" style="width:100%;border-radius:12px;margin:8px 0">':'');

        return '<div class="card ckc" data-no="'+esc(x.no)+'"><h2>'+esc(x.why||'살펴볼 것')+' <span class="tag t-wait">'+esc(x.by||'')+'</span></h2>'+
          '<p class="note" style="margin:0">'+esc(x.comName||x.com||'방 만들기')+' · '+esc(x.kind||'')+(x.who?' · '+esc(x.who):'')+' · '+esc(x.at||'')+'</p>'+pic+
          (txt?'<p style="white-space:pre-wrap;margin:8px 0 0">'+esc(txt)+'</p>':'')+(x.url?'<p class="note" style="word-break:break-all">'+esc(x.url)+'</p>':'')+
          '<div class="pair" style="margin-top:12px"><button class="btn line" type="button" data-ck="pass">그대로</button><button class="btn red" type="button" data-ck="keep">가림</button></div></div>';
      }).join(''):'<div class="card"><p class="lead" style="margin:0">살펴볼 것이 없습니다.</p></div>');
    $('ckB').onclick=hqList;
    each($('main'),'.ckc',function(c){ var no=c.getAttribute('data-no');
      each(c,'[data-ck]',function(b){ b.onclick=function(){ var pass=b.getAttribute('data-ck')==='pass'; each(c,'[data-ck]',function(o){ o.disabled=true; });

          if(r.status!=='ok'){ each(c,'[data-ck]',function(o){ o.disabled=false; }); toast(r.msg||'처리하지 못했습니다'); return; }
          c.parentNode.removeChild(c); toast(pass?'원래대로 보입니다':'가려 두었습니다',r.left?'남은 것 '+r.left+'건':'모두 살폈습니다');
          if(!r.left){ hqList(); }
        }); }; });

  });
}

    if($('mkOff')){ $('mkOff').onclick=function(){ var b=this; b.disabled=true; hqApi({action:'recHq',act:'modKey',off:'1',_busy:'처리하는 중입니다'},function(r){ b.disabled=false; if(r.status==='ok'){ closeSheet(); toast('클로드 키를 뺐습니다','지금은 금칙어만 살핍니다'); hqList(); } else { $('mkM').innerHTML='<div class="err">'+esc(r.msg||'처리하지 못했습니다.')+'</div>'; } }); }; }

  }

    hqConfirm('메인 모임으로','loveflow.ai.kr 메인 화면에서 들어오는 분은 「'+esc(x.name)+'」로 들어옵니다.','메인으로',false,function(fail){
      hqApi({action:'recHq',act:'main',com:x.com,_busy:'처리하는 중입니다'},function(r){ if(r.status==='ok'){ closeSheet(); toast('메인 모임을 정했습니다',x.name); hqList(); } else { fail(r.msg); } }); }); return;
  }

      var pick=x.frame||'';
      sheet('<h2>모임 틀</h2><p class="lead" style="margin-top:4px">「'+esc(x.name)+'」에 붙일 틀을 고릅니다.</p><div id="hfL">'+(fr.length?fr.map(function(f){ return '<button type="button" class="mrow rlo'+(f.no===pick?' on':'')+'" data-fr="'+esc(f.no)+'"><span class="rdo"></span><span><b>'+esc(f.name||f.no)+'</b><small>'+esc(f.no)+'</small></span></button>'; }).join(''):'<p class="note">「모임 틀」 탭에 틀이 없습니다.</p>')+'</div>'+

          hqApi({action:'recHq',act:'frame',com:x.com,frame:pick,_busy:'틀을 붙이는 중입니다'},function(r){ b.disabled=false; if(r.status==='ok'){ closeSheet(); toast('틀을 붙였습니다',x.name); hqList(); } else { $('hfM').innerHTML='<div class="err">'+esc(r.msg||'붙이지 못했습니다.')+'</div>'; } }); };
