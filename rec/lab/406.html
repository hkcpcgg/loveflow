<html lang="ko">
<head>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1E4A76;--navy2:#163A5C;--cream:#FFFCF7;--sand:#F4EEE4;--ink:#2E3A46;--sub:#7D7465;--line:#EADFCF;--red:#B03A2E;
  --hq:#534AB7;--hqbg:#EEEDFE;--hqtx:#26215C;--up:#185FA5;--upbg:#E6F1FB;--uptx:#042C53;--adm:#0F6E56;--admbg:#E1F5EE;--admtx:#04342C;
  --mem:#444441;--membg:#F1EFE8;--memtx:#2C2C2A;--gst:#9C9A92;--gstbg:#F7F6F2;--gsttx:#5F5E5A;
  --f:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--f);word-break:keep-all}
button{font-family:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:30;height:52px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
.top .ttl{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px}
.top .rb{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:19px}
/* 자리 띠 */
.pos{position:sticky;top:52px;z-index:29;display:flex;align-items:center;gap:10px;padding:9px 12px;border:0;width:100%;text-align:left;border-bottom:1px solid rgba(0,0,0,.06)}
.pos .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:15px;flex:none}
.pos .tx{flex:1;min-width:0}.pos b{display:block;font-size:15px;font-weight:700}.pos small{display:block;font-size:12.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos .go{font-size:12px;opacity:.8;flex:none}
.pos .sos{flex:none;border:0;border-radius:18px;padding:6px 10px;background:#fff;color:var(--red);font-weight:700;font-size:13px;box-shadow:0 0 0 1px rgba(176,58,46,.35)}
.r-hq{background:var(--hqbg);color:var(--hqtx)}.r-hq .dot{background:var(--hq)}
.r-up{background:var(--upbg);color:var(--uptx)}.r-up .dot{background:var(--up)}
.r-adm{background:var(--admbg);color:var(--admtx)}.r-adm .dot{background:var(--adm)}
.r-mem{background:var(--membg);color:var(--memtx)}.r-mem .dot{background:var(--mem)}
.r-gst{background:var(--gstbg);color:var(--gsttx)}.r-gst .dot{background:var(--gst)}
main{min-height:calc(100vh - 110px);padding-bottom:110px}
h1{font-size:20px;margin:16px 14px 4px;color:var(--navy2)}
.lead{margin:0 14px 12px;color:var(--sub);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--sand)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 14px}
.btn{border:0;border-radius:14px;padding:14px 10px;font-size:15.5px;font-weight:700;background:var(--navy);color:#fff;width:100%}
.btn.g{background:var(--adm)}.btn.p{background:var(--hq)}.btn.line{background:#fff;color:var(--navy2);box-shadow:inset 0 0 0 1.5px var(--line)}.btn.red{background:var(--red)}
.card{background:#fff;border-radius:16px;margin:10px 14px;padding:14px;box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line)}
.card h2{margin:0 0 6px;font-size:16px;color:var(--navy2)}
.card p{margin:0;color:var(--sub);font-size:14px;line-height:1.6}
.big{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:16px;padding:16px 14px;text-align:left;font-size:16px;font-weight:700}
.big small{display:block;font-weight:400;font-size:13px;opacity:.85;margin-top:2px}
.big .ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:#fff;flex:none}
.todo{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.todo:last-child{border-bottom:0}.todo em{margin-left:auto;font-style:normal;background:var(--red);color:#fff;border-radius:12px;padding:2px 9px;font-size:13px;font-weight:700}
.todo .q{border:0;background:var(--sand);color:var(--sub);width:24px;height:24px;border-radius:50%;font-weight:700;flex:none}
.tabs[hidden]{display:none!important}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;border:0;background:none;padding:9px 0 10px;font-size:12.5px;color:var(--sub)}
.tabs button i{display:block;font-style:normal;font-size:19px;margin-bottom:2px}
.tabs button.on{color:var(--adm);font-weight:700}.tabs.hq button.on{color:var(--hq)}
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:#fff;width:100%;border-left:0;border-right:0;border-top:0;text-align:left;font-size:15px}
.row .nm{flex:1;min-width:0}.row .nm b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .nm small{color:var(--sub);font-size:12.5px}
.tag{display:inline-block;border-radius:10px;padding:2px 8px;font-size:12px;font-weight:700;margin-left:4px}
.t-red{background:#FCEBEB;color:#791F1F}.t-adm{background:var(--admbg);color:var(--admtx)}.t-wait{background:#FAEEDA;color:#633806}.t-hq{background:var(--hqbg);color:var(--hqtx)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 14px 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:18px;padding:7px 12px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);font-size:13.5px;color:var(--ink)}
.chip.on{background:var(--hq);color:#fff;box-shadow:none}.chip b{margin-left:4px}
.find{display:flex;gap:6px;margin:12px 14px 8px}.find input{flex:1;border:0;border-radius:12px;padding:12px;font-size:15px;box-shadow:inset 0 0 0 1.5px var(--line);font-family:inherit}
.find button{border:0;border-radius:12px;background:var(--hq);color:#fff;padding:0 14px;font-weight:700}
.nav3{display:flex;justify-content:center;gap:18px;margin:24px 0 8px}
.nav3 button{width:44px;height:44px;border-radius:50%;border:0;background:#fff;box-shadow:0 0 0 1px var(--line);font-size:18px;color:var(--navy2)}
.foot{text-align:center;color:var(--sub);font-size:12px;padding:6px 0 20px}
.dim{position:fixed;inset:0;background:rgba(20,24,30,.42);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}.dim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:#fff;border-radius:20px 20px 0 0;max-height:86vh;overflow:auto;padding:18px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s}
.sheet.on{transform:none}.sheet h2{margin:0 0 6px;font-size:18px;color:var(--navy2)}.sheet .lead{margin:0 0 12px}
.menu{position:fixed;top:0;right:0;bottom:0;width:84%;max-width:330px;z-index:61;background:#fff;transform:translateX(105%);transition:transform .25s;overflow:auto;padding-bottom:30px}
.menu.on{transform:none}
.menu .hd{background:var(--navy);color:#fff;padding:16px 14px;font-weight:700;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.menu .hd button{border:0;background:rgba(255,255,255,.14);color:#fff;width:34px;height:34px;border-radius:50%;font-size:16px}
.mr{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:13px 16px;font-size:15.5px;text-align:left;color:var(--ink)}
.mr i{font-style:normal;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--sand);font-size:16px;flex:none}
.mr small{display:block;color:var(--sub);font-size:12.5px}
.sl{font-size:12.5px;color:var(--sub);padding:12px 16px 2px;font-weight:700}
.place{display:flex;align-items:center;gap:10px;width:100%;border:0;background:#fff;padding:12px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:15px}
.place .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:14px;flex:none}
.place .tx{flex:1}.place b{display:block}.place small{color:var(--sub);font-size:12.5px}.place em{font-style:normal;font-size:12.5px;color:var(--sub)}
.place.here{background:var(--sand);border-radius:12px;padding-left:8px}
label.f{display:block;font-size:14px;font-weight:700;margin:10px 0 6px;color:var(--navy2)}
input.t{width:100%;border:0;border-radius:12px;padding:13px;font-size:16px;box-shadow:inset 0 0 0 1.5px var(--line);font-family:inherit}
.steps{display:flex;gap:6px;margin:4px 0 12px}.steps span{flex:1;height:5px;border-radius:3px;background:var(--line)}.steps span.on{background:var(--adm)}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#1E2A36;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:88%;text-align:center}.toast.on{opacity:1}
.demo{position:fixed;left:10px;bottom:calc(66px + env(safe-area-inset-bottom));z-index:40;border:0;border-radius:18px;padding:7px 11px;background:#2E3A46;color:#fff;font-size:12.5px;opacity:.88}
.demo.low{bottom:calc(14px + env(safe-area-inset-bottom))}
.who{display:grid;gap:8px}
</style>
</head>
<body>
<header class="top"><span class="ttl"><span>🍇</span><span id="ttl">우리 이야기</span></span><button class="rb" id="burger" aria-label="메뉴">☰</button></header>
<button class="pos" id="pos" type="button"></button>
<main id="main"></main>
<nav class="tabs" id="tabs" hidden></nav>
<button class="demo" id="demo" type="button">시험판 · 누구로 보기</button>
<div class="dim" id="dim"></div>
<div class="sheet" id="sheet"></div>
<nav class="menu" id="menu" aria-label="우리 이야기 메뉴"></nav>
<div class="toast" id="toast"></div>
<script>
(function(){
var $=function(i){return document.getElementById(i);};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var R={hq:{c:'r-hq',ic:'♛',nm:'본부',col:'var(--hq)'},up:{c:'r-up',ic:'◆',nm:'위 방 관리자',col:'var(--up)'},adm:{c:'r-adm',ic:'⚙',nm:'관리자',col:'var(--adm)'},chk:{c:'r-adm',ic:'⚙',nm:'확인자',col:'var(--adm)'},mem:{c:'r-mem',ic:'✎',nm:'올리는 분',col:'var(--mem)'},gst:{c:'r-gst',ic:'◌',nm:'둘러보는 분',col:'var(--gst)'}};
var ROOMS={
  dabok:{name:'파주 프로방스 복요리 다복 이야기',short:'다복',pics:['d01','d02','d04','d05','d06','d07','d08','d10','d11'].map(function(x){return '../seed/dabok/'+x+'_t.jpg';})},
  lf:{name:'사랑흐름 우리 이야기',short:'사랑흐름',pics:['s1','s2','s3','s4','s5','s6','s7','s1','s2'].map(function(x){return '../seed/lf/'+x+'_t.jpg';})},
  school:{name:'문산초등학교 우리 이야기',short:'문산초',pics:['s3','s4','s5','s6','s7','s1','s2','s3','s4'].map(function(x){return '../seed/lf/'+x+'_t.jpg';}),downs:12},
  munsan:{name:'문산초 59회 우리 친구들 이야기',short:'문산초 59회',pics:['s5','s6','s7','s1','s2','s3','s4','s5','s6'].map(function(x){return '../seed/lf/'+x+'_t.jpg';})}
};
/* 시험판 사람 다섯 — 카카오 하나가 가진 자리 */
var P={
  boss:{label:'대표님(본부)',home:'dabok',places:function(){var a=[{w:'hq',r:'hq'},{w:'lf',r:'adm'}];if(HO<3){a.push({w:'dabok',r:'adm',note:HO===1?'넘기는 중':HO===2?'사장님과 둘':'넘기기 전'});}a.push({w:'munsan',r:'mem'});return a;}},
  owner:{label:'다복 사장님',home:'dabok',places:function(){return [{w:'dabok',r:HO>=2?'adm':'gst'}];}},
  upper:{label:'문산초 위 방 관리자',home:'school',places:function(){return [{w:'school',r:'up'},{w:'munsan',r:'mem'}];}},
  member:{label:'다복 단골(올리는 분)',home:'dabok',places:function(){return [{w:'dabok',r:'mem'}];}},
  guest:{label:'마당에서 들어온 분',home:'dabok',places:function(){return [];}}
};
var who='boss', HO=0, STACK=[], hqF='', admTab='home';
function places(){return P[who].places();}
function roleAt(w){if(w==='hq'){return places().some(function(p){return p.w==='hq';})?'hq':'';}var p=places().filter(function(x){return x.w===w;})[0];if(p){return p.r;}return 'gst';}
function isHq(){return places().some(function(p){return p.w==='hq';});}
function cur(){return STACK[STACK.length-1];}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.k);toast.k=setTimeout(function(){t.classList.remove('on');},1900);}
function go(v,push){if(push!==false){STACK.push(v);}render();window.scrollTo(0,0);}
function back(){if(STACK.length>1){STACK.pop();render();window.scrollTo(0,0);return;}sheet('<h2>우리 이야기에서 나가시겠습니까?</h2><p class="lead">카카오톡 대화로 돌아갑니다.</p><div class="pair" style="margin:0"><button class="btn line" data-x>머물기</button><button class="btn" data-x data-t="시험판 — 실제로는 카카오톡으로 돌아갑니다">나가기</button></div>');}
function home(){STACK=[{v:'room',w:P[who].home}];render();window.scrollTo(0,0);}
/* 자리 띠 — 늘 붙음 */
function posBar(){
  var v=cur(),b=$('pos'),r,w,sub,sos=false,lab;
  if(v.v==='hq'){r='hq';sub='사랑흐름 우리 이야기 전체 · 방 '+HQROOMS.length;lab='본부';sos=true;}
  else if(v.v==='plaza'){var top=isHq()?'hq':(places()[0]?places()[0].r:'gst');r=top;sub='우리 이야기 마당';lab=R[r].nm;}
  else{w=v.w;r=roleAt(w);sub=ROOMS[w].name;lab=R[r].nm+(v.v==='adm'?' · 관리 중':'');sos=v.v==='adm';if(r==='up'){sub=ROOMS[w].short+' · 아래 방 '+ROOMS[w].downs;}}
  var o=R[r];b.className='pos '+o.c;
  b.innerHTML='<span class="dot">'+o.ic+'</span><span class="tx"><b>'+esc(lab)+'</b><small>'+esc(sub)+'</small></span>'+(sos?'<span class="sos" id="sos">🚨 응급</span>':'<span class="go">내 자리 ▾</span>');
  b.onclick=function(e){if(e.target&&e.target.id==='sos'){sosSheet();return;}mySeats();};
}
/* 내 자리 판 */
function mySeats(){
  var v=cur(),ps=places(),h='<h2>내 자리</h2><p class="lead">카카오 하나로 맡은 자리입니다. 누르면 그 자리로 갑니다.</p>';
  if(!ps.length){h+='<div class="card" style="margin:0 0 10px"><p>아직 함께하는 이야기방이 없습니다. 초대를 받거나 이야기방을 만들면 여기에 생깁니다.</p></div><button class="btn" data-x data-t="시험판 — 이야기방 만들기 화면으로 갑니다">이야기방 만들기</button>';sheet(h);return;}
  ps.forEach(function(p,i){var o=R[p.r],here=(p.w==='hq'&&v.v==='hq')||(v.w===p.w&&v.v!=='hq');
    h+='<button class="place'+(here?' here':'')+'" data-pl="'+i+'"><span class="dot" style="background:'+o.col+'">'+o.ic+'</span><span class="tx"><b>'+(p.w==='hq'?'본부':esc(ROOMS[p.w].short))+'</b><small>'+o.nm+(p.note?' · '+esc(p.note):'')+'</small></span><em>'+(here?'지금 여기':'가기 ›')+'</em></button>';});
  h+='<p class="lead" style="margin-top:12px;font-size:13px">본부는 처음 쓰는 기기에서만 카카오톡 [승인]을 한 번 더 받습니다.</p>';
  sheet(h,function(s){[].forEach.call(s.querySelectorAll('[data-pl]'),function(b){b.onclick=function(){var p=ps[+b.getAttribute('data-pl')];close();if(p.w==='hq'){go({v:'hq',t:'today'});}else{go({v:'room',w:p.w});}};});});
}
/* ☰ 우리 이야기 메뉴 */
function openMenu(){
  var v=cur(),ps=places(),m=$('menu'),h='<div class="hd"><span>우리 이야기</span><button id="mX" aria-label="닫기">✕</button></div>';
  h+='<div style="padding:10px 12px 4px">'+$('pos').outerHTML.replace('id="pos"','id="mPos"').replace('id="sos"','')+'</div>';
  h+='<button class="mr" data-m="plaza"><i>🌿</i><span>우리 이야기 마당<small>여러 이야기방 사진</small></span></button>';
  h+='<button class="mr" data-m="seats"><i>📍</i><span>내 이야기방<small>내 자리 · 맡은 방 · 함께하는 방</small></span></button>';
  h+='<button class="mr" data-m="make"><i>＋</i><span>이야기방 만들기<small>나 · 가족 · 모임 · 일터 · 마을 · 기관</small></span></button>';
  var mg=ps.filter(function(p){return p.r==='adm'||p.r==='chk'||p.r==='up';});
  if(mg.length){h+='<div class="sl">관리</div>';mg.forEach(function(p){h+='<button class="mr" data-adm="'+p.w+'"><i style="background:'+(p.r==='up'?'var(--upbg)':'var(--admbg)')+'">'+R[p.r].ic+'</i><span>'+esc(ROOMS[p.w].short)+' 관리<small>'+R[p.r].nm+'</small></span></button>';});}
  if(isHq()){h+='<button class="mr" data-m="hq"><i style="background:var(--hqbg)">♛</i><span>본부<small>모든 방 · 오늘 손볼 것 · 관리자 넘기기</small></span></button>';}
  h+='<div class="sl">도움</div><button class="mr" data-m="guide"><i>？</i><span>이용 안내</span></button><button class="mr" data-m="share"><i>↗</i><span>공유하기<small>마당 · 이야기방 만들기 링크</small></span></button>';
  h+='<div style="border-top:1px solid var(--line);margin-top:8px"></div><button class="mr" data-m="lf"><i>⌂</i><span>사랑흐름 홈<small>사랑흐름 전체 메뉴는 여기에서</small></span></button>';

$('dim').onclick=close;$('burger').onclick=openMenu;
$('demo').onclick=function(){
  sheet('<h2>시험판 · 누구로 보기</h2><p class="lead">자리를 바꾸면 자리 띠 · ☰ · 내 자리 · 관리 단추가 같이 바뀝니다.</p><div class="who">'+Object.keys(P).map(function(k){return '<button class="btn '+(k===who?'':'line')+'" data-w="'+k+'">'+P[k].label+'</button>';}).join('')+'<button class="btn line" id="rst">넘기기 처음부터</button></div>',function(s){
    [].forEach.call(s.querySelectorAll('[data-w]'),function(b){b.onclick=function(){who=b.getAttribute('data-w');close();admTab='home';hqF='';home();toast(P[who].label+'(으)로 봅니다');};});
    $('rst').onclick=function(){HO=0;close();home();toast('다복 넘기기를 처음으로 돌렸습니다');};
  });
};
/* 그리기 */
function render(){
  var v=cur(),m=$('main'),n=$('tabs');n.hidden=true;$('demo').className='demo low';
  if(v.v==='adm'&&!/^(adm|chk|up)$/.test(roleAt(v.w))){STACK=[{v:'room',w:v.w}];v=cur();}
  if(v.v==='hq'&&!isHq()){STACK=[{v:'room',w:P[who].home}];v=cur();}
  $('ttl').textContent=v.v==='hq'?'우리 이야기 · 본부':v.v==='adm'?'우리 이야기 · 관리':'우리 이야기';
  posBar();
  if(v.v==='room'){m.innerHTML=roomView(v);}
  else if(v.v==='plaza'){m.innerHTML=plazaView();}
  else if(v.v==='adm'){m.innerHTML=admView(v);admTabs(v.w);$('demo').className='demo';}
  else if(v.v==='hq'){m.innerHTML=hqView(v);}
  if($('nb')){$('nb').onclick=back;$('nh').onclick=home;$('nf').onclick=function(){toast('앞으로 갈 화면이 없습니다');};}
  if($('adm')){$('adm').onclick=function(){admTab='home';go({v:'adm',w:v.w});};}
  if($('up')){$('up').onclick=function(){toast('시험판 — 올리기 4걸음 화면');};}
  if($('join')){$('join').onclick=function(){toast('시험판 — 카카오로 함께하기');};}
  if($('hoBig')){$('hoBig').onclick=handover;}
  if($('inv')){$('inv').onclick=function(){toast('시험판 — 카카오톡 초대하기');};}
  [].forEach.call(m.querySelectorAll('[data-q]'),function(b){b.onclick=function(){var t=window._todo[+b.getAttribute('data-q')];sheet('<h2>이럴 땐 · '+t[0]+'</h2><p class="lead">'+t[2]+'</p><button class="btn g" data-x>알았습니다</button>');};});
  [].forEach.call(m.querySelectorAll('[data-ht]'),function(b){b.onclick=function(){var t=b.getAttribute('data-ht');if(t==='pc'){toast('판매 · 발급 · 서비스 · 사람 · 운영은 컴퓨터 본부에서 엽니다');return;}v.t=t;render();};});
  [].forEach.call(m.querySelectorAll('.todo'),function(d,i){if(v.v==='hq'){d.style.cursor='pointer';d.onclick=function(){hqF=['noAdm','rq','wait',''][i];if(i===3){toast('시험판 — 새로 생긴 방 신청 목록');return;}v.t='rooms';render();};}});
  [].forEach.call(m.querySelectorAll('[data-hf]'),function(b){b.onclick=function(){hqF=b.getAttribute('data-hf');render();};});
  if($('hqS')){$('hqS').onclick=function(){v.q=$('hqQ').value;render();};$('hqQ').onkeydown=function(e){if(e.key==='Enter'){v.q=this.value;render();}};}
  [].forEach.call(m.querySelectorAll('[data-rm]'),function(b){b.onclick=function(){hqRoom(b.getAttribute('data-rm'));};});
}
home();
})();
</script>
</body>
</html>
