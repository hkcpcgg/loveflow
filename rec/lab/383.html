<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>우리 이야기 마당 · 시험판 383</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1E4A76;--navy2:#163A5C;--gold:#C9A96E;--orange:#E8771E;--rose:#C25B7C;--cream:#FFFCF7;--sand:#F4EEE4;--ink:#2E3A46;--sub:#7D7465;--line:#EADFCF;
  --f:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;--barH:52px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--f);word-break:keep-all}
body{overscroll-behavior-y:contain}
button{font-family:inherit;cursor:pointer}

/* ── 위 바 : 내리면 숨고 올리면 나옴 ── */
.top{position:fixed;left:0;right:0;top:0;z-index:30;height:calc(var(--barH) + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);
  background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding-left:12px;padding-right:12px;
  transition:transform .28s ease;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.top.hide{transform:translateY(-100%)}
.top .ttl{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;letter-spacing:-.2px}
.top .ttl .g{font-size:20px}
.top .rb{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:18px;display:grid;place-items:center}
main{padding-top:calc(var(--barH) + env(safe-area-inset-top))}

/* ── 방 띠 (인스타 스토리 줄) ── */
.rooms{display:flex;gap:14px;overflow-x:auto;padding:14px 14px 10px;scrollbar-width:none}
.rooms::-webkit-scrollbar{display:none}
.rm{flex:0 0 auto;width:68px;text-align:center;border:0;background:none;padding:0;color:var(--ink)}
.rm .c{display:block;width:64px;height:64px;margin:0 auto;border-radius:50%;padding:3px;background:conic-gradient(from 210deg,#8E7CF0,#5CC8E0,#B7F0E0,#F6E3B4,#F2B8D9,#8E7CF0);box-shadow:0 0 14px rgba(142,124,240,.28)}
.rm .c i{display:block;width:100%;height:100%;border-radius:50%;border:2px solid var(--cream);background:#ddd center/cover no-repeat}
.rm .n{display:block;font-size:12px;margin-top:5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* v3 내 방 · 새 기억 빛 · 다 본 방 회색 */
.rm.new .c{animation:aur 3.2s linear infinite}
@keyframes aur{to{filter:hue-rotate(360deg)}}
.rm.new .n{font-weight:700}
.rm.seen .c{background:#D9D4E3;box-shadow:none}
.rm .dot{display:block;width:7px;height:7px;border-radius:50%;margin:4px auto 0;background:linear-gradient(120deg,#8E7CF0,#5CC8E0);box-shadow:0 0 6px #8E7CF0}
.rsep{flex:0 0 auto;width:1px;align-self:stretch;margin:6px 0 22px;background:var(--line)}
.top .me{width:38px;height:38px;border-radius:50%;border:0;color:#fff;font-weight:700;font-size:14px;margin-right:8px;
  background:conic-gradient(from 210deg,#8E7CF0,#5CC8E0,#B7F0E0,#F6E3B4,#F2B8D9,#8E7CF0);padding:2px}
.top .me span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--navy2)}
.top .rt{display:flex;align-items:center}
/* v3 겹 화면(나 · 남 · 받는 분) */
.pg{position:fixed;inset:0;background:var(--cream);overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
.pg.on{display:block}
#me{z-index:50} #who{z-index:65} #rcv{z-index:75}
.ph{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;height:calc(52px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 10px 0;background:var(--navy);color:#fff}
.ph button{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:18px}
.ph b{font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mh{display:flex;align-items:center;gap:14px;padding:18px 16px 6px}
.av{flex:0 0 auto;width:64px;height:64px;border-radius:50%;padding:3px;background:conic-gradient(from 210deg,#8E7CF0,#5CC8E0,#B7F0E0,#F6E3B4,#F2B8D9,#8E7CF0)}
.av span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:linear-gradient(150deg,#1B2350,#3B2F72);color:#fff;font-weight:700;font-size:22px}
.mh .nm{font-size:20px;font-weight:700}
.mh .sb{font-size:12.5px;color:var(--sub);margin-top:4px}
.sec{padding:14px 14px 4px}
.sec h2{font-size:14px;color:var(--sub);margin:0 0 10px;font-weight:500}
.rc{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:10px;margin:0 0 10px;box-shadow:0 1px 0 var(--line),0 2px 10px rgba(30,40,80,.04);cursor:pointer}
.rc .im{flex:0 0 auto;width:66px;height:66px;border-radius:14px;background:#ddd center/cover;display:grid;place-items:center;font-size:30px}
.rc .tx{flex:1;min-width:0}
.rc .nm{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .sb{font-size:13px;color:var(--sub);margin-top:4px}
.rc .nw{display:inline-block;margin-top:6px;font-size:12.5px;color:#fff;padding:4px 10px;border-radius:12px;background:linear-gradient(120deg,#8E7CF0,#5CC8E0);box-shadow:0 0 12px rgba(142,124,240,.45)}
.rc .mo{flex:0 0 auto;width:40px;height:40px;border:0;background:none;font-size:20px;color:var(--sub);border-radius:50%}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.mg button{position:relative;aspect-ratio:1/1;border:0;padding:0;overflow:hidden;background:#e9e2d6}
.mg img,.mg .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mg .art{font-size:34px}
.lock{position:absolute;left:5px;top:5px;font-size:11px;line-height:1;color:#fff;background:rgba(0,0,0,.5);border-radius:9px;padding:4px 7px;z-index:1}
.note{font-size:12.5px;color:var(--sub);padding:2px 16px 10px}
.bigb{display:block;width:calc(100% - 28px);margin:18px 14px 26px;border:0;border-radius:26px;padding:15px;font-size:16px;font-weight:700;color:#1B2350;
  background:linear-gradient(120deg,#F6E3B4,#F2B8D9 55%,#B7F0E0);box-shadow:0 4px 16px rgba(242,184,217,.4)}
/* v3 올린 분 */
.info .by{display:block;border:0;background:none;color:#fff;font-size:13px;opacity:.9;padding:6px 0 0;text-decoration:underline;text-underline-offset:3px}
/* v3 보여 드리기 판 */
.sx{padding:2px 6px 4px}
.sx h4{font-size:17px;margin:2px 6px 12px;color:var(--ink)}
.pk{display:flex;gap:8px;overflow-x:auto;margin:0 0 12px;padding:0 4px;scrollbar-width:none}
.sheet .pk button{flex:0 0 auto;width:auto;padding:9px 16px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:15px}
.sheet .pk button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.pv{display:flex;gap:12px;align-items:center;background:var(--sand);border-radius:14px;padding:10px;margin:0 4px 14px}
.pv i{flex:0 0 auto;width:64px;height:64px;border-radius:10px;background:center/cover;display:grid;place-items:center;font-size:28px;font-style:normal}
.pv p{margin:0;font-size:15px;line-height:1.5;color:var(--ink)}
.sheet button.kk{justify-content:center;background:#FEE500;color:#191919;font-weight:700;border-radius:24px;margin:0 4px;width:calc(100% - 8px)}
.sheet button.ln{justify-content:center;color:#6B5BD2;font-size:14.5px}
.sx .off{padding:18px 8px;font-size:15px;line-height:1.6;color:var(--ink);text-align:center}
/* v3 받는 분 화면 */
.rv{max-width:600px;margin:0 auto;padding:18px 16px 30px;text-align:center}
.rv .br{font-size:12.5px;color:#6B5BD2;letter-spacing:.5px;margin-bottom:12px}
.rv .lead{font-size:16.5px;line-height:1.65;color:var(--ink);margin:0 0 16px}
.rv .ph2{border-radius:16px;overflow:hidden;aspect-ratio:4/3;background:#ddd center/cover;display:grid;place-items:center;font-size:80px;box-shadow:0 6px 24px rgba(30,40,80,.15)}
.rv .tt{font-size:17px;font-weight:700;margin:14px 0 18px}
.rv textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:14px;padding:12px;font-family:inherit;font-size:16px;resize:vertical;background:#fff}
.rv .go2{display:block;width:100%;margin:10px 0 0;border:0;border-radius:24px;padding:14px;font-size:16px;font-weight:700;color:#fff;background:var(--navy)}
.rv .lk{display:inline-block;margin-top:22px;border:0;background:none;color:var(--sub);font-size:13.5px;text-decoration:underline;text-underline-offset:3px}
.rv .done{display:none;margin-top:14px;padding:14px;border-radius:14px;background:#fff;font-size:15px;line-height:1.6}


.rm.mk .c{background:linear-gradient(140deg,#d9d2f5,#cfeef4);box-shadow:none}
.rm.mk .c i{display:grid;place-items:center;background:#fff;font-size:26px;color:#6B5BD2}

/* ── 바둑판 : 3칸 · 열 칸마다 큰 칸 하나(왼쪽 · 오른쪽 번갈아) ── */
.grid{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:calc((100vw - 4px) / 3);gap:2px}
@media (min-width:600px){.grid{grid-auto-rows:calc((600px - 4px) / 3)} main{max-width:600px;margin:0 auto}}
.t{position:relative;overflow:hidden;background:#e9e2d6;border:0;padding:0}
.t.big{grid-column:span 2;grid-row:span 2}
.t img,.t video,.t .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.t .tag{position:absolute;left:5px;bottom:5px;max-width:calc(100% - 10px);font-size:11px;line-height:1;color:#fff;background:rgba(0,0,0,.42);
  padding:4px 7px;border-radius:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.t .mvi{position:absolute;right:6px;top:6px;color:#fff;font-size:13px;text-shadow:0 0 4px rgba(0,0,0,.5);pointer-events:none}
.art{display:grid!important;place-items:center;font-size:40px;filter:saturate(.9)}
.art{text-shadow:0 0 22px rgba(255,255,255,.55)}
.t.big .art{font-size:64px}
.make{grid-column:1 / -1;color:#fff;background:radial-gradient(80% 120% at 15% 0%,rgba(242,184,217,.55),transparent 60%),radial-gradient(70% 120% at 100% 100%,rgba(92,200,224,.5),transparent 60%),linear-gradient(150deg,#1B2350 0%,#3B2F72 55%,#1F4A6E 100%);display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:16px;border:0}
.make h3{margin:0 0 10px;font-size:20px;color:#fff;letter-spacing:-.3px;text-shadow:0 0 18px rgba(183,240,224,.35)}
.make .chips{display:flex;flex-wrap:nowrap;gap:5px;overflow-x:auto;max-width:100%;margin:0 0 14px;scrollbar-width:none}
.make .chips span{flex:0 0 auto;font-size:13px;padding:5px 10px;border-radius:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);color:#fff;backdrop-filter:blur(4px)}
.make .go{border:0;background:linear-gradient(120deg,#F6E3B4,#F2B8D9 55%,#B7F0E0);color:#1B2350;font-size:16px;font-weight:700;padding:13px 28px;border-radius:26px;box-shadow:0 4px 18px rgba(242,184,217,.45)}
.more{text-align:center;color:var(--sub);font-size:13px;padding:18px}

/* ── 맨 아래 : ← ⌂ → · 푸터 ── */
.way{display:flex;justify-content:center;gap:22px;padding:18px 0 10px}
.way button{width:44px;height:44px;border-radius:50%;border:0;background:var(--navy);color:#fff;font-size:18px}
.way button.off{opacity:.3}
.foot{text-align:center;color:var(--sub);font-size:11.5px;line-height:1.7;padding:6px 12px calc(20px + env(safe-area-inset-bottom))}

/* ── 세로 넘김 (쇼츠식) ── */
.vw{position:fixed;inset:0;z-index:60;background:#000;display:none}
.vw.on{display:block}
.sc{position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
.sc::-webkit-scrollbar{display:none}
.sl{position:relative;height:100%;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;display:grid;place-items:center;overflow:hidden}
.sl .bg{position:absolute;inset:-30px;background:center/cover no-repeat;filter:blur(24px) brightness(.45);transform:scale(1.1)}
.sl img,.sl video,.sl .art{position:relative;max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain}
.sl .art{font-size:96px}
.sh{position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(transparent,rgba(0,0,0,.62));pointer-events:none}
.info{position:absolute;left:14px;right:84px;bottom:calc(22px + env(safe-area-inset-bottom));color:#fff}
.info .room{display:inline-flex;align-items:center;gap:6px;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:13px;padding:6px 11px;border-radius:16px;
  max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;backdrop-filter:blur(4px)}
.info .room i{width:20px;height:20px;border-radius:50%;background:#ccc center/cover;flex:0 0 auto}
.info .tt{font-size:16px;font-weight:700;margin:9px 0 3px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.info .when{font-size:12.5px;opacity:.85}
.side{position:absolute;right:8px;bottom:calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:16px}
.side button{width:62px;border:0;background:none;color:#fff;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;text-shadow:0 1px 3px rgba(0,0,0,.6);padding:0}
.side button b{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:21px;font-weight:400;backdrop-filter:blur(4px)}
.side button.on b{background:var(--rose)}
.side button.on2 b{background:var(--gold)}
.vtop{position:absolute;left:0;right:0;top:0;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;
  background:linear-gradient(rgba(0,0,0,.45),transparent);pointer-events:none}
.vtop button{pointer-events:auto;width:42px;height:42px;border-radius:50%;border:0;background:rgba(0,0,0,.35);color:#fff;font-size:20px}
.vtop .cnt{color:#fff;font-size:12.5px;opacity:.85}
.pop{position:absolute;left:50%;top:45%;font-size:90px;transform:translate(-50%,-50%) scale(.3);opacity:0;pointer-events:none;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.pop.go{animation:pop .8s ease forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}60%{transform:translate(-50%,-50%) scale(.95)}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}

/* 처음 한 번 손가락 그림 */
.hint{position:absolute;inset:0;z-index:5;background:rgba(0,0,0,.55);display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center}
.hint.on{display:flex}
.hint .f{font-size:58px;animation:sw 1.4s ease-in-out infinite}
.hint p{margin:14px 0 18px;font-size:17px;font-weight:700}
.hint button{border:0;background:#fff;color:var(--navy);font-weight:700;font-size:15px;padding:10px 24px;border-radius:22px}
@keyframes sw{0%{transform:translateY(40px);opacity:0}25%{opacity:1}70%{transform:translateY(-40px);opacity:1}100%{transform:translateY(-50px);opacity:0}}

/* ⋯ 판 · 알림 */
.dim{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.4);display:none}
.dim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:81;background:#fff;border-radius:18px 18px 0 0;padding:8px 10px calc(14px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:#ddd;margin:4px auto 10px}
.sheet button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:14px 12px;font-size:16px;color:var(--ink);border-radius:10px;text-align:left}
.sheet button:active{background:var(--sand)}
.sheet button.warn{color:#B03A2E}
.sheet .cl{justify-content:center;color:var(--sub);border-top:1px solid var(--line);border-radius:0;margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;background:rgba(30,40,55,.92);color:#fff;font-size:14px;
  padding:10px 16px;border-radius:20px;max-width:88vw;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none;line-height:1.45}
.toast.on{opacity:1}

/* 시험판 견줘 보기 */
.lab{margin:14px 12px 0;padding:12px;border:1px dashed var(--gold);border-radius:12px;background:#fff;font-size:13px;color:var(--sub)}
.lab b{color:var(--navy)}
.lab .sw{display:flex;gap:6px;margin-top:8px}
.lab .sw button{flex:1;border:1px solid var(--line);background:var(--cream);border-radius:18px;padding:8px 6px;font-size:13px;color:var(--ink)}
.lab .sw button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
</style>
</head>
<body>

<header class="top" id="top">
  <div class="ttl"><span class="g">🍇</span>우리 이야기 마당</div>
  <div class="rt"><button class="me" id="meB" type="button" aria-label="나"><span>나</span></button><button class="rb" id="menuB" type="button" aria-label="메뉴">☰</button></div>
</header>

<main id="main">
  <nav class="rooms" id="rooms" aria-label="이야기방"></nav>
  <section class="grid" id="grid"></section>
  <div class="more" id="more">사진을 더 불러오는 중입니다</div>

  <div class="lab">
    <b>시험판 383</b> — 진짜 서버 없이 눌러 보는 화면입니다. 「견본」 방 둘은 색 그림입니다.
    <div class="sw"><button type="button" id="mxA">지금 차례(방마다 번갈아)</button><button type="button" id="mxB" class="on">고르게 섞기(384)</button></div>
  </div>

var ME='규찬',faBy=[ME,ME,ME,'정희 누나',ME,'정희 누나',ME,'어머니','정희 누나',ME],faWho=['할머니','아버지','막내','정희 누나','외할머니','막내','','어머니','','큰딸'];
faA.forEach(function(x,i){ITEMS.push({room:'fa',art:[x[0],x[2]],title:x[1],when:'견본',age:i*4+2,by:faBy[i],who:faWho[i],kid:i===2||i===5?1:0});});
var muA=[['🌾','성동리 가을 들녘','radial-gradient(120% 90% at 70% 15%,#F8D9A0 0%,#B06A86 50%,#2A2140 100%)'],['🏫','문산초 운동회','radial-gradient(120% 90% at 25% 10%,#DDF0D5 0%,#5E9C86 48%,#16302C 100%)'],['🚂','문산역 옛 모습','radial-gradient(120% 90% at 75% 20%,#B9DDF5 0%,#3F6FB8 48%,#101A3A 100%)'],['🥁','마을 잔치','radial-gradient(120% 90% at 20% 15%,#E7B7D3 0%,#7C6FC4 42%,#1F2A55 100%)'],['🌳','동구 밖 느티나무','radial-gradient(120% 90% at 80% 10%,#C8F0EC 0%,#3FA3B3 45%,#0F3446 100%)'],['🧺','장날 풍경','radial-gradient(120% 90% at 30% 20%,#F6DDEB 0%,#9B84C9 48%,#2E2550 100%)'],['🏠','마을 회관 준공','radial-gradient(120% 90% at 70% 15%,#F8D9A0 0%,#B06A86 50%,#2A2140 100%)'],['🐄','외양간 송아지','radial-gradient(120% 90% at 25% 10%,#DDF0D5 0%,#5E9C86 48%,#16302C 100%)']];
muA.forEach(function(x,i){ITEMS.push({room:'mu',art:[x[0],x[2]],title:x[1],when:'견본',age:i*5+1,by:i%3===0?'정희 누나':'성동리 이장님',who:i===1?'규찬':''});});
var PZ=ITEMS.filter(function(x){return !x.kid;});   /* 아이가 나온 사진은 마당에 안 나감 */

/* ── 자리 짓기 : 9장이 한 묶음(4줄) · 큰 칸(2×2) 하나 · 왼쪽 · 오른쪽 번갈아 · 세 묶음(27장) 뒤 「이야기방 만들기」 한 칸 ── */
var MAKE_AFTER=3;
function slots(n){
  var out=[],row=1,b=0;
  while(out.length<n){
    if(b===MAKE_AFTER){out.push({make:1,r:row});row+=2;}
    var L=(b%2===0),blk=[];
    if(L){blk=[{r:row,c:1,big:1},{r:row,c:3},{r:row+1,c:3}];}else{blk=[{r:row,c:1},{r:row,c:2,big:1},{r:row+1,c:1}];}
    for(var k=0;k<2;k++){for(var c=1;c<=3;c++){blk.push({r:row+2+k,c:c});}}
    blk.forEach(function(x){if(out.filter(function(o){return !o.make;}).length<n){out.push(x);}});
    row+=4;b++;
  }
  if(b===MAKE_AFTER||n<=0){out.push({make:1,r:row});}
  return out;
}
/* ── 384 섞기 ──
   지금 차례 : 방마다 하나씩 번갈아(가나다 가나다) → 3칸 바둑판에서 세로 줄이 방마다 갈라짐
   고르게 섞기 : 새것이 앞쪽에 자주 · 같은 방이 옆 · 위 칸에 붙지 않게(실제 자리로 따짐) */
function byRoom(){var g={};PZ.forEach(function(x){(g[x.room]=g[x.room]||[]).push(x);});Object.keys(g).forEach(function(k){g[k].sort(function(a,b){return a.age-b.age;});});return g;}
function mixOld(){var g=byRoom(),ks=ROOMS.map(function(r){return r.id;}),out=[],k=0,more=true;while(more){more=false;ks.forEach(function(r){if(g[r][k]){out.push(g[r][k]);more=true;}});k++;}return out;}
function cellsOf(s){var a=[];var h=s.big?2:1;for(var r=0;r<h;r++){for(var c=0;c<h;c++){a.push((s.r+r)+':'+(s.c+c));}}return a;}
function mixEven(SL){
  var g=byRoom(),out=[],occ={};
  SL.forEach(function(s){
    if(s.make){return;}
    var near={},cs=cellsOf(s);
    cs.forEach(function(k){var p=k.split(':'),r=+p[0],c=+p[1];
      [[0,-1,60],[-1,0,60],[-1,-1,15],[-1,1,15],[0,1,60],[1,-1,15]].forEach(function(d){var o=occ[(r+d[0])+':'+(c+d[1])];if(o&&cs.indexOf((r+d[0])+':'+(c+d[1]))<0){near[o]=Math.max(near[o]||0,d[2]);}});});
    var best=null,bs=1e9;
    Object.keys(g).forEach(function(rid){var x=g[rid][0];if(!x){return;}
      var sc=x.age+(near[rid]||0)-g[rid].length*0.6;
      if(s.big&&x.art){sc+=8;}                         /* 큰 칸은 사진 · 영상 먼저 */
      if(sc<bs){bs=sc;best=rid;}});
    var it=g[best].shift();out.push(it);cs.forEach(function(k){occ[k]=it.room;});
  });
  return out;
}

/* ── 그리기 ── */
var ORDER=[],SL=[],MIX='even',SHOWN=0,PAGE=27;
function artHtml(a,cls){return '<div class="art '+(cls||'')+'" style="background:'+a[1]+'">'+a[0]+'</div>';}
function tileHtml(x,i,s){
  var r=rm(x.room),inner,big=!!s.big;
  if(x.art){inner=artHtml(x.art);}
  else if(x.mv&&big){inner='<video muted loop playsinline preload="none" poster="'+x.th+'" data-src="'+x.mv+'"></video>';}
  else{inner='<img loading="lazy" alt="" src="'+(big?x.img:x.th)+'">';}
  var pos='grid-row:'+s.r+(big?' / span 2':'')+';grid-column:'+s.c+(big?' / span 2':'');
  return '<button type="button" class="t'+(big?' big':'')+'" style="'+pos+'" data-i="'+i+'">'+inner+(x.mv?'<span class="mvi">▶</span>':'')+'<span class="tag">'+esc(r.name)+'</span></button>';
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function draw(reset){
  var gr=$('grid');
  if(reset){gr.innerHTML='';SHOWN=0;}
  var html='',i=SHOWN,cnt=0;
  for(var k=0;k<SL.length;k++){
    var s=SL[k];
    if(s.make){if(s.shown){continue;}var before=SL.slice(0,k).filter(function(o){return !o.make;}).length;if(before<=SHOWN+PAGE&&before>=SHOWN){html+=makeCard(s.r);s.shown=1;}continue;}
    var idx=SL.slice(0,k).filter(function(o){return !o.make;}).length;
    if(idx<SHOWN||idx>=SHOWN+PAGE){continue;}
    html+=tileHtml(ORDER[idx],idx,s);cnt++;
  }
  gr.insertAdjacentHTML('beforeend',html);SHOWN+=cnt;
  $('more').textContent=SHOWN<ORDER.length?'사진을 더 불러오는 중입니다':'여기까지입니다 · 내 이야기도 남겨 보세요';
  watchVideos();
}
function makeCard(r){
  return '<div class="make" style="grid-row:'+r+' / span 2">'+'<h3>나의 하루부터 우리 마을까지</h3>'+
    '<div class="chips"><span>📔 나</span><span>👪 가족</span><span>🤝 모임</span><span>🏪 일터</span><span>🌾 마을</span><span>🏛 기관</span></div>'+
    '<button type="button" class="go mkGo">＋ 이야기방 만들기</button></div>';
}
function face(r){return r.art?'background:'+r.art[1]:'background-image:url('+r.cover+')';}
function myRooms(){return ROOMS.filter(function(r){return r.mine;}).sort(function(a,b){return (b.pin||0)-(a.pin||0)||(b.newN||0)-(a.newN||0);});}
function drawRooms(){
  var h='',mine=myRooms(),oth=ROOMS.filter(function(r){return !r.mine;});
  function one(r,cls){
    var c=r.art?'<i style="display:grid;place-items:center;font-size:26px;background:'+r.art[1]+'">'+r.art[0]+'</i>':'<i style="background-image:url('+r.cover+')"></i>';
    return '<button type="button" class="rm '+cls+'" data-r="'+r.id+'"><span class="c">'+c+'</span><span class="n">'+esc(r.name.replace(/^견본 · /,''))+'</span></button>';
  }
  mine.forEach(function(r){h+=one(r,r.newN?'new':'seen');});
  if(mine.length&&oth.length){h+='<span class="rsep"></span>';}
  oth.forEach(function(r){h+=one(r,'');});
  h+='<button type="button" class="rm mk" id="rmMk"><span class="c"><i>＋</i></span><span class="n">만들기</span></button>';
  $('rooms').innerHTML=h;
}
function setMix(m){MIX=m;SL=slots(PZ.length);ORDER=m==='even'?mixEven(SL):mixOld();$('mxA').classList.toggle('on',m!=='even');$('mxB').classList.toggle('on',m==='even');draw(true);}

/* 큰 칸 영상 — 보일 때만 소리 없이 반복 */
var VO=null;
function watchVideos(){
  if(!window.IntersectionObserver){return;}
  if(!VO){VO=new IntersectionObserver(function(es){es.forEach(function(e){var v=e.target;if(e.isIntersecting){if(!v.src){v.src=v.getAttribute('data-src');}var p=v.play();if(p&&p.catch){p.catch(function(){});}}else{try{v.pause();}catch(x){}}});},{threshold:.5});}
  Array.prototype.forEach.call(document.querySelectorAll('.grid video:not([data-w])'),function(v){v.setAttribute('data-w','1');VO.observe(v);});
}

/* 끝까지 내리면 더 */
var MO=new IntersectionObserver(function(es){if(es[0].isIntersecting&&SHOWN<ORDER.length){setTimeout(function(){draw(false);},250);}},{rootMargin:'300px'});
MO.observe($('more'));

/* ── 383 위 바 : 내리면 숨김 · 올리면 나옴 ── */
var lastY=0,tick=false;
window.addEventListener('scroll',function(){
  if(tick){return;}tick=true;
  requestAnimationFrame(function(){
    var y=window.scrollY||0,d=y-lastY;
    if(y<60){$('top').classList.remove('hide');}
    else if(d>6){$('top').classList.add('hide');}
    else if(d<-6){$('top').classList.remove('hide');}
    lastY=y;tick=false;
  });
},{passive:true});

/* ── v3 겹 화면 : 휴대폰 뒤로 = 맨 위 겹 닫기 ── */
var LAY=[];
function layOpen(fn){LAY.push(fn);document.body.style.overflow='hidden';try{history.pushState({l:LAY.length},'');}catch(e){}}

var VI=0,LIKE={},MEM={},LIST=[];

    '<div class="tt">'+esc(x.title)+'</div><div class="when">'+esc(x.when)+'</div>'+byB+'</div>'+
    '<div class="side">'+
      '<button type="button" data-a="like"'+(LIKE[i]?' class="on"':'')+'><b>♥</b><span>좋아요</span></button>'+
      '<button type="button" data-a="mem"'+(MEM[i]?' class="on2"':'')+'><b>🍇</b><span>기억해요</span></button>'+
      '<button type="button" data-a="talk"><b>💬</b><span>한마디</span></button>'+
      '<button type="button" data-a="show"><b>✉</b><span>보여 드리기</span></button>'+
      '<button type="button" data-a="more"><b>⋯</b><span>더 보기</span></button>'+

var SO=null;
var VST=[];   /* 넘김 화면 위에서 또 넘김 화면을 열면(남의 화면 · 나 화면에서) 앞 것을 기억해 두었다가 되돌림 */
function viewFill(list,i,z){
  LIST=list;VI=i;var h='';LIST.forEach(function(x,k){h+=slideHtml(x,k);});
  $('sc').innerHTML=h;$('vw').style.zIndex=z;$('vw').classList.add('on');
  var sl=$('sc').children[i];$('sc').scrollTop=sl?sl.offsetTop:0;count();
  if(SO){SO.disconnect();}
  SO=new IntersectionObserver(function(es){es.forEach(function(e){
    var v=e.target.querySelector('video');
    if(e.isIntersecting){VI=+e.target.getAttribute('data-i');count();if(v){if(!v.src){v.src=v.getAttribute('data-src');}var p=v.play();if(p&&p.catch){p.catch(function(){});}}}
    else if(v){try{v.pause();}catch(x){}}
  });},{root:$('sc'),threshold:.6});
  Array.prototype.forEach.call($('sc').children,function(s){SO.observe(s);});
}
function openView(i,list){
  if($('vw').classList.contains('on')){VST.push({l:LIST,i:VI,z:$('vw').style.zIndex});}
  viewFill(list||ORDER,i,61+LAY.length);
  layOpen(closeViewNow);
  var seen=false;try{seen=localStorage.getItem('lf383_hint')==='1';}catch(e){}
  if(!seen){$('hint').classList.add('on');}
}
function count(){$('vC').textContent=(VI+1)+' / '+LIST.length;}
function closeViewNow(){
  if(VST.length){var pv=VST.pop();Array.prototype.forEach.call($('sc').querySelectorAll('video'),function(v){try{v.pause();}catch(x){}});viewFill(pv.l,pv.i,pv.z);return;}
  if(SO){SO.disconnect();}
  Array.prototype.forEach.call($('sc').querySelectorAll('video'),function(v){try{v.pause();}catch(x){}});
  $('vw').classList.remove('on');$('sc').innerHTML='';
  if(LIST===ORDER){var t=document.querySelector('.t[data-i="'+VI+'"]');if(t){t.scrollIntoView({block:'center'});}}
}
$('vX').onclick=function(){layBack();};

/* 두 번 톡 = 좋아요 (인스타식) */
var lastTap=0;
$('sc').addEventListener('click',function(e){
  var b=e.target.closest('button');var s=e.target.closest('.sl');if(!s){return;}var i=+s.getAttribute('data-i');
  if(b&&b.classList.contains('room')){toast('실화면에서는 「'+rm(b.getAttribute('data-r')).name+'」 첫 화면이 열립니다');return;}

  if(b){
    var a=b.getAttribute('data-a');
    if(a==='like'){LIKE[i]=!LIKE[i];b.classList.toggle('on',!!LIKE[i]);if(LIKE[i]){heart(s);ding();}}
    else if(a==='mem'){MEM[i]=!MEM[i];b.classList.toggle('on2',!!MEM[i]);toast(MEM[i]?'🍇 나도 기억해요 — 기억을 한 줄 보태실 수 있습니다':'기억해요를 거두었습니다');if(MEM[i]){ding();}}
    else if(a==='talk'){toast('실화면에서는 한마디 남기는 칸이 아래에서 올라옵니다');}
    else if(a==='show'){showSheet(LIST[i]);}
    else if(a==='more'){moreSheet(i);}
    return;
  }
  var now=Date.now();
  if(now-lastTap<300){if(!LIKE[i]){LIKE[i]=true;var lb=s.querySelector('[data-a="like"]');if(lb){lb.classList.add('on');}ding();}heart(s);lastTap=0;}
  else{lastTap=now;}
});
function heart(s){var p=s.querySelector('.pop');p.classList.remove('go');void p.offsetWidth;p.classList.add('go');}
var AC=null;
function ding(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(1046,AC.currentTime);o.frequency.setValueAtTime(1318,AC.currentTime+.08);g.gain.setValueAtTime(.0001,AC.currentTime);g.gain.exponentialRampToValueAtTime(.12,AC.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.35);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.4);}catch(e){}}

/* ⋯ 판 — 삭제 요청은 여기 안에만(실수로 안 닿게) */
function moreSheet(i){
  var r=rm(LIST[i].room);
  $('sheet').innerHTML='<div class="grab"></div>'+
    '<button type="button" data-s="room">🏠 「'+esc(r.name)+'」으로 가기</button>'+
    '<button type="button" data-s="copy">🔗 링크 복사</button>'+
    '<button type="button" data-s="share">↗ 공유하기</button>'+
    '<button type="button" data-s="del" class="warn">⚠ 삭제 요청</button>'+
    '<button type="button" data-s="x" class="cl">취소</button>';
  sheet(true);
}
function sheet(on){$('sheet').classList.toggle('on',on);$('dim').classList.toggle('on',on);}
$('dim').onclick=function(){sheet(false);};
$('sheet').onclick=function(e){var b=e.target.closest('button');if(!b){return;}
  if(b.hasAttribute('data-pk')){SHW.to=b.getAttribute('data-pk');showDraw();return;}
  var s=b.getAttribute('data-s');if(!s){return;}sheet(false);
  if(s==='kk'){toast('시험판 — 실화면에서는 카카오톡 친구 고르기가 열립니다');return;}
  if(s==='rv'){openRcv(SHW.x,SHW.to);return;}
  if(s==='pin'){var r0=rm(SHW.r);r0.pin=r0.pin?0:1;drawRooms();openMe(true);toast(r0.pin?'맨 위에 두었습니다':'맨 위에서 내렸습니다');return;}
  if(s==='out'){toast('시험판 — 실화면에서는 「방에서 나가시겠습니까?」를 한 번 더 묻습니다');return;}
  if(s==='share'){toast('실화면에서는 카카오톡 · 링크 복사를 고릅니다');return;}
  if(s==='room'){toast('실화면에서는 그 방 첫 화면이 열립니다');}
  else if(s==='copy'){toast('링크를 복사했습니다(시험판)');}
  else if(s==='del'){toast('실화면에서는 「요청 사유」를 고른 뒤 보냅니다');}
};

/* ── v3 보여 드리기 ── */
var SHW={};
function thumbStyle(x){return x.art?'background:'+x.art[1]:'background-image:url('+(x.th||x.img)+')';}
function showSheet(x){SHW={x:x,to:x.who&&x.who!==ME?x.who:''};showDraw();sheet(true);}
function showDraw(){
  var x=SHW.x,h='<div class="grab"></div><div class="sx">';
  if(x.kid){
    h+='<div class="off">👶 아이가 나온 사진은<br>보여 드리기를 하지 않습니다.<br><span style="font-size:13px;color:var(--sub)">이 방 안에서만 보입니다.</span></div><button type="button" data-s="x" class="cl">닫기</button></div>';
    $('sheet').innerHTML=h;return;
  }
  var names=[];if(x.who&&x.who!==ME){names.push(x.who);}
  h+='<h4>누구에게 보여 드릴까요?</h4><div class="pk">';
  names.forEach(function(n){h+='<button type="button" data-pk="'+esc(n)+'"'+(SHW.to===n?' class="on"':'')+'>'+esc(n)+'</button>';});
  h+='<button type="button" data-pk=""'+(SHW.to===''?' class="on"':'')+'>다른 분</button></div>';
  var who=SHW.to?SHW.to+'님':'○○님';
  h+='<div class="pv"><i style="'+thumbStyle(x)+'">'+(x.art?x.art[0]:'')+'</i><p>'+esc(who)+', 이 장면 기억나세요?<br><span style="font-size:13px;color:var(--sub)">「'+esc(x.title)+'」</span></p></div>';
  h+='<button type="button" data-s="kk" class="kk">카카오톡으로 보여 드리기</button>';
  h+='<button type="button" data-s="rv" class="ln">받는 분 화면 미리 보기 ›</button>';
  h+='<button type="button" data-s="x" class="cl">취소</button></div>';
  $('sheet').innerHTML=h;
}
/* ── v3 받는 분 화면(가입 없이 · 링크로 엶) ── */
function openRcv(x,to){
  var h=phHtml('받는 분 화면 · 미리 보기')+'<div class="rv"><div class="br">사랑흐름 우리 이야기</div>'+
    '<p class="lead">'+esc(to?to+'님,':'안녕하세요,')+'<br>'+esc(ME)+' 님이 이 장면을 함께 기억하고 싶어<br>보내 드렸습니다.</p>'+
    '<div class="ph2" style="'+(x.art?'background:'+x.art[1]:'background-image:url('+x.img+')')+'">'+(x.art?x.art[0]:'')+'</div>'+
    '<div class="tt">'+esc(x.title)+'</div>'+
    '<textarea id="rvT" placeholder="이 장면, 어떻게 기억하세요?"></textarea>'+
    '<button type="button" class="go2" id="rvGo">🍇 나도 기억해요 남기기</button>'+
    '<div class="done" id="rvDone">남기신 기억이 '+esc(ME)+' 님께 전해졌습니다.<br><button type="button" class="go2" id="rvRoom" style="margin-top:12px">「'+esc(rm(x.room).name)+'」 둘러보기</button></div>'+
    '<div><button type="button" class="lk" id="rvOut">이 사진에서 저를 빼 주세요</button></div></div>';
  pgOpen('rcv',h);
  $('rvGo').onclick=function(){if(!$('rvT').value.trim()){toast('기억을 한 줄 적어 주세요');$('rvT').focus();return;}ding();$('rvGo').style.display='none';$('rvT').readOnly=true;$('rvDone').style.display='block';};
  $('rvRoom').onclick=function(){toast('실화면에서는 그 방 첫 화면이 손님으로 열립니다');};
  $('rvOut').onclick=function(){toast('관리자에게 알려 드렸습니다 — 확인되면 이 사진이 내려갑니다(시험판)');};
}
/* ── v3 「나」 화면 ── */
function roomCard(r,withMore){
  var im=r.art?'<div class="im" style="background:'+r.art[1]+'">'+r.art[0]+'</div>':'<div class="im" style="background-image:url('+r.cover+')"></div>';
  return '<div class="rc" data-r="'+r.id+'">'+im+'<div class="tx"><div class="nm">'+(withMore&&r.pin?'📌 ':'')+esc(r.name)+'</div><div class="sb">함께하는 분 '+(r.ppl||0)+'</div>'+
    (r.newN?'<span class="nw">새 기억 '+r.newN+'</span>':'')+'</div>'+(withMore?'<button type="button" class="mo" data-m="'+r.id+'" aria-label="더 보기">⋯</button>':'')+'</div>';
}
function gridHtml(list,lockKid){
  var h='<div class="mg">';
  list.forEach(function(x,i){h+='<button type="button" data-g="'+i+'">'+(lockKid&&x.kid?'<span class="lock">🔒 아이 사진</span>':'')+(x.art?'<div class="art" style="background:'+x.art[1]+'">'+x.art[0]+'</div>':'<img alt="" src="'+x.th+'">')+'</button>';});
  return h+'</div>';
}
var MYL=[],WHL=[];
function openMe(redraw){
  MYL=ITEMS.filter(function(x){return x.by===ME;});
  var mem=Object.keys(MEM).filter(function(k){return MEM[k];}).length+2;
  var h=phHtml('나')+'<div class="mh"><div class="av"><span>'+esc(ME.slice(0,1))+'</span></div><div><div class="nm">'+esc(ME)+'</div><div class="sb">사진 '+MYL.length+' · 기억 '+mem+' · 나에게만 보입니다</div></div></div>'+
    '<div class="sec"><h2>내 이야기방</h2>';
  myRooms().forEach(function(r){h+=roomCard(r,true);});
  h+='</div><div class="sec"><h2>내가 남긴 사진</h2></div>'+gridHtml(MYL,true)+'<div class="note" style="padding-top:10px">🔒 아이가 나온 사진은 마당에 나가지 않고, 보여 드리기도 하지 않습니다.</div>'+'<button type="button" class="bigb" id="meMk">＋ 이야기방 만들기</button>';
  if(redraw&&$('me').classList.contains('on')){$('me').innerHTML=h;}else{pgOpen('me',h);}
}
$('me').addEventListener('click',function(e){
  var m=e.target.closest('[data-m]');if(m){SHW={r:m.getAttribute('data-m')};var r=rm(SHW.r);
    $('sheet').innerHTML='<div class="grab"></div><button type="button" data-s="pin">📌 '+(r.pin?'맨 위에서 내리기':'맨 위에 두기')+'</button><button type="button" data-s="out" class="warn">↩ 방 나가기</button><button type="button" data-s="x" class="cl">취소</button>';sheet(true);return;}
  var c=e.target.closest('.rc');if(c){toast('실화면에서는 「'+rm(c.getAttribute('data-r')).name+'」 첫 화면이 열립니다');return;}
  var g=e.target.closest('[data-g]');if(g){openView(+g.getAttribute('data-g'),MYL);return;}
  if(e.target.closest('#meMk')){toast('실화면에서는 「이야기방 만들기」 화면으로 갑니다');}
});
/* ── v3 남의 화면 — 내가 볼 수 있는 것만 · 친구 신청 없음 ── */
function canSee(r){return r.mine||!r.art||r.id==='mu';}   /* 견본: 내 방 + 누구나 둘러봄 방 */
function openWho(name){
  if(name===ME){openMe();return;}
  WHL=ITEMS.filter(function(x){return x.by===name&&canSee(rm(x.room))&&!x.kid;});
  var rooms={};ITEMS.forEach(function(x){if(x.by===name){rooms[x.room]=1;}});
  var both=myRooms().filter(function(r){return rooms[r.id];});
  var h=phHtml(name)+'<div class="mh"><div class="av"><span>'+esc(name.slice(0,1))+'</span></div><div><div class="nm">'+esc(name)+'</div></div></div>'+
    '<div class="sec"><h2>함께 있는 방</h2>';
  both.forEach(function(r){h+=roomCard(r,false);});
  if(!both.length){h+='<div class="note">함께 있는 방이 없습니다</div>';}
  h+='</div><div class="sec"><h2>'+esc(name)+' 님이 남긴 사진</h2></div>'+gridHtml(WHL,false)+'<div class="note" style="padding-top:10px">내가 볼 수 있는 방의 사진만 보입니다.</div>';
  pgOpen('who',h);
}
$('who').addEventListener('click',function(e){
  var c=e.target.closest('.rc');if(c){toast('실화면에서는 「'+rm(c.getAttribute('data-r')).name+'」 첫 화면이 열립니다');return;}
  var g=e.target.closest('[data-g]');if(g){openView(+g.getAttribute('data-g'),WHL);}
});
$('meB').onclick=function(){openMe();};

var TT=null;
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(TT);TT=setTimeout(function(){t.classList.remove('on');},2200);}

/* 바둑판 누르기 */
$('grid').addEventListener('click',function(e){
  if(e.target.closest('.mkGo')){toast('실화면에서는 「이야기방 만들기」 화면으로 갑니다');return;}
  var t=e.target.closest('.t');if(t){openView(+t.getAttribute('data-i'));}
});
$('rooms').addEventListener('click',function(e){var b=e.target.closest('.rm');if(!b){return;}
  if(b.id==='rmMk'){toast('실화면에서는 「이야기방 만들기」 화면으로 갑니다');return;}
  toast('실화면에서는 「'+rm(b.getAttribute('data-r')).name+'」 첫 화면이 열립니다');});
$('menuB').onclick=function(){toast('☰ 메뉴는 실화면 그대로(공유하기 · 이야기방 만들기 · 이용 안내)');};
$('wH').onclick=function(){window.scrollTo({top:0,behavior:'smooth'});};
$('wB').onclick=function(){toast('실화면에서는 「우리 이야기에서 나가시겠습니까?」를 묻습니다');};
$('mxA').onclick=function(){setMix('old');window.scrollTo(0,0);};
$('mxB').onclick=function(){setMix('even');window.scrollTo(0,0);};

drawRooms();setMix('even');
})();
</script>
</body>
</html>
