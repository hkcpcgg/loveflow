<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>QR 인쇄물 만들기 · 사랑흐름</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1E4A76;--ink:#24303C;--sub:#6B7280;--line:#E2DDD2;--bg:#FBF8F2;--deep:#1B1F3B;--violet:#5B4B8A}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans KR",system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%}
.pw{max-width:560px;margin:0 auto;padding:14px 14px 10px}
.ttl{text-align:center;margin:6px 0 2px;font-family:"Noto Serif KR",serif;font-size:22px;color:var(--navy)}
.room{text-align:center;color:var(--sub);font-size:14px;margin:0 0 12px}
.lab{font-weight:800;font-size:15px;margin:14px 0 6px;display:flex;align-items:center;gap:6px}
.lab i{font-style:normal}
.chips{display:flex;gap:8px;overflow-x:auto;white-space:nowrap;padding:2px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;border-radius:22px;padding:8px 14px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
.chip small{display:block;font-size:11px;color:var(--sub);line-height:1.2}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}.chip.on small{color:#D6E2F0}
.tp{display:inline-flex;align-items:center;gap:8px}.tp b{width:18px;height:24px;border-radius:4px;display:inline-block;border:1px solid rgba(0,0,0,.15)}
.fld{display:block;margin:8px 0}
.fld span{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
.fld input{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1.5px solid #D7D2C7;border-radius:10px;background:#fff}
.fld input:focus{outline:none;border-color:var(--navy)}
.tog{display:flex;align-items:center;gap:10px;margin:8px 0 2px;font-size:14px;cursor:pointer;user-select:none}
.tog input{width:20px;height:20px;accent-color:var(--navy)}
.ok{display:block;width:100%;margin:10px 0 0;padding:12px;border:0;border-radius:12px;background:var(--navy);color:#fff;font:inherit;font-weight:800;font-size:16px;cursor:pointer}
.prev{margin:16px 0 6px;background:#EFEBE3;border-radius:14px;padding:14px;text-align:center;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.prev img{max-width:100%;max-height:62vh;box-shadow:0 6px 22px rgba(0,0,0,.18);border-radius:3px;background:#fff}
.prev .cap{font-size:12px;color:var(--sub);margin-top:8px}
.wait{color:var(--sub);font-size:14px;display:flex;flex-direction:column;align-items:center;gap:8px}
.wait .hrt{font-size:26px;animation:hb 1s ease-in-out infinite}@keyframes hb{50%{transform:scale(1.2)}}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:8px 0 0;padding:14px;border-radius:12px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;border:0}
.btn.p{background:var(--deep);color:#fff}.btn.l{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn:disabled{opacity:.45}
.note{font-size:12.5px;color:var(--sub);text-align:center;margin:8px 0 0}
.err{background:#FBEDE8;color:#9A3A24;border-radius:10px;padding:12px;font-size:14px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(27,31,59,.94);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1}
.hold{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:98;display:none;flex-direction:column;align-items:center;justify-content:center;padding:18px}
.hold.on{display:flex}.hold img{max-width:100%;max-height:72vh;background:#fff}.hold p{color:#fff;font-size:15px;text-align:center}
.hold button{margin-top:10px;padding:10px 26px;border-radius:20px;border:0;font:inherit;font-weight:700}
</style>
</head>
<body data-lf-title="QR 인쇄물 만들기">
<div class="pw" id="pw">
  <p class="room" id="room"></p>
  <div id="main"></div>
</div>
<div class="toast" id="toast"></div>
<div class="hold" id="hold"><p>그림을 길게 눌러 저장하십시오</p><img id="holdImg" alt="QR 인쇄물"><button type="button" id="holdX">닫기</button></div>
<div id="lfFoot"></div>
<script>
(function(){
'use strict';
/* ── 크기 여섯 · 300dpi ── 74차 「마」 · mini = 아래 띠 작은 QR(식탁 카드 · 명함은 글씨만 · 그림 소통 ⑤ 대표 OK 261110) */
var SIZES=[
 {k:'a5',  t:'A5 세움판', s:'계산대',   W:1748,H:2480,mm:148, mini:true},
 {k:'a4',  t:'A4 포스터', s:'벽',       W:2480,H:3508,mm:210, mini:true},
 {k:'win', t:'창문 스티커',s:'유리창',  W:2362,H:2362,mm:200, mini:true},
 {k:'tbl', t:'식탁 카드', s:'탁자',     W:1181,H:1772,mm:100, mini:false},
 {k:'card',t:'명함',      s:'90×50mm',  W:1063,H:591, mm:90,  mini:false},
 {k:'kko', t:'카톡용 세로',s:'휴대폰 화면',W:1080,H:1920,mm:0, mini:true}
];
/* ── 틀 여섯 ── 흔한 금 · 주황 · 분홍 단색은 쓰지 않음 */
var TPLS=[
 {t:'틀 1',bg:'#FFFCF7',hd:'#163A5C',tx:'#46525E',band:'#1B1F3B',bd:''},
 {t:'틀 2',bg:'#F1EEF9',hd:'#3A2F6B',tx:'#4E4766',band:'#2A2150',bd:''},
 {t:'틀 3',bg:'#1E2E4A',hd:'#FFFFFF',tx:'#D9E1EE',band:'#0F1730',bd:'',dark:true},
 {t:'틀 4',bg:'#EAF3EF',hd:'#1F5B4A',tx:'#3E5A52',band:'#173F35',bd:''},
 {t:'틀 5',bg:'#FFFFFF',hd:'#1E4A76',tx:'#46525E',band:'#1B1F3B',bd:'#1E4A76'},
 {t:'틀 6 큰 글씨',bg:'#FFFCF7',hd:'#111111',tx:'#222222',band:'#1B1F3B',bd:'',big:true}
];
var MSGS=['오늘 이곳의 사진을 함께 남겨 주세요','우리 가게 이야기에 사진을 올려 주세요','손님이 남긴 사진을 함께 봐요','사진을 올려 주시면 작은 선물을 드립니다'];
var EV_MSG=3;
var PLAZA='https://www.loveflow.ai.kr/rec/?plaza=1';
var COPY='© 2026 LoveFlow 사랑흐름 · LFRI™ All rights reserved. 무단 복제 · 상업적 이용 금지';
var FB='"Noto Sans KR",system-ui,sans-serif', FS='"Noto Serif KR",serif';

function q(n){ var m=location.search.match(new RegExp('[?&]'+n+'=([^&]*)')); try{ return m?decodeURIComponent(m[1].replace(/\+/g,' ')):''; }catch(e){ return m?m[1]:''; } }
var COM=(q('c')||'').replace(/[^A-Za-z0-9\-]/g,'');
var RNAME=q('n').slice(0,40);
var URL_SHOP=COM?'https://www.loveflow.ai.kr/rec/?c='+COM:'';
var S={size:0,tpl:0,name:RNAME,msg:MSGS[0],ev:false};
try{ var sv=JSON.parse(localStorage.getItem('lf_print_'+COM)||'null'); if(sv){ S.size=sv.size|0; S.tpl=sv.tpl|0; S.name=sv.name||S.name; S.msg=(typeof sv.msg==='string')?sv.msg:S.msg; S.ev=!!sv.ev; } }catch(e){}
if(S.size<0||S.size>=SIZES.length){S.size=0;} if(S.tpl<0||S.tpl>=TPLS.length){S.tpl=0;}
function save(){ try{ localStorage.setItem('lf_print_'+COM,JSON.stringify(S)); }catch(e){} }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function $(i){ return document.getElementById(i); }
var tt=null; function toast(m){ var t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(function(){t.classList.remove('on');},2200); }

if(!COM){ $('main').innerHTML='<div class="err">이 화면은 이야기방 관리 화면의 「QR 받기」에서 엽니다.</div>'; return; }
$('room').textContent=RNAME?RNAME:'';
window.LF_WAY={home:function(){ location.href='/rec/?c='+COM; return true; }};

/* ── 화면 그리기 (3단: ① 고르기 · 고치기 ② 바로 보기 · 저장 · 공유 ③ 부가) ── */
function chipsSize(){ return SIZES.map(function(z,i){ return '<button type="button" class="chip'+(i===S.size?' on':'')+'" data-sz="'+i+'">'+z.t+'<small>'+z.s+'</small></button>'; }).join(''); }
function chipsTpl(){ return TPLS.map(function(p,i){ return '<button type="button" class="chip tp'+(i===S.tpl?' on':'')+'" data-tp="'+i+'"><b style="background:'+p.bg+';border-bottom:6px solid '+p.band+(p.bd?';outline:2px solid '+p.bd:'')+'"></b>'+p.t+'</button>'; }).join(''); }
function chipsMsg(){ return MSGS.map(function(m,i){ return '<button type="button" class="chip" data-mg="'+i+'">'+esc(m)+'</button>'; }).join(''); }
$('main').innerHTML=
 '<div class="lab"><i>📐</i>크기</div><div class="chips" id="cSz">'+chipsSize()+'</div>'+
 '<div class="lab"><i>🎨</i>틀</div><div class="chips" id="cTp">'+chipsTpl()+'</div>'+
 '<div class="lab"><i>✏️</i>문구</div>'+
 '<label class="fld"><span>가게 이름</span><input id="fName" maxlength="30" value="'+esc(S.name)+'"></label>'+
 '<label class="fld"><span>한 줄 문구</span><input id="fMsg" maxlength="40" value="'+esc(S.msg)+'"></label>'+
 '<div class="chips" id="cMg">'+chipsMsg()+'</div>'+
 '<label class="tog"><input type="checkbox" id="fEv"'+(S.ev?' checked':'')+'>이벤트 안내 한 줄 넣기</label>'+
 '<button type="button" class="ok" id="bApply">적용</button>'+
 '<div class="prev" id="prev"><div class="wait"><span class="hrt">💜</span><b>인쇄물을 그리는 중입니다</b></div></div>'+
 '<button type="button" class="btn p" id="bDown" disabled>⬇ 인쇄용 내려받기</button>'+
 '<button type="button" class="btn l" id="bShare" disabled>카카오톡으로 공유</button>'+
 '<p class="note">QR 주소는 바뀌지 않습니다 · 이벤트 내용은 가게가 책임집니다</p>';

function onSel(box,attr,fn){ $(box).addEventListener('click',function(e){ var b=e.target.closest('['+attr+']'); if(!b){return;} fn(parseInt(b.getAttribute(attr),10),b); }); }
function mark(box,attr,i){ Array.prototype.forEach.call($(box).querySelectorAll('['+attr+']'),function(b){ b.classList.toggle('on',parseInt(b.getAttribute(attr),10)===i); }); }
onSel('cSz','data-sz',function(i){ S.size=i; mark('cSz','data-sz',i); redraw(); });
onSel('cTp','data-tp',function(i){ S.tpl=i; mark('cTp','data-tp',i); redraw(); });
onSel('cMg','data-mg',function(i){ $('fMsg').value=MSGS[i]; if(i===EV_MSG){ $('fEv').checked=true; } readF(); redraw(); });
function readF(){ S.name=$('fName').value.trim(); S.msg=$('fMsg').value.trim(); S.ev=$('fEv').checked; }
$('bApply').onclick=function(){ readF(); redraw(); toast('적용했습니다'); };
$('fEv').onchange=function(){ readF(); redraw(); };
var it=null; ['fName','fMsg'].forEach(function(id){ $(id).addEventListener('input',function(){ clearTimeout(it); it=setTimeout(function(){ readF(); redraw(); },500); }); });

/* ── QR 부품 ── */
function qrLib(cb){ if(window.QRCode){ cb(true); return; } var s=document.createElement('script'); s.src='/rec/qr.js?v=1'; s.onload=function(){ cb(!!window.QRCode); }; s.onerror=function(){ cb(false); }; document.head.appendChild(s); }
function qrCanvas(text,px){ var box=document.createElement('div'); box.style.cssText='position:fixed;left:-9999px;top:0'; document.body.appendChild(box);
  try{ new QRCode(box,{text:text,width:px,height:px,correctLevel:QRCode.CorrectLevel.H}); }catch(e){ box.parentNode.removeChild(box); return null; }
  var c=box.querySelector('canvas'); box.parentNode.removeChild(box); return c; }
/* 둘레 여백(흰 바탕) 포함해 그림 · 여백 = 크기의 8% */
function drawQR(x,text,X,Y,size){ var m=Math.round(size*0.08), inner=size-2*m, c=qrCanvas(text,Math.max(256,Math.min(1600,Math.round(inner))));
  x.fillStyle='#FFFFFF'; x.fillRect(X,Y,size,size); if(c){ x.imageSmoothingEnabled=false; x.drawImage(c,X+m,Y+m,inner,inner); } return !!c; }
function wrap(x,t,max,lines){ var out=[],line=''; String(t).split(/(\s+)/).forEach(function(w){ if(!w){return;} if(x.measureText(line+w).width<=max||!line.trim()){ if(x.measureText(line+w).width>max){ w.split('').forEach(function(ch){ if(x.measureText(line+ch).width>max&&line){ out.push(line); line=ch; } else { line+=ch; } }); } else { line+=w; } } else { out.push(line.trim()); line=w.trim(); } }); if(line.trim()){out.push(line.trim());} if(out.length>lines){ out=out.slice(0,lines); out[lines-1]=out[lines-1].slice(0,-1)+'…'; } return out; }
/* 받침 있으면 「이」 · 없으면 「가」 */
function iga(w){ var c=String(w).charCodeAt(String(w).length-1); return (c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28)?'이':'가'; }
function fitFont(x,t,wt,fam,size,max){ var f=size; x.font=wt+' '+f+'px '+fam; while(f>size*0.6&&x.measureText(t).width>max){ f-=2; x.font=wt+' '+f+'px '+fam; } return f; }

/* ── 한 장 그리기 ── 돌려주는 것: canvas · 시험용 숫자(LAY) */
function render(){
  var Z=SIZES[S.size], P=TPLS[S.tpl], W=Z.W, H=Z.H, c=document.createElement('canvas'); c.width=W; c.height=H;
  var x=c.getContext('2d'), name=S.name||RNAME||'우리 가게', msg=S.msg, big=!!P.big, LAY={size:Z.k,tpl:S.tpl,W:W,H:H};
  var pxmm=Z.mm?W/Z.mm:0;
  x.fillStyle=P.bg; x.fillRect(0,0,W,H); x.textAlign='center'; x.textBaseline='middle';
  var land=W>H, u=(land?H:W)/1000;
  /* 아래 띠 */
  var bandH=Math.round((land?150:(Z.mini?190:150))*u);
  if(Z.k==='win'){ bandH=Math.round(170*u); }
  var bandY=H-bandH;
  if(P.bd){ x.strokeStyle=P.bd; x.lineWidth=Math.round(10*u); x.strokeRect(24*u,24*u,W-48*u,bandY-36*u); x.lineWidth=Math.round(3*u); x.strokeRect(44*u,44*u,W-88*u,bandY-76*u); }
  if(land){
    /* 명함 — 왼쪽 가게 QR · 오른쪽 글 */
    var pad=(P.bd?90:50)*u, qs=Math.round(bandY-2*pad); drawQR(x,URL_SHOP,pad,pad,qs); LAY.q=qs; LAY.qmm=pxmm?qs/pxmm:0;
    var tx0=pad+qs+50*u, tw=W-tx0-pad, cx=tx0+tw/2;
    var fs=fitFont(x,name,'800',FS,(big?150:120)*u,tw); x.fillStyle=P.hd; x.fillText(name,cx,pad+fs*0.7);
    x.font='500 '+((big?64:54)*u)+'px '+FB; x.fillStyle=P.tx; var ml=wrap(x,msg,tw,2); ml.forEach(function(t,i){ x.fillText(t,cx,pad+fs*1.5+i*70*u+40*u); });
    x.font='700 '+(50*u)+'px '+FB; x.fillStyle=P.dark?'#FFFFFF':'#2E3A46'; x.fillText('휴대폰 카메라로 비춰 보세요',cx,bandY-pad-(S.ev?70*u:20*u));
    if(S.ev){ x.font='500 '+(36*u)+'px '+FB; x.fillStyle=P.dark?'#B9C2D3':'#8A8172'; x.fillText('※ 이벤트 내용은 '+name+iga(name)+' 책임집니다',cx,bandY-pad-10*u); }
  } else {
    /* 세로 — 위 이름 · 문구 → 가운데 큰 QR → 안내 → 아래 띠 */
    var pd=80*u, tw2=W-2*pd, y=pd+(P.bd?40*u:0);
    var fs2=fitFont(x,name,'800',FS,(big?118:92)*u,tw2); x.fillStyle=P.hd; x.fillText(name,W/2,y+fs2/2); y+=fs2*1.25;
    var mf=(big?58:44)*u; x.font='500 '+mf+'px '+FB; x.fillStyle=P.tx; var ml2=msg?wrap(x,msg,tw2,2):[]; ml2.forEach(function(t,i){ x.fillText(t,W/2,y+mf*0.6+i*mf*1.35); }); y+=ml2.length*mf*1.35+30*u;
    var ctaH=(big?72:60)*u, evH=S.ev?46*u:0;
    var avail=bandY-y-ctaH-evH-50*u;
    var qs2=Math.round(Math.min(W*(big?0.74:0.64), avail)), mini=0, qy=0;
    var place=function(){ qy=Math.round(y+Math.max(0,(avail-qs2)*0.3)); mini=Z.mini?Math.round(Math.min(bandH-36*u, qs2/4)):0; };
    place();
    /* 아래 작은 QR 과 세로 거리 30mm 넘게 — 모자라면 가게 QR 을 조금씩 줄임 */
    if(mini&&pxmm){ var need=30.5*pxmm, n=0; while(n++<60 && (Math.round(bandY+(bandH-mini)/2)-(qy+qs2))<need){ qs2=Math.round(qs2*0.98); place(); } }
    if(mini&&pxmm&&mini/pxmm<14){ mini=0; }   /* 14mm 보다 작으면 잘 안 읽힘 → 글씨만 */
    var qx=Math.round((W-qs2)/2);
    if(P.dark){ x.fillStyle='rgba(255,255,255,.08)'; x.fillRect(qx-14*u,qy-14*u,qs2+28*u,qs2+28*u); }
    drawQR(x,URL_SHOP,qx,qy,qs2); LAY.q=qs2; LAY.qmm=pxmm?qs2/pxmm:0; LAY.qBottom=qy+qs2; LAY.qx=qx; LAY.qy=qy;
    var cy=qy+qs2+ctaH*0.75; x.font='700 '+((big?52:40)*u)+'px '+FB; x.fillStyle=P.dark?'#FFFFFF':'#2E3A46'; x.fillText('휴대폰 카메라로 비춰 보세요',W/2,cy);
    if(S.ev){ x.font='500 '+(27*u)+'px '+FB; x.fillStyle=P.dark?'#B9C2D3':'#8A8172'; x.fillText('※ 이벤트 내용은 '+name+iga(name)+' 책임집니다',W/2,cy+ctaH*0.55+10*u); }
    LAY.mini=mini;
  }
  /* 아래 짙은 띠 — 사랑흐름 */
  x.fillStyle=P.band; x.fillRect(0,bandY,W,bandH);
  var bp=46*u, miniPx=LAY.mini||0;
  x.textAlign='left';
  if(miniPx){
    var my=Math.round(bandY+(bandH-miniPx)/2), mx=Math.round(W-bp-miniPx);
    drawQR(x,PLAZA,mx,my,miniPx); LAY.miniTop=my; LAY.mx=mx; LAY.minimm=pxmm?miniPx/pxmm:0;
    LAY.gapmm=pxmm&&LAY.qBottom?(my-LAY.qBottom)/pxmm:0;
    x.textAlign='right'; x.fillStyle='#E6E1FA'; x.font='700 '+(30*u)+'px '+FB; x.fillText('사랑흐름',mx-18*u,bandY+bandH*0.40); x.fillText('둘러보기',mx-18*u,bandY+bandH*0.40+38*u);
    x.textAlign='left';
  }
  var lfF=(land?60:70)*u;
  x.fillStyle='#FFFFFF'; x.font='800 '+lfF+'px '+FS; x.fillText('사랑흐름',bp,bandY+bandH*0.36);
  x.fillStyle='#C9C3E6'; x.font='500 '+(24*u)+'px '+FB; x.fillText(miniPx?'우리 이야기 · loveflow.ai.kr':'사랑흐름 둘러보기 · loveflow.ai.kr',bp,bandY+bandH*0.66);
  x.fillStyle='rgba(255,255,255,.55)'; x.font='400 '+(14*u)+'px '+FB; x.fillText(COPY,bp,bandY+bandH*0.88);
  x.textAlign='center';
  c.LAY=LAY; return c;
}
var CV=null, busy=0;

    if(my!==busy){ return; }

      var Z=SIZES[S.size];

      $('bDown').disabled=false; $('bShare').disabled=false; window.__LAY=CV.LAY; };

  });
}
function fname(){ return '우리이야기_QR_'+COM+'_'+SIZES[S.size].k+'.png'; }
function blob(cb){ if(!CV){return;} CV.toBlob(function(b){ cb(b); },'image/png'); }

$('holdX').onclick=function(){ $('hold').classList.remove('on'); };

  try{ var u=URL.createObjectURL(b), a=document.createElement('a'); a.href=u; a.download=fname(); document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(u); if(a.parentNode){a.parentNode.removeChild(a);} },1500); toast('인쇄용 그림을 내려받았습니다'); }catch(e){ hold(); } }); };
$('bShare').onclick=function(){ blob(function(b){ var f=null; try{ f=new File([b],fname(),{type:'image/png'}); }catch(e){}
  if(f&&navigator.canShare&&navigator.canShare({files:[f]})){ navigator.share({files:[f],title:(S.name||RNAME)+' QR'}).catch(function(){}); return; }
  hold(); }); };
