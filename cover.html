<!DOCTYPE html>
<!-- 사랑흐름 표지(랜딩) v11 · 마퀴 한칸 내림+글자 2pt 키움 · 기능헤드라인 상단(관계우주 밑)/2줄 · 마퀴 버튼서 띄움 · 기능 헤드라인 고정(MBTI 너머/5분무료) + 시적카피 흐름 · 버튼위 마퀴(옆으로 흐르는 카피) · [배포시 파일명 cover.html 로 저장] · 무료나침반/홈입장 버튼 · 2026.06.26 · 노드10~15·우아·몰입카메라·부드러운페이드리셋·끌리는버튼 · Three.js r128 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>LOVE FLOW · 관계 우주</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#04060C;font-family:-apple-system,'Noto Sans KR',sans-serif;color:#F5E6C8}
  #scene{position:fixed;inset:0;touch-action:none}
  .ui{position:fixed;left:0;right:0;text-align:center;pointer-events:none;z-index:5}
  .top{top:30px}
  .top .title{font-family:'Nanum Myeongjo',serif;font-size:27px;font-weight:800;letter-spacing:.04em;color:#F5E6C8;text-shadow:0 2px 18px rgba(0,0,0,.7)}
  .top .brand{font-size:12px;letter-spacing:4px;color:#C9A24B;margin-bottom:8px}
  .spin-hint{position:fixed;left:0;right:0;top:46%;text-align:center;font-size:13px;letter-spacing:.06em;color:#C9A24B;z-index:5;pointer-events:none;opacity:.9;animation:floaty 2.6s ease-in-out infinite;text-shadow:0 1px 8px rgba(0,0,0,.6)}
  @keyframes floaty{0%,100%{transform:translateX(0)}50%{transform:translateX(10px)}}
  .spin-hint.hide{opacity:0;transition:opacity .6s}
  .bottom{bottom:34px;display:flex;flex-direction:column;align-items:center;gap:12px;z-index:6}
  .lead{margin-top:14px;text-align:center;padding:0 22px}
  .lead-main{font-family:'Nanum Myeongjo',serif;font-size:18px;font-weight:800;line-height:1.5;color:#F7ECCB;text-shadow:0 2px 16px rgba(0,0,0,.8)}
  .lead-main b{color:#E8C46A}
  .lead-sub{font-size:13px;color:#C9BA88;margin-top:7px;letter-spacing:.02em;text-shadow:0 1px 10px rgba(0,0,0,.7)}
  @media(max-width:600px){.lead-main{font-size:16px}.lead-sub{font-size:12px}}
  .marquee{position:fixed;left:0;right:0;bottom:215px;z-index:6;overflow:hidden;white-space:nowrap;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);pointer-events:none}
  .marquee-track{display:inline-block;white-space:nowrap;will-change:transform;animation:flow 95s linear infinite}
  .marquee-track span{font-size:18px;color:#EBDCB0;letter-spacing:.01em;text-shadow:0 1px 12px rgba(0,0,0,.7)}
  .marquee-track .dot{color:#C9A24B;margin:0 16px;font-size:16px}
  @keyframes flow{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @media(max-width:600px){.marquee{bottom:218px}.marquee-track span{font-size:17px}}
  .cta{pointer-events:auto;width:300px;max-width:84vw;border-radius:18px;padding:15px 20px;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px}
  .cta .t{font-size:17px;font-weight:800;letter-spacing:.01em}
  .cta .d{font-size:13px;font-weight:500;opacity:.92}
  .cta-free{background:linear-gradient(135deg,#E8C46A,#C9A24B);color:#0A162B;border:none;box-shadow:0 8px 30px rgba(201,162,75,.5);animation:pulse 2.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 8px 30px rgba(201,162,75,.5)}50%{transform:scale(1.035);box-shadow:0 10px 40px rgba(201,162,75,.72)}}
  .cta-paid{background:rgba(10,22,43,.45);color:#F0E2B8;border:1.5px solid #C9A24B}
  .cta:active{transform:scale(.975)}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="ui top">
  <div class="brand">LOVE FLOW</div>
  <div class="title">관계 우주</div>
  <div class="lead" id="lead"><div class="lead-main">MBTI로 성격은 알아도, <b>나와 그 사람 사이</b>는 몰랐죠</div><div class="lead-sub">사랑흐름이 그 관계를 읽어드려요 · 5분 · 무료</div></div>
</div>
<div class="spin-hint" id="spinHint">👆 손으로 돌려보세요</div>
<div class="marquee" id="marquee"><div class="marquee-track" id="mtrack"></div></div>
<div class="ui bottom">
  <button class="cta cta-free" id="ctaMain"><span class="t">🧭 무료 나침반</span><span class="d">내 관계의 계절을 읽다 →</span></button>
  <button class="cta cta-paid" id="ctaSub"><span class="t">🏠 홈으로 입장</span><span class="d">사랑흐름 이야기 둘러보기 →</span></button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  var cv=document.getElementById('scene'), W=innerWidth,H=innerHeight;
  var renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(W,H);
  var scene=new THREE.Scene(); scene.fog=new THREE.FogExp2(0x04060C,0.018);
  var camera=new THREE.PerspectiveCamera(62,W/H,0.1,1000);
  var camDist=30; camera.position.z=camDist;   // 몰입: 망에 가깝게

  scene.add(new THREE.AmbientLight(0x556080,0.85));
  var key=new THREE.DirectionalLight(0xFFF0D0,1.0); key.position.set(5,8,10); scene.add(key);
  var rim=new THREE.DirectionalLight(0x88B0E0,0.5); rim.position.set(-8,-4,-6); scene.add(rim);

  // 은은한 배경 별가루(가벼움)
  (function(){var g=new THREE.BufferGeometry(),n=260,p=[];for(var i=0;i<n;i++){var r=90*Math.cbrt(Math.random()),th=Math.random()*6.28,ph=Math.acos(2*Math.random()-1);p.push(r*Math.sin(ph)*Math.cos(th),r*Math.sin(ph)*Math.sin(th),r*Math.cos(ph));}g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x4A4530,size:0.4,transparent:true,opacity:0.5})));})();

  var root=new THREE.Group(); scene.add(root);
  function radial(i,m){var c=document.createElement('canvas');c.width=c.height=128;var x=c.getContext('2d');var g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,i);g.addColorStop(0.4,m);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(c);}
  var glowTex=radial('rgba(255,243,205,0.95)','rgba(212,175,55,0.4)');
  var PAL=[0xE0A85A,0x6FA8C9,0xD98AA0,0x9AD0A0,0xC9B24B,0xB48AD9,0x7FC9C0,0xE8C06A,0x8A9AD9,0xC98A6F,0x9AD9C0,0xBFAE7F];

  function bead(color,size){
    var grp=new THREE.Group();
    var m=new THREE.Mesh(new THREE.SphereGeometry(size,22,22),new THREE.MeshPhongMaterial({color:color,shininess:80,specular:0x444444,transparent:true,opacity:0}));
    grp.add(m);
    var spr=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:color,blending:THREE.AdditiveBlending,transparent:true,opacity:0,depthWrite:false}));
    spr.scale.set(size*5,size*5,1); grp.add(spr);
    grp.scale.setScalar(0.001); grp.userData={core:m,glow:spr,size:size,born:0,fade:1};
    return grp;
  }
  var nodes=[], edges=[], faces=[], edgeKey={}, seeds=[], triCount=0;
  var MAX = (W<600?11:14);   // 모바일 11, 데스크탑 14 (10~15 수준)
  var phase='grow';          // grow → hold → fade → (reset)
  var holdT=0;

  function addNode(pos,color,size){var g=bead(color,size);g.position.copy(pos);root.add(g);var n={grp:g,pos:pos.clone()};nodes.push(n);return n;}
  function curveBetween(a,b){var mid=a.clone().add(b).multiplyScalar(0.5);var out=mid.clone().normalize().multiplyScalar(mid.length()*0.16+1.4);mid.add(out);return new THREE.QuadraticBezierCurve3(a.clone(),mid,b.clone());}
  function addEdge(n1,n2,faint){
    var i1=nodes.indexOf(n1),i2=nodes.indexOf(n2),k=Math.min(i1,i2)+'-'+Math.max(i1,i2);
    if(edgeKey[k])return;edgeKey[k]=1;
    var geo=new THREE.TubeGeometry(curveBetween(n1.pos,n2.pos),14,faint?0.05:0.09,6,false);
    var mat=new THREE.MeshBasicMaterial({color:faint?0x8AA0C9:0xD9B96A,transparent:true,opacity:0,blending:THREE.AdditiveBlending});
    var mesh=new THREE.Mesh(geo,mat);root.add(mesh);edges.push({mesh:mesh,born:0,max:faint?0.45:0.8,fade:1});
  }
  function addFace(a,b,c,color){
    var geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute([a.x,a.y,a.z,b.x,b.y,b.z,c.x,c.y,c.z],3));geo.computeVertexNormals();
    var mat=new THREE.MeshBasicMaterial({color:color,transparent:true,opacity:0,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false});
    var mesh=new THREE.Mesh(geo,mat);root.add(mesh);faces.push({mesh:mesh,born:0,target:0.08,fade:1});
  }

  function start(){
    for(var i=nodes.length-1;i>=0;i--)root.remove(nodes[i].grp);
    for(var e=0;e<edges.length;e++)root.remove(edges[e].mesh);
    for(var f=0;f<faces.length;f++)root.remove(faces[f].mesh);
    nodes.length=0;edges.length=0;faces.length=0;seeds.length=0;edgeKey={};triCount=0;
    phase='grow';holdT=0;root.rotation.set(0,0,0);tRotY=0;rotY=0;
    var pA=addNode(new THREE.Vector3(-5,4,0),PAL[1],1.4);
    var pB=addNode(new THREE.Vector3(5,4,0),PAL[3],1.4);
    var me=addNode(new THREE.Vector3(0,-2,2),0xFFE0A0,1.9);
    pA.grp.userData.born=0.01;pB.grp.userData.born=0.01;me.grp.userData.born=0.01;
    addEdge(pA,pB);addEdge(pA,me);addEdge(me,pB);addFace(pA.pos,pB.pos,me.pos,0xC9A24B);
    triCount=1;
    seeds.push({a:pA,b:pB,bias:-1});seeds.push({a:pA,b:me,bias:1});seeds.push({a:pB,b:me,bias:-1});
  }

  function growOne(){
    if(!seeds.length||nodes.length>=MAX)return false;
    var idx=Math.floor(Math.random()*seeds.length),s=seeds[idx],A=s.a,B=s.b;
    var mid=A.pos.clone().add(B.pos).multiplyScalar(0.5),edgeLen=A.pos.distanceTo(B.pos);
    var along=B.pos.clone().sub(A.pos).normalize(),radialV=mid.clone().normalize();
    var perp=new THREE.Vector3().crossVectors(along,radialV).normalize();
    var up=new THREE.Vector3(0,s.bias||(Math.random()<0.5?1:-1),0);
    var dir=radialV.clone().multiplyScalar(0.5).add(perp.multiplyScalar((Math.random()<0.5?1:-1)*0.6)).add(up.multiplyScalar(0.5)).normalize();
    var npos=mid.clone().add(dir.multiplyScalar(edgeLen*(0.7+Math.random()*0.4)));
    if(npos.length()>20)npos.setLength(20);
    var color=PAL[nodes.length%PAL.length],size=0.6+Math.random()*0.4;
    var C=addNode(npos,color,size);addEdge(A,C);addEdge(B,C);addFace(A.pos,B.pos,C.pos,color);triCount++;
    seeds.push({a:A,b:C,bias:(s.bias||1)});seeds.push({a:B,b:C,bias:-(s.bias||1)});
    if(Math.random()<0.55)seeds.splice(idx,1);
    if(nodes.length>7&&Math.random()<0.35){var n1=nodes[(Math.random()*nodes.length)|0],n2=nodes[(Math.random()*nodes.length)|0];if(n1!==n2&&n1.pos.distanceTo(n2.pos)<14&&n1.pos.distanceTo(n2.pos)>5)addEdge(n1,n2,true);}
    return true;
  }
  start();

  // 버튼 (행선지 임시 — 추후 확정)
  document.getElementById('ctaMain').onclick=function(){ location.href='/compass.html'; };
  document.getElementById('ctaSub').onclick=function(){ location.href='/'; };

  // 드래그/줌
  var rotX=0.12,rotY=0,tRotX=0.12,tRotY=0,spin=0.0013,drag=false,lx,ly,lastD=0;
  function dn(x,y){drag=true;lx=x;ly=y;var sh=document.getElementById("spinHint");if(sh)sh.classList.add("hide");}function mv(x,y){if(!drag)return;tRotY+=(x-lx)*0.006;tRotX+=(y-ly)*0.006;tRotX=Math.max(-1.2,Math.min(1.2,tRotX));lx=x;ly=y;}function up(){drag=false;}
  cv.addEventListener('mousedown',function(e){dn(e.clientX,e.clientY);});addEventListener('mousemove',function(e){mv(e.clientX,e.clientY);});addEventListener('mouseup',up);
  cv.addEventListener('touchstart',function(e){if(e.touches.length===1)dn(e.touches[0].clientX,e.touches[0].clientY);else if(e.touches.length===2)lastD=pn(e);},{passive:true});
  cv.addEventListener('touchmove',function(e){if(e.touches.length===1)mv(e.touches[0].clientX,e.touches[0].clientY);else if(e.touches.length===2){var d=pn(e);camDist+=(lastD-d)*0.05;camDist=Math.max(20,Math.min(50,camDist));lastD=d;}},{passive:true});
  cv.addEventListener('touchend',up);function pn(e){var dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;return Math.sqrt(dx*dx+dy*dy);}
  cv.addEventListener('wheel',function(e){camDist+=e.deltaY*0.02;camDist=Math.max(20,Math.min(50,camDist));},{passive:true});

  var t=0, acc=0, beat=1.35;
  function tick(){
    t+=0.016;
    // 단계 진행
    if(phase==='grow'){
      acc+=0.016; if(acc>=beat){acc=0; if(!growOne()&&nodes.length>=MAX){phase='hold';holdT=0;} if(nodes.length>=MAX){phase='hold';holdT=0;} }
    } else if(phase==='hold'){
      holdT+=0.016; if(holdT>4.5){ phase='fade'; }
    } else if(phase==='fade'){
      var done=true;
      for(var i=0;i<nodes.length;i++){nodes[i].grp.userData.fade-=0.012;var fv=Math.max(0,nodes[i].grp.userData.fade);if(fv>0)done=false;nodes[i].grp.userData.core.material.opacity*=fv>0?0.94:0;nodes[i].grp.userData.glow.material.opacity*=fv>0?0.94:0;}
      for(var e=0;e<edges.length;e++){edges[e].mesh.material.opacity*=0.93;}
      for(var f=0;f<faces.length;f++){faces[f].mesh.material.opacity*=0.93;}
      if(done||t%100<0){} 
      // 충분히 흐려지면 재시작
      if(nodes.length && nodes[0].grp.userData.fade<=0){ start(); }
    }

    if(!drag)tRotY+=spin;
    rotX+=(tRotX-rotX)*0.06;rotY+=(tRotY-rotY)*0.06;root.rotation.x=rotX;root.rotation.y=rotY;
    camera.position.z+=(camDist-camera.position.z)*0.08;

    if(phase!=='fade'){
      for(var i=0;i<nodes.length;i++){var u=nodes[i].grp.userData;if(u.born<1){u.born+=0.025;var a=Math.min(1,u.born),e=1-Math.pow(1-a,3);nodes[i].grp.scale.setScalar(Math.max(0.001,e));u.core.material.opacity=a;u.glow.material.opacity=a*0.8;}else{nodes[i].grp.scale.setScalar(1+Math.sin(t*1.2+i)*0.035);}}
      for(var e2=0;e2<edges.length;e2++){var ed=edges[e2];if(ed.born<1){ed.born+=0.035;ed.mesh.material.opacity=Math.min(1,ed.born)*ed.max;}}
      for(var f2=0;f2<faces.length;f2++){var fc=faces[f2];if(fc.born<1){fc.born+=0.022;fc.mesh.material.opacity=Math.min(1,fc.born)*fc.target;}}
    }
    renderer.render(scene,camera);requestAnimationFrame(tick);
  }
  tick();
  addEventListener('resize',function(){W=innerWidth;H=innerHeight;camera.aspect=W/H;camera.updateProjectionMatrix();renderer.setSize(W,H);});
})();
</script>

<script>
(function(){
  var phrases=[
    // A
    "사랑흐름은 당신과 그 사람 사이의 나침반입니다","못다 한 이야기를 꺼내보고","그 사람 말에 담긴 진심도 헤아려보고","왜 그랬는지 서로의 마음을 읽어가다 보면","내일은 어떻게 다가갈지, 작은 한 걸음까지 손에 쥐어집니다",
    // B
    "나로부터 시작되는 관계의 여행","오늘은 엄마와, 다음엔 아빠와, 또 그리운 친구와","미워서가 아니라, 서로의 언어가 달랐을 뿐","건넬 수 있는 말 한마디가 보입니다","당신의 봄이 다시 오기를",
    // C
    "관계에도 계절이 있습니다","서로의 MBTI를 이해했다고 믿었지만","그 너머, 그 사람의 진짜 속마음은 어땠을까요","사랑흐름은 성격 너머의 마음을 함께 읽어요","막힘이 보인다는 건 방향이 보인다는 뜻","오늘 건넬 한마디가 봄을 부릅니다"
  ];
  // 한 줄로 점 연결
  var line = phrases.join(' <span class="dot">·</span> ') + ' <span class="dot">·</span> ';
  // 끊김 없는 흐름 위해 동일 내용 2회 (track 50%에서 리셋)
  document.getElementById('mtrack').innerHTML = '<span>'+line+'</span><span>'+line+'</span>';
})();
</script>
</body>
</html>
