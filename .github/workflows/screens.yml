# ★ 현재 버전 ▶ .github/workflows/screens.yml · v1 · 261024 · [칸 7-나 428] 화면을 올릴 때마다 화면 목록(lf/screens.json)을 저절로 다시 지음
name: 화면 목록 자동 갱신
on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'lf/screens-notes.json'
      - 'tools/screens/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: screens
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 화면 목록 짓기
        run: node tools/screens/build.js
      - name: 바뀌었으면 올리기
        run: |
          if git diff --quiet -- lf/screens.json; then echo "바뀐 것 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lf/screens.json
          git commit -m "화면 목록 자동 갱신 [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
