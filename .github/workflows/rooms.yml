# ★ 현재 버전 ▶ .github/workflows/rooms.yml · v1 · 261113 · [572 ⑤ 490 카톡 미리보기 카드] 1시간마다 우리 이야기 공개 목록 시트를 읽어 열린 방마다 r/방번호/index.html(미리보기 머리말 + 그 방으로 넘김)을 다시 지음 — 바뀐 방만 올림 · 닫힌 방은 지움(404.html 이 그 방으로 넘김)
name: 방 미리보기 카드
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/rooms.py']
permissions:
  contents: write
concurrency:
  group: rooms
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 방 미리보기 카드 짓기
        run: python3 tools/rooms.py
      - name: 바뀌었으면 올리기
        run: |
          git add -A r
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "방 미리보기 카드 — r/ [skip ci]"
          git pull -q --rebase origin main && git push -q origin HEAD:main
