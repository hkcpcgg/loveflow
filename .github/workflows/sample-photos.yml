# ★ 현재 버전 ▶ .github/workflows/sample-photos.yml · v3 · 261110 · (v3 Unsplash 는 GitHub 서버를 막음(401) → 위키미디어 공용 CC0 · 퍼블릭 도메인 사진으로) 견본 방 사진 받기 — tools/sample/list.txt 의 Unsplash 사진을 받아 rec/seed/sample/ 에 1600px(본) · 320px(_t 미리보기)로 올림 · 우리 이야기 서버 ⑤편집기가 www.loveflow.ai.kr/rec/seed/sample/ 에서 받아 감
name: 견본 방 사진 받기
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/sample/get.py']
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 받기 · 줄이기 (위키미디어 공용 · CC0 · 퍼블릭 도메인만)
        run: |
          sudo apt-get -qq install -y imagemagick >/dev/null 2>&1 || true
          rm -rf rec/seed/sample && python3 tools/sample/get.py
      - name: 올리기
        run: |
          git add rec/seed/sample
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "견본 방 사진 받기 — rec/seed/sample [skip ci]"
          git pull -q --rebase origin main && git push -q origin HEAD:main
